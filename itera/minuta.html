<!doctype html>
<html lang="es" class="esperando-marca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Minuta por revisar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;900&display=swap">
<link rel="stylesheet" href="/portal_comun.css?v=20261127zg">
<script src="/portal_comun.js?v=20261127zg"></script>
<style>
/* Minuta post-reunion: revision del vendedor antes de enviar al cliente (13-nov-2026). Solo se ve con la liga del aviso (?k=). */
.prueba{background:var(--osc);color:#fff;border-radius:8px;padding:10px 14px;font-size:14px}
.estado{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:#fff4e5;color:#7a4a00}.estado.hecho{background:#e6f4ea;color:#1e6b34}
.campo{display:grid;gap:4px}.campo textarea{min-height:120px;line-height:1.45}.campo textarea.largo{min-height:300px}
.tarea{display:grid;grid-template-columns:auto minmax(0,1fr) 150px;gap:8px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.tarea input[type=checkbox]{margin-top:10px;width:18px;height:18px}.tarea small{color:var(--g);display:block;margin-top:4px}
@media(max-width:620px){.tarea{grid-template-columns:auto minmax(0,1fr)!important}.tarea input[type=date]{grid-column:2}}
.cand{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer}.cand input{width:18px;height:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;z-index:20}.modal[hidden]{display:none}
.modal .card{max-width:560px;width:100%}
/* 17-nov-2026: pestanas horizontales (como GR WF13) y tareas con responsables. */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line);margin:4px 0 0}
.tab{border:0;background:transparent;text-decoration:none;padding:10px 14px;font:inherit;font-weight:700;font-size:14px;color:var(--g);border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--osc);border-bottom-color:var(--prim)}.tab small{font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;margin-left:4px}.tab small.falta{background:#fff4e5;color:#7a4a00}.tab small.listo{background:#e6f4ea;color:#1e6b34}
.tabp{border-top-left-radius:0;border-top-right-radius:0}.tabp[hidden]{display:none!important}
body.ocupado .acciones button{opacity:.5;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff7cc;border:1px solid #f1d65a;border-radius:6px;padding:3px 8px;margin:0 6px 6px 0;font-size:13px}
.chip a{color:#555;text-decoration:none;font-weight:700}.fila2{display:flex;gap:8px}.fila2 input{flex:1;min-width:0}
.dres{max-height:220px;overflow:auto;margin:6px 0}.dres div{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #eee;font-size:13px}
.hilo{background:#fafafa;border:1px solid #eee;border-radius:8px;padding:8px 10px;margin:0 0 12px;font-size:13px}
.tarea{grid-template-columns:auto minmax(0,1fr) 150px}.tarea.coaching{background:#faf7ff}.etq{display:inline-block;font-size:11px;font-weight:700;color:var(--prim);margin-bottom:4px}
.tcol{display:grid;gap:6px}.quitar{font-size:12px;padding:4px 8px}
.resp{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:8px;font-size:13px}.resp span{color:var(--g)}.resp label{display:inline-flex;gap:4px;align-items:center}.resp input{width:16px;height:16px}
@media(max-width:620px){.tab{padding:9px 10px;font-size:13px}.tcol{grid-column:2;grid-template-columns:1fr auto}}
</style>
</head>
<body>
<div class="top"><span class="marca" id="logo"><b>GR Intelligence</b></span><span class="quien" id="quien"></span></div>
<div class="banda oscura" id="banda"><div class="in"><h1 id="titulo">Minuta por revisar</h1><p id="bajada"></p></div></div>
<main><div class="panel" id="panel"><div class="card"><p class="vacio">Cargando la minuta…</p></div></div></main>
<div class="modal" id="modal" hidden><div class="card" id="modalC"></div></div>
<footer>Operado por Great Revenue Intelligence · <a href="/privacidad.html">Aviso de privacidad</a></footer>
<script>
(function () {
  var API = 'https://mikea.app.n8n.cloud/webhook/motor-minuta';
  var K = (/[?&]k=([A-Za-z0-9]+)/.exec(location.search) || [])[1] || '';
  var $ = GRP.$, h = GRP.h, D = null, HILO = null, HILO_REM = null, ADJ = [], FORM = null, HILO_ON = true, HILO_MSG = '', WAF = null;
  GRP.marcaPublica('Minuta por revisar', 'Revisa, corrige si hace falta y envía desde tu cuenta. Nada sale al cliente sin tu clic.');
  // 17-nov (auditoria 4): una accion a la vez. Mientras una accion que escribe (enviar, tareas, cambiar oportunidad, alta,
  // fase, nota, WhatsApp, corregir) esta en curso, todos los botones de accion quedan inactivos: asi no se cruzan.
  var OCUPADO = false;
  function api(cuerpo) {
    cuerpo.k = K;
    var escribe = ['ver', 'buscar', 'hilo', 'drive'].indexOf(cuerpo.accion) < 0;
    if (escribe && OCUPADO) return Promise.resolve({ ok: false, error: 'Espera a que termine la acción anterior.' });
    if (escribe) { OCUPADO = true; document.body.classList.add('ocupado'); }
    function fin(x) { if (escribe) { OCUPADO = false; document.body.classList.remove('ocupado'); } return x; }
    return fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(cuerpo) })
      .then(function (r) { return r.json().catch(function () { return { ok: false, error: 'Respuesta no válida del servidor.' }; }); })
      .catch(function () { return { ok: false, error: 'Sin conexión. Revisa tu internet y vuelve a intentar.' }; })
      .then(fin)
      // 18-nov (auditoria e2-5/e2-7): un envio o una creacion de tareas quedo en duda (se interrumpio o Gmail/Zoho no confirmaron).
      // La persona revisa y dice que paso: si SI salio, se registra sin mandarlo de nuevo; si NO, se reintenta. Nada a ciegas.
      .then(function (x) {
        if (!x || !x.interrumpido || cuerpo.forzar_apartado) return x;
        var q = x.interrumpido === 'enviar' || x.interrumpido === 'partner' ? ['¿El correo SÍ aparece en Enviados?', 'Entonces el correo no salió. ¿Enviarlo ahora?']
          : x.interrumpido === 'agendar' ? ['¿La reunión SÍ aparece en el Google Calendar?', 'Entonces la reunión no se creó. ¿Agendarla ahora?']
          : ['¿Las tareas SÍ aparecen en la oportunidad en Zoho?', 'Entonces las tareas no se crearon. ¿Crearlas ahora?'];
        if (confirm(x.error + '\n\n' + q[0] + '\nAceptar = sí: registrarlo así, sin hacerlo de nuevo.\nCancelar = no.'))
          return api(Object.assign({}, cuerpo, { forzar_apartado: true, ya_salio: true }));
        if (confirm(q[1])) return api(Object.assign({}, cuerpo, { forzar_apartado: true }));
        return x; });
  }
  // 17-nov (auditoria): quien revisa queda escrito en cada nota de Zoho (la conexion de Zoho es una sola y no dice quien fue).
  function QUIEN() { var s = $('quienSel'); if (s && s.value) return s.value; try { var v = localStorage.getItem('itera_minuta_quien'); if (v) return v; } catch (e) {} return D ? D.remitente : ''; }
  function selQuien(lista) {
    var act = ''; try { act = localStorage.getItem('itera_minuta_quien') || ''; } catch (e) {}
    // 17-nov (auditoria 5): la lista incluye a responsables y remitentes, y siempre a quien recibio el aviso; nunca se queda
    // elegida una persona que nadie escogio.
    var vistos = {}; lista = lista.concat(D.remitentes || [], [{ correo: D.remitente, nombre: D.remitente_nombre || D.remitente }]).filter(function (r) { var c = String(r.correo || '').toLowerCase(); if (!c || vistos[c]) return false; vistos[c] = 1; return true; });
    if (!lista.some(function (r) { return r.correo === act; })) act = D.remitente;
    return '<label class="campo">Quién está revisando (queda en Zoho)<select id="quienSel">' + lista.map(function (r) { return '<option value="' + h(r.correo) + '"' + (r.correo === act ? ' selected' : '') + '>' + h(r.nombre) + '</option>'; }).join('') + '</select></label>';
  }
  function msg(id, ok, t) { GRP.msg(id, ok ? 'ok' : 'bad', t); }
  function estado(t, hecho) { return '<span class="estado' + (hecho ? ' hecho' : '') + '">' + h(t) + '</span>'; }
  function cargar() {
    if (K.length < 20) { $('panel').innerHTML = '<div class="card"><p class="msg bad">Falta la llave de la liga. Abre la liga completa del aviso.</p></div>'; return; }
    api({ accion: 'ver' }).then(function (d) {
      if (!d || !d.ok) { $('panel').innerHTML = '<div class="card"><p class="msg bad">' + h((d && d.error) || 'No se pudo cargar.') + '</p></div>'; return; }
      D = d; pintar();
    });
  }
  // 13-nov tarde (como GR): reunion interna. Nota (decisiones, pendientes, riesgos, salud) y tareas con responsable; se crean en
  // Zoho a nombre de cada responsable solo con el clic de quien recibio el aviso.
  function pintarInterna() {
    var d = D, H = '', tc = !!d.tareas_creadas_el, eq = d.equipo || [];
    $('titulo').textContent = 'Reunión interna';
    $('quien').textContent = d.remitente_nombre ? 'Revisa: ' + d.remitente_nombre : '';
    if (d.prueba) H += '<div class="prueba"><b>PRUEBA.</b> Las tareas se crean con la palabra PRUEBA al frente.</div>';
    H += '<div class="card"><div class="card-h"><h2>' + h(d.titulo) + '</h2>' + (tc ? estado('Tareas creadas', true) : estado('Por revisar')) + '</div>'
      + '<dl class="dato"><dt>Fecha</dt><dd>' + h(d.fecha) + '</dd><dt>Participantes</dt><dd>' + h(eq.map(function (e) { return e.nombre; }).join(', ')) + '</dd></dl>'
      + '<p style="white-space:pre-line">' + h(d.nota || '') + '</p><div class="acciones"><button class="s" data-corr="nota">Corregir</button></div></div>';
    var opts = function (sel) { return eq.map(function (e) { return '<option value="' + h(e.correo) + '"' + (e.correo === sel ? ' selected' : '') + '>' + h(e.nombre) + '</option>'; }).join(''); };
    H += '<div class="card"><div class="card-h"><h2><span class="num">1</span>Tareas en Zoho</h2>' + (tc ? estado('Creadas el ' + d.tareas_creadas_el, true) : '') + '</div>'
      + (tc ? '' : '<p class="nota">Ajusta responsable y fecha. Se crean a nombre de cada responsable solo cuando las apruebes.</p>')
      + (d.tareas || []).map(function (t, i) { return '<div class="tarea"><input type="checkbox" id="tk' + i + '" checked' + (tc ? ' disabled' : '') + '><div><input id="tt' + i + '" value="' + h(t.titulo) + '"' + (tc ? ' disabled' : '') + ' style="width:100%"><select id="tr' + i + '"' + (tc ? ' disabled' : '') + ' style="margin-top:6px">' + opts(t.responsable) + '</select><small>' + h(t.proposito || '') + '</small></div><input type="date" id="tf' + i + '" value="' + h(t.fecha_limite) + '"' + (tc ? ' disabled' : '') + '></div>'; }).join('')
      + ((d.tareas || []).length ? '' : '<p class="nota">No se detectaron tareas con compromiso.</p>')
      + '<div class="acciones">' + (tc || !(d.tareas || []).length ? '' : '<button class="p" id="bTareas">Crear tareas aprobadas</button>') + '<button class="s" data-corr="tareas">Corregir</button><span class="msg" id="mTareas"></span></div></div>';
    $('panel').innerHTML = H; GRP.revelar();
    if ($('bTareas')) $('bTareas').onclick = function () {
      var b = this, ts = (d.tareas || []).map(function (t, i) { return { titulo: $('tt' + i).value, fecha_limite: $('tf' + i).value, responsable: $('tr' + i).value, proposito: t.proposito, incluir: $('tk' + i).checked }; });
      b.disabled = true; msg('mTareas', true, 'Creando…');
      api({ accion: 'tareas', tareas: ts, quien: QUIEN() }).then(function (x) { if (x.ok) { msg('mTareas', true, x.mensaje); setTimeout(cargar, 1200); } else { msg('mTareas', false, x.error); b.disabled = false; } });
    };
    Array.prototype.forEach.call(document.querySelectorAll('[data-corr]'), function (b) { b.onclick = function () { corregir(b.getAttribute('data-corr')); }; });
  }
  // 17-nov-2026 (entrega 1, paridad con GR WF13): pestanas horizontales Oportunidad, Correo, WhatsApp y Tareas. La oportunidad se
  // puede cambiar o buscar aunque el motor ya la haya encontrado (mientras no haya nada enviado ni tareas creadas) y la fase se
  // mueve desde aqui. El correo sale de la cuenta que se elija (lista blanca: remitentes) con copia editable. Cada tarea lleva uno
  // o varios responsables (una tarea por persona en Zoho) y se pueden agregar y quitar tareas.
  var TAB = null, T = null;
  // 18-nov (auditoria e2-1): lo que el vendedor ya escribio en Correo y WhatsApp sobrevive cuando la pagina se repinta tras otra
  // accion (fase, nota, tareas...). Asi nunca envia algo distinto de lo que ve.
  // 18-nov (entrega 3): lo escrito en Proxima reunion y Fabricante tambien sobrevive al repintar.
  var AGF = null, FAF = null;
  function guardarForm() {
    if ($('agAgenda') && !$('agAgenda').disabled) AGF = { cuenta: $('agCuenta').value, titulo: $('agTitulo').value, fecha: $('agFecha').value, dur: $('agDur').value, inv: $('agInv').value, agenda: $('agAgenda').value };
    if ($('faTexto') && !$('faTexto').disabled) FAF = { rem: $('faRem').value, para: $('faPara').value, copia: $('faCopia').value, asunto: $('faAsunto').value, texto: $('faTexto').value };
    if ($('wa') && !$('wa').disabled) WAF = { wa: $('wa').value, tel: $('tel') ? $('tel').value : '' };
    if (!$('cuerpo') || $('cuerpo').disabled) return;
    var a = $('asunto');
    FORM = { rem: $('rem').value, para: $('para').value, copia: $('copia').value, asunto: a.hasAttribute('data-orig') ? a.getAttribute('data-orig') : a.value, cuerpo: $('cuerpo').value,
      wa: $('wa') && !$('wa').disabled ? $('wa').value : null, tel: $('tel') && !$('tel').disabled ? $('tel').value : null };
    if ($('enHilo')) HILO_ON = $('enHilo').checked;
  }
  function pintar() {
    guardarForm();
    if (D && D.interna) return pintarInterna();
    var d = D, H = '';
    var falta = !!d.falta_oportunidad, enviada = d.estado === 'minuta_enviada', wa = !!d.whatsapp_enviado_el, tc = !!d.tareas_creadas_el;
    var rems = d.remitentes || [], resps = d.responsables || [];
    if (!TAB) TAB = falta ? 'op' : 'co';
    $('quien').textContent = d.remitente_nombre ? 'Revisa: ' + d.remitente_nombre : '';
    if (d.prueba) H += '<div class="prueba"><b>PRUEBA.</b> Todo lo que envíes desde aquí llega solo a ' + h(d.solo_a) + ', no al cliente.</div>';
    H += '<div class="card"><div class="card-h"><h2>' + h(d.tipo || 'Reunión') + ' · ' + h(d.empresa || d.titulo) + '</h2>' + (enviada ? estado('Minuta enviada', true) : estado(falta ? 'Falta elegir oportunidad' : 'Por revisar')) + '</div>'
      + '<dl class="dato"><dt>Reunión</dt><dd>' + h(d.fecha) + ' · ' + h(d.titulo) + '</dd>'
      + '<dt>Oportunidad</dt><dd>' + (d.oportunidad ? h(d.oportunidad) + ' (' + h(d.fase) + ')' + (d.url_zoho ? ' · <a href="' + h(d.url_zoho) + '" target="_blank" rel="noopener">Abrir en Zoho</a>' : '') : '<b>Por elegir</b>') + '</dd>'
      + (d.verificar ? '<dt>Por verificar</dt><dd>' + h(d.verificar) + '</dd>' : '') + '</dl>' + selQuien(resps.slice()) + '</div>';
    var ag = !!d.reunion_agendada_el, fe = !!d.partner_enviado_el;
    var TABS = [['op', 'Oportunidad', falta ? 'Falta' : ''], ['co', 'Correo', enviada ? 'Enviado' : ''], ['wa', 'WhatsApp', wa ? 'Enviado' : ''], ['ta', 'Tareas', tc ? 'Creadas' : ''], ['ag', 'Próxima reunión', ag ? 'Agendada' : '']].concat(d.partner ? [['fa', 'Fabricante', fe ? 'Enviado' : '']] : []);
    if (TAB === 'fa' && !d.partner) TAB = 'co';
    H += '<div class="tabs" role="tablist">' + TABS.map(function (t) { return '<button type="button" role="tab" class="tab' + (TAB === t[0] ? ' on' : '') + '" data-tab="' + t[0] + '">' + h(t[1]) + (t[2] ? ' <small class="' + (t[2] === 'Falta' ? 'falta' : 'listo') + '">' + h(t[2]) + '</small>' : '') + '</button>'; }).join('') + '</div>';

    // --- Oportunidad
    var P = '';
    if (d.oportunidad) {
      P += '<p><b>' + h(d.oportunidad) + '</b><br><small>Fase actual: ' + h(d.fase) + '</small></p>';
      P += '<label class="campo">Mover a la fase<select id="fase">' + (d.fases || []).map(function (x) { return '<option' + (x === d.fase ? ' selected' : '') + '>' + h(x) + '</option>'; }).join('') + '</select></label>'
        + (d.fase_sugerida ? '<p class="nota">Fase sugerida por el motor: <b>' + h(d.fase_sugerida) + '</b>. El motor no la cambia: la cambias tú aquí.</p>' : '')
        + '<label class="campo">¿Por qué cambia? (queda en la nota de Zoho)<textarea id="faseC" rows="2"></textarea></label>'
        + '<div class="acciones"><button class="p" id="bFase">Cambiar fase en Zoho</button><button class="s" data-corr="fase">Corregir</button><span class="msg" id="mFase"></span></div>'
        + '<label class="campo" style="margin-top:16px">Nota para la oportunidad en Zoho<textarea id="notaT" rows="3" placeholder="Algo que el equipo deba saber de esta reunión"></textarea></label>'
        + '<div class="acciones"><button class="s" id="bNota">Guardar nota en Zoho</button><span class="msg" id="mNota"></span></div>';
    } else {
      P += '<p class="nota">El motor no adivina. Elige la oportunidad de IT Institute a la que pertenece esta reunión; ahí se guardan la nota, la minuta enviada y las tareas. Mientras falte, no se puede enviar.</p>';
    }
    if (d.puede_cambiar) {
      var dests = String(d.destinatarios || '').split(/[,;\s]+/).filter(Boolean);
      var buscador = ((d.candidatos || []).length ? '<p><b>De esta empresa</b></p>' + d.candidatos.map(function (c) { return '<label class="cand"><input type="radio" name="cand" value="' + h(c.id) + '"><span><b>' + h(c.nombre) + '</b><br><small>' + h(c.fase) + '</small></span></label>'; }).join('') : '')
        + '<label class="campo">Buscar en Zoho (empresa u oportunidad)<input id="q" value="' + h(d.empresa_busqueda || d.empresa || '') + '"></label>'
        + '<div class="acciones"><button class="s" id="bBuscar">Buscar</button><span class="msg" id="mBuscar"></span></div><div id="res"></div>'
        + '<div class="acciones"><button class="p" id="bElegir">' + (d.oportunidad ? 'Cambiar a esta oportunidad' : 'Usar esta oportunidad') + '</button><span class="msg" id="mElegir"></span></div>'
        + '<details class="alta"' + (!d.oportunidad && !(d.candidatos || []).length ? ' open' : '') + ' style="margin-top:14px"><summary><b>¿No existe? Dala de alta aquí</b></summary>'
        + '<p class="nota">Se crea en el Zoho de Itera a tu nombre, con su empresa y su contacto. Si ya hay una abierta de ese contacto y producto, se usa esa.</p>'
        + '<label class="campo">Empresa<input id="aEmp" value="' + h(d.empresa_busqueda || d.empresa || '') + '"></label>'
        + '<label class="campo">Correo del contacto del cliente<input id="aCor" list="aCorL" value="' + h(dests[0] || '') + '"><datalist id="aCorL">' + dests.map(function (x) { return '<option value="' + h(x) + '">'; }).join('') + '</datalist></label>'
        + '<label class="campo">Nombre del contacto<input id="aNom"></label><label class="campo">Apellido del contacto<input id="aApe"></label>'
        + '<label class="campo">Producto<select id="aProd"><option value="">Elige el producto</option>' + (d.productos || []).map(function (x) { return '<option value="' + h(x.codigo) + '">' + h(x.nombre) + '</option>'; }).join('') + '</select></label>'
        + '<label class="campo">¿De dónde vino la oportunidad?<select id="aCan"><option value="">Elige</option><option value="secuencia">Secuencia o campaña de marketing</option><option value="dueno">Cuenta propia del vendedor</option><option value="fabricante">La refirió el fabricante (Udemy, Coursera…)</option><option value="renovacion">Renovación</option></select></label>'
        + '<label class="campo">Tamaño de la empresa (Zoho lo pide si la empresa es nueva)<select id="aTam"><option value="">Ya existe en Zoho / no sé</option><option value="25">Menos de 50 empleados</option><option value="100">De 50 a 249 empleados</option><option value="1000">De 250 a 5,000 empleados</option><option value="6000">Más de 5,000 empleados</option></select></label>'
        + '<div class="acciones"><button class="p" id="bCrear">Dar de alta y usar esta oportunidad</button><span class="msg" id="mCrear"></span></div></details>';
      P += d.oportunidad ? '<details class="alta" style="margin-top:16px"><summary><b>¿No es esta? Cambia la oportunidad</b></summary>' + buscador + '</details>' : buscador;
    } else if (d.oportunidad) {
      P += '<p class="nota">La oportunidad ya no se puede cambiar porque ya se envió algo o ya se crearon tareas en ella.</p>';
    }
    H += '<div class="card tabp" id="p-op"' + (TAB === 'op' ? '' : ' hidden') + '>' + P + '</div>';

    // --- Correo
    var remSel = d.remitente_envio || d.remitente;
    H += '<div class="card tabp" id="p-co"' + (TAB === 'co' ? '' : ' hidden') + '>'

    $('bCopiar').onclick = function () { var t = $('wa').value; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { msg('mWa', true, 'Copiado. Pégalo en WhatsApp.'); }, function () { $('wa').select(); msg('mWa', true, 'Selecciona y copia el texto.'); }); };
    function telWa() { var t = ($('tel') ? $('tel').value : '').replace(/[^0-9]/g, ''); return t.length === 10 ? '52' + t : t; }
    function telOk(n) { return n.length >= 10 && n.length <= 15; }
    if ($('bAbrirWa')) $('bAbrirWa').onclick = function () { var n = telWa();
      if (d.prueba) { msg('mWa', false, 'En prueba no se abre WhatsApp con el número del cliente: copia el texto.'); return; }
      if (!telOk(n)) { msg('mWa', false, 'Escribe el número del cliente (10 dígitos o con lada del país).'); return; }
      window.open('https://wa.me/' + n + '?text=' + encodeURIComponent($('wa').value), '_blank', 'noopener'); msg('mWa', true, 'Se abrió WhatsApp. Cuando lo envíes, marca «Ya lo envié».'); };
    if ($('bWa')) $('bWa').onclick = function () { var b = this; var n = telWa(); if (n && !telOk(n)) { msg('mWa', false, 'Revisa el número de WhatsApp (de 10 a 15 dígitos).'); return; } b.disabled = true; api({ accion: 'whatsapp', texto: $('wa').value, telefono: n, quien: QUIEN() }).then(function (x) { if (x.ok) { msg('mWa', true, x.mensaje); setTimeout(cargar, 1200); } else { msg('mWa', false, x.error); b.disabled = false; } }); };
    if ($('bAddT')) $('bAddT').onclick = function () { leerTareas(); var m = new Date(Date.now() + 2 * 864e5); T.push({ titulo: '', fecha_limite: m.toISOString().slice(0, 10), proposito: '', prioridad: '', tipo: 'cierre', responsables: [d.remitente], incluir: true, nueva: true }); pintarTareas(false, resps); var u = $('tt' + (T.length - 1)); if (u) u.focus(); };
    if ($('bTareas')) $('bTareas').onclick = function () {
      leerTareas();
      var ts = T.filter(function (t) { return t.incluir && String(t.titulo).trim(); });
      if (!ts.length) { msg('mTareas', false, 'Marca al menos una tarea con título.'); return; }
      var sin = ts.filter(function (t) { return !t.responsables.length; });
      if (sin.length) { msg('mTareas', false, 'Elige al menos un responsable para: ' + sin.map(function (t) { return t.titulo; }).join('; ')); return; }
      var b = this; b.disabled = true; msg('mTareas', true, 'Creando…');
      api({ accion: 'tareas', tareas: ts, quien: QUIEN() }).then(function (x) { if (x.ok) { msg('mTareas', true, x.mensaje); T = null; setTimeout(cargar, 1200); } else { msg('mTareas', false, x.error); b.disabled = false; } });
    };
    if ($('bAgendar')) $('bAgendar').onclick = function () {
      var b = this, inv = $('agInv').value.trim(), f = $('agFecha').value;
      if (!f) { msg('mAg', false, 'Elige la fecha y la hora.'); return; }
      if (!inv) { msg('mAg', false, 'Agrega al menos un invitado.'); return; }
      if (!confirm('¿Agendar «' + $('agTitulo').value + '» el ' + f.replace('T', ' a las ') + ' en el calendario de ' + $('agCuenta').value + ' e invitar a ' + (d.prueba ? d.solo_a : inv) + '?')) return;
      b.disabled = true; msg('mAg', true, 'Agendando…');
      api({ accion: 'agendar', cuenta: $('agCuenta').value, titulo: $('agTitulo').value, fecha: f, duracion: $('agDur').value, invitados: inv, agenda: $('agAgenda').value, quien: QUIEN() })
        .then(function (x) { if (x.ok) { msg('mAg', true, x.mensaje); setTimeout(cargar, 1500); } else { msg('mAg', false, x.error); b.disabled = false; } });
    };
    // La firma del texto acompana a la cuenta que envia al fabricante.
    if ($('faRem')) $('faRem').onchange = function () { var prev = this.getAttribute('data-prev'), nue = this.value, fp = firmaDe(prev), fn = firmaDe(nue), t = $('faTexto');
      if (fp && fn && t.value.indexOf(fp) >= 0) t.value = t.value.split(fp).join(fn); this.setAttribute('data-prev', nue); };
    if ($('bPartner')) $('bPartner').onclick = function () {
      var b = this, para = $('faPara').value.trim();
      if (!para) { msg('mFa', false, 'Escribe a quién del fabricante va la minuta.'); return; }
      if (!$('faTexto').value.trim()) { msg('mFa', false, 'El texto está vacío.'); return; }
      if (!confirm(d.prueba ? 'Prueba: se envía solo a ' + d.solo_a + '. ¿Enviar?' : '¿Enviar la minuta a ' + d.partner + ' (' + para + ') desde ' + $('faRem').value + '?')) return;
      b.disabled = true; msg('mFa', true, 'Enviando…');
      api({ accion: 'partner', remitente: $('faRem').value, para: para, copia: $('faCopia').value, asunto: $('faAsunto').value, cuerpo: $('faTexto').value, quien: QUIEN() })
        .then(function (x) { if (x.ok) { msg('mFa', true, x.mensaje); setTimeout(cargar, 1200); } else { msg('mFa', false, x.error); b.disabled = false; } });
    };
    Array.prototype.forEach.call(document.querySelectorAll('[data-corr]'), function (b) { b.onclick = function () { corregir(b.getAttribute('data-corr')); }; });
  }
  function firmaDe(correo) { var r = (D.remitentes || []).filter(function (x) { return x.correo === correo; })[0]; return r ? r.firma : ''; }
  function copiaPara(correo) { return (D.copia_base || []).filter(function (x) { return x !== correo; }).join(', '); }
  function leerTareas() {
    if (!T || !$('listaT')) return;
    T.forEach(function (t, i) {
      if (!$('tt' + i)) return;
      t.titulo = $('tt' + i).value; t.fecha_limite = $('tf' + i).value; t.incluir = $('tk' + i).checked;
      t.responsables = Array.prototype.map.call(document.querySelectorAll('input[name=tr' + i + ']:checked'), function (x) { return x.value; });
    });
  }
  function pintarTareas(tc, resps) {
    if (!$('listaT')) return;
    $('listaT').innerHTML = T.length ? T.map(function (t, i) {
      var dis = tc ? ' disabled' : '';
      return '<div class="tarea' + (t.tipo === 'coaching' ? ' coaching' : '') + '"><input type="checkbox" id="tk' + i + '"' + (t.incluir ? ' checked' : '') + dis + '>'
        + '<div>' + (t.tipo === 'coaching' ? '<span class="etq">Coaching para ti</span>' : '') + '<input id="tt' + i + '" value="' + h(t.titulo) + '" placeholder="Qué hay que hacer"' + dis + ' style="width:100%">'
        + (t.proposito ? '<small>' + h(t.proposito) + '</small>' : '')
        + '<div class="resp"><span>Responsable:</span>' + resps.map(function (r) { return '<label><input type="checkbox" name="tr' + i + '" value="' + h(r.correo) + '"' + (t.responsables.indexOf(r.correo) !== -1 ? ' checked' : '') + dis + '>' + h(r.nombre) + '</label>'; }).join('') + '</div></div>'
        + '<div class="tcol"><input type="date" id="tf' + i + '" value="' + h(t.fecha_limite) + '"' + dis + '>' + (tc ? '' : '<button type="button" class="s quitar" data-quitar="' + i + '">Quitar</button>') + '</div></div>';
    }).join('') : '<p class="nota">No hay tareas. Agrega una si hace falta.</p>';
    Array.prototype.forEach.call(document.querySelectorAll('[data-quitar]'), function (b) { b.onclick = function () { leerTareas(); T.splice(Number(b.getAttribute('data-quitar')), 1); pintarTareas(false, resps); }; });
  }
  var TIPOS = [['tono', 'Tono o forma de decirlo'], ['dato', 'Un dato está mal'], ['oferta', 'Lo que ofrecemos'], ['destinatarios', 'A quién va'], ['persona', 'Nombre o cargo'], ['otro', 'Otro']];
  function corregir(medio) {
    $('modalC').innerHTML = '<div class="card-h"><h2>Corregir ' + h(medio) + '</h2></div><p class="nota">Llega a Mejoras de mensajes del portal y las siguientes minutas la toman en cuenta.</p>'
      + '<label>¿Qué estuvo mal?<select id="cT">' + TIPOS.map(function (t) { return '<option value="' + t[0] + '">' + t[1] + '</option>'; }).join('') + '</select></label>'
      + '<label>Cómo lo dirías tú<textarea id="cP" rows="5"></textarea></label><label>Comentario<textarea id="cC" rows="2"></textarea></label>'
      + '<div class="acciones"><button class="s" id="cX">Cancelar</button><button class="p" id="cOk">Enviar corrección</button><span class="msg" id="mC"></span></div>';
    $('modal').hidden = false;
    $('cX').onclick = function () { $('modal').hidden = true; };
    $('cOk').onclick = function () { var b = this; b.disabled = true; api({ accion: 'corregir', medio: medio, tipo: $('cT').value, propuesta: $('cP').value, comentario: $('cC').value, quien: QUIEN() }).then(function (x) { if (x.ok) { msg('mC', true, x.mensaje); setTimeout(function () { $('modal').hidden = true; }, 1500); } else { msg('mC', false, x.error); b.disabled = false; } }); };
  }
  cargar();
})();
</script>
