<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Conocimiento Great Revenue</title>
<style>
  /* Conocimiento (plan B, 25 oct 2026): pestana del tablero (?tab=conocimiento), con el formato del tablero. Sin clave. */
  :root{ --purple:#7C3AED; --pink:#EC4899; --cyan:#06B6D4; --mint:#10B981; --yellow:#F59E0B; --red:#EF4444;
    --bg:#0B0F19; --bg-2:#141827; --bg-3:#1E2433; --border:#2A3142; --text:#F3F4F6; --text-dim:#9CA3AF; --text-mute:#6B7280; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
  button,textarea{font:inherit}
  a{color:var(--cyan);text-decoration:none} a:hover{text-decoration:underline}
  #app{max-width:1400px;margin:0 auto;padding:16px}
  .hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:linear-gradient(135deg,var(--purple),var(--pink));border-radius:12px;margin-bottom:14px}
  .hdr b{font-size:17px;font-weight:800;letter-spacing:.5px} .hdr span{font-size:11px;opacity:.85;letter-spacing:1px;text-transform:uppercase}
  .en-tablero .hdr{display:none}
  .barra-sup{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .tabs{display:flex;gap:4px;background:var(--bg-2);padding:6px;border-radius:10px;overflow-x:auto}
  .tab{background:transparent;border:0;color:var(--text-dim);padding:9px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
  .tab:hover{background:var(--bg-3);color:var(--text)}
  .tab.on{background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff}
  .tab .n{background:rgba(0,0,0,.3);border-radius:9px;padding:0 7px;margin-left:6px;font-size:11px}
  .tab .n:empty{display:none}
  .yo{font-size:13px;color:var(--text-dim)} .yo b{color:var(--text)}
  h1{font-size:18px;font-weight:800;margin-bottom:4px} h2{font-size:12px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin:22px 0 10px}
  .nota{font-size:13px;color:var(--text-dim);margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
  .card{background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px}
  .card.clic{cursor:pointer;text-align:left;color:inherit;width:100%} .card.clic:hover{border-color:var(--purple)}
  .card.hecho{opacity:.72}
  .kpi{background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
  .kpi .v{font-size:22px;font-weight:800} .kpi .t{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.8px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px}
  .t{font-weight:700} .sub{font-size:12px;color:var(--text-dim)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .etq{font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px;background:var(--bg-3);color:var(--text-dim);white-space:nowrap}
  .etq.mike{background:rgba(239,68,68,.18);color:#fca5a5} .etq.lider{background:rgba(6,182,212,.16);color:#67e8f9}
  .etq.nuevo{background:rgba(16,185,129,.16);color:#6ee7b7} .etq.corrige{background:rgba(245,158,11,.16);color:#fcd34d}
  .etq.contradice{background:rgba(239,68,68,.18);color:#fca5a5} .etq.refuerza{background:rgba(124,58,237,.2);color:#c4b5fd}
  .etq.ok{background:rgba(16,185,129,.16);color:#6ee7b7}
  .cab{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
  .bloque{font-size:13px;margin-top:8px} .bloque span{display:block;font-size:10.5px;font-weight:700;color:var(--text-mute);text-transform:uppercase;letter-spacing:.8px;margin-bottom:2px}
  .antes{background:rgba(239,68,68,.08);border-left:3px solid var(--red);border-radius:6px;padding:6px 10px}
  .despues{background:rgba(16,185,129,.08);border-left:3px solid var(--mint);border-radius:6px;padding:6px 10px}
  .linea-dec{border-top:1px solid var(--border);padding-top:10px;margin-top:10px}
  .acc{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .btn{background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;border:0;border-radius:8px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer}
  .btn.sec{background:var(--bg-3);color:var(--text);border:1px solid var(--border)} .btn:disabled{opacity:.45;cursor:default}
  .enlace{background:none;border:0;color:var(--cyan);cursor:pointer;font-size:12.5px}
  textarea{width:100%;min-height:70px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px;font-size:13px;margin-top:6px}
  .filtros{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
  .chip{border:1px solid var(--border);background:var(--bg-2);color:var(--text-dim);border-radius:16px;padding:5px 12px;font-size:12.5px;cursor:pointer}
  .chip.on{background:var(--purple);border-color:var(--purple);color:#fff}
  .decidido{background:rgba(16,185,129,.1);border-radius:8px;padding:8px 10px;font-size:12.5px;margin-top:8px;color:#a7f3d0}
  .aviso{background:rgba(6,182,212,.08);border:1px solid rgba(6,182,212,.3);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--text-dim);margin-bottom:12px}
  .volver{background:none;border:0;color:var(--cyan);cursor:pointer;font-size:13px;margin-bottom:8px}
  .vacio{color:var(--text-mute);font-size:13px;padding:10px 0}
  .fondo{position:fixed;inset:0;background:rgba(4,6,12,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
  .modal{background:var(--bg-2);border:1px solid var(--border);border-radius:14px;padding:18px 20px;max-width:720px;width:100%;max-height:88vh;overflow:auto}
  .modal h3{font-size:16px;font-weight:800;margin-bottom:8px}
  .kb-md{white-space:pre-wrap;font-size:11.5px;max-height:45vh;overflow:auto;background:var(--bg);padding:8px;border-radius:6px;color:var(--text-dim)}
  .fila{border-bottom:1px solid var(--border);padding:6px 0;font-size:13px} .fila.mal b{color:var(--red)}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--bg-3);border:1px solid var(--border);color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;z-index:30}
  .error{color:#fca5a5;font-size:13px;margin-top:6px}
  ol.pasos{font-size:13.5px;line-height:1.6;padding-left:20px;color:var(--text-dim)} ol.pasos li{margin-bottom:6px} ol.pasos b{color:var(--text)}
  .tabla{overflow-x:auto} table.t2{width:100%;border-collapse:collapse;font-size:13px} table.t2 th{text-align:left;color:var(--text-mute);font-size:11px;text-transform:uppercase;letter-spacing:.8px;padding:6px 8px;border-bottom:1px solid var(--border)}
  table.t2 td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
  /* 26 oct: filtros por lider y producto, ayudas "i" (como Consumo), tarjeta con evidencia y accion. */
  .i{display:inline-flex;width:15px;height:15px;border-radius:50%;border:1px solid var(--text-mute);color:var(--text-mute);font-size:10px;font-weight:700;align-items:center;justify-content:center;cursor:help;margin-left:6px;text-transform:none;letter-spacing:0;vertical-align:middle;font-style:normal}
  .filtros-top{background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:14px}
  .fila-f{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:3px 0}
  .lbl{font-size:11px;font-weight:700;color:var(--text-mute);text-transform:uppercase;letter-spacing:.8px;margin-right:4px;display:inline-flex;align-items:center}
  .chip.sinbase{border-style:dashed} .chip.cero{opacity:.55}
  details.prod{background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:10px}
  details.prod>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  details.prod .card{background:var(--bg);margin-top:10px}
  details.reu{border-top:1px solid var(--border);padding:8px 0} details.reu>summary{cursor:pointer;list-style:none}
  details.ev{margin-top:6px;font-size:12.5px} details.ev>summary{cursor:pointer;color:var(--cyan)}
  .ev-i{border-left:2px solid var(--border);padding:4px 10px;margin:6px 0}
  .bloque.accion{background:rgba(124,58,237,.1);border-left:3px solid var(--purple);border-radius:6px;padding:6px 10px}
  .bloque span.i,h2 .i,.lbl .i{display:inline-flex;text-transform:none;margin-bottom:0;font-size:10px;color:var(--text-mute)}
  .etq i{font-style:normal;opacity:.7;font-weight:600}
  td.celda{cursor:pointer} td.celda:hover{background:var(--bg-3)} .dim{color:var(--text-mute)}
  @media (max-width:640px){ #app{padding:10px} .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div id="app">
  <div class="hdr"><div><b>GREAT REVENUE</b><br><span>Conocimiento</span></div></div>
  <div class="barra-sup">
    <nav class="tabs" id="tabs"></nav>
    <span class="yo" id="yo"></span>
  </div>
  <div id="filtros"></div>
  <main id="main"><p class="vacio">Cargando…</p></main>
</div>
<script>
(function(){
  // Sin clave, como el tablero (decision de Mike, 25 oct). Si una liga vieja trae ?k=, se manda igual.
  // 26 oct: sin "¿quien eres?": se filtra por lider y producto; quien aprueba es el lider del filtro (con "Todos", Mike).
  var K = new URLSearchParams(location.search).get('k') || '';
  var BASE = 'https://mikea.app.n8n.cloud/webhook/';
  var datos = null, vista = guardado('gr_con_vista') || 'resumen', fLid = guardado('gr_con_lider') || 'todos', fProd = guardado('gr_con_prod') || 'todos';
  var fPer = 'semana', fEnt = 'todas', fAcc = 'todas', fEst = 'nuevo', fFij = 'por', fReu = 'procesada', zona = 'semana', espera = null;
  if (window.self !== window.top) document.documentElement.classList.add('en-tablero');
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  // Ayuda al pasar el mouse, como en Consumo y el tablero: un circulo "i" con el texto.
  function ay(t){ return '<span class="i" title="' + esc(t) + '">i</span>'; }
  function toast(t){ var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 3200); }
  function fecha(ts){ return ts ? new Date(ts * 1000).toLocaleString('es-MX', { timeZone: 'America/Mexico_City', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : ''; }
  function dia(f){ var d = String(f || '').slice(0, 10).split('-'); return d.length === 3 ? Number(d[2]) + '-' + ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][Number(d[1]) - 1] : ''; }
  function guardado(k, v){ try { if (v === undefined) return localStorage.getItem(k) || ''; localStorage.setItem(k, v); } catch (e) { return ''; } }
  function post(ruta, cuerpo){
    return fetch(BASE + ruta, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign(K ? { k: K } : {}, cuerpo || {})) })
      .then(function(r){ return r.text().then(function(t){
        var j = null; try { j = JSON.parse(t); } catch (e) {}
        if (!r.ok || !j) throw new Error((j && (j.error || j.message)) || (r.status === 500 ? 'No se pudo guardar: revisa que te toque decidirlo' : 'Error ' + r.status));
        return j;
      }); });
  }
  // Quien firma lo que se aprueba: el lider elegido en el filtro; con "Todos", Mike.
  function actor(){ return fLid !== 'todos' ? fLid : 'Mike'; }
  function puede(decide){ return actor() === 'Mike' || actor() === decide; }
  function modal(h){ cerrar(); var f = document.createElement('div'); f.className = 'fondo'; f.id = 'fondo'; f.innerHTML = '<div class="modal">' + h + '</div>'; document.body.appendChild(f); }
  function cerrar(){ var f = $('fondo'); if (f) f.remove(); }

  // ---------- Vocabulario con su ayuda ----------
  var CL = { nuevo: ['Nuevo', 'La base no lo dice y conviene agregarlo.'], refuerza: ['Confirma', 'La base ya lo dice y esto lo confirma.'],
    mas_convincente: ['Más convincente', 'La base lo dice, pero responden mejor a otra forma de decirlo.'], contradice: ['Contradice', 'Dicen lo contrario de lo que la base afirma u ofrece: hay que decidir.'],
    corrige: ['Corrige', 'Un dato de la base es falso o ya no está vigente.'], ya_no_funciona: ['Ya no funciona', 'Algo de la base dejó de producir respuestas o citas.'],
    hueco: ['Hueco', 'Una pregunta u objeción que la base no responde.'], hipotesis: ['Hipótesis', 'Algo prometedor con poca evidencia: se prueba antes de meterlo a la base.'],
    otra_linea: ['De otra línea', 'Es de otro producto o llegó a un segmento equivocado.'], fuera: ['Ruido', 'No sirve para la base.'] };
  var MAD = { hipotesis: ['Hipótesis', 'Poca evidencia: 1 o 2 casos.'], en_prueba: ['En prueba', 'Aprobada para probarse en la ronda; se mide al cierre.'],
    comprobada: ['Comprobada', 'Se repitió 3 veces o más.'], nucleo: ['Núcleo', 'Comprobada y ya en el centro de la base.'], refutada: ['Refutada', 'Los datos dicen que ya no funciona.'], vencida: ['Vencida', 'Material de hace más de 90 días que nada reciente confirma.'] };
  // Las 10 entradas de la Voz del mercado. D1-D7 se analizan; D8 y D9 se miden al cierre de la ronda; D10 se cuenta.
  var ENT = { D1: ['Secuencias', 'Respuestas a las secuencias de Amplemarket: qué ángulo, rol e industria responde o rechaza.'],
    D2: ['DUO (señales)', 'Respuestas a los mensajes DUO: qué señal sí abre conversación.'], D3: ['Open+3', 'Respuestas de quien recibió el mensaje Open+3 (abrió 3 veces y no contestó).'],
    D4: ['WhatsApp', 'Conversaciones del bot de WhatsApp: qué pregunta la gente y dónde se traba.'], D5: ['Reuniones', 'Transcripts de las reuniones (Gemini), cada una contra la base de su línea.'],
    D6: ['Coaching', 'Notas de coaching después de cada reunión (Post-Reunión en HubSpot).'], D7: ['Correcciones', 'Mensajes del motor que el equipo corrigió.'],
    D8: ['Resultados', 'Respuestas, citas y conversaciones medidas contra la línea base. Se mide al cierre de la ronda.'], D9: ['Señal de cada cita', 'Qué señal produjo cada cita. Se mide al cierre de la ronda.'],
    D10: ['Motivos de pérdida', 'Oportunidades perdidas en la ventana y su motivo (HubSpot). Se cuentan, no se analizan.'] };
  var ENT_A = ['D1', 'D2', 'D3', 'D4', 'D5', 'D6', 'D7', 'D8', 'D9', 'D10'];
  var VOZ_MARCA = { E1: 'Propuesta de valor', E2: 'ICP', E3: 'Llamado a la acción', E4: 'Presentación del Discovery y template', E5: 'Catálogo: monto, responsables y partner', E6: 'Reglas del REA', E7: 'Configuración de señales', E8: 'Casos citables', E9: 'Directorio de partners' };
  // Tipo de acción de cada propuesta. Las viejas (sin "accion") la toman de su clase.
  var ACC = { cambiar_base: ['Cambiar la base', 'Aprobar cambia el texto de la base en la siguiente versión.'], probar: ['Probar en la ronda', 'Aprobar la pone «en prueba»: se mide al cierre de la ronda y, si funciona, entra a la base.'],
    corregir_lista: ['Corregir la lista', 'Sacar o mover un segmento, industria o rol de una lista o secuencia de Amplemarket.'], otra_linea: ['Pasar a otra línea', 'Lo que se aprendió es de otro producto: se manda a su base.'],
    regla: ['Respuesta del bot o del motor', 'Una regla nueva de cómo contestar (bot de WhatsApp, respuestas a replies o DUO).'], ninguna: ['Solo informativo', 'No pide cambio; queda como contexto.'] };
  function tipoAcc(x){ if (x.accion && ACC[x.accion.tipo]) return x.accion.tipo;
    return x.clase === 'hipotesis' ? 'probar' : x.clase === 'otra_linea' ? 'otra_linea' : 'cambiar_base'; }
  var CATORCE = Date.now() - 14 * 86400000;
  function pasado(x){ return x.origen === 'rezago' || ((x.origen === 'reunion' || x.origen === 'consolidada') && Date.parse(x.fecha) < CATORCE); }
  function corto(n){ return String(n || '').replace(/\s*\(.*\)\s*$/, ''); }

  // ---------- Filtros: lider y producto ----------
  function lineasLider(){ return datos.lineas.filter(function(l){ return fLid === 'todos' || l.lidera === fLid; }); }
  function lineasVista(){ return lineasLider().filter(function(l){ return fProd === 'todos' || l.codigo === fProd; }); }
  function barraFiltros(){
    var lids = ['todos'].concat((datos.lideres || []).map(function(x){ return x.nombre; }));
    var ls = lineasLider();
    return '<div class="filtros-top"><div class="fila-f"><span class="lbl">Líder' + ay('Muestra solo los productos que lidera esa persona según el catálogo. Lo que apruebes queda con su nombre; con «Todos», con el de Mike.') + '</span>' +
      lids.map(function(n){ return '<button class="chip' + (fLid === n ? ' on' : '') + '" data-flid="' + esc(n) + '">' + (n === 'todos' ? 'Todos' : esc(n)) + '</button>'; }).join('') + '</div>' +
      '<div class="fila-f"><span class="lbl">Producto' + ay('Los productos del catálogo. Los que dicen «sin base» todavía no tienen base de conocimiento: sus mensajes se cuentan, pero no se analizan.') + '</span>' +
      '<button class="chip' + (fProd === 'todos' ? ' on' : '') + '" data-fprod="todos">Todos (' + ls.length + ')</button>' +
      ls.map(function(l){ return '<button class="chip' + (fProd === l.codigo ? ' on' : '') + (l.kb ? '' : ' sinbase') + '" data-fprod="' + esc(l.codigo) + '" title="' + esc(l.nombre + ' · lidera ' + l.lidera + (l.kb ? ' · base ' + l.kb.nombre : ' · sin base todavía')) + '">' + esc(corto(l.nombre)) + (l.kb ? '' : ' · sin base') + '</button>'; }).join('') + '</div></div>';
  }

  // 29 oct: el borrador de cada base se lee al cargar. Antes «Ver cómo quedaría» siempre volvía a prepararlo y, si se
  // cerraba la ventana, no quedaba a la vista; ahora el botón dice si está preparando, listo para revisar o con error.
  var borr = {};
  function leerBorradores(){
    (datos.lineas || []).filter(function(l){ return l.kb && l.por_aplicar; }).forEach(function(l){
      post('gr-portal-kb-borrador', { linea: l.codigo }).then(function(j){ borr[l.codigo] = j.borrador || {}; if (vista === 'resumen') pintar(); }).catch(function(){});
    });
  }
  function cargar(){
    return post('gr-conocimiento').then(function(j){ datos = j;
      if (fLid !== 'todos' && !(datos.lideres || []).some(function(x){ return x.nombre === fLid; })) fLid = 'todos';
      if (fProd !== 'todos' && !datos.lineas.some(function(l){ return l.codigo === fProd; })) fProd = 'todos';
      pintar(); leerBorradores(); })
      .catch(function(e){ $('main').innerHTML = '<p class="error">No se pudo cargar: ' + esc(e.message) + '. Vuelve a intentar.</p>'; });
  }
  // Pendientes de las bases agrupados por tema: cada base nombra distinto el mismo choque, asi que se agrupan en temas fijos
  // (el orden importa: gana la primera regla que coincide). Dentro de cada tema va cada linea con su choque.
  var TEMAS = [
    ['fuentes', 'Fuentes sin leer o sin fuente directa', /no le[ií]das|le[ií]das en|^fuentes|sin fuente|^falta|lo que falta/i],
    ['plazos', 'Plazos', /plazo/i],
    ['paises', 'Países e idioma', /argentina|espa[nñ]a|pa[ií]s|puerto rico|idioma/i],
    ['monto', 'Monto, precio y cobro', /monto|cobro|licencia|precio/i],
    ['partner', 'Partner técnico', /partner|telecom/i],
    ['medicion', 'Números del motor que no cuadran', /cita|interesados|reuni[oó]n|denominador|cu[aá]ntos|ventaja|apertura|resultados mezclados|ruta de|ciclo|n[uú]mero de paso|oportunidad sin origen|mensajes que produjeron|gancho|bandeja|insumos|channel factory/i],
    ['senales', 'Señales y cómo se configuran', /se[ñn]al|vacantes|palabras clave|or[ií]genes|canales/i],
    ['ofrece', 'Qué se ofrece y cómo se pide (llamado a la acción)', /qu[eé] se ofrece|cta|cierre|duraci[oó]n|sin costo|c[oó]mo se abre|frase ancla|seguimiento/i],
    ['casos', 'Cifras y casos que se pueden citar', /cifra|caso|cliente|ahorro|multiplica|24\/7|pruebas|datastax|migramos|m[aá]s de 20/i],
    ['roles', 'A quién se le habla: decisor, roles y tamaño', /qui[eé]n decide|decisor|rol|tama[nñ]o/i],

    var t = e.target.closest('[data-v],[data-ayuda],[data-flid],[data-fprod],[data-zona],[data-ir],[data-fper],[data-fest],[data-fent],[data-facc],[data-freu],[data-ff],[data-ok],[data-otra],[data-guarda],[data-ia],[data-base],[data-permiso],[data-verb]'); if (!t || !datos) return;
    var g = function(k){ return t.getAttribute(k); };
    if (t.hasAttribute('data-v')) { vista = g('data-v'); window.scrollTo(0, 0); return pintar(); }
    if (t.hasAttribute('data-ayuda')) return verAyuda();
    if (t.hasAttribute('data-flid')) { fLid = g('data-flid'); if (fProd !== 'todos' && !lineasLider().some(function(l){ return l.codigo === fProd; })) fProd = 'todos'; return pintar(); }
    if (t.hasAttribute('data-fprod')) { fProd = g('data-fprod'); return pintar(); }
    if (t.hasAttribute('data-zona')) { zona = g('data-zona'); return pintar(); }
    // Celda de la matriz: abre Por decidir con ese producto, entrada y periodo.
    if (t.hasAttribute('data-ir')) { var p = g('data-ir').split('|'); fProd = p[0]; fEnt = p[1]; fPer = p[2]; fAcc = 'todas'; fEst = 'nuevo'; vista = 'decidir'; window.scrollTo(0, 0); return pintar(); }
    if (t.hasAttribute('data-fper')) { fPer = g('data-fper'); return pintar(); }
    if (t.hasAttribute('data-fest')) { fEst = g('data-fest'); return pintar(); }
    if (t.hasAttribute('data-fent')) { fEnt = g('data-fent'); fAcc = 'todas'; return pintar(); }
    if (t.hasAttribute('data-facc')) { fAcc = g('data-facc'); return pintar(); }
    if (t.hasAttribute('data-freu')) { fReu = g('data-freu'); return pintar(); }
    if (t.hasAttribute('data-ff')) { fFij = g('data-ff'); return pintar(); }
    if (t.hasAttribute('data-permiso')) { e.preventDefault(); return pedirPermiso(g('data-permiso')); }
    if (t.hasAttribute('data-base')) { e.preventDefault(); return verBase(g('data-base')); }
    if (t.hasAttribute('data-verb')) { var lv = datos.lineas.filter(function(x){ return x.codigo === g('data-verb'); })[0]; return verBorrador(lv, borr[g('data-verb')] || {}); }
    if (t.hasAttribute('data-ok')) { t.disabled = true; return decidir(g('data-ok'), 'confirmo'); }
    if (t.hasAttribute('data-otra')) { var d = $('otra-' + g('data-otra').replace('|', '-')); d.hidden = !d.hidden; if (!d.hidden) d.querySelector('textarea').focus(); return; }
    if (t.hasAttribute('data-guarda')) { var c = g('data-guarda'), v = $('otra-' + c.replace('|', '-')).querySelector('textarea').value.trim(); if (!v) return toast('Escribe qué se decide'); t.disabled = true; return decidir(c, 'cambio', v); }
    if (t.hasAttribute('data-ia')) {
      var a = g('data-ia'), i = g('data-i');
      if (a === 'editar') {
        var actual = ($('txt-' + i) || {}).textContent || '';
        modal('<h3>Editar la propuesta</h3><p class="nota">Queda aprobada con tu texto. Si es una prueba, di en qué secuencia o salida y cómo se mide.</p><textarea id="edTxt" style="min-height:120px">' + esc(actual) + '</textarea><div class="acc"><button class="btn sec" id="cerrar">Cancelar</button><button class="btn" id="edOk">Guardar y aprobar</button></div>');
        $('cerrar').onclick = cerrar; $('edOk').onclick = function(){ var v = $('edTxt').value.trim(); if (!v) return; cerrar(); revisar(i, 'editar', v); };
        return;
      }
      t.disabled = true; return revisar(i, a);
    }
  });
  cargar();
})();
</script>
</body>
</html>
