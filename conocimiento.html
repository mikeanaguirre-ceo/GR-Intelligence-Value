<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Conocimiento Great Revenue</title>
<style>
  /* Conocimiento (plan B, 25 oct 2026): pestana del tablero (?tab=conocimiento), con el formato del tablero. Sin clave. */
  :root{ --purple:#7C3AED; --pink:#EC4899; --cyan:#06B6D4; --mint:#10B981; --yellow:#F59E0B; --red:#EF4444;
    --bg:#0B0F19; --bg-2:#141827; --bg-3:#1E2433; --border:#2A3142; --text:#F3F4F6; --text-dim:#9CA3AF; --text-mute:#6B7280; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
  button,textarea{font:inherit}
  a{color:var(--cyan);text-decoration:none} a:hover{text-decoration:underline}
  #app{max-width:1400px;margin:0 auto;padding:16px}
  .hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:linear-gradient(135deg,var(--purple),var(--pink));border-radius:12px;margin-bottom:14px}
  .hdr b{font-size:17px;font-weight:800;letter-spacing:.5px} .hdr span{font-size:11px;opacity:.85;letter-spacing:1px;text-transform:uppercase}
  .en-tablero .hdr{display:none}
  .barra-sup{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .tabs{display:flex;gap:4px;background:var(--bg-2);padding:6px;border-radius:10px;overflow-x:auto}
  .tab{background:transparent;border:0;color:var(--text-dim);padding:9px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
  .tab:hover{background:var(--bg-3);color:var(--text)}
  .tab.on{background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff}
  .tab .n{background:rgba(0,0,0,.3);border-radius:9px;padding:0 7px;margin-left:6px;font-size:11px}
  .tab .n:empty{display:none}
  .yo{font-size:13px;color:var(--text-dim)} .yo b{color:var(--text)}
  h1{font-size:18px;font-weight:800;margin-bottom:4px} h2{font-size:12px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin:22px 0 10px}
  .nota{font-size:13px;color:var(--text-dim);margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
  .card{background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px}
  .card.clic{cursor:pointer;text-align:left;color:inherit;width:100%} .card.clic:hover{border-color:var(--purple)}
  .card.hecho{opacity:.72}
  .kpi{background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
  .kpi .v{font-size:22px;font-weight:800} .kpi .t{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.8px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px}
  .t{font-weight:700} .sub{font-size:12px;color:var(--text-dim)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .etq{font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px;background:var(--bg-3);color:var(--text-dim);white-space:nowrap}
  .etq.mike{background:rgba(239,68,68,.18);color:#fca5a5} .etq.lider{background:rgba(6,182,212,.16);color:#67e8f9}
  .etq.nuevo{background:rgba(16,185,129,.16);color:#6ee7b7} .etq.corrige{background:rgba(245,158,11,.16);color:#fcd34d}
  .etq.contradice{background:rgba(239,68,68,.18);color:#fca5a5} .etq.refuerza{background:rgba(124,58,237,.2);color:#c4b5fd}
  .etq.ok{background:rgba(16,185,129,.16);color:#6ee7b7}
  .cab{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
  .bloque{font-size:13px;margin-top:8px} .bloque span{display:block;font-size:10.5px;font-weight:700;color:var(--text-mute);text-transform:uppercase;letter-spacing:.8px;margin-bottom:2px}
  .antes{background:rgba(239,68,68,.08);border-left:3px solid var(--red);border-radius:6px;padding:6px 10px}
  .despues{background:rgba(16,185,129,.08);border-left:3px solid var(--mint);border-radius:6px;padding:6px 10px}
  .linea-dec{border-top:1px solid var(--border);padding-top:10px;margin-top:10px}
  .acc{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .btn{background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;border:0;border-radius:8px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer}
  .btn.sec{background:var(--bg-3);color:var(--text);border:1px solid var(--border)} .btn:disabled{opacity:.45;cursor:default}
  .enlace{background:none;border:0;color:var(--cyan);cursor:pointer;font-size:12.5px}
  textarea{width:100%;min-height:70px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px;font-size:13px;margin-top:6px}
  .filtros{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
  .chip{border:1px solid var(--border);background:var(--bg-2);color:var(--text-dim);border-radius:16px;padding:5px 12px;font-size:12.5px;cursor:pointer}
  .chip.on{background:var(--purple);border-color:var(--purple);color:#fff}
  .decidido{background:rgba(16,185,129,.1);border-radius:8px;padding:8px 10px;font-size:12.5px;margin-top:8px;color:#a7f3d0}
  .aviso{background:rgba(6,182,212,.08);border:1px solid rgba(6,182,212,.3);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--text-dim);margin-bottom:12px}
  .volver{background:none;border:0;color:var(--cyan);cursor:pointer;font-size:13px;margin-bottom:8px}
  .vacio{color:var(--text-mute);font-size:13px;padding:10px 0}
  .fondo{position:fixed;inset:0;background:rgba(4,6,12,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
  .modal{background:var(--bg-2);border:1px solid var(--border);border-radius:14px;padding:18px 20px;max-width:720px;width:100%;max-height:88vh;overflow:auto}
  .modal h3{font-size:16px;font-weight:800;margin-bottom:8px}
  .kb-md{white-space:pre-wrap;font-size:11.5px;max-height:45vh;overflow:auto;background:var(--bg);padding:8px;border-radius:6px;color:var(--text-dim)}
  .fila{border-bottom:1px solid var(--border);padding:6px 0;font-size:13px} .fila.mal b{color:var(--red)}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--bg-3);border:1px solid var(--border);color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;z-index:30}
  .error{color:#fca5a5;font-size:13px;margin-top:6px}
  ol.pasos{font-size:13.5px;line-height:1.6;padding-left:20px;color:var(--text-dim)} ol.pasos li{margin-bottom:6px} ol.pasos b{color:var(--text)}
  .tabla{overflow-x:auto} table.t2{width:100%;border-collapse:collapse;font-size:13px} table.t2 th{text-align:left;color:var(--text-mute);font-size:11px;text-transform:uppercase;letter-spacing:.8px;padding:6px 8px;border-bottom:1px solid var(--border)}
  table.t2 td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
  @media (max-width:640px){ #app{padding:10px} .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div id="app">
  <div class="hdr"><div><b>GREAT REVENUE</b><br><span>Conocimiento</span></div></div>
  <div class="barra-sup">
    <nav class="tabs" id="tabs">
      <button class="tab on" data-v="semana">Esta semana<span class="n" id="n-semana"></span></button>
      <button class="tab" data-v="fijas">Decisiones fijas<span class="n" id="n-fijas"></span></button>
      <button class="tab" data-v="ronda">Ronda</button>
      <button class="tab" data-v="rezago">Rezago<span class="n" id="n-rezago"></span></button>
      <button class="tab" data-v="como">Cómo funciona</button>
    </nav>
    <span class="yo" id="yo"></span>
  </div>
  <main id="main"><p class="vacio">Cargando…</p></main>
</div>
<script>
(function(){
  // Sin clave, como el tablero (decision de Mike, 25 oct). Si una liga vieja trae ?k=, se manda igual.
  var K = new URLSearchParams(location.search).get('k') || '';
  var BASE = 'https://mikea.app.n8n.cloud/webhook/';
  var datos = null, vista = 'semana', abierta = '', abiertaPasado = false, quien = '', fSem = 'mias', fFij = 'por', espera = null;
  if (window.self !== window.top) document.documentElement.classList.add('en-tablero');
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function toast(t){ var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 3200); }
  function fecha(ts){ return ts ? new Date(ts * 1000).toLocaleString('es-MX', { timeZone: 'America/Mexico_City', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : ''; }
  function guardado(k, v){ try { if (v === undefined) return localStorage.getItem(k) || ''; localStorage.setItem(k, v); } catch (e) { return ''; } }
  function post(ruta, cuerpo){
    return fetch(BASE + ruta, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign(K ? { k: K } : {}, cuerpo || {})) })
      .then(function(r){ return r.text().then(function(t){
        var j = null; try { j = JSON.parse(t); } catch (e) {}
        if (!r.ok || !j) throw new Error((j && (j.error || j.message)) || (r.status === 500 ? 'No se pudo guardar: revisa que te toque decidirlo' : 'Error ' + r.status));
        return j;
      }); });
  }
  function puede(decide){ return quien === 'Mike' || quien === decide; }
  function mia(l){ return quien === 'Mike' || quien === 'Martha' || l.lidera === quien; }
  function modal(h){ cerrar(); var f = document.createElement('div'); f.className = 'fondo'; f.id = 'fondo'; f.innerHTML = '<div class="modal">' + h + '</div>'; document.body.appendChild(f); }
  function cerrar(){ var f = $('fondo'); if (f) f.remove(); }
  // Las 10 clases del plan B y la madurez de cada pieza.
  var CL = { nuevo: 'Nuevo', refuerza: 'Confirma', mas_convincente: 'Más convincente', contradice: 'Contradice', corrige: 'Corrige', ya_no_funciona: 'Ya no funciona',
    hueco: 'Hueco', hipotesis: 'Hipótesis por probar', otra_linea: 'De otra línea', fuera: 'Ruido' };
  var MAD = { hipotesis: 'Hipótesis', en_prueba: 'En prueba', comprobada: 'Comprobada', nucleo: 'Núcleo', refutada: 'Refutada', vencida: 'Vencida' };
  // Lo pasado: el rezago y las reuniones de hace mas de 14 dias. Lo demas es de esta semana.
  var CATORCE = Date.now() - 14 * 86400000;
  function pasado(x){ return x.origen === 'rezago' || (x.origen === 'reunion' && Date.parse(x.fecha) < CATORCE); }

  function elegirPersona(){
    var ps = (datos && datos.personas) || [];
    modal('<h3>¿Quién eres?</h3><p class="nota">Lo que apruebes o decidas queda con tu nombre y la hora. Cada quien ve primero sus líneas.</p><div class="acc">' +
      ps.map(function(p){ return '<button class="btn' + (p === quien ? '' : ' sec') + '" data-p="' + esc(p) + '">' + esc(p) + '</button>'; }).join('') + '</div>');
    $('fondo').onclick = function(e){ var p = e.target.getAttribute('data-p'); if (p) { quien = p; guardado('gr_conocimiento_quien', p); cerrar(); pintar(); } };
  }
  function cargar(){
    return post('gr-conocimiento').then(function(j){ datos = j; quien = guardado('gr_conocimiento_quien'); if (datos.personas.indexOf(quien) < 0) quien = ''; pintar(); if (!quien) elegirPersona(); })
      .catch(function(e){ $('main').innerHTML = '<p class="error">No se pudo cargar: ' + esc(e.message) + '. Vuelve a intentar.</p>'; });
  }
  // Pendientes de las bases agrupados por tema: cada base nombra distinto el mismo choque, asi que se agrupan en temas fijos
  // (el orden importa: gana la primera regla que coincide). Dentro de cada tema va cada linea con su choque.
  var TEMAS = [
    ['fuentes', 'Fuentes sin leer o sin fuente directa', /no le[ií]das|le[ií]das en|^fuentes|sin fuente|^falta|lo que falta/i],
    ['plazos', 'Plazos', /plazo/i],
    ['paises', 'Países e idioma', /argentina|espa[nñ]a|pa[ií]s|puerto rico|idioma/i],
    ['monto', 'Monto, precio y cobro', /monto|cobro|licencia|precio/i],
    ['partner', 'Partner técnico', /partner|telecom/i],
    ['medicion', 'Números del motor que no cuadran', /cita|interesados|reuni[oó]n|denominador|cu[aá]ntos|ventaja|apertura|resultados mezclados|ruta de|ciclo|n[uú]mero de paso|oportunidad sin origen|mensajes que produjeron|gancho|bandeja|insumos|channel factory/i],
    ['senales', 'Señales y cómo se configuran', /se[ñn]al|vacantes|palabras clave|or[ií]genes|canales/i],
    ['ofrece', 'Qué se ofrece y cómo se pide (llamado a la acción)', /qu[eé] se ofrece|cta|cierre|duraci[oó]n|sin costo|c[oó]mo se abre|frase ancla|seguimiento/i],
    ['casos', 'Cifras y casos que se pueden citar', /cifra|caso|cliente|ahorro|multiplica|24\/7|pruebas|datastax|migramos|m[aá]s de 20/i],
    ['roles', 'A quién se le habla: decisor, roles y tamaño', /qui[eé]n decide|decisor|rol|tama[nñ]o/i],
    ['segmentos', 'Industrias, segmentos y fronteras con otras líneas', /industria|banca|seguros|agencias|ciberseguridad|frente de cx|traslape|frontera|alcance|campa[nñ]a/i],
    ['nombre', 'Nombre del producto y cómo se dice', /nombr|motores|texto del open|integraciones|azure|perfiles falsos/i],
    ['versiones', 'Versiones de PV, ICP, presentación y ficha', /versi[oó]n|ficha|pv vo|pie de la pv|resumen de marketing|discovery|presentaci|diferenciales|enfoque|m[eé]todo|etapas|recorridos|c[oó]digo/i],
    ['mensajes', 'Dolores, objeciones y mensajes', /dolor|objeci[oó]n|datos solo|mensajes|alcance/i]
  ];
  function temaDe(t){ for (var i = 0; i < TEMAS.length; i++) if (TEMAS[i][2].test(t)) return TEMAS[i]; return ['otros', 'Otros', null]; }
  function grupos(){
    var g = {}, orden = TEMAS.map(function(x){ return x[0]; }).concat(['otros']);
    datos.lineas.forEach(function(l){ l.pendientes.forEach(function(x){ var tm = temaDe(x.tema); (g[tm[0]] = g[tm[0]] || { clave: tm[0], tema: tm[1], items: [] }).items.push({ l: l, x: x }); }); });
    return Object.keys(g).map(function(k){ var o = g[k]; o.mike = o.items.some(function(i){ return i.x.decide === 'Mike'; }); o.abiertos = o.items.filter(function(i){ return !i.x.decision; }).length;
      o.lineas = o.items.map(function(i){ return i.l.codigo; }).filter(function(c, n, a){ return a.indexOf(c) === n; }).length; return o; })
      .sort(function(a, b){ return orden.indexOf(a.clave) - orden.indexOf(b.clave); });
  }
  function contar(){
    var sem = 0, rez = 0; datos.lineas.forEach(function(l){ if (fSem === 'todas' || mia(l)) l.propuestas.forEach(function(x){ if (x.estado === 'nuevo') { if (pasado(x)) rez++; else sem++; } }); });
    var fij = 0; grupos().forEach(function(g){ if (g.items.some(function(i){ return !i.x.decision && puede(i.x.decide); })) fij++; });
    $('n-semana').textContent = sem || ''; $('n-fijas').textContent = fij || ''; $('n-rezago').textContent = rez || '';
  }

  function pintar(){
    $('yo').innerHTML = quien ? 'Eres <b>' + esc(quien) + '</b> · <button class="enlace" data-cambiar="1">cambiar</button>' : '';
    document.querySelectorAll('#tabs .tab').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-v') === vista); });
    contar();
    if (abierta) return pintarLinea();
    if (vista === 'semana') return pintarSemana();
    if (vista === 'fijas') return pintarFijas();
    if (vista === 'ronda') return pintarRonda();
    if (vista === 'rezago') return pintarRezago();
    return pintarComo();
  }

  // ---------- Esta semana (Hacer): lo nuevo de cada linea, para su lider ----------
  function pintarSemana(){
    var ls = datos.lineas.filter(function(l){ return l.kb && (fSem === 'todas' || mia(l)); });
    var h = '<h1>Esta semana</h1><p class="nota">Lo que dejaron las reuniones, los replies, Open+3, WhatsApp y las correcciones, comparado contra la base de cada línea. Lo que confirma o no sirve ya se archivó solo; aquí queda lo que necesita una decisión.</p>' +
      '<div class="filtros"><button class="chip' + (fSem === 'mias' ? ' on' : '') + '" data-fs="mias">Mis líneas</button><button class="chip' + (fSem === 'todas' ? ' on' : '') + '" data-fs="todas">Todas</button></div><div class="grid">';
    h += ls.map(function(l){
      var nuevas = l.propuestas.filter(function(x){ return x.estado === 'nuevo' && !pasado(x); });
      var por = {}; nuevas.forEach(function(x){ por[x.clase] = (por[x.clase] || 0) + 1; });
      return '<button class="card clic" data-l="' + esc(l.codigo) + '"><div class="t">' + esc(l.nombre) + '</div><div class="sub">Lidera ' + esc(l.lidera) + ' · ' + esc(l.kb.nombre) + '</div><div class="chips">' +
        (nuevas.length ? Object.keys(por).map(function(c){ return '<span class="etq ' + esc(c) + '">' + por[c] + ' ' + esc((CL[c] || c).toLowerCase()) + '</span>'; }).join('') : '<span class="etq ok">Al día</span>') +
        (l.por_aplicar ? '<span class="etq refuerza">' + l.por_aplicar + ' por llevar a la base</span>' : '') + '</div></button>';
    }).join('') + '</div>';
    if (!ls.length) h += '<p class="vacio">No lideras ninguna línea con base. Mira "Todas".</p>';
    var sin = datos.lineas.filter(function(l){ return !l.kb; }).map(function(l){ return l.nombre; });
    if (sin.length) h += '<p class="nota" style="margin-top:12px">Sin base todavía: ' + esc(sin.join(', ')) + '.</p>';
    $('main').innerHTML = h;
  }
  function linea(){ return datos.lineas.filter(function(l){ return l.codigo === abierta; })[0]; }
  function tarjetaPropuesta(x){
    var ok = puede(x.decide) && !x.aplicado;
    return '<div class="card' + (x.estado !== 'nuevo' ? ' hecho' : '') + '"><div class="cab"><span class="chips" style="margin:0"><span class="etq ' + esc(x.clase) + '">' + esc(CL[x.clase] || x.clase) + '</span><span class="etq">' + esc(x.seccion || 'Sin sección') + '</span><span class="etq">' + (x.origen === 'rezago' ? 'Rezago desde ' + esc(String(x.id).split('-').slice(2, 5).join('-')) : x.origen === 'lote' ? 'Lote semanal del ' + esc(x.fecha) : 'Reunión del ' + esc(x.fecha)) + '</span>' + (x.madurez ? '<span class="etq ' + (x.madurez === 'comprobada' ? 'ok' : x.madurez === 'refutada' ? 'contradice' : '') + '">' + esc(MAD[x.madurez] || x.madurez) + '</span>' : '') + '</span><span class="etq ' + (x.decide === 'Mike' ? 'mike' : 'lider') + '">Lo decide ' + esc(x.decide) + '</span></div>' +
      (x.actual ? '<div class="bloque antes"><span>Hoy dice</span>' + esc(x.actual) + '</div>' : '') +
      '<div class="bloque despues"><span>' + (x.actual ? 'Quedaría' : 'Se agrega') + '</span><div id="txt-' + esc(x.id) + '">' + esc(x.texto) + '</div></div>' +
      (x.motivo ? '<div class="sub" style="margin-top:6px">' + esc(x.motivo) + '</div>' : '') + (x.cita ? '<div class="sub" style="margin-top:4px">Evidencia: “' + esc(x.cita) + '” · ' + (x.citable ? 'se puede usar en público' : 'solo interno') + '</div>' : '') +
      (x.por ? '<div class="decidido">' + (x.estado === 'aprobado' ? 'Aprobada' : x.estado === 'descartado' ? 'No aprobada' : 'Regresada') + ' por <b>' + esc(x.por) + '</b> · ' + esc(fecha(x.ts)) + (x.aplicado ? ' · ya está en ' + esc(x.kb_version || 'la base') : '') + '</div>' : '') +
      (ok ? '<div class="acc">' + (x.estado !== 'aprobado' ? '<button class="btn sec" data-ia="aprobar" data-i="' + esc(x.id) + '">Aprobar</button>' : '') + '<button class="btn sec" data-ia="editar" data-i="' + esc(x.id) + '">Editar</button>' +
        (x.estado !== 'descartado' ? '<button class="btn sec" data-ia="descartar" data-i="' + esc(x.id) + '">No aprobar</button>' : '') + (x.estado !== 'nuevo' ? '<button class="enlace" data-ia="reabrir" data-i="' + esc(x.id) + '">Regresar a sin revisar</button>' : '') + '</div>' : '') + '</div>';
  }
  function pintarLinea(){
    var l = linea(); if (!l) { abierta = ''; return pintar(); }
    var deEsta = l.propuestas.filter(function(x){ return abiertaPasado ? pasado(x) : !pasado(x); });
    var nuevas = deEsta.filter(function(x){ return x.estado === 'nuevo'; }), hechas = deEsta.filter(function(x){ return x.estado !== 'nuevo'; });
    var h = '<button class="volver" id="volver">← ' + (abiertaPasado ? 'Rezago' : 'Esta semana') + '</button><h1>' + esc(l.nombre) + (abiertaPasado ? ' · rezago' : '') + '</h1><p class="nota">Lidera <b>' + esc(l.lidera) + '</b>. Base vigente: <a href="' + esc(l.kb.url) + '" target="_blank" rel="noopener">' + esc(l.kb.nombre) + '</a>.</p>' +
      '<h2>Por decidir (' + nuevas.length + ')</h2>' + (nuevas.length ? nuevas.map(tarjetaPropuesta).join('') : '<p class="vacio">Nada pendiente en esta línea.</p>') +
      (hechas.length ? '<details><summary class="sub" style="cursor:pointer;margin-top:10px">Ya revisadas (' + hechas.length + ')</summary>' + hechas.map(tarjetaPropuesta).join('') + '</details>' : '');
    $('main').innerHTML = h;
  }

  // ---------- Decisiones fijas: choques de la PV, el ICP y las reglas, agrupados por tema ----------
  function pintarFijas(){
    var gs = grupos().filter(function(g){
      if (fFij === 'por') return g.abiertos > 0;
      if (fFij === 'mias') return g.items.some(function(i){ return !i.x.decision && puede(i.x.decide); });
      if (fFij === 'hechas') return g.items.some(function(i){ return i.x.decision; });
      return true; });
    var h = '<h1>Decisiones fijas</h1><p class="nota">Choques entre la propuesta de valor, el ICP, el REA y lo que dice el mercado, que quedaron en "Pendiente de verificar" de cada base. Están agrupados por tema para decidir parejo en todas las líneas; abre un tema para ver cada línea. Lo que toca la promesa (qué se ofrece, cifras, casos, precios, plazos, países) lo decide Mike.</p>' +
      '<div class="filtros">' + [['por', 'Por decidir'], ['mias', 'Me tocan'], ['hechas', 'Decididas'], ['todas', 'Todas']].map(function(f){ return '<button class="chip' + (fFij === f[0] ? ' on' : '') + '" data-ff="' + f[0] + '">' + f[1] + '</button>'; }).join('') + '</div>';
    h += '<p class="sub" style="margin-bottom:10px">' + gs.length + ' tema' + (gs.length === 1 ? '' : 's') + ' en este filtro.</p>';
    h += gs.length ? gs.map(function(g){
      return '<details class="card"' + (gs.length <= 3 ? ' open' : '') + '><summary class="cab" style="cursor:pointer;list-style:none"><span class="t">' + esc(g.tema) + '</span><span class="chips" style="margin:0"><span class="etq">' + g.abiertos + ' por decidir de ' + g.items.length + '</span><span class="etq">' + g.lineas + ' línea' + (g.lineas === 1 ? '' : 's') + '</span><span class="etq ' + (g.mike ? 'mike' : 'lider') + '">' + (g.mike ? 'Incluye decisiones de Mike' : 'Lo decide el líder') + '</span></span></summary>' +
        g.items.map(function(i){
          var x = i.x, clave = i.l.codigo + '|' + x.id, ok = puede(x.decide) && !(x.decision && x.decision.aplicado);
          return '<div class="linea-dec"><div class="cab"><div class="sub"><b style="color:var(--text)">' + esc(i.l.nombre) + '</b> · ' + esc(x.tema) + '</div><span class="etq ' + (x.decide === 'Mike' ? 'mike' : 'lider') + '">Lo decide ' + esc(x.decide) + '</span></div>' +
            '<div class="bloque"><span>Qué dicen las fuentes</span>' + esc(x.choque) + '</div><div class="bloque"><span>Qué se tomó en la base</span>' + esc(x.tomado) + '</div>' +
            (x.decision ? '<div class="decidido"><b>Decidido por ' + esc(x.decision.por) + '</b> · ' + esc(fecha(x.decision.ts)) + (x.decision.aplicado ? ' · ya está en la base' : ' · entra en la siguiente versión') + '<br>' + esc(x.decision.texto) + '</div>' : '') +
            (ok ? '<div class="acc"><button class="btn sec" data-ok="' + esc(clave) + '">De acuerdo con lo que se tomó</button><button class="btn sec" data-otra="' + esc(clave) + '">Decidir otra cosa</button></div><div id="otra-' + esc(clave.replace('|', '-')) + '" hidden><textarea placeholder="Qué se decide y por qué"></textarea><div class="acc"><button class="btn" data-guarda="' + esc(clave) + '">Guardar decisión</button></div></div>' : '') + '</div>';
        }).join('') + '</details>';
    }).join('') : '<p class="vacio">Nada en este filtro.</p>';
    $('main').innerHTML = h;
  }

  // ---------- Ronda (Verificar y Actuar) ----------
  function pintarRonda(){
    var lote = datos.lote, ls = datos.lineas.filter(function(l){ return l.kb; });
    var h = '<h1>Ronda</h1><p class="nota">Qué versión de la base usa cada línea, qué falta llevar a la base y qué dejó el último lote. Al cierre de cada ronda se mide lo que está en prueba contra la línea base y se publica la versión nueva.</p>';
    if (lote) h += '<div class="kpis"><div class="kpi"><div class="v">' + lote.propuestas + '</div><div class="t">propuestas del último lote</div></div><div class="kpi"><div class="v">' + lote.lineas.reduce(function(a, l){ return a + l.revisar; }, 0) + '</div><div class="t">para decidir</div></div><div class="kpi"><div class="v">' + lote.lineas.reduce(function(a, l){ return a + l.confirman; }, 0) + '</div><div class="t">confirman la base</div></div><div class="kpi"><div class="v">' + esc(String(lote.desde).slice(5, 10)) + ' a ' + esc(String(lote.hasta).slice(5, 10)) + '</div><div class="t">semana analizada</div></div></div>';
    h += '<div class="card tabla"><table class="t2"><tr><th>Línea</th><th>Lidera</th><th>Base vigente</th><th>Por llevar a la base</th><th>Último lote</th><th></th></tr>' + ls.map(function(l){
      var lt = lote ? lote.lineas.filter(function(x){ return x.linea === l.codigo; })[0] : null;
      return '<tr><td>' + esc(l.nombre) + '</td><td>' + esc(l.lidera) + '</td><td><a href="' + esc(l.kb.url) + '" target="_blank" rel="noopener">' + esc(l.kb.nombre) + '</a></td><td>' + l.por_aplicar + '</td><td class="sub">' + (lt ? esc(lt.cuentas.replies + ' replies · ' + lt.revisar + ' para decidir · ' + lt.confirman + ' confirman') : '—') + '</td>' +
        '<td>' + (puede(l.lidera) ? '<button class="btn sec" data-base="' + esc(l.codigo) + '"' + (l.por_aplicar ? '' : ' disabled') + '>Ver cómo quedaría</button>' : '') + '</td></tr>';
    }).join('') + '</table></div>';
    h += '<div class="aviso"><b>En prueba:</b> todavía no hay piezas en prueba. Se llenan con el paso 2 del plan B (madurez: hipótesis → en prueba → comprobada → núcleo, y refutada o vencida).</div>';
    $('main').innerHTML = h;
  }
  // ---------- Rezago ----------
  function pintarRezago(){
    var rz = datos.rezago || [], ls = datos.lineas.filter(function(l){ return l.kb && (fSem === 'todas' || mia(l)); });
    var tot = rz.reduce(function(a, c){ a.p += c.propuestas; c.lineas.forEach(function(l){ a.r += l.revisar; a.rep += l.cuentas.replies; }); return a; }, { p: 0, r: 0, rep: 0 });
    var h = '<h1>Rezago</h1><p class="nota">Lo que ya pasó y no se había recolectado, procesado por ciclos de 30 días, de lo más reciente a lo más viejo. Lo viejo pesa menos: sirve sobre todo para confirmar, marcar como "ya no funciona" lo que la base afirma y los datos desmienten, o encontrar huecos. Revisa una ventana por semana.</p>';
    h += '<div class="kpis"><div class="kpi"><div class="v">' + rz.length + '</div><div class="t">ventanas procesadas</div></div><div class="kpi"><div class="v">' + tot.rep + '</div><div class="t">replies leídos (sin fuera de oficina)</div></div><div class="kpi"><div class="v">' + tot.p + '</div><div class="t">propuestas</div></div><div class="kpi"><div class="v">' + tot.r + '</div><div class="t">para decidir</div></div></div>';
    h += '<div class="aviso"><b>Reuniones del rezago:</b> las de los últimos 90 días con transcript ya están en cola (66 el 26-oct: AM 34, AEO 16, TW 6, LT 4, GenIA 3, BD 2, ITS 1). Se procesan de lunes a viernes a las 9, 13 y 17, hasta 6 por vez, y sus propuestas aparecen aquí. Lo de más de 90 días va en la fase 2.</div>';
    h += '<div class="filtros"><button class="chip' + (fSem === 'mias' ? ' on' : '') + '" data-fs="mias">Mis líneas</button><button class="chip' + (fSem === 'todas' ? ' on' : '') + '" data-fs="todas">Todas</button></div>';
    if (rz.length) h += '<div class="card tabla"><table class="t2"><tr><th>Línea</th>' + rz.map(function(c){ return '<th>' + esc(String(c.desde).slice(5, 10)) + ' a ' + esc(String(c.hasta).slice(5, 10)) + '</th>'; }).join('') + '<th>Por decidir</th><th></th></tr>' +
      ls.map(function(l){
        var pend = l.propuestas.filter(function(x){ return pasado(x) && x.estado === 'nuevo'; }).length;
        return '<tr><td>' + esc(l.nombre) + '<div class="sub">Lidera ' + esc(l.lidera) + '</div></td>' + rz.map(function(c){ var x = c.lineas.filter(function(y){ return y.linea === l.codigo; })[0];
          return '<td class="sub">' + (x ? '<b style="color:var(--text)">' + x.revisar + '</b> para decidir<br>' + x.cuentas.replies + ' replies' + (x.cuentas.wa ? ' · ' + x.cuentas.wa + ' WhatsApp' : '') : '—') + '</td>'; }).join('') +
          '<td><b>' + pend + '</b></td><td><button class="btn sec" data-l="' + esc(l.codigo) + '" data-pasado="1"' + (l.propuestas.some(pasado) ? '' : ' disabled') + '>Revisar</button></td></tr>';
      }).join('') + '</table></div>';
    h += '<h2>Lo que dejó cada ventana</h2>' + rz.map(function(c){
      return '<details class="card"><summary class="cab" style="cursor:pointer;list-style:none"><span class="t">' + esc(String(c.desde).slice(0, 10)) + ' a ' + esc(String(c.hasta).slice(0, 10)) + '</span><span class="etq">' + c.propuestas + ' propuestas</span></summary>' +
        c.lineas.filter(function(x){ return fSem === 'todas' || ls.some(function(l){ return l.codigo === x.linea; }); }).map(function(x){ return '<div class="linea-dec"><div class="sub"><b style="color:var(--text)">' + esc(x.nombre) + '</b> · ' + x.cuentas.replies + ' replies, ' + x.cuentas.ooo + ' fuera de oficina, ' + x.cuentas.open3 + ' envíos de Open+3</div><div class="bloque">' + esc(x.error ? 'No se pudo analizar: ' + x.error : x.resumen) + '</div></div>'; }).join('') +
        (c.sin_base && c.sin_base.length ? '<div class="linea-dec sub">Sin base (solo se cuentan): ' + esc(c.sin_base.map(function(x){ return x.nombre + ' ' + x.replies + ' replies'; }).join(', ')) + '</div>' : '') + '</details>';
    }).join('');
    $('main').innerHTML = h;
  }
  function pintarComo(){
    $('main').innerHTML = '<h1>Cómo funciona</h1><p class="nota">Una base de conocimiento por línea (GR_KB_&lt;línea&gt;), de donde salen el bot de WhatsApp, Open+3, las secuencias, las señales, las respuestas a replies, la preparación de reuniones y la propuesta.</p>' +
      '<ol class="pasos"><li><b>Entradas fijas</b> (PV, ICP, llamado a la acción, reglas del REA, configuración de señales, casos): las decide Mike. Sus choques están en <b>Decisiones fijas</b>.</li>' +
      '<li><b>Entradas del día</b> (replies de secuencias y DUO, Open+3, WhatsApp, reuniones, coaching, correcciones, resultados): Claude las compara contra la base y las clasifica: nuevo, confirma, más convincente, contradice, corrige, ya no funciona, hueco, hipótesis, de otra línea o ruido. Lo que necesita decisión llega a <b>Esta semana</b>, para el líder de la línea.</li>' +
      '<li><b>Quién decide:</b> el líder según el catálogo. Lo que cambia la promesa (qué se ofrece, cifras, casos, precios, plazos, países) lo decide Mike.</li>' +
      '<li><b>Ronda:</b> cada 4 a 6 semanas se mide lo que está en prueba contra la línea base, lo comprobado sube al núcleo y se publica la versión nueva de la base. La anterior se conserva.</li>' +
      '<li><b>Rezago:</b> lo que ya pasó se recolecta por ciclos, empezando por los últimos 90 días; lo viejo pesa menos.</li></ol>';
  }

  // ---------- Acciones ----------
  function verBase(c){
    var l = datos.lineas.filter(function(x){ return x.codigo === c; })[0];
    post('gr-portal-kb-preparar', { linea: c }).then(function(){
      modal('<h3>Preparando la versión nueva</h3><p class="nota" id="kbMsg">Claude está integrando lo aprobado y las decisiones en ' + esc(l.kb.nombre) + '. Tarda de 1 a 3 minutos; puedes cerrar esta ventana y volver.</p><div class="acc"><button class="btn sec" id="cerrar">Cerrar</button></div>');
      $('cerrar').onclick = cerrar; clearInterval(espera); var n = 0;
      espera = setInterval(function(){
        if (++n > 40) { clearInterval(espera); return; }
        post('gr-portal-kb-borrador', { linea: c }).then(function(j){
          var x = j.borrador || {};
          if (x.estado === 'listo') { clearInterval(espera); if ($('kbMsg')) verBorrador(l, x); }
          if (x.estado === 'error') { clearInterval(espera); if ($('kbMsg')) $('kbMsg').textContent = 'No se pudo preparar: ' + (x.error || ''); }
        }).catch(function(){});
      }, 8000);
    }).catch(function(e){ toast(e.message); });
  }
  function verBorrador(l, b){
    modal('<h3>Así quedaría ' + esc(b.siguiente) + '</h3><p class="nota">Se crea un documento nuevo junto a ' + esc(b.kb_nombre) + ' (que se conserva) y el catálogo apunta a él.</p><div class="decidido">' + esc(b.resumen || '') + '</div>' +
      (b.cambios || []).map(function(x){ return '<div class="fila' + (x.aplicado ? '' : ' mal') + '"><b>' + (x.aplicado ? 'Entra' : 'No entra') + '</b> · ' + esc(x.seccion) + '<div class="sub">' + esc(x.como) + '</div></div>'; }).join('') +
      '<details><summary class="sub" style="cursor:pointer;margin-top:8px">Ver el documento completo</summary><pre class="kb-md">' + esc(b.markdown || '') + '</pre></details><div class="error" id="kbErr"></div>' +
      '<div class="acc"><button class="btn sec" id="cerrar">Todavía no</button><button class="btn" id="kbOk">Confirmar y crear ' + esc(b.siguiente) + '</button></div>');
    $('cerrar').onclick = cerrar;
    $('kbOk').onclick = function(){
      var btn = this; btn.disabled = true; btn.textContent = 'Creando…';
      post('gr-portal-kb-confirmar', { linea: l.codigo }).then(function(j){ cerrar(); toast('Listo: ' + j.nombre + ' creada y ligada en el catálogo'); return cargar(); })
        .catch(function(e){ btn.disabled = false; btn.textContent = 'Confirmar y crear ' + b.siguiente; $('kbErr').textContent = e.message; });
    };
  }
  function pendiente(clave){ var p = clave.split('|'), l = datos.lineas.filter(function(x){ return x.codigo === p[0]; })[0]; return { l: l, x: l.pendientes.filter(function(x){ return x.id === p[1]; })[0] }; }
  function decidir(clave, decision, texto){
    var o = pendiente(clave);
    post('gr-conocimiento-decidir', { por: quien, linea: o.l.codigo, id: o.x.id, tema: o.x.tema, choque: o.x.choque, tomado: o.x.tomado, decision: decision, texto: texto || '' })
      .then(function(){ toast('Decisión guardada con tu nombre'); return cargar(); }).catch(function(e){ toast(e.message); });
  }
  function revisar(id, accion, texto){
    post('gr-conocimiento-revisar', { por: quien, insumo_id: id, accion: accion, texto: texto || '' })
      .then(function(){ toast(accion === 'descartar' ? 'No aprobada' : accion === 'reabrir' ? 'Regresada a sin revisar' : 'Aprobada: entra en la siguiente versión de la base'); return cargar(); })
      .catch(function(e){ toast(e.message); });
  }

  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-cambiar],[data-v],[data-l],[data-fs],[data-ff],[data-ok],[data-otra],[data-guarda],[data-ia],[data-base],#volver'); if (!t || !datos) return;
    if (t.hasAttribute('data-cambiar')) return elegirPersona();
    if (t.hasAttribute('data-v')) { vista = t.getAttribute('data-v'); abierta = ''; abiertaPasado = false; return pintar(); }
    if (!quien) return elegirPersona();
    if (t.id === 'volver') { abierta = ''; abiertaPasado = false; return pintar(); }
    if (t.hasAttribute('data-l')) { abierta = t.getAttribute('data-l'); abiertaPasado = t.hasAttribute('data-pasado'); window.scrollTo(0, 0); return pintar(); }
    if (t.hasAttribute('data-fs')) { fSem = t.getAttribute('data-fs'); return pintar(); }
    if (t.hasAttribute('data-ff')) { fFij = t.getAttribute('data-ff'); return pintar(); }
    if (t.hasAttribute('data-base')) return verBase(t.getAttribute('data-base'));
    if (t.hasAttribute('data-ok')) { t.disabled = true; return decidir(t.getAttribute('data-ok'), 'confirmo'); }
    if (t.hasAttribute('data-otra')) { var d = $('otra-' + t.getAttribute('data-otra').replace('|', '-')); d.hidden = !d.hidden; if (!d.hidden) d.querySelector('textarea').focus(); return; }
    if (t.hasAttribute('data-guarda')) { var c = t.getAttribute('data-guarda'), v = $('otra-' + c.replace('|', '-')).querySelector('textarea').value.trim(); if (!v) return toast('Escribe qué se decide'); t.disabled = true; return decidir(c, 'cambio', v); }
    if (t.hasAttribute('data-ia')) {
      var a = t.getAttribute('data-ia'), i = t.getAttribute('data-i');
      if (a === 'editar') {
        var actual = ($('txt-' + i) || {}).textContent || '';
        modal('<h3>Editar la propuesta</h3><textarea id="edTxt" style="min-height:120px">' + esc(actual) + '</textarea><div class="acc"><button class="btn sec" id="cerrar">Cancelar</button><button class="btn" id="edOk">Guardar y aprobar</button></div>');
        $('cerrar').onclick = cerrar; $('edOk').onclick = function(){ var v = $('edTxt').value.trim(); if (!v) return; cerrar(); revisar(i, 'editar', v); };
        return;
      }
      t.disabled = true; return revisar(i, a);
    }
  });
  cargar();
})();
</script>
</body>
</html>
