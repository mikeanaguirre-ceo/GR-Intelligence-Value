<style>

/* HEADER */
.hdr {
  display: flex;

  display: flex; align-items: center; gap: 6px;
}
.dot {
  width: 8px; height: 8px;

  border-radius: 50%;

}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.btn-refresh {
  background: rgba(0,0,0,0.25);
  border: none;
  color: white;

.timer { font-size: 11px; opacity: 0.8; font-variant-numeric: tabular-nums; }

.tabs {

  border-radius: 10px;
  margin-bottom: 16px;

}
.tab {

  border: none;
  color: var(--text-dim);
  padding: 10px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;

}
.tab:hover { background: var(--bg-3); color: var(--text); }
.tab.active {
  background: linear-gradient(135deg, var(--purple), var(--pink));

}
.badge-red {

  padding: 2px 7px;

  font-size: 11px;
  margin-left: 6px;
}

/* PANELS */
.panel { display: none; }
.panel.active { display: block; }
.loading, .empty {

}
.error {

}

/* KPI CARDS */

}

.section {

  margin-bottom: 16px;
}
.section-title {

  margin-bottom: 14px;

}

}

/* TABLES */
.tbl {

/* FOOTER */

.kanban {

function grEsc(x){ return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtFecha(s){ if(!s||s==='null') return ''; var d=new Date(s); if(isNaN(d)) return ''; var M=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return d.getUTCDate()+' '+M[d.getUTCMonth()]+' '+d.getUTCFullYear(); }

function persResp(x,map){ var r=personaFromSubject((x.metadata||{}).subject); if(r) return r; var oid=String((x.engagement||{}).ownerId||""); return map[oid]||(oid?("Owner "+oid):"Sin asignar"); }
async function cargarActividadesGR(dealId,containerId){
  var box=document.getElementById(containerId); if(!box) return;
  box.innerHTML='<div style="color:#6B7280;font-size:11px">Cargando tareas…</div>';
  try{
    var r=await fetch('https://mikea.app.n8n.cloud/webhook/gr-act?dealId='+encodeURIComponent(dealId));
    var data=await r.json();
    var tasks=((data&&data.results)||[]).filter(function(x){return (x.engagement&&x.engagement.type)==='TASK';});
    if(!tasks.length){ box.innerHTML='<div style="color:#6B7280;font-size:11px">Sin tareas asociadas a esta oportunidad.</div>'; return; }
    var byOwner={};
    tasks.forEach(function(x){ var r=persResp(x,GR_OWNERS); (byOwner[r]=byOwner[r]||[]).push(x); });
    var html='';
    Object.keys(byOwner).forEach(function(oid){
      var nm=oid;
      var ts=byOwner[oid].sort(function(a,b){return (b.engagement.timestamp||0)-(a.engagement.timestamp||0);});
      html+='<div style="font-weight:800;color:#F3F4F6;font-size:13px;margin:9px 0 4px">'+grEsc(nm)+' <span style="color:#9CA3AF;font-weight:600;font-size:12px">· '+ts.length+' tarea'+(ts.length!==1?'s':'')+'</span></div>';
      ts.forEach(function(x){ var e=x.engagement||{}; var m=x.metadata||{}; var done=String(m.status||'').toUpperCase()==='COMPLETED'; var dts=e.timestamp||0; var now=Date.now(); var col=done?'#6B7280':(dts&&dts<now?'#DB0540':(dts&&(dts-now)<3*86400000?'#FFCD00':'#62D175')); var subj=String(m.subject||m.body||'Tarea').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').trim().slice(0,90); var dd=dts?new Date(dts).toISOString().slice(0,10):''; html+='<div style="display:flex;align-items:center;gap:9px;font-size:13px;padding:5px 0;line-height:1.4;border-bottom:1px solid rgba(255,255,255,.05)"><span style="width:10px;height:10px;border-radius:50%;background:'+col+';flex:none"></span><span style="flex:1;color:'+(done?'#6B7280':'#E5E7EB')+';'+(done?'text-decoration:line-through':'')+'">'+grEsc(subj)+'</span><span style="color:#9CA3AF;font-size:11px;flex:none">'+dd+'</span></div>'; });
    });
    box.innerHTML=html;
  }catch(err){ box.innerHTML='<div style="color:#DB0540;font-size:12px">No se pudieron cargar las actividades.</div>'; }
}

  var stgs=grStagesForSelect(); var curId=''; stgs.forEach(function(x){ if(x.id===d.stage) curId=x.id; });
  document.getElementById('grmd-stage').innerHTML=stgs.map(function(x){return '<option value="'+x.id+'"'+(x.id===curId?' selected':'')+'>'+grEsc(x.label)+'</option>';}).join('');

async function guardarDealGR(){
  var dealId=window.__grEditId; if(!dealId) return;
  var stage=document.getElementById('grmd-stage').value;
  var close=document.getElementById('grmd-close').value;
  var stt=document.getElementById('grmd-status'); var btn=document.getElementById('grmd-save');
  var _sel=document.getElementById('grmd-contact'); var _ph=document.getElementById('grmd-phone');
  var phoneChanged=!!(_sel&&_ph&&_sel.value&&_ph.value!==(_ph.getAttribute('data-orig')||''));
  stt.textContent='Guardando…'; stt.style.color='#9CA3AF'; btn.disabled=true;
  try{
    var r=await fetch('https://mikea.app.n8n.cloud/webhook/gr-deal',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({dealId:dealId,dealstage:stage,closedate:close})});
    if(!r.ok) throw new Error('HTTP '+r.status);
    if(phoneChanged){
      try{
        await fetch('https://mikea.app.n8n.cloud/webhook/gr-update-deal',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({contactId:_sel.value,properties:{phone:_ph.value}})});
      }catch(e){}
    }
    // Actualizacion optimista en memoria: sin recargar la pagina ni re-fetch.
    // El boton ↻ Actualizar es el punto de reconciliacion con HubSpot.
    var _d=(DATA.deals||[]).filter(function(x){return String(x.id)===String(dealId);})[0];
    if(_d){
      _d.stage=stage;
      if(close) _d.closedate=close;
      if(phoneChanged && _d.contacto && (!_d.contacto.id || String(_d.contacto.id)===String(_sel.value))){
        _d.contacto.telefono=_ph.value;
      }
    }
    cerrarModalGR();
    try{ renderCurrentTab(); }catch(e){}
    taskToast('Guardado. Aprieta ↻ Actualizar para confirmar con HubSpot', true);
    btn.disabled=false;
  }catch(e){ stt.textContent='Error al guardar: '+e.message; stt.style.color='#DB0540'; btn.disabled=false; }
}

function catStageColHex(){ var m={},pal=(CAT().paleta||CAT_FALLBACK.paleta); catStagesAct().forEach(function(s){m[s.label]=pal[s.color];}); return m; }
function catProdsPresentes(){
  var orden=((CAT().productos)||CAT_FALLBACK.productos||[]).map(function(p){return p.id;});
  var excl={'Interno':1,'Otro':1};
  var pres=[...new Set(((typeof DATA!=='undefined'&&DATA&&DATA.deals)?DATA.deals:[]).map(function(d){return d.prod;}).filter(Boolean))].filter(function(p){return !excl[p];});
  pres.sort(function(a,b){var ia=orden.indexOf(a),ib=orden.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib);});

}

function catProdMap(){ var m={}; ((CAT().productos)||CAT_FALLBACK.productos||[]).forEach(function(p){ m[p.id]=p; }); return m; }
function grupoDeProd(prod){ var p=catProdMap()[prod]; if(p&&p.grupo) return p.grupo; if(prod==='Interno'||prod==='Otro'||prod==='P-Otro') return 'INTERNO'; return 'GR'; }
var GRUPOS_ORDEN=['ALL','GR','PT','IMMMU','INTERNO'];
function grupoLabel(g){ return g==='ALL'?'All':(g==='INTERNO'?'Interno':g); }
// Semáforo de tiempo (uno solo): rojo=vencida, amarillo=hoy/próx 3d, verde=al día/futura
function semList(menu){ var b=[ {id:'ALL',label:'Todos'},{id:'rojo',label:'🔴 Vencidas'},{id:'amarillo',label:'🟡 Próximas'},{id:'verde',label:'🟢 Al día'} ]; if(menu==='pendientes'){ b.splice(1,0,{id:'cerradas',label:'<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#6B7280;margin-right:5px;vertical-align:middle;"></span>Cerradas'}); } return b; }
function semDeItem(it,kind){ if(it&&it.semaforo) return it.semaforo; return 'verde'; }
// Producto canónico presente en un arreglo dado (excluye Interno/Otro), en orden de catálogo
function prodsPresentesDe(arr){
  var orden=((CAT().productos)||CAT_FALLBACK.productos||[]).map(function(p){return p.id;});
  var excl={'Interno':1,'Otro':1,'P-Otro':1};
  var pres=[...new Set((arr||[]).map(function(x){return x.prod;}).filter(Boolean))].filter(function(p){return !excl[p];});
  pres.sort(function(a,b){var ia=orden.indexOf(a),ib=orden.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib);});
  return pres;
}
// Personas presentes (para conteo) en un arreglo, cada item con .personas (deals/alertas) o .persona (tareas)
function personasDeItem(it){ if(it&&Array.isArray(it.personas)) return it.personas; if(it&&it.persona) return [it.persona]; return []; }
// ===== Render de filtros unificado =====
function _chip(menu,k,v,label,active,extra){ return '<button class="chip '+(active?'active':'')+'" data-f="'+menu+'" data-k="'+k+'" data-v="'+v+'"'+(extra||'')+'>'+label+'</button>'; }
function _stagesPresentes(arr){
  var st=((CAT().stages)||CAT_FALLBACK.stages||[]).slice().sort(function(a,b){return a.prioridad-b.prioridad;});
  var labelsPres=[...new Set((arr||[]).map(function(d){return d.stageLabel||d.stage;}).filter(Boolean))];
  return st.filter(function(x){return labelsPres.indexOf(x.label)>=0;});
}
// arr = universo del menú (para conteos y opciones presentes). kind: 'deal'|'task'|'alerta'
function filtrosHTML(menu, arr, kind){
  var f=FILT[menu]; var H='';
  // Persona (todos los menús) con conteo
  var pcount={}; var totalP=0;
  (arr||[]).forEach(function(it){ var ps=personasDeItem(it); if(ps.length===0){ pcount['Otro']=(pcount['Otro']||0)+1; } else { ps.forEach(function(p){ pcount[p]=(pcount[p]||0)+1; }); } totalP++; });
  var pids=catPersonaIds();
  H+='<div class="filters"><span class="filter-label">Persona:</span>';
  H+=_chip(menu,'persona','Todos','Todos ('+totalP+')', f.persona==='Todos');
  pids.forEach(function(p){ if(pcount[p] || menu==='alertas') H+=_chip(menu,'persona',p, p+' ('+(pcount[p]||0)+')', f.persona===p); });
  if(pcount['Otro']) H+=_chip(menu,'persona','Otro','Otro ('+pcount['Otro']+')', f.persona==='Otro');
  H+='</div>';
  // Semáforo (pipeline, pendientes, alertas — no recap)
  if(menu!=='recap'){
    H+='<div class="filters"><span class="filter-label">Semáforo:</span>';
    semList(menu).forEach(function(o){ H+=_chip(menu,'sem',o.id,o.label, (f.sem||'ALL')===o.id); });
    H+='</div>';
  }
  // Grupo (todos)
  H+='<div class="filters"><span class="filter-label">Grupo:</span>';
  GRUPOS_ORDEN.forEach(function(g){ H+=_chip(menu,'grupo',g,grupoLabel(g), (f.grupo||'ALL')===g); });
  H+='</div>';
  // Producto (todos) canónico, presente
  var prods;
  if(menu==='alertas'){
    var _excl={'Interno':1,'Otro':1,'P-Otro':1};
    prods=((CAT().productos)||CAT_FALLBACK.productos||[]).map(function(x){return x.id;}).filter(function(x){return !_excl[x];});
  } else { prods=prodsPresentesDe(arr); }
  if(f.grupo && f.grupo!=='ALL'){ prods=prods.filter(function(p){return grupoDeProd(p)===f.grupo;}); }
  var _pc={}; (arr||[]).forEach(function(it){ if(it&&it.prod) _pc[it.prod]=(_pc[it.prod]||0)+1; });
  H+='<div class="filters"><span class="filter-label">Producto:</span>';
  H+=_chip(menu,'prod','ALL','Todos', (f.prod||'ALL')==='ALL');
  prods.forEach(function(p){ H+=_chip(menu,'prod',p, (menu==='alertas'? (p+' ('+(_pc[p]||0)+')') : p), f.prod===p); });
  H+='</div>';
  // Stage (solo deals: pipeline, alertas)
  if(kind==='deal'||kind==='alerta'){
    var stgs;
    if(menu==='alertas'){
      stgs=((CAT().stages)||CAT_FALLBACK.stages||[]).slice().sort(function(a,b){return a.prioridad-b.prioridad;});
    } else { stgs=_stagesPresentes(arr); }
    if(!stgs.some(function(x){return x.label==='Perdida';})) stgs=stgs.concat([{label:'Perdida'}]);
    var _sc={}; (arr||[]).forEach(function(it){ var l=(it&&(it.stageLabel||it.stage))||''; if(l) _sc[l]=(_sc[l]||0)+1; });
    H+='<div class="filters"><span class="filter-label">Stage:</span>';
    H+=_chip(menu,'stage','ALL','Todos', (f.stage||'ALL')==='ALL');
    stgs.forEach(function(x){ H+=_chip(menu,'stage',x.label, (menu==='alertas'? (x.label+' ('+(_sc[x.label]||0)+')') : x.label), f.stage===x.label); });
    H+='</div>';
    // Monto
    H+='<div class="filters"><span class="filter-label">Monto:</span>';
    MONTO_OPC.forEach(function(o){ H+=_chip(menu,'monto',o.id,o.label, (f.monto||0)===o.id); });
    H+='</div>';
  }
  // Categoría (solo alertas)
  if(menu==='alertas'){
    H+='<div class="filters"><span class="filter-label">Categoría:</span>';
    [['ALL','Todas'],['Cerrar','Cerrar'],['ReActivar','ReActivar'],['Higienizar','Higienizar']].forEach(function(o){ H+=_chip(menu,'categoria',o[0],o[1], (f.categoria||'ALL')===o[0]); });
    H+='</div>';
  }
  return H;
}

function pasaFiltro(menu, it, kind){
  var f=FILT[menu];
  if(f.persona && f.persona!=='Todos'){ var ps=personasDeItem(it); if(f.persona==='Otro'){ if(ps.length>0) return false; } else if(ps.indexOf(f.persona)<0) return false; }
  if(menu!=='recap' && f.sem && f.sem!=='ALL'){ if(semDeItem(it,kind)!==f.sem) return false; }
  if(f.grupo && f.grupo!=='ALL'){ if(grupoDeProd(it.prod)!==f.grupo) return false; }
  if(f.prod && f.prod!=='ALL'){ if(it.prod!==f.prod) return false; }
  if((kind==='deal'||kind==='alerta') && f.stage && f.stage!=='ALL'){ var sl=it.stageLabel||it.stage; if(sl!==f.stage) return false; }
  if((kind==='deal'||kind==='alerta') && f.monto){ if((it.amount||0) < f.monto) return false; }
  if(menu==='alertas' && f.categoria && f.categoria!=='ALL'){ if(it.categoria!==f.categoria) return false; }
  return true;
}

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => Array.from(document.querySelectorAll(sel));

function fmt(n) {
  if (n == null || isNaN(n)) return '—';
  return '$' + Math.round(n).toLocaleString('en-US');
}

function fmtK(n) {
  if (n == null || isNaN(n)) return '—';
  if (Math.abs(n) >= 1000000) return '$' + (n / 1000000).toFixed(2) + 'M';
  if (Math.abs(n) >= 1000) return '$' + Math.round(n / 1000) + 'K';
  return '$' + Math.round(n);
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  const now = new Date();
  return Math.floor((d - now) / (1000 * 60 * 60 * 24));
}

function tagForStage(stage, stageLabel) {
  // Prefer the label from the webhook (handles custom stage IDs correctly)
  const map = {
    presentationscheduled: 'tag-propuesta',
    qualifiedtobuy: 'tag-educacion',
    appointmentscheduled: 'tag-atraccion',
    closedwon: 'tag-won',
    decisionmakerboughtin: 'tag-won',

    '1332596064': 'tag-educacion',    // En Conv.
    '1092009814': 'tag-perdida'       // Perdida
  };
  const cls = map[stage] || 'tag-perdida';
  const label = stageLabel || stage || '—';
  return `<span class="tag ${cls}">${label}</span>`;
}

// --- Data fetch ---
async function loadData() {
  try {
    // Fetch principal v10 + AM v1 en paralelo
    // Prospección carga en paralelo pero NO bloquea el dashboard principal
    const prospPromise = fetch(PROSPECCION_URL).catch(e => { console.warn('Prospeccion endpoint failed:', e); return null; });
    const [dealsRes, amRes] = await Promise.all([
      fetch(DATA_URL),
      fetch(AM_URL + '?period=' + amPeriod).catch(e => { console.warn('AM endpoint failed:', e); return null; })
    ]);
    const prospRes = await prospPromise;
    const empresasRes = null;

    if (!dealsRes.ok) throw new Error('HTTP ' + dealsRes.status);
    
    // Leer como texto primero para diagnosticar mejor
    const dealsText = await dealsRes.text();
    if (!dealsText || dealsText.trim() === '') {
      throw new Error('QUOTA_LIMIT');
    }
    // Si la respuesta es HTML (típico de n8n cuando hay error de plan)
    if (dealsText.trim().startsWith('<')) {
      if (dealsText.includes('Execution limit') || dealsText.includes('upgrading your plan')) {
        throw new Error('QUOTA_LIMIT');
      }
      throw new Error('HTML_RESPONSE');
    }
    
    try {
      DATA = JSON.parse(dealsText);
    } catch (parseErr) {
      throw new Error('INVALID_JSON');
    }
    
    if (!DATA.ok) throw new Error('Webhook returned ok:false');

    // AM data es opcional — si falla el dashboard sigue funcionando
    if (amRes && amRes.ok) {
      try {
        const amText = await amRes.text();
        if (amText && amText.trim() !== '' && !amText.trim().startsWith('<')) {
          AM_DATA = JSON.parse(amText);
        }
      } catch (e) {
        console.warn('AM data parse failed:', e);
        AM_DATA = null;
      }
    }

    // Prospección eventos (opcional) — si falla, el dashboard sigue
    if (prospRes && prospRes.ok) {
      try {
        try {
          if (empresasRes) {
            const eText = await empresasRes.text();
            if (eText && eText.trim() !== '' && !eText.trim().startsWith('<')) {
              EMPRESAS_DATA = JSON.parse(eText);
            }
          }
        } catch(e2) { console.warn('Empresas error:', e2); }

        const pText = await prospRes.text();
        if (pText && pText.trim() !== '' && !pText.trim().startsWith('<')) {
          PROSPECCION_DATA = JSON.parse(pText);
        }
      } catch (e) {
        console.warn('Prospeccion data parse failed:', e);
        PROSPECCION_DATA = null;
      }
    }

    // Tasks ahora vienen del mismo webhook en DATA.tareas/DATA.statsTareas
    // Adaptamos al shape que espera el renderer: { tareas, statsTareas }
    TASKS = {
      tareas: DATA.tareas || {},
      statsTareas: DATA.statsTareas || {}
    };

    // Re-ligar cada tarea a su oportunidad por el VINCULO REAL de HubSpot (asociacion, 2 portales).
    // Si la tarea no tiene asociacion, se conserva lo que mando el backend (fallback).
    try {
      const ra = await fetch(GR_ASSOC_URL);
      if (ra && ra.ok) {
        const am = await ra.json();
        if (am && typeof am === 'object') {
          window.__assocMap = am;
          const _byId = {}; (DATA.deals || []).forEach(function(d){ _byId[String(d.id)] = d; });
          Object.keys(TASKS.tareas).forEach(function(p){
            (TASKS.tareas[p] || []).forEach(function(t){
              const aid = am[String(t.id)];
              const d = aid ? _byId[String(aid)] : null;
              if (d) { t.client = d.cliente || d.name || t.client; t.matchedDealIds = [d.id]; t.dealStages = [d.stageLabel || d.stage].filter(Boolean); }
            });
          });
        }
      }
    } catch (e) { /* fallback: valores del backend */ }

    updateTimer();
    updateFooter();
    renderCurrentTab();
    // Cargar datos de empresa en background (no bloquea)
    fetch(EMPRESAS_URL).then(function(r){ return r.json(); }).then(function(data){
      EMPRESAS_DATA = data;
      if(currentTab === 'prospeccion') renderCurrentTab();
    }).catch(function(e){ console.warn('Empresas endpoint failed:', e); });
  } catch (err) {
    console.error('Load error:', err);
    let html = '';
    if (err.message === 'QUOTA_LIMIT') {
      html = `<div class="error" style="background:#7F1D1D;border-left:3px solid #EF4444;padding:16px 20px;border-radius:8px;color:#FCA5A5">
        <div style="font-size:16px;font-weight:700;margin-bottom:8px;color:#FECACA">⚠️ Límite mensual de n8n alcanzado</div>
        <div style="color:#F3F4F6;line-height:1.5;margin-bottom:8px">El webhook de HubSpot no responde porque el plan de n8n llegó a su límite de ejecuciones del mes.</div>
        <div style="font-size:13px;color:#9CA3AF;margin-top:12px;padding-top:12px;border-top:1px solid #991B1B">
          <strong style="color:#F3F4F6">Soluciones:</strong><br>
          1. Subir el plan en <a href="https://app.n8n.cloud/account/change-plan" target="_blank" style="color:#FCA5A5;text-decoration:underline">n8n Cloud</a><br>
          2. Esperar reset mensual de la cuota<br>
          3. Pausar workflows no críticos
        </div>
      </div>`;
    } else if (err.message === 'INVALID_JSON' || err.message === 'HTML_RESPONSE') {
      html = `<div class="error" style="background:#7F1D1D;border-left:3px solid #EF4444;padding:16px 20px;border-radius:8px;color:#FCA5A5">
        <div style="font-size:16px;font-weight:700;margin-bottom:8px;color:#FECACA">⚠️ Backend respondió con formato inválido</div>
        <div style="color:#F3F4F6;line-height:1.5">El webhook regresó algo que no es JSON. Probablemente un error de n8n (rate limit, workflow desactivado o error interno).</div>
        <div style="font-size:13px;color:#9CA3AF;margin-top:12px">Verifica el workflow <code style="background:#1E2433;padding:2px 6px;border-radius:4px;color:#FCA5A5">MkWucn3DHSez5um1</code> en n8n.</div>
      </div>`;
    } else {
      html = `<div class="error" style="background:#7F1D1D;border-left:3px solid #EF4444;padding:16px 20px;border-radius:8px;color:#FCA5A5">
        <div style="font-size:16px;font-weight:700;margin-bottom:8px;color:#FECACA">⚠️ Error cargando datos</div>
        <div style="color:#F3F4F6;line-height:1.5">${err.message}</div>
        <div style="font-size:13px;color:#9CA3AF;margin-top:8px">URL: ${DATA_URL}</div>
      </div>`;
    }
    $('#p-recap').innerHTML = html;
  $$('#p-recap .task-edit-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      var titleBtn = (btn.dataset.title || '').replace(/&quot;/g, '"').slice(0, 40);
      // TASKS.tareas es {persona: [task, task, ...]}
      var found = null;
      if (TASKS && TASKS.tareas) {
        Object.values(TASKS.tareas).forEach(function(arr) {
          if (!found) arr.forEach(function(t) {
            if (!found && titleBtn && (t.title||'').indexOf(titleBtn.slice(0,30)) >= 0)
              found = t;
          });
        });
      }
      if (found) {
        openTaskEditor({
          tid: found.id||'', did: (found.matchedDealIds && found.matchedDealIds[0])||'',
          oid: found.ownerId||'', client: btn.dataset.client||found.client||'',
          title: found.title||'', prod: found.prod||'', persona: found.persona||'',
          date: found.date||'', stages: (found.dealStages||[]).join('|')
        });
      } else {
        // Tarea completada sin match en pendientes
        openTaskEditor({
          tid:'', did:'', oid:'', client: btn.dataset.client||'',
          title: (btn.dataset.title||'').replace(/&quot;/g,'"'),
          completionDate: btn.dataset.completionDate||''
        });
      }
    });
  });
  }
}

// --- Tab routing ---
function switchTab(tabId) {
  currentTab = tabId;
  $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tabId));
  $$('.panel').forEach(p => p.classList.toggle('active', p.id === 'p-' + tabId));
  history.pushState({tab:tabId},'',location.pathname+'?tab='+tabId);
  renderCurrentTab();
}
window.addEventListener('popstate',function(e){
  var tab=(e.state&&e.state.tab)||'pipeline';
  currentTab=tab;
  $$('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  $$('.panel').forEach(p=>p.classList.toggle('active',p.id==='p-'+tab));
  renderCurrentTab();
});

function renderCurrentTab() {
  if (!DATA) {
    // DATA no cargó aún — mostrar mensaje en el tab activo
    var contP = document.getElementById('p-prospeccion');
    if (contP && currentTab === 'prospeccion') {
      contP.innerHTML = '<div style="color:#9CA3AF;padding:16px;font-size:13px;">Esperando datos principales...</div>';
    }
    return;
  }
  const renderers = {
    recap: renderRecap,
    overview: renderOverview,
    pipeline: renderPipeline,
    won: renderWon,
    clientes: renderClientes,
    pendientes: renderPendientes,
    alertas: renderAlertasConLimpieza,
    prospeccion: renderProspeccion,
    amplemarket: renderAmplemarket,
    forecast: renderForecast,
    metricas: renderMetricas,
    chat: renderChat
  };
  const fn = renderers[currentTab];
  try { if (fn) fn(); } catch(e) {
    var ep = document.getElementById('p-' + currentTab);
    if (ep) ep.innerHTML = '<div style="color:#ef4444;padding:16px;">Error en render: ' + e.message + '</div>';
  }
}

const STAGE_ORDER_K = STAGE_ORDER.concat([{key:'1092009814',label:'Perdida',id:'1092009814'}]);
function nuevaMatch(createdate,val){ if(val==='ALL') return true; var f=new Date(createdate); if(isNaN(f)) return false; var now=new Date(); var sameMonth=f.getMonth()===now.getMonth()&&f.getFullYear()===now.getFullYear(); var age=Math.floor((now-f)/86400000); var dom=f.getDate(); if(val==='mes')return sameMonth; if(val==='s1')return sameMonth&&dom<=7; if(val==='s2')return sameMonth&&dom>=8&&dom<=14; if(val==='s3')return sameMonth&&dom>=15&&dom<=21; if(val==='s4')return sameMonth&&dom>=22; if(val==='g30')return age>30; if(val==='g45')return age>45; if(val==='g90')return age>90; return true; }
function nuevaPasa(d,val){ return nuevaMatch(d.createdate,val); }
function metaNuevas(goal){
  var prioMap={}; ((typeof CAT==='function'?CAT().stages:null)||CAT_FALLBACK.stages||[]).forEach(function(s){prioMap[s.id]=s.prioridad;});
  var now=new Date();
  var _ss=FILT.pipeline.stage,_sm=FILT.pipeline.sem,_sn=FILT.pipeline.nueva; FILT.pipeline.stage='ALL'; FILT.pipeline.sem='ALL'; FILT.pipeline.nueva='ALL';
  var eduPlus=(DATA.deals||[]).filter(function(d){ var p=prioMap[d.stage]; if(p===undefined||p<6||p>10) return false; var f=new Date(d.createdate); if(isNaN(f)||f.getMonth()!==now.getMonth()||f.getFullYear()!==now.getFullYear()) return false; if(FILT.pipeline.excludeP&&d.name&&d.name.startsWith('P_')) return false; return pasaFiltro('pipeline',d,'deal'); }).length;
  FILT.pipeline.stage=_ss; FILT.pipeline.sem=_sm; FILT.pipeline.nueva=_sn;
  var week=Math.min(4,Math.max(1,Math.ceil(now.getDate()/7)));
  var expected=Math.round(goal*week/4);
  var pacing=expected>0?Math.round(eduPlus/expected*100):0;
  return {goal:goal,eduPlus:eduPlus,week:week,expected:expected,pacing:pacing,onPace:eduPlus>=expected};
}
function nuevaCol(d){ var f=new Date(d.createdate); if(isNaN(f)) return 'transparent'; var age=Math.floor((new Date()-f)/86400000); return age<=7?'#10B981':age<=15?'#34d399':age<=30?'#FFCD00':age<=45?'#F59E0B':age<=90?'#F97316':'#6B7280'; }

function nuevaPasaTask(t,val,am){ if(val==='ALL') return true; var ids=t.matchedDealIds||[]; if(!ids.length) return false; return ids.some(function(id){ var c=am[String(id)]; return c!==undefined && nuevaMatch(c,val); }); }

const PERSONAS = catPersonaIds(); // centralizado en catálogo (CAT)
const EARLY_STAGES = ['Señal','Reply','Contactado','En Conv.'];
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MESES_CORTO = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

function taskToast(msg, ok) {
  let t = document.getElementById('task-toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'task-toast';
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:10001;padding:12px 18px;border-radius:10px;font-size:14px;font-weight:600;color:#fff;box-shadow:0 6px 24px rgba(0,0,0,.4);transition:opacity .3s;';
    document.body.appendChild(t);
  }
  t.style.background = ok ? '#16A34A' : '#DC2626';
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.opacity = '0'; }, 3400);
}

function parseSubject(title) {
  let base = (title || '').replace(/\s*\([^)]*\)\s*$/, '').trim();
  let prefix = base, accion = '';
  const idx = base.indexOf(' — ');
  if (idx >= 0) { prefix = base.slice(0, idx).trim(); accion = base.slice(idx + 3).trim(); }
  return { prefix, accion };
}

function buildSubject(ctx, prod, accion, responsable) {
  let empresaPart;
  if (ctx.prefix && ctx.prefix.indexOf('_') >= 0) empresaPart = ctx.prefix.slice(ctx.prefix.indexOf('_') + 1);
  else if (ctx.prefix) empresaPart = ctx.prefix;
  else empresaPart = (ctx.client || '').replace(/\s+/g, '');
  const newPrefix = prod ? (prod + '_' + empresaPart) : empresaPart;
  let s = newPrefix;
  if (accion) s += ' — ' + accion;
  if (responsable) s += ' (' + responsable + ')';
  return s;
}

function computeOwner(ctx) {
  if (ctx.internal) return '77808624';
  const stages = (ctx.stages || []).filter(Boolean);
  if (stages.some(s => EARLY_STAGES.includes(s))) return '82004391';
  return ctx.oid || '77808624';
}

function selOptions(list, current) {
  return list.map(v => '<option value="' + v + '"' + (v === current ? ' selected' : '') + '>' + v + '</option>').join('');
}

// ---------- Calendario propio ----------
let _calState = { y: 2026, m: 0 };
function fmtDisplay(iso) {
  if (!iso) return '';
  const p = iso.split('-').map(Number);
  return p[2] + ' ' + MESES_CORTO[p[1] - 1] + ' ' + p[0];
}
function renderCalendar() {
  const cal = document.getElementById('tm-cal');
  if (!cal) return;
  const y = _calState.y, m = _calState.m;
  const startDow = (new Date(y, m, 1).getDay() + 6) % 7; // lunes=0
  const days = new Date(y, m + 1, 0).getDate();
  const sel = document.getElementById('tm-date').value;
  const navBtn = 'background:none;border:1px solid var(--border,#2a2d35);border-radius:6px;color:var(--text,#e5e7eb);cursor:pointer;width:26px;height:26px;';
  let html = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">' +
    '<button type="button" data-cal="prev" style="' + navBtn + '">‹</button>' +
    '<span style="font-weight:600;font-size:13px;color:var(--text,#e5e7eb);">' + MESES[m] + ' ' + y + '</span>' +
    '<button type="button" data-cal="next" style="' + navBtn + '">›</button></div>' +
    '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;">';
  ['L','M','M','J','V','S','D'].forEach(d => html += '<div style="text-align:center;color:var(--text-dim,#9ca3af);font-size:10px;padding:2px;">' + d + '</div>');
  for (let i = 0; i < startDow; i++) html += '<div></div>';
  for (let d = 1; d <= days; d++) {
    const iso = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const isSel = iso === sel;
    html += '<button type="button" data-day="' + iso + '" style="padding:6px 0;border:0;border-radius:6px;cursor:pointer;font-size:12px;' +
      (isSel ? 'background:linear-gradient(135deg,var(--purple,#7c3aed),var(--pink,#db2777));color:#fff;font-weight:700;' : 'background:none;color:var(--text,#e5e7eb);') + '">' + d + '</button>';
  }
  html += '</div>';
  cal.innerHTML = html;
  cal.querySelector('[data-cal="prev"]').addEventListener('click', () => { _calState.m--; if (_calState.m < 0) { _calState.m = 11; _calState.y--; } renderCalendar(); });
  cal.querySelector('[data-cal="next"]').addEventListener('click', () => { _calState.m++; if (_calState.m > 11) { _calState.m = 0; _calState.y++; } renderCalendar(); });
  cal.querySelectorAll('[data-day]').forEach(b => b.addEventListener('click', () => {
    document.getElementById('tm-date').value = b.dataset.day;
    document.getElementById('tm-date-display').value = fmtDisplay(b.dataset.day);
    cal.style.display = 'none';
  }));
}
function openCalendar() {
  const iso = document.getElementById('tm-date').value;
  const d = iso ? new Date(iso + 'T00:00:00') : new Date();
  _calState = { y: d.getFullYear(), m: d.getMonth() };
  renderCalendar();
  document.getElementById('tm-cal').style.display = 'block';
}
function setDateQuick(plusDays) {
  const d = new Date();
  if (plusDays) d.setDate(d.getDate() + plusDays);
  const iso = d.toISOString().slice(0, 10);
  document.getElementById('tm-date').value = iso;
  document.getElementById('tm-date-display').value = fmtDisplay(iso);
}

function openAlertAction(ds) {

  if (_taskCtx.did) {
    enterNewTaskMode();
    const h = document.getElementById('tm-heading');
    if (h) h.textContent = 'Generar siguiente acción';
  } else {
    taskToast('Esta alerta no tiene oportunidad asociada en HubSpot', false);
  }

async function doTaskAction(kind) {
  const prod = document.getElementById('tm-prod').value;
  const accion = document.getElementById('tm-accion').value.trim();
  const responsable = getResponsable();
  const date = document.getElementById('tm-date').value;
  let url, payload;

  if (kind === 'close') {
    url = TASK_CLOSE_URL;
    payload = { taskId: _taskCtx.tid };
  } else if (kind === 'reopen') {
    url = TASK_UPDATE_URL;
    payload = { taskId: _taskCtx.tid, reopen: true, status: 'NOT_STARTED' };
  } else {
    if (!responsable) { taskToast('Falta el responsable', false); return; }
    if (!accion) { taskToast('Falta describir qué hay que hacer', false); return; }
    const subject = buildSubject(_taskCtx, prod, accion, responsable);
    const ownerId = computeOwner(_taskCtx);
    if (kind === 'update') {
      url = TASK_UPDATE_URL;
      payload = { taskId: _taskCtx.tid, descripcion: subject, fechaCierre: date, ownerId };
    } else { // create (nueva tarea)
      if (!_taskCtx.did) { taskToast('Sin oportunidad asociada: no se puede crear', false); return; }
      url = TASK_NEXT_URL;
      payload = { dealId: _taskCtx.did, descripcion: subject, fechaCierre: date, ownerId };
    }
  }
  try {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    document.getElementById('task-modal').style.display = 'none';
    taskToast((kind === 'update' ? 'Tarea actualizada' : kind === 'close' ? 'Tarea cerrada' : 'Tarea nueva creada') + '. Aprieta ↻ Actualizar', true);
    // Sin re-fetch automatico de los 4 endpoints: el usuario reconcilia con ↻ Actualizar cuando quiera.
  } catch (e) {
    taskToast('Error: ' + e.message, false);
  }
}

  }).join('');
  var tabla=active.arr.length?('<table class="tbl"><thead>'+thead+'</thead><tbody>'+rows+'</tbody></table>'):'<div class="empty">Sin registros en esta categoría 🎉</div>';
  if(cEl){
    cEl.innerHTML='<div class="section-title" style="margin-top:8px"><span class="section-count">🧹 '+active.label+' · '+active.arr.length+'</span><span style="margin-left:auto;color:var(--text-mute);font-size:11px">solo marca BORRAR · el borrado lo haces tú en HubSpot</span></div>'+tabla;
    cEl.querySelectorAll('.limp-mark').forEach(function(b){b.addEventListener('click',function(){markBorrar(b.getAttribute('data-tipo'),b.getAttribute('data-id'),decodeURIComponent(b.getAttribute('data-orig')),false,b);});});
    cEl.querySelectorAll('.limp-undo').forEach(function(b){b.addEventListener('click',function(){markBorrar(b.getAttribute('data-tipo'),b.getAttribute('data-id'),decodeURIComponent(b.getAttribute('data-orig')),true,b);});});
  }
}

async function markBorrar(tipo,id,nombreActual,quitar,btn){
  if(btn){btn.disabled=true;btn.textContent=quitar?'Quitando…':'Marcando…';}
  try{
    var r=await fetch(MARK_BORRAR_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tipo:tipo,id:id,nombreActual:nombreActual,quitar:!!quitar})});
    if(!r.ok) throw new Error('HTTP '+r.status);
    if(quitar){delete LIMP_MARKED[id];}else{LIMP_MARKED[id]=true;}
    taskToast((quitar?'Marca quitada':'Marcado para borrar')+'. Aprieta ↻ Actualizar',true);
    renderLimpieza();
  }catch(e){ if(btn){btn.disabled=false;btn.textContent=quitar?'Deshacer':'Marcar para borrar';} taskToast('Error: '+e.message,false); }
}

function ownerIdToPersona(ownerId) {
  if (ownerId === '82004391') return 'Martha';

function applyAlertasFilters(alertas) {
  let filtered = alertas.filter(a => pasaFiltro('alertas', a, 'alerta'));
  if (FILT.alertas.accion !== 'ALL') filtered = filtered.filter(a => a.accion === FILT.alertas.accion);

  // Sort
  const sortMode = FILT.alertas.sort || 'monto_desc';
  filtered.sort((a, b) => {
    if (sortMode === 'monto_desc') return (b.amount || 0) - (a.amount || 0);
    if (sortMode === 'dias_desc') return (b.days || 0) - (a.days || 0);
    if (sortMode === 'urgencia') {
      // Cerrar > ReActivar > Higienizar
      const order = { Cerrar: 0, ReActivar: 1, Higienizar: 2 };
      const c = (order[a.categoria] || 9) - (order[b.categoria] || 9);
      if (c !== 0) return c;
      return (b.amount || 0) - (a.amount || 0);
    }
    return 0;
  });

  return filtered;
}

function buildChatContext() {

  const tareas = (DATA.tareas && DATA.tareas.tareas) || [];
  const alertas16 = DATA.alertas16 || [];
  const stats = DATA.statsAlertas16 || {};
  
  const grDeals = deals.filter(d => !d.name.startsWith('PT_'));
  
  return {
    dealsActivos: grDeals.filter(d => !['closedwon', '1092009814'].includes(d.stage)).length,
    dealsTotal: grDeals.length,
    tareasVencidas: tareas.filter(t => {

    alertasTotales: alertas16.length,
    alertasCerrar: (stats.porCategoria && stats.porCategoria.Cerrar) || 0,

function fmtPct(v) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  // If rate > 100%, it means opens are from leads enrolled before the period — show — instead of misleading 200%+
  if (Number(v) > 1.0) return '—';
  return (Number(v) * 100).toFixed(1) + '%';
}
function fmtNum(v) {
  if (v === null || v === undefined) return '—';
  return Number(v).toLocaleString('en-US');
}
function freshness(iso) {
  if (!iso) return 'sin datos';
  const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  const hours = Math.floor((Date.now() - new Date(iso).getTime()) / 3600000);
  if (hours < 1) return 'hace minutos';
  if (hours < 24) return `hace ${hours}h`;
  if (days === 1) return 'hace 1 día';
  if (days < 7) return `hace ${days} días`;
  return `hace ${Math.floor(days / 7)} sem`;
}
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  if (isNaN(d)) return '—';
  return `${d.getDate()} ${months[d.getMonth()].toLowerCase()} ${d.getFullYear()}`;
}

function toggleAmDrilldown(which) {
  amDrilldown = (amDrilldown === which) ? null : which;

function renderAmplemarketDrilldown() {
  const container = document.getElementById('am-drilldown');

  if (!amDrilldown) {
    container.innerHTML = '';
    container.style.display = 'none';

  container.style.display = 'block';
  
  if (amDrilldown === 'meetings') container.innerHTML = renderMeetingsDrilldown();
  else if (amDrilldown === 'replies') container.innerHTML = renderRepliesDrilldown();

function isEventoPrueba(e){
  var emp=(e.empresa||'').toLowerCase();
  var pros=(e.prospecto||'').toLowerCase();
  var msg=(e.mensaje||'').toLowerCase();
  // Excluir eventos de testing/prueba
  if(/\btest\b|\bprueba\b|auditoria gr|testv8|test v8|validacion prueba|prueba uno|prueba dos|prueba tres|prueba inmmu|prueba immmu/.test(emp)) return true;
  if(/\btest\b|\bprueba\b|testv8/.test(pros)) return true;
  // Excluir "Great Revenue" como empresa prospecto (es evento interno)
  if(emp==='great revenue' && !e.deal_id) return true;
  return false;
}

/* ---- Dia natural America/Mexico_City ----------------------------------
   FIX 16jul2026 — CAUSA RAIZ: la columna y el filtro "HOY" no median el dia
   natural, median una ventana rodante de 24h:
       age = Math.floor((now - fecha)/86400000);  if (age <= 0) -> hoy
   Con eso, a cualquier hora del render "HOY" arrastraba parte del dia
   anterior (replies del 15-jul contados el 16-jul en el reporte diario).
   Ahora se compara la fecha calendario en America/Mexico_City: independiente
   de la hora del render y del huso horario del navegador.
   d7/d30/d90 se dejan rodantes A PROPOSITO: ahi "ultimos N dias" es la
   semantica correcta y no hay defecto medido. HOY sigue contenido en d7. */
var GR_TZ_FMT = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Mexico_City', year: 'numeric', month: '2-digit', day: '2-digit' });
function grDayKey(d) {
  var p = GR_TZ_FMT.formatToParts(d), o = {};
  for (var i = 0; i < p.length; i++) { o[p[i].type] = p[i].value; }
  return o.year + '-' + o.month + '-' + o.day;
}

   ('asked_to_circle_back_later') y el detalle por la NORMALIZADA ('circle_back'),

// Nunca borra ni recrea las listas, asi que el lista_id que usa el marcador no cambia.
var GR_SYNC_LISTAS_URL = 'https://mikea.app.n8n.cloud/webhook/gr-sync-listas';

function grSyncListasLlamadas(){
  var btn = document.getElementById('btn-sync-listas');
  var msg = document.getElementById('sync-listas-msg');
  if(!btn || !msg) return;
  btn.disabled = true;
  var txt = btn.textContent;
  btn.textContent = 'Actualizando...';
  btn.style.opacity = '0.6';
  msg.style.color = 'var(--text-dim)';
  msg.textContent = 'Sincronizando contra HubSpot. Tarda varios minutos, no cierres la pagina.';

  fetch(GR_SYNC_LISTAS_URL, { method: 'POST' })
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(d){
      var listas = (d && Array.isArray(d.LISTAS)) ? d.LISTAS : [];
      var fallas = (d && Array.isArray(d.FALLAS)) ? d.FALLAS : [];
      var lineas = listas.map(function(l){
        var c = [];
        if(l.intencion_agregar > 0) c.push('+' + l.intencion_agregar);
        if(l.intencion_quitar > 0) c.push('-' + l.intencion_quitar);
        return l.nombre + ': ' + l.en_hubspot + ' prospectos (' + (c.length ? c.join(' / ') : 'sin cambios') + ')';
      });
      if(fallas.length){
        msg.style.color = '#EF4444';
        msg.innerHTML = '<strong>Termin\u00f3 con fallas:</strong><br>' + fallas.join('<br>') + (lineas.length ? '<br><br>' + lineas.join('<br>') : '');
      } else {
        msg.style.color = '#10B981';
        msg.innerHTML = '<strong>Listas actualizadas.</strong><br>' + (lineas.length ? lineas.join('<br>') : 'Nada que cambiar.');
      }
    })
    .catch(function(e){
      msg.style.color = '#EF4444';
      msg.innerHTML = '<strong>No se pudo actualizar.</strong> ' + String(e.message || e)
        + '<br>Si dice timeout, la sincronizaci\u00f3n pudo haber corrido igual. Vuelve a intentar en un minuto.';
    })
    .then(function(){ btn.disabled = false; btn.textContent = txt; btn.style.opacity = '1'; });
}

function pPct(x) { return ((x || 0) * 100).toFixed(1) + '%'; }
function pNum(n) { return (n || 0).toLocaleString('es-MX'); }
function pMoney(n) { return '$' + Math.round(n || 0).toLocaleString('es-MX'); }
function semaforo(val, bench) { return val >= bench ? 'var(--mint,#34d399)' : (val >= bench * 0.6 ? 'var(--yellow,#fbbf24)' : 'var(--red,#f87171)'); }

function funnelRow(steps) {
  let h = '<div style="display:flex;gap:8px;align-items:stretch;overflow-x:auto;">';
  steps.forEach((s, i) => {
    if (i > 0) h += '<div style="display:flex;align-items:center;color:var(--text-mute);font-size:16px;padding:0 2px;">→</div>';
    h += '<div style="flex:1;min-width:110px;background:var(--bg-3,#1a1d24);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;">' +
      '<div style="font-size:11px;color:var(--text-dim);">' + s.label + '</div>' +
      '<div style="font-size:24px;font-weight:700;color:' + (s.color || 'var(--text)') + ';">' + s.val + '</div>' +
      (s.sub ? '<div style="font-size:11px;color:var(--text-mute);">' + s.sub + '</div>' : '') +
      (s.bench ? '<div style="font-size:10px;color:var(--text-mute);">' + s.bench + '</div>' : '') +
      '</div>';
  });
  h += '</div>';
  return h;
}

      🔮 <strong style="color:var(--text)">DuoCopilot</strong> detecta señales (job changes, posts, job openings, etc.) y las propone para secuenciar automáticamente. Funnel: Generated → Sequenced → Replies → Meetings.
    </div>
    <div style="overflow-x:auto"><table class="tbl">
      <thead>
        <tr><th>Producto</th><th>Señal</th><th class="num">Generated</th><th class="num">Sequenced</th><th class="num">Seq%</th><th class="num">Replies</th><th class="num">Mtgs</th></tr>
      </thead>
      <tbody>`;
  breakdown.forEach(b => {
    const seqRate = b.generated > 0 ? b.sequenced / b.generated : 0;
    html += `<tr>
      <td style="font-weight:700;color:var(--text)">${b.producto}</td>
      <td style="color:var(--text-dim);font-size:12px">${b.signal}</td>

      <td class="num" style="${b.meetings>0?'color:var(--purple);font-weight:700':''}">${b.meetings || 0}</td>
    </tr>`;
  });
  html += '</tbody></table></div></div>';
  return html;
}
function pPct(x) { return ((x || 0) * 100).toFixed(1) + '%'; }
function pNum(n) { return (n || 0).toLocaleString('es-MX'); }
function pMoney(n) { return '$' + Math.round(n || 0).toLocaleString('es-MX'); }
function semaforo(val, bench) { return val >= bench ? 'var(--mint,#34d399)' : (val >= bench * 0.6 ? 'var(--yellow,#fbbf24)' : 'var(--red,#f87171)'); }

function funnelRow(steps) {
  let h = '<div style="display:flex;gap:8px;align-items:stretch;overflow-x:auto;">';

  var fechaTxt=(function(){var f=new Date(fecha);return isNaN(f)?'—':f.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'});})();
  var industLine=[(e.industria?e.industria.replace(/_/g,' ').toLowerCase().replace(/\b\w/g,function(c){return c.toUpperCase();}):''), (e.empleados?Number(e.empleados).toLocaleString('es-MX')+' emp.':''), (e.ciudad&&e.pais?e.ciudad+', '+e.pais:e.ciudad||e.pais||'')].filter(Boolean).join(' · ');
  var fase=function(et){if(!et)return'gray';if(/Ganada/i.test(et))return'green';if(/Perdida/i.test(et))return'gray';if(/Atracci|Educaci|Propuesta|Aprobaci|Contract|Reunion|Renovaci/i.test(et))return'green';if(/Conversaci/i.test(et))return'yellow';return'red';};
  var FC={green:'#10B981',yellow:'#F59E0B',red:'#EF4444',gray:'#6B7280'};
  var retraso=diasAtras(fecha);
  var retroCol=(function(){var a=Math.floor((nowP-new Date(fecha))/86400000);return a<=1?'#10B981':a<=7?'#F59E0B':'#EF4444';})();
  var mrow=function(k,v,inner){return '<div style="display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #2A3142;font-size:13px;"><span style="color:#9CA3AF;font-size:12px;">'+k+'</span><span style="font-weight:600;text-align:right;max-width:220px;">'+(inner||esc(v||'—'))+'</span></div>';};
  var abtn=function(href,lbl,col){return href?'<a href="'+href+'" target="_blank" rel="noopener" style="flex:1;min-width:100px;text-align:center;text-decoration:none;padding:9px 6px;border-radius:9px;border:1px solid '+col+';color:'+col+';font-size:12px;font-weight:700;display:inline-block;">'+lbl+'</a>':'';};
  var body=
    '<div style="font-size:19px;font-weight:800;color:#F3F4F6;line-height:1.15;">'+esc(e.empresa||'—')+'</div>'+
    (industLine?'<div style="font-size:12px;color:#6B7280;margin:2px 0 10px;">'+esc(industLine)+'</div>':'')+
    ((e.descripcion_empresa||e.descripcion)?'<div style="font-size:12px;color:#cbd5e1;line-height:1.5;background:#1E2433;border:1px solid #2A3142;border-radius:10px;padding:10px 12px;margin:0 0 12px;max-height:120px;overflow:auto;"><span style="display:block;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#6B7280;margin-bottom:4px;">Descripción</span>'+esc(e.descripcion_empresa||e.descripcion)+'</div>':'')+
    '<div style="font-size:14px;font-weight:700;color:#F3F4F6;">'+esc(e.prospecto||'—')+'</div>'+
    (e.puesto?'<div style="font-size:12px;color:#9CA3AF;margin:2px 0 10px;">'+esc(e.puesto)+'</div>':'')+
    '<div style="margin:10px 0;padding:9px 12px;border-left:3px solid #06B6D4;background:rgba(6,182,212,.06);border-radius:0 8px 8px 0;font-size:12px;color:#cbd5e1;font-style:italic;"><span style="display:block;font-style:normal;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#6B7280;margin-bottom:3px;">Último mensaje</span>'+(msg?esc(msg):'<span style="opacity:.4;">Sin mensaje registrado</span>')+'</div>'+
    '<div style="margin:10px 0;">'+
      mrow('Etapa','',(e.etapa?'<span style="background:'+FC[fase(e.etapa)]+'22;color:'+FC[fase(e.etapa)]+';padding:2px 8px;border-radius:12px;font-weight:700;">'+esc(e.etapa)+'</span>':'—'))+
      mrow('Clasificación','',fmtLbl(e.clasificacion||''))+
      mrow('Producto',e.producto)+
      (e.amount?mrow('Valor','','$'+Number(e.amount).toLocaleString('es-MX')):'')+
      (e.empleados?mrow('Empleados',Number(e.empleados).toLocaleString('es-MX')):'')+
      (e.ciudad||e.pais?mrow('Ubicación',[e.ciudad,e.pais].filter(Boolean).join(', ')):'')+
      (webUrl?mrow('Web','','<a href="'+webUrl+'" target="_blank" style="color:#06B6D4;">'+esc(webUrl.replace(/^https?:\/\//,''))+'</a>'):'')+
      mrow('Campaña',e.campana)+
      mrow('Canal',e.canal)+
      mrow('Tenant',e.tenant)+
      mrow('Sin respuesta','','<span style="color:'+retroCol+';">'+esc(retraso)+'</span>')+
      mrow('Fecha',fechaTxt)+
    '</div>'+
    '<div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;">'+
      abtn(liPerUrl,'in Persona ↗','#06B6D4')+
      abtn(liEmpUrl,'in Empresa ↗','#3b82f6')+
      (webUrl?abtn(webUrl,'Web ↗','#9CA3AF'):'')+
      (e.deal_id?abtn('https://app.hubspot.com/contacts/'+portal+'/record/0-3/'+e.deal_id,'HubSpot ↗','#10B981'):'')+
    '</div>';
  var ov=document.getElementById('prosp-modal');
  if(!ov){ov=document.createElement('div');ov.id='prosp-modal';document.body.appendChild(ov);}
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px;';
  ov.innerHTML='<div onclick="event.stopPropagation()" style="background:#141827;border:1px solid #2A3142;border-radius:16px;max-width:470px;width:100%;max-height:88vh;overflow:auto;padding:20px;position:relative;box-shadow:0 24px 70px rgba(0,0,0,.6);"><button onclick="closeProspModal()" style="position:absolute;top:10px;right:14px;background:none;border:none;color:#9CA3AF;font-size:26px;cursor:pointer;line-height:1;">&times;</button>'+body+'</div>';
  ov.onclick=closeProspModal;
  if(!window.__prospEsc){window.__prospEsc=true;document.addEventListener('keydown',function(ev){if(ev.key==='Escape')closeProspModal();});}
}

function renderAmplemarket() {
  const am = AM_DATA;
  
  if (!am || (!am.ok && !am.kpis) || am.periodoNoDisponible) {
    const isPeriodMissing = am && am.periodoNoDisponible;
    const message = isPeriodMissing 
      ? `Snapshot de ${amPeriod}d no disponible. Pide a Claude actualizar Amplemarket.`
      : 'No hay snapshot disponible aún.';

        <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">

          <button onclick="setAmPeriod(15)" class="chip" style="${amPeriod===15?'background:var(--purple);color:white;border-color:var(--purple)':''}">15 días</button>
          <button onclick="setAmPeriod(30)" class="chip" style="${amPeriod===30?'background:var(--purple);color:white;border-color:var(--purple)':''}">30 días</button>
        </div>
        <div class="section-title">📡 Amplemarket — Snapshot pendiente</div>
        <div style="padding:32px;text-align:center;background:var(--bg-3);border:1px solid var(--border);border-radius:8px">
          <div style="font-size:48px;margin-bottom:12px">⏳</div>
          <div style="font-size:16px;font-weight:600;margin-bottom:8px;color:var(--text)">${message}</div>
          <div style="color:var(--text-dim);margin-bottom:16px">${isPeriodMissing ? 'El backend funciona pero falta el snapshot de este periodo.' : 'El backend está activo pero el static data está vacío.'}</div>
          <code style="background:var(--bg-3);padding:6px 12px;border-radius:4px;display:inline-block;color:var(--purple);border:1px solid var(--border)">"actualizar Amplemarket"</code>
        </div>
      </div>
    `;
    return;
  }

  const k = am.kpis || {};
  const productos = am.productos || [];
  const accionables = am.accionables || [];
  const totales = am.totales || {};
  const stats = am.stats || {};

  let h = `
    <div class="section" style="margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">

        <button onclick="setAmPeriod(7)" class="chip" style="${amPeriod===7?'background:var(--purple);color:white;border-color:var(--purple)':''}">7 días</button>
        <button onclick="setAmPeriod(15)" class="chip" style="${amPeriod===15?'background:var(--purple);color:white;border-color:var(--purple)':''}">15 días</button>
        <button onclick="setAmPeriod(30)" class="chip" style="${amPeriod===30?'background:var(--purple);color:white;border-color:var(--purple)':''}">30 días</button>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:14px">
        <div>
          <div style="font-size:18px;font-weight:700;color:var(--text)">📡 Amplemarket — Últimos ${am.periodoDias || amPeriod} días</div>
          <div style="font-size:12px;color:var(--text-dim);margin-top:2px">
            ${am.periodoDesde || '—'} → ${am.periodoHasta || '—'} ·

          <div class="kpi-label">🎯 Reuniones agendadas <span style="color:var(--text-mute);font-size:10px">${amDrilldown==='meetings'?'(abierto ▼)':'(click)'}</span></div>
          <div class="kpi-value">${k.meetings || 0}</div>
          <div class="kpi-sub">${totales.seqMeetings || 0} SEQ · ${totales.duoMeetings || 0} DUO</div>
        </div>
        <div class="kpi kpi-cyan" data-am-kpi="replies" onclick="toggleAmDrilldown('replies')" style="cursor:pointer;transition:all 0.15s;${amDrilldown==='replies'?'box-shadow:0 0 0 2px var(--cyan)':''}" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">
          <div class="kpi-label">💬 Respuestas <span style="color:var(--text-mute);font-size:10px">${amDrilldown==='replies'?'(abierto ▼)':'(click)'}</span></div>
          <div class="kpi-value">${k.replies || 0}</div>
          <div class="kpi-sub">${totales.seqReplies || 0} SEQ · ${totales.duoReplies || 0} DUO</div>
        </div>
        <div class="kpi kpi-yellow" data-am-kpi="openplus3" onclick="toggleAmDrilldown('openplus3')" style="cursor:pointer;transition:all 0.15s;${amDrilldown==='openplus3'?'box-shadow:0 0 0 2px var(--yellow)':''}" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">
          <div class="kpi-label">📨 Open+3 (engaged) <span style="color:var(--text-mute);font-size:10px">${amDrilldown==='openplus3'?'(abierto ▼)':'(click)'}</span></div>
          <div class="kpi-value">${fmtNum(k.openPlus3)}</div>
          <div class="kpi-sub">leads en seqs &gt;60% open rate</div>

        <div class="kpi kpi-purple" data-am-kpi="duogenerated" onclick="toggleAmDrilldown('duogenerated')" style="cursor:pointer;transition:all 0.15s;${amDrilldown==='duogenerated'?'box-shadow:0 0 0 2px var(--purple)':''}" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">
          <div class="kpi-label">🔮 DUO Generated <span style="color:var(--text-mute);font-size:10px">${amDrilldown==='duogenerated'?'(abierto ▼)':'(click)'}</span></div>

          <div class="kpi-sub">${totales.duoSequenced || 0} ya secuenciadas</div>
        </div>
      </div>
    </div>

    <!-- Drilldown inline container -->
    <div id="am-drilldown" style="display:none;margin-bottom:8px"></div>
  `;

  // === COMPARATIVO SEQ vs DUO POR PRODUCTO ===

    <div class="section">

      <div style="font-size:12px;color:var(--text-dim);margin-bottom:12px">Reply rate solo es comparable dentro del mismo canal. El ganador se define por reuniones agendadas.</div>
      <div style="overflow-x:auto"><table class="tbl">
        <thead>
          <tr>
            <th rowspan="2" style="vertical-align:bottom">Producto</th>
            <th colspan="5" style="text-align:center;color:var(--mint);border-bottom:1px solid var(--border)">📋 SEQ — Secuencias outbound</th>
            <th colspan="5" style="text-align:center;color:var(--purple);border-bottom:1px solid var(--border)">🔮 DUO — Señales DuoCopilot</th>
            <th rowspan="2" style="vertical-align:bottom;text-align:center">🏆 Ganador</th>
          </tr>
          <tr>
            <th class="num" style="color:var(--mint)">Seqs</th><th class="num" style="color:var(--mint)">Leads</th><th class="num" style="color:var(--mint)">Open%</th><th class="num" style="color:var(--mint)">Reply%</th><th class="num" style="color:var(--mint)">Mtgs</th>
            <th class="num" style="color:var(--purple)">Sigs</th><th class="num" style="color:var(--purple)">Gen</th><th class="num" style="color:var(--purple)">Seq%</th><th class="num" style="color:var(--purple)">Reply%</th><th class="num" style="color:var(--purple)">Mtgs</th>
          </tr>
        </thead>
        <tbody>`;

  productos.forEach(p => {
    const s = p.seq, d = p.duo;
    const g = GANADOR_STYLES[p.ganador] || GANADOR_STYLES['inactivo'];
    h += `<tr>
      <td style="font-weight:700;color:var(--text)">${p.codigo}</td>
      <td class="num">${s.secuencias || 0}</td>
      <td class="num">${fmtNum(s.leads)}</td>
      <td class="num" style="${s.openRate>=0.5&&s.openRate<=1?'color:var(--mint);font-weight:600':''}">${s.leads>0?fmtPct(s.openRate):'—'}</td>
      <td class="num" style="${s.replyRate>=0.02?'color:var(--mint);font-weight:600':s.replyRate<0.005&&s.leads>50?'color:var(--red)':''}">${s.leads>0?fmtPct(s.replyRate):'—'}</td>
      <td class="num" style="${s.meetings>0?'color:var(--mint);font-weight:700':''}">${s.meetings || 0}</td>
      <td class="num">${d.signals || 0}</td>
      <td class="num">${fmtNum(d.generated)}</td>
      <td class="num">${d.generated>0?fmtPct(d.sequenceRate):'—'}</td>
      <td class="num" style="${d.replyRate>=0.02?'color:var(--purple);font-weight:600':''}">${d.sequenced>0?fmtPct(d.replyRate):'—'}</td>
      <td class="num" style="${d.meetings>0?'color:var(--purple);font-weight:700':''}">${d.meetings || 0}</td>

  h += `</tbody></table></div></div>`;

  // === ACCIONABLES ===

  const filtrados = accionables.filter(a => {

  h += `

          const isActive = tipo === amFilters.tipo;
          return `
            <div onclick="setAmFilter('tipo','${isActive ? 'todos' : tipo}')" 
                 style="background:var(--bg-3);border:1px solid ${isActive ? st.color : 'var(--border)'};border-radius:8px;padding:10px;cursor:pointer;text-align:center;transition:all 0.15s;${isActive ? 'box-shadow:0 0 0 1px ' + st.color : ''}">
              <div style="font-size:18px;font-weight:700;color:${st.color}">${cnt}</div>
              <div style="font-size:11px;font-weight:600;margin-top:2px;color:var(--text-dim)">${st.icon} ${st.cat}</div>
            </div>
          `;
        }).join('')}
      </div>

      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center">
        <span style="font-size:12px;color:var(--text-dim);margin-right:4px">Canal:</span>
        ${['todos','SEQ','DUO'].map(c => `
          <button onclick="setAmFilter('canal','${c}')" class="chip" 
                  style="${c === amFilters.canal ? 'background:var(--purple);color:white;border-color:var(--purple)' : ''}">
            ${c === 'todos' ? 'Todos' : (c === 'SEQ' ? '📋 SEQ' : '🔮 DUO')}

        <span style="font-size:12px;color:var(--text-dim);margin:0 4px 0 12px">Producto:</span>
        <button onclick="setAmFilter('producto','todos')" class="chip" 
                style="${amFilters.producto === 'todos' ? 'background:var(--purple);color:white;border-color:var(--purple)' : ''}">
          Todos
        </button>
        ${productosConDatos.map(prod => `
          <button onclick="setAmFilter('producto','${prod}')" class="chip" 
                  style="${prod === amFilters.producto ? 'background:var(--purple);color:white;border-color:var(--purple)' : ''}">
            ${prod}
          </button>
        `).join('')}
      </div>
  `;

  if (filtrados.length === 0) {
    h += `<div style="padding:24px;text-align:center;color:var(--text-dim)">Sin acciones que coincidan con los filtros.</div>`;
  } else {
    h += `<table class="tbl">
      <thead>
        <tr><th>Acción</th><th>Canal</th><th>Producto</th><th>Detalle</th></tr>
      </thead>
      <tbody>`;
    filtrados.forEach(a => {
      const st = ACCION_STYLES[a.id] || ACCION_STYLES.optimizar;
      h += `<tr>
        <td style="color:${st.color};font-weight:600;white-space:nowrap">${st.icon} ${st.cat}</td>

        <td style="color:var(--text-dim)">${a.detalle}</td>
      </tr>`;
    });
    h += `</tbody></table>`;
  }
  h += `</div>`;

  // === DETALLE EXPANDIDO POR DEFAULT ===
  h += `
    <div class="section">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <div class="section-title" style="margin:0">📊 Detalle por secuencia y señal <span class="section-count">${(totales.seqSecuencias || 0) + (totales.duoSignals || 0)}</span></div>
        <div style="display:flex;gap:6px">
          <button class="chip" data-am-detail="sequences" onclick="switchAmDetailViewInPlace('sequences')"
                  style="${amDetailView==='sequences'?'background:var(--purple);color:white;border-color:var(--purple)':''}">📋 Secuencias (${totales.seqSecuencias || 0})</button>
          <button class="chip" data-am-detail="signals" onclick="switchAmDetailViewInPlace('signals')"
                  style="${amDetailView==='signals'?'background:var(--purple);color:white;border-color:var(--purple)':''}">🔮 Señales DUO (${totales.duoSignals || 0})</button>

  productos.forEach(p => {
    (p.seq.detalle || []).forEach(s => {
      h += `<tr>
        <td style="font-weight:700;color:var(--text)">${p.codigo}</td>

        <td class="num" style="${s.replyRate>=0.02?'color:var(--mint);font-weight:600':s.replyRate<0.005&&s.leads>50?'color:var(--red)':''}">${s.leads>0?fmtPct(s.replyRate):'—'}</td>
        <td class="num">${s.interested || 0}</td>
        <td class="num" style="${s.meetings>0?'color:var(--mint);font-weight:700':''}">${s.meetings || 0}</td>
      </tr>`;
    });
  });

  h += `</tbody></table></div>

      <div id="am-duo-detail" style="display:${amDetailView==='signals'?'block':'none'}">

// --- FORECAST ---
function renderForecast() {
  const deals = DATA.deals;
  const propuestas = deals.filter(d => d.stage === 'presentationscheduled');
  const educacion = deals.filter(d => d.stage === 'qualifiedtobuy');
  const atraccion = deals.filter(d => d.stage === 'appointmentscheduled');

  const propTotal = propuestas.reduce((s, d) => s + (d.amount || 0), 0);
  const educTotal = educacion.reduce((s, d) => s + (d.amount || 0), 0);
  const atrTotal = atraccion.reduce((s, d) => s + (d.amount || 0), 0);

  const conservador = propTotal * 0.35;
  const base = conservador + educTotal * 0.20;
  const optimista = base + atrTotal * 0.10;

  // Closes próximos 30 días
  const close30 = deals.filter(d => {
    const days = daysUntil(d.closedate);
    return days !== null && days >= 0 && days <= 30;
  }).sort((a, b) => new Date(a.closedate) - new Date(b.closedate));

  let html = `
    <div class="kpi-grid">
      <div class="kpi kpi-mint">
        <div class="kpi-label">Conservador</div>
        <div class="kpi-value">${fmtK(conservador)}</div>
        <div class="kpi-sub">Propuestas × 35%</div>
      </div>
      <div class="kpi kpi-cyan">
        <div class="kpi-label">Base</div>
        <div class="kpi-value">${fmtK(base)}</div>
        <div class="kpi-sub">+ Educación × 20%</div>
      </div>
      <div class="kpi kpi-purple">
        <div class="kpi-label">Optimista</div>
        <div class="kpi-value">${fmtK(optimista)}</div>
        <div class="kpi-sub">+ Atracción × 10%</div>
      </div>
    </div>
    <div class="section">
      <div class="section-title">Closes próximos 30 días <span class="section-count">${close30.length}</span></div>
      <table class="tbl">
        <thead><tr><th>Deal</th><th>Stage</th><th>Close</th><th>Días</th><th class="num">Monto</th></tr></thead>
        <tbody>
  `;
  if (close30.length === 0) {
    html += `<tr><td colspan="5" class="empty">Sin closes en los próximos 30 días</td></tr>`;
  }
  close30.forEach(d => {
    const days = daysUntil(d.closedate);
    const cls = days <= 7 ? 'urg-row' : (days <= 15 ? 'atn-row' : '');
    html += `<tr class="${cls}">
      <td>${d.name}</td>
      <td>${tagForStage(d.stage, d.stageLabel)}</td>
      <td>${d.closedate}</td>
      <td>${days}d</td>
      <td class="num">${fmt(d.amount)}</td>
    </tr>`;
  });
  html += `</tbody></table></div>`;
  $('#p-forecast').innerHTML = html;
}

    btn.addEventListener('click', () => switchTab(btn.dataset.tab));

}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

        +(mejor?'<span style="color:#62D175;font-size:11px;font-weight:700">← más actividad, conservar</span>':'')+'</td>'
        +'<td style="text-align:center;padding:7px 6px">'+f.tareas+'</td><td style="text-align:center;padding:7px 6px">'+f.notas+'</td><td style="text-align:center;padding:7px 6px">'+f.actividades+'</td><td style="text-align:center;padding:7px 6px;font-weight:800">'+f.total+'</td>'
        +'<td style="padding:7px 6px;white-space:nowrap"><button class="btn-action" onclick="grfMarcarDeal(\''+x.id+'\',\''+encodeURIComponent(x.nombre||'')+'\',this)">Marcar borrar</button> '
        +'<button class="btn-action" onclick="grfConservar(\''+x.id+'\')">Conservar esta</button></td></tr>'; }).join('');
      window.__grDup=cands.map(function(x){ return {id:String(x.id), nombre:x.nombre||''}; });
      grfSet('Resolver duplicado',
        '<div style="color:#9CA3AF;margin-bottom:10px">Todas las oportunidades de <b>'+grfEsc(cli||'—')+'</b> ('+cands.length+'). Compara la actividad y decide cuál conservar: «Conservar esta» marca todas las demás para borrar.</div>'
        +'<table class="tbl" style="width:100%"><thead><tr><th>Oportunidad</th><th style="text-align:center">Tareas</th><th style="text-align:center">Notas</th><th style="text-align:center">Activ.</th><th style="text-align:center">Total</th><th></th></tr></thead><tbody>'+filas+'</tbody></table>', false);
    }catch(e){ grfSet('Resolver duplicado','<div style="color:#DB0540">Error: '+grfEsc(e.message)+'</div>', false); }
    return;
  }
  grfSet('Acción','<div style="color:#9CA3AF">Esta acción todavía no tiene editor.</div>', false);
}

async function grfMarcarDeal(id,nombreEnc,btn){
  if(btn){ btn.disabled=true; btn.textContent='Marcando…'; }
  try{
    var r=await fetch(GRF_MARK,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({tipo:'deal',id:id,nombreActual:decodeURIComponent(nombreEnc||''),quitar:false})});
    if(!r.ok) throw new Error('HTTP '+r.status);
    if(btn){ btn.textContent='✓ Marcado'; }
    grfStatus('Marcado para borrar. El borrado lo haces tú en HubSpot.','#62D175');
  }catch(e){ if(btn){ btn.disabled=false; btn.textContent='Marcar borrar'; } grfStatus('Error: '+e.message,'#DB0540'); }
}

async function grfConservar(keepId){
  var lista=(window.__grDup||[]).filter(function(x){ return String(x.id)!==String(keepId); });
  if(!lista.length){ grfStatus('No hay otras oportunidades que marcar.','#FCD34D'); return; }
  grfStatus('Marcando '+lista.length+' oportunidad(es)…','#9CA3AF');
  var ok=0;
  for(var i=0;i<lista.length;i++){
    try{
      var r=await fetch(GRF_MARK,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({tipo:'deal',id:lista[i].id,nombreActual:lista[i].nombre,quitar:false})});
      if(r.ok) ok++;
    }catch(e){}
  }
  grfStatus('✓ '+ok+' de '+lista.length+' marcadas para borrar. El borrado lo haces tú en HubSpot.','#62D175');
}

async function grfGuardar(){
  var btn=document.getElementById('grf-save'); if(btn) btn.disabled=true;
  grfStatus('Guardando…','#9CA3AF');
  try{
    if(GRF.accion==='etiquetarProducto'){
      var prod=document.getElementById('grf-prod').value;
      var nuevo=grfNombreConProducto((GRF.ctx&&GRF.ctx.nombre)||'', prod);
      var r=await fetch(GRF_UPDATE,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({dealId:GRF.dealId,properties:{dealname:nuevo}})});
      if(!r.ok) throw new Error('HTTP '+r.status);
    } else if(GRF.accion==='definirMonto'){
      var m=document.getElementById('grf-monto').value;
      if(m===''||isNaN(Number(m))) throw new Error('Monto inválido');
      var r2=await fetch(GRF_UPDATE,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({dealId:GRF.dealId,properties:{amount:String(Number(m))}})});
      if(!r2.ok) throw new Error('HTTP '+r2.status);
    } else if(GRF.accion==='vincularContacto'){
      var ids=[].slice.call(document.querySelectorAll('.grf-ct:checked')).map(function(x){return x.value;});
      if(!ids.length) throw new Error('Marca al menos un contacto');
      for(var i=0;i<ids.length;i++){
        var rr=await fetch(GRF_ASSOC,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({contactId:ids[i],dealId:GRF.dealId})});
        if(!rr.ok) throw new Error('HTTP '+rr.status);
      }
    } else if(GRF.accion==='vincularDeals'){
      var dids=[].slice.call(document.querySelectorAll('.grf-dl:checked')).map(function(x){return x.value;});
      if(!dids.length) throw new Error('Marca al menos una oportunidad');
      var cid=(GRF.ctx&&GRF.ctx.contactId)||'';
      if(!cid) throw new Error('Falta el contacto');
      for(var j=0;j<dids.length;j++){
        var r3=await fetch(GRF_ASSOC,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({contactId:cid,dealId:dids[j]})});
        if(!r3.ok) throw new Error('HTTP '+r3.status);
      }
    } else { throw new Error('Acción no soportada'); }
    grfStatus('✓ Guardado','#62D175');
    grfCerrar();
    taskToast('Guardado. Aprieta ↻ Actualizar para ver los cambios', true);
    if(btn) btn.disabled=false;
  }catch(e){ grfStatus('Error: '+e.message,'#DB0540'); if(btn) btn.disabled=false; }
}

/* ===================== PESTANA METRICAS ===================== */
var METRICAS_URL = 'https://mikea.app.n8n.cloud/webhook/gr-metricas';
var MT_TENANT_FIJO = (typeof METRICAS_TENANT_FIJO !== 'undefined') ? METRICAS_TENANT_FIJO : '';
var MT_STATE = { periodo:'mes', mes:'', producto:'TODOS', owner:'TODOS', tenant:(MT_TENANT_FIJO||'TODOS') };
var MT_DATA = null, MT_CARGANDO = false;
var MT_C = { morado:'#7D2AE4', azul:'#02ADBA', verde:'#62D175', amarillo:'#FFCD00', rojo:'#DB0540', gris:'#9CA3AF' };
var MT_MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

function mtEsc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function mtPanel(){ return document.getElementById('p-metricas') || document.getElementById('page-metricas'); }
function mtNum(n){ return (n==null?0:n); }
function mtMesLbl(ym){ if(!ym||ym.length<7) return ym; return MT_MESES[Number(ym.slice(5,7))-1]+' '+ym.slice(2,4); }
function mtDia(f){ if(!f||f.length<10) return f||'—'; return f.slice(8,10)+'/'+f.slice(5,7); }
function mtSetFiltro(campo, valor){ MT_STATE[campo]=valor; mtCargar(); }
function mtToggle(id){ var el=document.getElementById(id); if(el) el.style.display=(el.style.display==='none'?'block':'none'); }

async function mtCargar(){
  var cont = mtPanel(); if(!cont||MT_CARGANDO) return;
  MT_CARGANDO = true;
  if(!MT_DATA) cont.innerHTML = '<div style="padding:24px;color:#9CA3AF;font-size:13px;">Cargando métricas…</div>';
  try{
    var r = await fetch(METRICAS_URL,{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({tenant:(MT_TENANT_FIJO||MT_STATE.tenant),periodo:MT_STATE.periodo,mes:MT_STATE.mes,producto:MT_STATE.producto,owner:MT_STATE.owner})});
    if(!r.ok) throw new Error('HTTP '+r.status);
    MT_DATA = await r.json();
    if(!MT_STATE.mes && MT_DATA.filtros_aplicados) MT_STATE.mes = MT_DATA.filtros_aplicados.mes||'';
    mtPintar();
  }catch(e){
    cont.innerHTML='<div style="padding:24px;color:'+MT_C.rojo+';font-size:13px;">No se pudieron cargar las métricas: '+mtEsc(e.message)+'</div>';
  }finally{ MT_CARGANDO=false; }
}

function mtChips(titulo,campo,opciones,activo){
  var h='<div style="margin:0 0 10px 0;">';
  h+='<div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:'+MT_C.gris+';margin-bottom:5px;">'+mtEsc(titulo)+'</div>';
  h+='<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;">';
  for(var i=0;i<opciones.length;i++){
    var o=opciones[i];
    if(o==='|'){ h+='<span style="width:1px;height:18px;background:rgba(148,163,184,.35);margin:0 3px;"></span>'; continue; }
    var val=(typeof o==='string')?o:o.v, lbl=(typeof o==='string')?o:o.l, sub=(typeof o==='object'&&o.sub);
    var on=(String(val)===String(activo));
    h+='<button onclick="mtSetFiltro(\''+campo+'\',\''+mtEsc(val).replace(/'/g,"\\'")+'\')" style="cursor:pointer;border-radius:999px;'
      +'padding:'+(sub?'3px 9px':'5px 11px')+';font-size:'+(sub?'11px':'12px')+';'
      +'border:1px solid '+(on?MT_C.morado:'rgba(148,163,184,.35)')+';'
      +'background:'+(on?MT_C.morado:'transparent')+';color:'+(on?'#fff':'inherit')+';">'+mtEsc(lbl)+'</button>';
  }
  return h+'</div></div>';
}

function mtTarjeta(etiqueta,valor,sufijo,color,pie,idDetalle){
  var v = idDetalle ? '<span style="font-size:10px;color:'+MT_C.gris+';cursor:pointer;" onclick="mtToggle(\''+idDetalle+'\')">▸ ver</span>' : '';
  return '<div style="flex:1 1 150px;min-width:150px;border:1px solid rgba(148,163,184,.25);border-radius:12px;padding:12px 14px;">'
   +'<div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">'
   +'<span style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:'+MT_C.gris+';">'+mtEsc(etiqueta)+'</span>'+v+'</div>'
   +'<div style="font-size:30px;font-weight:700;line-height:1.15;color:'+color+';">'+mtEsc(valor)+(sufijo||'')+'</div>'
   +'<div style="font-size:11px;color:'+MT_C.gris+';min-height:14px;">'+(pie||'')+'</div></div>';
}

function mtVar(a0,p0){
  var a=mtNum(a0),p=mtNum(p0);
  if(p===0) return a>0?'<span style="color:'+MT_C.verde+';">nuevo</span>':'<span style="color:'+MT_C.gris+';">sin comparativo</span>';
  var d=Math.round(((a-p)/p)*100), col=d>0?MT_C.verde:(d<0?MT_C.rojo:MT_C.gris);
  return '<span style="color:'+col+';">'+(d>0?'+':'')+d+'% vs '+p+'</span>';
}

function mtTabla(cols,filas){
  var h='<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:12px;"><thead><tr style="text-align:left;color:'+MT_C.gris+';font-size:10px;text-transform:uppercase;letter-spacing:.06em;">';
  for(var i=0;i<cols.length;i++) h+='<th style="padding:6px 8px;white-space:nowrap;">'+mtEsc(cols[i])+'</th>';
  h+='</tr></thead><tbody>';
  for(var j=0;j<filas.length;j++){
    h+='<tr style="border-top:1px solid rgba(148,163,184,.15);">';
    for(var k=0;k<filas[j].length;k++) h+='<td style="padding:6px 8px;">'+filas[j][k]+'</td>';
    h+='</tr>';
  }
  return h+'</tbody></table></div>';
}

/* mismas columnas que el detalle de citas, para que se lea igual arriba y abajo */
function mtDetalleOportunidades(id, lista){

      :'<div style="color:'+MT_C.gris+';font-size:12px;padding:6px;">Sin oportunidades.</div>')+'</div>';

function mtPintar(){
  var cont=mtPanel(); if(!cont||!MT_DATA) return;
  var d=MT_DATA, cit=d.citas||{}, flu=d.flujo||{}, tar=d.tareas||{}, cat=d.catalogos||{};
  var h='';

  /* ---------- FILTROS ---------- */
  h+='<div style="border:1px solid rgba(148,163,184,.2);border-radius:12px;padding:12px 14px;margin-bottom:16px;">';
  h+=mtChips('Periodo','periodo',[{v:'todas',l:'Todas'},'|',{v:'mes',l:'Mes'},
      {v:'sem1',l:'S1',sub:1},{v:'sem2',l:'S2',sub:1},{v:'sem3',l:'S3',sub:1},{v:'sem4',l:'S4',sub:1},
      '|',{v:'30d',l:'30d'},{v:'45d',l:'45d'},{v:'90d',l:'90d'}],MT_STATE.periodo);
  if(['mes','sem1','sem2','sem3','sem4'].indexOf(MT_STATE.periodo)>=0){
    var ms=(cat.meses||[]).slice(0,12).map(function(m){return {v:m,l:mtMesLbl(m),sub:1};});
    if(ms.length) h+=mtChips('Mes','mes',ms,MT_STATE.mes);
  }
  if(!MT_TENANT_FIJO) h+=mtChips('Cliente','tenant',['TODOS'].concat(cat.tenants||[]),MT_STATE.tenant);
  h+=mtChips('Producto','producto',['TODOS'].concat(cat.productos||[]),MT_STATE.producto);
  h+=mtChips('Responsable','owner',['TODOS'].concat(cat.owners||[]),MT_STATE.owner);
  h+='<div style="font-size:11px;color:'+MT_C.gris+';margin-top:4px;">Del '+mtEsc((d.rango||{}).desde)+' al '+mtEsc((d.rango||{}).hasta)+'</div></div>';

  /* ---------- ADVERTENCIAS ---------- */
  var advs=d.advertencias||[];
  if(advs.length){
    h+='<div style="border-left:3px solid '+MT_C.amarillo+';background:rgba(255,205,0,.07);border-radius:6px;padding:10px 12px;margin-bottom:16px;font-size:12px;">';
    for(var a=0;a<advs.length;a++) h+='<div style="margin:2px 0;">'+mtEsc(advs[a])+'</div>';
    h+='</div>';
  }

  /* ---------- BLOQUE 1: EMBUDO DE CONVERSION ---------- */
  var emb=flu.embudo_conversion||[];
  if(emb.length){
    h+='<h3 style="margin:0 0 4px 0;font-size:15px;">Embudo hoy</h3>';
    h+='<div style="font-size:11px;color:'+MT_C.gris+';margin-bottom:10px;">Cuántas oportunidades hay paradas en cada etapa y qué proporción hay en la siguiente. Es la forma del embudo en este momento, no el seguimiento de un grupo en el tiempo.</div>';
    h+='<div style="display:flex;flex-wrap:wrap;align-items:stretch;gap:2px;margin-bottom:12px;">';
    for(var b=0;b<emb.length;b++){
      var e=emb[b];
      var colE = e.razon_pct>=50?MT_C.verde:(e.razon_pct>=20?MT_C.amarillo:MT_C.rojo);
      h+='<div style="flex:1 1 90px;min-width:90px;text-align:center;border:1px solid rgba(148,163,184,.25);border-radius:10px;padding:8px 6px;">'
        +'<div style="font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:'+MT_C.gris+';min-height:22px;">'+mtEsc(e.de)+'</div>'
        +'<div style="font-size:24px;font-weight:700;">'+mtNum(e.inventario_de)+'</div>'
        +'<div style="font-size:11px;color:'+colE+';">↓ '+mtNum(e.razon_pct)+'%</div></div>';
      if(b===emb.length-1){
        h+='<div style="flex:1 1 90px;min-width:90px;text-align:center;border:1px solid '+MT_C.verde+';border-radius:10px;padding:8px 6px;">'
          +'<div style="font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:'+MT_C.gris+';min-height:22px;">'+mtEsc(e.a)+'</div>'
          +'<div style="font-size:24px;font-weight:700;color:'+MT_C.verde+';">'+mtNum(e.inventario_a)+'</div>'
          +'<div style="font-size:11px;color:'+MT_C.gris+';">meta</div></div>';
      }
    }
    h+='</div>';
    h+='<div style="border:1px solid rgba(148,163,184,.25);border-radius:12px;padding:12px 14px;margin-bottom:26px;font-size:13px;">'
      +'<b>Citas que vienen: '+mtNum(flu.citas_proyectadas)+'</b> '
      +'<span style="color:'+MT_C.gris+';font-size:11px;">— '+mtNum(flu.inventario_atraccion)+' en Atracción, con '+mtNum(cit.show_rate_pct)+'% de conversión histórica</span></div>';
  }

  /* ---------- BLOQUE 2: CITAS ---------- */
  var metaP=mtNum(cit.meta_periodo), cump=mtNum(cit.cumplimiento_meta_pct);
  var colMeta=cump>=100?MT_C.verde:(cump>=70?MT_C.amarillo:MT_C.rojo);
  h+='<h3 style="margin:0 0 4px 0;font-size:15px;">Citas del periodo</h3>';
  h+='<div style="font-size:11px;color:'+MT_C.gris+';margin-bottom:10px;">Atracción = la cita quedó agendada. Educación = la reunión se efectuó.</div>';
  h+='<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;">';

  h+=mtTarjeta('Educación',mtNum(cit.efectuadas),'',MT_C.verde,mtVar(cit.efectuadas,(cit.vs_periodo_previo||{}).efectuadas),'mt-det-citas');
  h+=mtTarjeta('Conversión',mtNum(cit.show_rate_pct),'%',(cit.show_rate_confiable?MT_C.morado:MT_C.amarillo),(cit.show_rate_confiable?'Atracción → Educación':'parcial: cohorte incompleta'));
  h+=mtTarjeta('Vs meta',cump,'%',colMeta,(metaP?(mtNum(cit.efectuadas)+' de '+metaP+' · cierre '+mtNum(cit.proyeccion_cierre)):'sin meta'));

  h+=mtTarjeta('Tarda',mtNum(cit.dias_de_atraccion_a_educacion),'d',MT_C.azul,'de agendar a sentarse');
  h+='</div>';

  var det=cit.detalle||[], filasC=[];

  var cp=cit.conversion_por_producto||[];
