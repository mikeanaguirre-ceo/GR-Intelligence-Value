    for(var p2=0;p2<cp.length;p2++){ var q=cp[p2];
      var colP=q.conversion_pct>=60?MT_C.verde:(q.conversion_pct>=30?MT_C.amarillo:MT_C.rojo);
      filasP.push([mtEsc(q.producto),mtNum(q.agendadas),mtNum(q.efectuadas),'<b style="color:'+colP+';">'+mtNum(q.conversion_pct)+'%</b>']); }
    h+='<div style="margin-bottom:12px;"><span style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:'+MT_C.gris+';cursor:pointer;" onclick="mtToggle(\'mt-prod\')">▸ Conversión por producto</span>'
      +'<div id="mt-prod" style="display:none;margin-top:8px;padding:8px;border:1px solid rgba(148,163,184,.2);border-radius:8px;">'
      +mtTabla(['Producto','Atracción','Educación','Conversión'],filasP)+'</div></div>';
  }

  /* ---------- GRAFICA SEMANAL ---------- */
  var tend=cit.tendencia_semanal||[];
  if(tend.length){
    var maxT=1; for(var t=0;t<tend.length;t++) if(tend[t].educacion>maxT) maxT=tend[t].educacion;
    h+='<div style="border:1px solid rgba(148,163,184,.2);border-radius:12px;padding:12px 14px;margin-bottom:26px;">';
    h+='<div style="font-size:12px;font-weight:600;margin-bottom:2px;">Reuniones efectuadas por semana</div>';
    h+='<div style="font-size:11px;color:'+MT_C.gris+';margin-bottom:8px;">Cada barra es una semana completa, de lunes a domingo. Las últimas '+tend.length+', la más antigua a la izquierda. '
      +'<b>'+mtNum(cit.semanas_bajo_meta)+' de '+mtNum(cit.semanas_medidas)+' quedaron por debajo de la meta.</b></div>';
    h+='<div style="display:flex;align-items:flex-end;gap:4px;height:118px;">';
    for(var s=0;s<tend.length;s++){
      var w=tend[s], alt=Math.round((w.educacion/maxT)*84), altM=Math.round((w.meta/maxT)*84);
      var col=w.educacion>=w.meta?MT_C.verde:(w.educacion>=w.meta*0.5?MT_C.amarillo:MT_C.rojo);
      h+='<div style="flex:1;text-align:center;" title="'+mtDia(w.semana)+' al '+mtDia(w.semana_fin)+': '+w.educacion+' efectuadas, '+w.atraccion+' agendadas">'
        +'<div style="font-size:10px;color:'+col+';font-weight:700;">'+w.educacion+'</div>'
        +'<div style="position:relative;height:84px;display:flex;align-items:flex-end;">'
        +'<div style="width:100%;height:'+Math.max(alt,2)+'px;background:'+col+';border-radius:3px 3px 0 0;"></div>'
        +'<div style="position:absolute;left:0;right:0;bottom:'+altM+'px;border-top:1px dashed '+MT_C.gris+';"></div></div>'
        +'<div style="font-size:8px;color:'+MT_C.gris+';">'+mtDia(w.semana)+'</div></div>';
    }
    h+='</div><div style="font-size:10px;color:'+MT_C.gris+';margin-top:6px;">La línea punteada es la meta semanal ('+mtNum((tend[0]||{}).meta)+' reuniones). Verde llegó, amarillo a medias, rojo lejos.</div></div>';
  }

  /* ---------- BLOQUE 3: TIEMPOS DEL EMBUDO ---------- */
  h+='<h3 style="margin:0 0 4px 0;font-size:15px;">Tiempos del embudo</h3>';
  h+='<div style="font-size:11px;color:'+MT_C.gris+';margin-bottom:10px;">Foto del '+mtEsc(flu.foto_mas_reciente||'—')+'. Con retraso = lleva más días de los que fija el plazo de su etapa.</div>';
  if(flu.cuello_de_botella){
    h+='<div style="border-left:3px solid '+MT_C.rojo+';background:rgba(219,5,64,.07);border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:13px;">'
      +'<b>Cuello de botella: '+mtEsc(flu.cuello_de_botella)+'</b> <span style="color:'+MT_C.gris+';font-size:11px;">— '+mtEsc(flu.cuello_criterio||'')+'</span></div>';
  }
  h+='<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;">';
  h+=mtTarjeta('En el embudo',mtNum(flu.inventario_total),'',MT_C.azul,'oportunidades vivas');
  h+=mtTarjeta('En tiempo',mtNum(flu.en_tiempo_pct),'%',MT_C.verde,mtNum(flu.en_tiempo)+' oportunidades');
  h+=mtTarjeta('Con retraso',mtNum(flu.retrasados_pct),'%',MT_C.rojo,mtNum(flu.retrasados)+' oportunidades','mt-det-retraso');
  h+=mtTarjeta('Avanzaron',mtNum(flu.avanzaron),'',MT_C.verde,flu.foto_comparada?('desde '+mtEsc(flu.foto_comparada)):'requiere 2 fotos');
  h+=mtTarjeta('Entraron',mtNum(flu.entraron),'',MT_C.morado,flu.foto_comparada?('desde '+mtEsc(flu.foto_comparada)):'requiere 2 fotos');
  h+='</div>';
  h+=mtDetalleOportunidades('mt-det-retraso',flu.retrasados_detalle||[]);

  var pe=flu.por_etapa||[];
  if(pe.length){
    var filasE=[];
    for(var p3=0;p3<pe.length;p3++){
      var e2=pe[p3], idd='mt-et-'+p3;
      var colR=e2.retrasados_pct>=50?MT_C.rojo:(e2.retrasados_pct>=25?MT_C.amarillo:MT_C.verde);
      var colA=e2.tasa_avance_pct>=30?MT_C.verde:(e2.tasa_avance_pct>0?MT_C.amarillo:MT_C.gris);
      filasE.push(['<b>'+mtEsc(e2.etapa)+'</b> <span style="font-size:10px;color:'+MT_C.gris+';cursor:pointer;" onclick="mtToggle(\''+idd+'\')">▸ ver</span>',
        mtNum(e2.inventario),
        '<span style="color:'+MT_C.verde+';">'+mtNum(e2.en_tiempo_pct)+'%</span>',
        '<span style="color:'+colR+';font-weight:700;">'+mtNum(e2.retrasados_pct)+'%</span>',
        (e2.exceso_promedio_pct?'<span style="color:'+MT_C.rojo+';">+'+mtNum(e2.exceso_promedio_pct)+'%</span>':'—'),
        mtNum(e2.dias_promedio)+'d',(e2.umbral_dias?mtNum(e2.umbral_dias)+'d':'—'),
        '<span style="color:'+colA+';">'+mtNum(e2.tasa_avance_pct)+'%</span>']);
    }
    h+=mtTabla(['Etapa','Hay','En tiempo','Con retraso','Excedido','Días prom.','Plazo','Avance'],filasE);
    for(var q2=0;q2<pe.length;q2++) h+=mtDetalleOportunidades('mt-et-'+q2,pe[q2].detalle||[]);
  }

  /* ---------- BLOQUE 4: TAREAS ---------- */
  h+='<h3 style="margin:22px 0 4px 0;font-size:15px;">Tareas</h3>';
  h+='<div style="font-size:11px;color:'+MT_C.gris+';margin-bottom:10px;">Se miden contra su fecha compromiso. La autoridad es HubSpot.</div>';
  if(tar.disponible===false || (!tar.vencian && !tar.backlog_abierto)){
    h+='<div style="border:1px dashed rgba(148,163,184,.4);border-radius:10px;padding:12px 14px;font-size:12px;color:'+MT_C.gris+';">'
      +'Sin tareas con fecha compromiso en este periodo, o HubSpot no respondió al consultarlas.</div>';
  } else {
    var cT=mtNum(tar.cumplimiento_pct);
    h+='<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;">';
    h+=mtTarjeta('Vencían',mtNum(tar.vencian),'',MT_C.azul,'con compromiso en el periodo','mt-det-tareas');
    h+=mtTarjeta('Cumplidas',mtNum(tar.cumplidas),'',MT_C.verde,'');
    h+=mtTarjeta('Cumplimiento',cT,'%',(cT>=80?MT_C.verde:(cT>=50?MT_C.amarillo:MT_C.rojo)),'contra fecha compromiso');
    h+=mtTarjeta('Sin cumplir',mtNum(tar.vencidas_sin_cumplir),'',MT_C.rojo,mtNum(tar.retraso_promedio_dias)+'d de retraso prom.');
    h+=mtTarjeta('Backlog',mtNum(tar.backlog_abierto),'',MT_C.gris,'vencidas y abiertas');
    h+='</div>';
    var dt=tar.detalle||[], filasT=[];
    for(var u=0;u<dt.length;u++){ var z=dt[u];
      var colT=z.estado==='Cumplida'?MT_C.verde:(z.estado==='Vencida'?MT_C.rojo:MT_C.gris);
      filasT.push([mtEsc(z.asunto),mtEsc(z.owner),mtEsc(z.vence),
        '<span style="color:'+colT+';">'+mtEsc(z.estado)+'</span>',
        (z.retraso_dias===''||z.retraso_dias==null)?'—':(z.retraso_dias>0?'<span style="color:'+MT_C.rojo+';">+'+z.retraso_dias+'d</span>':'a tiempo')]); }
    h+='<div id="mt-det-tareas" style="display:none;margin-bottom:12px;padding:8px;border:1px solid rgba(148,163,184,.2);border-radius:8px;">'
      +mtTabla(['Tarea','Responsable','Vence','Estado','Retraso'],filasT)+'</div>';
    var po=tar.por_owner||[];
    if(po.length){
      var filasO=[];
      for(var v2=0;v2<po.length;v2++){ var o2=po[v2];
        var colO=o2.cumplimiento_pct>=80?MT_C.verde:(o2.cumplimiento_pct>=50?MT_C.amarillo:MT_C.rojo);
        filasO.push([mtEsc(o2.owner),mtNum(o2.vencian),mtNum(o2.cumplidas),mtNum(o2.sin_cumplir),
          '<b style="color:'+colO+';">'+mtNum(o2.cumplimiento_pct)+'%</b>']); }
      h+=mtTabla(['Responsable','Vencían','Cumplidas','Sin cumplir','Cumplimiento'],filasO);
    }
  }

  h+='<div style="font-size:10px;color:'+MT_C.gris+';margin-top:22px;">Mide efectividad de resultado, no esfuerzo: sin datos de llamadas ni de mensajes enviados, "no avanzó" no distingue entre no haber contactado y haber contactado sin interés.</div>';
  cont.innerHTML=h;
}
function renderMetricas(){ if(!MT_DATA) mtCargar(); else mtPintar(); }
/* =================== FIN PESTANA METRICAS =================== */

</script>
</body>
</html>
