<style>
:root {
  --purple: #7C3AED;
  --pink: #EC4899;
  --cyan: #06B6D4;

  --bg: #0B0F19;

* { box-sizing: border-box; margin: 0; padding: 0; }

body {

  line-height: 1.5;

#app {

/* HEADER */
.hdr {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px;
  background: linear-gradient(135deg, var(--purple), var(--pink));

}

.logo {
  width: 42px; height: 42px;

}
.hdr-main { font-size: 18px; font-weight: 800; letter-spacing: 0.5px; }
.hdr-sub { font-size: 11px; opacity: 0.85; letter-spacing: 1px; text-transform: uppercase; }

.hdr-right { display: flex; align-items: center; gap: 12px; }
.live-badge {
  background: rgba(0,0,0,0.25);

  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  display: flex; align-items: center; gap: 6px;
}
.dot {
  width: 8px; height: 8px;
  background: #10B981;
  border-radius: 50%;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.btn-refresh {
  background: rgba(0,0,0,0.25);
  border: none;
  color: white;
  padding: 8px 14px;
  border-radius: 8px;

  font-size: 13px;
  font-weight: 600;
}
.btn-refresh:hover { background: rgba(0,0,0,0.4); }
.timer { font-size: 11px; opacity: 0.8; font-variant-numeric: tabular-nums; }

/* TABS */
.tabs {
  display: flex;
  gap: 4px;
  background: var(--bg-2);
  padding: 6px;
  border-radius: 10px;
  margin-bottom: 16px;
  overflow-x: auto;
}
.tab {
  background: transparent;
  border: none;
  color: var(--text-dim);
  padding: 10px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  transition: all 0.15s;
}
.tab:hover { background: var(--bg-3); color: var(--text); }
.tab.active {
  background: linear-gradient(135deg, var(--purple), var(--pink));
  color: white;
}
.badge-red {
  background: var(--red);
  color: white;
  padding: 2px 7px;
  border-radius: 10px;
  font-size: 11px;
  margin-left: 6px;
}

/* PANELS */
.panel { display: none; }
.panel.active { display: block; }
.loading, .empty {
  padding: 60px 20px;
  text-align: center;
  color: var(--text-mute);
  font-size: 14px;
}
.error {
  padding: 20px;
  background: rgba(239,68,68,0.1);
  border: 1px solid rgba(239,68,68,0.3);
  border-radius: 8px;
  color: #FCA5A5;
  margin: 16px 0;
}

/* KPI CARDS */
.kpi-grid {

}
.kpi {

}
.kpi-label {

  letter-spacing: 1px;

  margin-bottom: 8px;
}
.kpi-value {

}
.kpi-sub {

}
.kpi-purple { border-left: 3px solid var(--purple); }
.kpi-pink { border-left: 3px solid var(--pink); }
.kpi-cyan { border-left: 3px solid var(--cyan); }
.kpi-mint { border-left: 3px solid var(--mint); }
.kpi-yellow { border-left: 3px solid var(--yellow); }

/* AMPLEMARKET TAB */
.qd-star { color: #16a34a; font-weight: 600; }

}
.am-tab:hover { background: #e5e7eb; }
.am-tab-active {
  background: #1e293b;
  color: white;
  border-color: #1e293b;
}

/* SECTIONS */
.section {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px;
  margin-bottom: 16px;
}
.section-title {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 14px;
  color: var(--text);

  align-items: center;
  gap: 8px;
}
.section-count {
  background: var(--bg-3);
  color: var(--text-dim);
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
}

/* TABLES */
.tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.tbl th {

  padding: 10px 8px;

/* ALERTS */
.alert {

.alert:hover { background: var(--bg-3); }

/* FILTERS */
.filters {

  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 14px;

}
.filter-label {
  font-size: 11px;

  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-right: 4px;
}
.chip {
  background: var(--bg-3);
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 5px 12px;
  border-radius: 14px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;

.client-grid {

}
.client-total {
  font-size: 20px;
  font-weight: 700;

}
.client-contact {

  margin-bottom: 10px;
}
.client-deals { margin-top: 8px; }
.client-deal {
  font-size: 12px;
  padding: 6px 0;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
}

/* FOOTER */
.ftr {
  margin-top: 20px;
  padding: 12px 20px;
  background: var(--bg-2);
  border: 1px solid var(--border);

/* KANBAN — Pipeline vertical por stage */
.kanban {
  display: grid;
  grid-template-columns: repeat(6, minmax(200px, 1fr));
  gap: 10px;

.kanban-col {

}
.kanban-col-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  text-transform: uppercase;

}
.kanban-col-count {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 2px;
}
.kanban-col-body {
  padding: 8px;

  flex-direction: column;
  gap: 6px;
  max-height: 70vh;
  overflow-y: auto;
}
.kanban-card {
  background: var(--bg-2);

}

}
.kanban-card-date {

}
.kanban-empty {

@media (max-width: 1100px) {

function catStageColHex(){ var m={},pal=(CAT().paleta||CAT_FALLBACK.paleta); catStagesAct().forEach(function(s){m[s.label]=pal[s.color];}); return m; }
function catProdsPresentes(){
  var orden=((CAT().productos)||CAT_FALLBACK.productos||[]).map(function(p){return p.id;});
  var excl={'Interno':1,'Otro':1};
  var pres=[...new Set(((typeof DATA!=='undefined'&&DATA&&DATA.deals)?DATA.deals:[]).map(function(d){return d.prod;}).filter(Boolean))].filter(function(p){return !excl[p];});
  pres.sort(function(a,b){var ia=orden.indexOf(a),ib=orden.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib);});
  return pres;
}

function catProdMap(){ var m={}; ((CAT().productos)||CAT_FALLBACK.productos||[]).forEach(function(p){ m[p.id]=p; }); return m; }
function grupoDeProd(prod){ var p=catProdMap()[prod]; if(p&&p.grupo) return p.grupo; if(prod==='Interno'||prod==='Otro'||prod==='P-Otro') return 'INTERNO'; return 'GR'; }
var GRUPOS_ORDEN=['ALL','GR','PT','IMMMU','INTERNO'];
function grupoLabel(g){ return g==='ALL'?'All':(g==='INTERNO'?'Interno':g); }
// Semáforo de tiempo (uno solo): rojo=vencida, amarillo=hoy/próx 3d, verde=al día/futura
function semList(menu){ var b=[ {id:'ALL',label:'Todos'},{id:'rojo',label:'🔴 Vencidas'},{id:'amarillo',label:'🟡 Próximas'},{id:'verde',label:'🟢 Al día'} ]; if(menu==='pendientes'){ b.splice(1,0,{id:'cerradas',label:'✅ Cerradas'}); } return b; }
function semDeItem(it,kind){ if(it&&it.semaforo) return it.semaforo; return 'verde'; }
// Producto canónico presente en un arreglo dado (excluye Interno/Otro), en orden de catálogo
function prodsPresentesDe(arr){
  var orden=((CAT().productos)||CAT_FALLBACK.productos||[]).map(function(p){return p.id;});
  var excl={'Interno':1,'Otro':1,'P-Otro':1};
  var pres=[...new Set((arr||[]).map(function(x){return x.prod;}).filter(Boolean))].filter(function(p){return !excl[p];});
  pres.sort(function(a,b){var ia=orden.indexOf(a),ib=orden.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib);});
  return pres;
}
// Personas presentes (para conteo) en un arreglo, cada item con .personas (deals/alertas) o .persona (tareas)
function personasDeItem(it){ if(it&&Array.isArray(it.personas)) return it.personas; if(it&&it.persona) return [it.persona]; return []; }
// ===== Render de filtros unificado =====
function _chip(menu,k,v,label,active,extra){ return '<button class="chip '+(active?'active':'')+'" data-f="'+menu+'" data-k="'+k+'" data-v="'+v+'"'+(extra||'')+'>'+label+'</button>'; }
function _stagesPresentes(arr){
  var st=((CAT().stages)||CAT_FALLBACK.stages||[]).slice().sort(function(a,b){return a.prioridad-b.prioridad;});
  var labelsPres=[...new Set((arr||[]).map(function(d){return d.stageLabel||d.stage;}).filter(Boolean))];
  return st.filter(function(x){return labelsPres.indexOf(x.label)>=0;});
}
// arr = universo del menú (para conteos y opciones presentes). kind: 'deal'|'task'|'alerta'
function filtrosHTML(menu, arr, kind){
  var f=FILT[menu]; var H='';
  // Persona (todos los menús) con conteo
  var pcount={}; var totalP=0;
  (arr||[]).forEach(function(it){ var ps=personasDeItem(it); if(ps.length===0){ pcount['Otro']=(pcount['Otro']||0)+1; } else { ps.forEach(function(p){ pcount[p]=(pcount[p]||0)+1; }); } totalP++; });
  var pids=catPersonaIds();
  H+='<div class="filters"><span class="filter-label">Persona:</span>';
  H+=_chip(menu,'persona','Todos','Todos ('+totalP+')', f.persona==='Todos');
  pids.forEach(function(p){ if(pcount[p]) H+=_chip(menu,'persona',p, p+' ('+pcount[p]+')', f.persona===p); });
  if(pcount['Otro']) H+=_chip(menu,'persona','Otro','Otro ('+pcount['Otro']+')', f.persona==='Otro');
  H+='</div>';
  // Semáforo (pipeline, pendientes, alertas — no recap)
  if(menu!=='recap'){
    H+='<div class="filters"><span class="filter-label">Semáforo:</span>';
    semList(menu).forEach(function(o){ H+=_chip(menu,'sem',o.id,o.label, (f.sem||'ALL')===o.id); });
    H+='</div>';
  }
  // Grupo (todos)
  H+='<div class="filters"><span class="filter-label">Grupo:</span>';
  GRUPOS_ORDEN.forEach(function(g){ H+=_chip(menu,'grupo',g,grupoLabel(g), (f.grupo||'ALL')===g); });
  H+='</div>';
  // Producto (todos) canónico, presente
  var prods=prodsPresentesDe(arr);
  if(f.grupo && f.grupo!=='ALL'){ prods=prods.filter(function(p){return grupoDeProd(p)===f.grupo;}); }
  H+='<div class="filters"><span class="filter-label">Producto:</span>';
  H+=_chip(menu,'prod','ALL','Todos', (f.prod||'ALL')==='ALL');
  prods.forEach(function(p){ H+=_chip(menu,'prod',p,p, f.prod===p); });
  H+='</div>';
  // Stage (solo deals: pipeline, alertas)
  if(kind==='deal'||kind==='alerta'){
    var stgs=_stagesPresentes(arr);
    H+='<div class="filters"><span class="filter-label">Stage:</span>';
    H+=_chip(menu,'stage','ALL','Todos', (f.stage||'ALL')==='ALL');
    stgs.forEach(function(x){ H+=_chip(menu,'stage',x.label,x.label, f.stage===x.label); });
    H+='</div>';
    // Monto
    H+='<div class="filters"><span class="filter-label">Monto:</span>';
    MONTO_OPC.forEach(function(o){ H+=_chip(menu,'monto',o.id,o.label, (f.monto||0)===o.id); });
    H+='</div>';
  }
  // Categoría (solo alertas)
  if(menu==='alertas'){
    H+='<div class="filters"><span class="filter-label">Categoría:</span>';
    [['ALL','Todas'],['Cerrar','Cerrar'],['ReActivar','ReActivar'],['Higienizar','Higienizar']].forEach(function(o){ H+=_chip(menu,'categoria',o[0],o[1], (f.categoria||'ALL')===o[0]); });
    H+='</div>';
  }
  return H;
}
// Predicado unificado
function pasaFiltro(menu, it, kind){
  var f=FILT[menu];
  if(f.persona && f.persona!=='Todos'){ var ps=personasDeItem(it); if(f.persona==='Otro'){ if(ps.length>0) return false; } else if(ps.indexOf(f.persona)<0) return false; }
  if(menu!=='recap' && f.sem && f.sem!=='ALL'){ if(semDeItem(it,kind)!==f.sem) return false; }
  if(f.grupo && f.grupo!=='ALL'){ if(grupoDeProd(it.prod)!==f.grupo) return false; }
  if(f.prod && f.prod!=='ALL'){ if(it.prod!==f.prod) return false; }
  if((kind==='deal'||kind==='alerta') && f.stage && f.stage!=='ALL'){ var sl=it.stageLabel||it.stage; if(sl!==f.stage) return false; }
  if((kind==='deal'||kind==='alerta') && f.monto){ if((it.amount||0) < f.monto) return false; }
  if(menu==='alertas' && f.categoria && f.categoria!=='ALL'){ if(it.categoria!==f.categoria) return false; }
  return true;
}

  else if(k==='excludeP') FILT[menu][k]=!FILT[menu][k];
  else FILT[menu][k]=v;
  if(typeof renderCurrentTab==='function') renderCurrentTab();
});

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => Array.from(document.querySelectorAll(sel));

function fmt(n) {
  if (n == null || isNaN(n)) return '—';
  return '$' + Math.round(n).toLocaleString('en-US');
}

function fmtK(n) {
  if (n == null || isNaN(n)) return '—';
  if (Math.abs(n) >= 1000000) return '$' + (n / 1000000).toFixed(2) + 'M';
  if (Math.abs(n) >= 1000) return '$' + Math.round(n / 1000) + 'K';
  return '$' + Math.round(n);
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  const now = new Date();
  return Math.floor((d - now) / (1000 * 60 * 60 * 24));
}

// --- Data fetch ---
async function loadData() {
  try {
    // Fetch principal v10 + AM v1 en paralelo
    // Prospección carga en paralelo pero NO bloquea el dashboard principal
    const prospPromise = fetch(PROSPECCION_URL).catch(e => { console.warn('Prospeccion endpoint failed:', e); return null; });
    const [dealsRes, amRes] = await Promise.all([
      fetch(DATA_URL),
      fetch(AM_URL + '?period=' + amPeriod).catch(e => { console.warn('AM endpoint failed:', e); return null; })
    ]);
    const prospRes = await prospPromise;
    const empresasRes = null;

    if (!dealsRes.ok) throw new Error('HTTP ' + dealsRes.status);
    
    // Leer como texto primero para diagnosticar mejor
    const dealsText = await dealsRes.text();
    if (!dealsText || dealsText.trim() === '') {
      throw new Error('QUOTA_LIMIT');
    }
    // Si la respuesta es HTML (típico de n8n cuando hay error de plan)
    if (dealsText.trim().startsWith('<')) {
      if (dealsText.includes('Execution limit') || dealsText.includes('upgrading your plan')) {
        throw new Error('QUOTA_LIMIT');
      }
      throw new Error('HTML_RESPONSE');
    }
    
    try {
      DATA = JSON.parse(dealsText);
    } catch (parseErr) {
      throw new Error('INVALID_JSON');
    }
    
    if (!DATA.ok) throw new Error('Webhook returned ok:false');

    // AM data es opcional — si falla el dashboard sigue funcionando
    if (amRes && amRes.ok) {
      try {
        const amText = await amRes.text();
        if (amText && amText.trim() !== '' && !amText.trim().startsWith('<')) {
          AM_DATA = JSON.parse(amText);
        }
      } catch (e) {
        console.warn('AM data parse failed:', e);
        AM_DATA = null;
      }
    }

    // Prospección eventos (opcional) — si falla, el dashboard sigue
    if (prospRes && prospRes.ok) {
      try {
        try {
          if (empresasRes) {
            const eText = await empresasRes.text();
            if (eText && eText.trim() !== '' && !eText.trim().startsWith('<')) {
              EMPRESAS_DATA = JSON.parse(eText);
            }
          }
        } catch(e2) { console.warn('Empresas error:', e2); }

        const pText = await prospRes.text();
        if (pText && pText.trim() !== '' && !pText.trim().startsWith('<')) {
          PROSPECCION_DATA = JSON.parse(pText);
        }
      } catch (e) {
        console.warn('Prospeccion data parse failed:', e);
        PROSPECCION_DATA = null;
      }
    }

    // Tasks ahora vienen del mismo webhook en DATA.tareas/DATA.statsTareas
    // Adaptamos al shape que espera el renderer: { tareas, statsTareas }
    TASKS = {
      tareas: DATA.tareas || {},
      statsTareas: DATA.statsTareas || {}
    };

    updateTimer();
    updateFooter();
    renderCurrentTab();
    // Cargar datos de empresa en background (no bloquea)
    fetch(EMPRESAS_URL).then(function(r){ return r.json(); }).then(function(data){
      EMPRESAS_DATA = data;
      if(currentTab === 'prospeccion') renderCurrentTab();
    }).catch(function(e){ console.warn('Empresas endpoint failed:', e); });
  } catch (err) {
    console.error('Load error:', err);
    let html = '';
    if (err.message === 'QUOTA_LIMIT') {
      html = `<div class="error" style="background:#7F1D1D;border-left:3px solid #EF4444;padding:16px 20px;border-radius:8px;color:#FCA5A5">
        <div style="font-size:16px;font-weight:700;margin-bottom:8px;color:#FECACA">⚠️ Límite mensual de n8n alcanzado</div>
        <div style="color:#F3F4F6;line-height:1.5;margin-bottom:8px">El webhook de HubSpot no responde porque el plan de n8n llegó a su límite de ejecuciones del mes.</div>
        <div style="font-size:13px;color:#9CA3AF;margin-top:12px;padding-top:12px;border-top:1px solid #991B1B">
          <strong style="color:#F3F4F6">Soluciones:</strong><br>
          1. Subir el plan en <a href="https://app.n8n.cloud/account/change-plan" target="_blank" style="color:#FCA5A5;text-decoration:underline">n8n Cloud</a><br>
          2. Esperar reset mensual de la cuota<br>
          3. Pausar workflows no críticos
        </div>
      </div>`;
    } else if (err.message === 'INVALID_JSON' || err.message === 'HTML_RESPONSE') {
      html = `<div class="error" style="background:#7F1D1D;border-left:3px solid #EF4444;padding:16px 20px;border-radius:8px;color:#FCA5A5">
        <div style="font-size:16px;font-weight:700;margin-bottom:8px;color:#FECACA">⚠️ Backend respondió con formato inválido</div>
        <div style="color:#F3F4F6;line-height:1.5">El webhook regresó algo que no es JSON. Probablemente un error de n8n (rate limit, workflow desactivado o error interno).</div>

        });
      } else {

// --- Tab routing ---
function switchTab(tabId) {
  currentTab = tabId;
  $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tabId));
  $$('.panel').forEach(p => p.classList.toggle('active', p.id === 'p-' + tabId));
  history.pushState({tab:tabId},'',location.pathname+'?tab='+tabId);
  renderCurrentTab();
}
window.addEventListener('popstate',function(e){
  var tab=(e.state&&e.state.tab)||'pipeline';
  currentTab=tab;
  $$('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  $$('.panel').forEach(p=>p.classList.toggle('active',p.id==='p-'+tab));
  renderCurrentTab();
});

function renderCurrentTab() {
  if (!DATA) {
    // DATA no cargó aún — mostrar mensaje en el tab activo
    var contP = document.getElementById('p-prospeccion');
    if (contP && currentTab === 'prospeccion') {
      contP.innerHTML = '<div style="color:#9CA3AF;padding:16px;font-size:13px;">Esperando datos principales...</div>';
    }
    return;
  }
  const renderers = {
    recap: renderRecap,
    overview: renderOverview,
    pipeline: renderPipeline,
    won: renderWon,
    clientes: renderClientes,
    pendientes: renderPendientes,
    alertas: renderAlertas,
    prospeccion: renderProspeccion,
    amplemarket: renderAmplemarket,
    forecast: renderForecast,
    chat: renderChat
  };
  const fn = renderers[currentTab];
  try { if (fn) fn(); } catch(e) {
    var ep = document.getElementById('p-' + currentTab);
    if (ep) ep.innerHTML = '<div style="color:#ef4444;padding:16px;">Error en render: ' + e.message + '</div>';
  }
}

const STAGE_ORDER = catStagesAct().map(function(s){return {key:s.id,label:s.label,id:s.id};}); // catálogo (CAT)

function renderPipeline() {
  // Normaliza producto desde el nombre para categorias que el backend deja en Otro (BD, AEO+SEO)
  (DATA.deals||[]).forEach(function(d){
    if(d.prod==='Otro'||d.prod==='P-Otro'){
      var nm=String(d.name||'').toUpperCase().replace(/^P_/,'');
      if(nm.indexOf('BD_')===0||nm.indexOf('BD ')===0||nm.indexOf('BD-')===0) d.prod='BD';
      else if(nm.indexOf('IMU')===0||nm.indexOf('IMMMU')===0) d.prod='IMMMU';
    }
  });
  const _uniqP=[...new Set(DATA.deals.map(d => d.prod).filter(Boolean))];
  const _ORD=['TW','AM','AEO','3V','GenIA','ITS','LT','BD','WB','HS','PT','IMMMU','Interno','Otro'];
  _uniqP.sort((a,b)=>{const ia=_ORD.indexOf(a),ib=_ORD.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib);});
  let _grp=_uniqP; if(pipelineFilters.group!=='ALL'){ const gs=PROD_GROUPS[pipelineFilters.group]||[]; _grp=_uniqP.filter(p=>gs.includes(p)); }
  const prods = ['ALL', ..._grp];
  const owners = ['ALL', ...new Set(DATA.deals.map(d => d.owner).filter(Boolean))];

  const poolPipe = DATA.deals.filter(d => d.stage !== 'closedwon' && d.stage !== '1092009814');
  const filtered = poolPipe.filter(d => {
    if (FILT.pipeline.excludeP && d.name && d.name.startsWith('P_')) return false;
    return pasaFiltro('pipeline', d, 'deal');
  });

  const total = filtered.reduce((s, d) => s + (d.amount || 0), 0);

  // Agrupar por stage
  const byStage = {};
  STAGE_ORDER.forEach(s => byStage[s.key] = []);
  const otros = [];
  filtered.forEach(d => {
    const key = STAGE_ORDER.find(s => s.id === d.stage)?.key;
    if (key) byStage[key].push(d);
    else otros.push(d);
  });
  // Ordenar dentro de cada columna por monto descendente
  Object.values(byStage).forEach(arr => arr.sort((a, b) => (b.amount || 0) - (a.amount || 0)));
  otros.sort((a, b) => (b.amount || 0) - (a.amount || 0));

  let html = `
    <div class="section">
      ${filtrosHTML('pipeline', poolPipe, 'deal')}
      <div class="filters">
        <span class="filter-label">Otros:</span>
        <button class="chip ${FILT.pipeline.excludeP ? 'active' : ''}" data-f="pipeline" data-k="excludeP" data-v="toggle">Excluir P_</button>
      </div>
      <div id="pipeline-metrics-gr-pip" style="margin:12px 0 4px"></div>
      <div class="section-title">
        <span class="section-count">${filtered.length} deals activos</span>
        <span style="margin-left:auto;color:var(--text-dim);font-size:12px;">Total: <strong style="color:var(--text);">${fmtK(total)}</strong></span>
      </div>
      <div class="kanban">
  `;

  STAGE_ORDER.forEach(s => {
    const col = byStage[s.key];
    const colTotal = col.reduce((sum, d) => sum + (d.amount || 0), 0);
    html += `
      <div class="kanban-col">
        <div class="kanban-col-header">
          <div class="kanban-col-title">${s.label}</div>
          <div class="kanban-col-count">${col.length} · ${fmtK(colTotal)}</div>
        </div>
        <div class="kanban-col-body">
    `;
    if (col.length === 0) {
      html += `<div class="kanban-empty">—</div>`;
    } else {
      col.slice(0, 40).forEach(d => {
        const days = d.closedate ? daysUntil(d.closedate) : null;
        const dateClass = days !== null && days < 0 ? 'kanban-date-late' : '';
        const clienteDisplay = d.cliente || d.name;
        const subtitleHtml = d.cliente && d.cliente !== d.name
          ? `<div class="kanban-card-sub" style="font-size:10px;color:var(--text-dim);margin-top:2px;">${d.name}</div>`
          : '';
        const _semCol = ({rojo:'#DB0540',amarillo:'#FFCD00',verde:'#62D175'})[d.semaforo] || 'transparent';
        const _perChips = (d.personas && d.personas.length)
          ? `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:5px;">${d.personas.slice(0,3).map(p=>`<span style="font-size:10px;padding:1px 7px;border-radius:8px;background:rgba(125,42,228,.16);color:#C4A5F0;">${p}</span>`).join('')}</div>`
          : '';
        html += `
          <div class="kanban-card" style="border-left:3px solid ${_semCol};">
            <div class="kanban-card-name">${clienteDisplay}</div>
            ${subtitleHtml}
            <div class="kanban-card-meta">
              <span class="kanban-card-amount">${fmtK(d.amount)}</span>
              <span style="display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--text-dim);"><span style="width:8px;height:8px;border-radius:50%;background:${_semCol};display:inline-block;"></span>${({rojo:'Vencida',amarillo:'Próxima',verde:'Al día'})[d.semaforo]||''}</span>
            </div>
            ${_perChips}
            ${d.closedate ? `<div class="kanban-card-date ${dateClass}">${d.closedate}</div>` : ''}
          </div>
        `;
      });
      if (col.length > 40) {
        html += `<div class="kanban-empty">+ ${col.length - 40} más</div>`;
      }
    }
    html += `</div></div>`;
  });

  html += `</div>`;

  if (otros.length > 0) {
    html += `<div class="section-title" style="margin-top:20px;">Otros stages <span class="section-count">${otros.length}</span></div>
      <table class="tbl"><thead><tr><th>Deal</th><th>Stage</th><th>Owner</th><th>Close</th><th class="num">Monto</th></tr></thead><tbody>`;
    otros.slice(0, 20).forEach(d => {
      html += `<tr>
        <td>${d.name}</td>
        <td>${tagForStage(d.stage, d.stageLabel)}</td>
        <td>${d.owner || '—'}</td>
        <td>${d.closedate || '—'}</td>
        <td class="num">${fmt(d.amount)}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
  }

  html += `</div>`;
  $('#p-pipeline').innerHTML = html;

  $$('[data-pfilter]').forEach(btn => {
    btn.addEventListener('click', () => {
      const f = btn.dataset.pfilter;
      const v = btn.dataset.pval;
      if (f === 'excludeP') pipelineFilters.excludeP = !pipelineFilters.excludeP;
      else pipelineFilters[f] = v;
      renderPipeline();
    });
  });
  renderPipelineMetricsPipeline();
}

function renderPipelineMetricsPipeline(){
  var box=document.getElementById('pipeline-metrics-gr-pip'); if(!box) return;
  var allDeals=(DATA&&DATA.deals)||[];
  var filtered=allDeals.filter(function(d){
    if(d.stage==='closedwon'||d.stage==='1092009814') return false;
    if(FILT.pipeline.excludeP&&d.name&&d.name.startsWith('P_')) return false;
    return pasaFiltro('pipeline', d, 'deal');
  });
  // stageMap usa el label EXACTO de cada stage en STAGE_ORDER del Kanban
  var stageMap={};
  if(typeof STAGE_ORDER!=='undefined') STAGE_ORDER.forEach(function(s){stageMap[s.id]=s.label;});
  // Solo incluir deals con stage reconocido en el Kanban activo
  var dbs={};
  filtered.forEach(function(d){
    var et=stageMap[d.stage]; // undefined para Renovación, Perdida, etc.
    if(!et) return;
    if(!dbs[et]) dbs[et]=[];
    dbs[et].push(d);
  });
  // Labels y colores = los mismos que las columnas del Kanban
  var GR_ORDER=catStageLabelsAct(); // catálogo (CAT)
  var GR_COL=catStageColHex(); // catálogo (CAT)
  var allKeys=Object.keys(dbs);
  var main=allKeys.filter(function(k){return !/Perdida|Closed Won/i.test(k);});
  var perd=allKeys.filter(function(k){return /Perdida|Closed Won/i.test(k);});
  main.sort(function(a,b){var ia=GR_ORDER.indexOf(a),ib=GR_ORDER.indexOf(b);return(ia===-1?99:ia)-(ib===-1?99:ib);});
  var totalActivos=main.reduce(function(s,k){return s+(dbs[k]||[]).length;},0);
  var totalPerdida=perd.reduce(function(s,k){return s+(dbs[k]||[]).length;},0);
  var total=totalActivos+totalPerdida;
  if(!total){box.innerHTML='';return;}
  var h='<div style="margin-bottom:10px;font-size:11px;font-weight:700;color:#6B7280;text-transform:uppercase;letter-spacing:.06em">Pipeline GR &middot; <span style="color:#F3F4F6">'+total+'</span> deals &middot; <span style="color:#62D175">'+totalActivos+'</span> activos</div>';
  h+='<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;">';
  main.forEach(function(k){
    var deals=dbs[k]||[]; if(!deals.length) return;
    var col=GR_COL[k]||'#6B7280';
    var pct=totalActivos>0?Math.round(deals.length/totalActivos*100):0;
    h+='<div style="display:flex;flex-direction:column;align-items:center;gap:2px;background:'+col+'18;border:1px solid '+col+'44;border-radius:14px;padding:10px 16px;min-width:80px;">'+
      '<div style="font-size:22px;font-weight:800;color:'+col+';line-height:1;">'+deals.length+'</div>'+
      '<div style="font-size:10px;font-weight:700;color:#F3F4F6;text-align:center;line-height:1.3;">'+k+'</div>'+
      '<div style="font-size:13px;font-weight:700;color:'+col+'cc;margin-top:2px;">'+pct+'%</div>'+
      '</div>';
  });
  if(totalPerdida>0){
    h+='<div style="align-self:stretch;width:1px;background:#2A3142;margin:0 4px;"></div>';
    perd.forEach(function(k){
      var deals=dbs[k]||[]; if(!deals.length) return;
      h+='<div style="display:flex;flex-direction:column;align-items:center;gap:2px;background:#6B728018;border:1px solid #6B728044;border-radius:14px;padding:10px 16px;min-width:80px;">'+
        '<div style="font-size:22px;font-weight:800;color:#6B7280;line-height:1;">'+deals.length+'</div>'+
        '<div style="font-size:10px;font-weight:700;color:#9CA3AF;text-align:center;line-height:1.3;">'+k+'</div>'+
        '</div>';
    });
  }
  h+='</div>';
  box.innerHTML=h;
}

// --- WON ---
function renderWon() {
  // v10: Consume wonBuckets si está disponible, fallback a won[] plano
  const wb = DATA.wonBuckets || null;
  const statsWon = DATA.statsWon || null;

  // Fallback: si no hay wonBuckets (API v9 o antes), usar renderWon legacy
  if (!wb || !statsWon) {
    return renderWonLegacy();
  }

  const renovaciones = wb.renovacionesAnuales || [];
  const consultorias = wb.consultoriasMensuales || [];
  const historico = wb.historicoWon || [];

  const recurrenteAnual = statsWon.renovacionesAnuales.montoTotal + statsWon.consultoriasMensuales.montoAnual;

  // Día actual del mes para calcular status de factura
  const today = new Date();
  const diaHoy = today.getDate();

  let html = '';

  // === KPIs agregados arriba ===
  html += `
    <div class="won-kpis">
      <div class="won-kpi renewal">
        <div class="won-kpi-label">💰 Revenue Recurrente Anual</div>
        <div class="won-kpi-value">${fmtK(recurrenteAnual)}</div>
        <div class="won-kpi-sub">${fmtK(statsWon.renovacionesAnuales.montoTotal)} anuales + ${fmtK(statsWon.consultoriasMensuales.montoAnual)} consultorías</div>
      </div>
      <div class="won-kpi recurring">
        <div class="won-kpi-label">📅 Renovaciones críticas</div>
        <div class="won-kpi-value">${statsWon.renovacionesAnuales.vencidas + statsWon.renovacionesAnuales.criticas}</div>
        <div class="won-kpi-sub">Vencen en ≤60 días · ${statsWon.renovacionesAnuales.proximas} próximas (≤90d)</div>
      </div>
      <div class="won-kpi oneshot">
        <div class="won-kpi-label">💵 Monto mensual recurrente</div>
        <div class="won-kpi-value">${fmtK(statsWon.consultoriasMensuales.montoMensual)}</div>
        <div class="won-kpi-sub">${statsWon.consultoriasMensuales.count} consultorías activas</div>
      </div>
    </div>
  `;

  // === BUCKET 1: Renovaciones Anuales ===
  html += `
    <div class="won-bucket">
      <div class="won-bucket-header">
        <span class="won-bucket-icon">📅</span>
        <span>Renovaciones Anuales</span>
        <span class="won-bucket-count">${renovaciones.length}</span>
        <span class="won-bucket-total">Total: <strong>${fmtK(statsWon.renovacionesAnuales.montoTotal)}</strong></span>
      </div>
  `;

  if (renovaciones.length === 0) {
    html += `<div class="won-empty-bucket">Sin renovaciones anuales activas</div>`;
  } else {
    // Calcular % barra (días restantes como % de 365)
    renovaciones.forEach(d => {
      const days = d.diasParaVencer;
      // Barra: 100% cuando vencida/crítica, decrece conforme se aleja
      let barPct;
      if (days < 0) barPct = 100;
      else if (days <= 60) barPct = 100 - (days / 60 * 20); // 100-80%
      else if (days <= 90) barPct = 80 - ((days - 60) / 30 * 20); // 80-60%
      else if (days <= 180) barPct = 60 - ((days - 90) / 90 * 30); // 60-30%
      else barPct = Math.max(10, 30 - ((days - 180) / 180 * 20)); // 30-10%

      const daysDisplay = days < 0 ? `${Math.abs(days)}d vencida` : `${days}d`;
      const dealId = d.id || '';
      const hsUrl = dealId ? `https://app.hubspot.com/contacts/49671716/record/0-3/${dealId}` : '#';

      html += `
        <div class="won-renewal-row">
          <div>
            <div class="won-deal-name">${d.name}</div>
            <div class="won-deal-prod">${d.prod || ''} · ${d.owner || '—'} · Vence ${d.closedate || '—'}</div>
            <div class="urg-bar"><div class="urg-bar-fill ${d.urgencia}" style="width:${barPct}%"></div></div>
          </div>
          <div class="days-cell">
            <strong>${days < 0 ? Math.abs(days) : days}</strong>
            <span>${days < 0 ? 'días venc' : 'días'}</span>
          </div>
          <div><span class="urg-badge ${d.urgencia}">${d.urgencia}</span></div>
          <div class="num-right">${fmtK(d.amount)}</div>
          <div style="text-align:center;">
            <a class="btn-action" href="${hsUrl}" target="_blank">Ver deal →</a>
          </div>
        </div>
      `;
    });
  }
  html += `</div>`;

  // === BUCKET 2: Consultorías Mensuales ===
  html += `
    <div class="won-bucket">
      <div class="won-bucket-header">
        <span class="won-bucket-icon">💰</span>
        <span>Consultorías Mensuales</span>
        <span class="won-bucket-count">${consultorias.length}</span>
        <span class="won-bucket-total">${fmtK(statsWon.consultoriasMensuales.montoMensual)}/mes · <strong>${fmtK(statsWon.consultoriasMensuales.montoAnual)}/año</strong></span>
      </div>
  `;

  if (consultorias.length === 0) {
    html += `<div class="won-empty-bucket">Sin consultorías mensuales activas</div>`;
  } else {
    consultorias.forEach(d => {
      const diaCorte = d.diaCorte || 1;
      // Días hasta próximo corte
      let diasProxCorte;
      if (diaHoy <= diaCorte) {
        diasProxCorte = diaCorte - diaHoy;
      } else {
        // ya pasó este mes, calcular días del próximo
        const proxCorte = new Date(today.getFullYear(), today.getMonth() + 1, diaCorte);
        diasProxCorte = Math.ceil((proxCorte - today) / (1000 * 60 * 60 * 24));
      }

      // Status factura del mes actual:
      // - Si hoy >= diaCorte: factura debió emitirse (vencida si no se emitió)
      // - Si hoy < diaCorte: OK pendiente
      let facturaStatus, facturaText;
      if (diaHoy >= diaCorte) {
        const diasVencido = diaHoy - diaCorte;
        facturaStatus = diasVencido > 0 ? 'vencida' : 'proxima';
        facturaText = diasVencido === 0 ? 'Hoy' : `${diasVencido}d vencida`;
      } else {
        facturaStatus = 'ok';
        facturaText = `Pendiente`;
      }

      const dealId = d.id || '';
      const hsUrl = dealId ? `https://app.hubspot.com/contacts/49671716/record/0-3/${dealId}` : '#';

      html += `
        <div class="won-recurring-row">
          <div>
            <div class="won-deal-name">${d.name}</div>
            <div class="won-deal-prod">${d.prod || '3V'} · ${d.owner || '—'} · Contrato hasta ${d.closedate || '—'}</div>
          </div>
          <div style="text-align:center;">
            <span class="dia-corte">Día ${diaCorte}</span>
            <div class="won-deal-prod" style="margin-top:4px;">próx corte en ${diasProxCorte}d</div>
          </div>
          <div style="text-align:center;">
            <span class="factura-status ${facturaStatus}">${facturaText}</span>
          </div>
          <div class="num-right">
            ${fmt(d.amount)}/mes
            <div class="won-deal-prod" style="text-align:right;">${fmtK(d.amount * 12)}/año</div>
          </div>
          <div style="text-align:center;">
            <a class="btn-action" href="${hsUrl}" target="_blank">Ver deal →</a>
          </div>
        </div>
      `;
    });
  }
  html += `</div>`;

  // === BUCKET 3: Histórico Won (one-shot projects) ===
  html += `
    <div class="won-bucket">
      <div class="won-bucket-header">
        <span class="won-bucket-icon">📊</span>
        <span>Histórico Won</span>
        <span class="won-bucket-count">${historico.length}</span>
        <span class="won-bucket-total">Proyectos one-shot · Total: <strong>${fmtK(statsWon.historicoWon.montoTotal)}</strong></span>
      </div>
  `;

  if (historico.length === 0) {
    html += `<div class="won-empty-bucket">Sin proyectos one-shot cerrados</div>`;
  } else {
    html += `<table class="tbl" style="border-radius:0 0 8px 8px;"><thead><tr><th>Deal</th><th>Producto</th><th>Owner</th><th>Cierre</th><th class="num">Monto</th></tr></thead><tbody>`;
    historico.forEach(d => {
      const dealId = d.id || '';
      const hsUrl = dealId ? `https://app.hubspot.com/contacts/49671716/record/0-3/${dealId}` : '#';
      html += `<tr>
        <td><strong>${d.cliente || d.name}</strong><br><small style="color:var(--text-dim);">${d.name}</small></td>
        <td>${d.prod || '—'}</td>
        <td>${d.owner || '—'}</td>
        <td>${d.closedate || '—'}</td>
        <td class="num">${fmt(d.amount)}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `</div>`;

  $('#p-won').innerHTML = html;
}

      </div>

        <div class="kpi-value">${s.proximas}</div>
        <div class="kpi-sub">planear</div>
      </div>
    </div>
  `;

  // Persona filter
  html += `<div class="section">
    ${filtrosHTML('pendientes', allT, 'task')}
    <div class="filters">
      <span class="filter-label">Ordenar por:</span>
      <button class="chip ${sortMode === 'urgency' ? 'active' : ''}" data-f="pendientes" data-k="sort" data-v="urgency">🎯 Urgencia</button>
      <button class="chip ${sortMode === 'date_asc' ? 'active' : ''}" data-f="pendientes" data-k="sort" data-v="date_asc">📅 Fecha ↑</button>
      <button class="chip ${sortMode === 'date_desc' ? 'active' : ''}" data-f="pendientes" data-k="sort" data-v="date_desc">📅 Fecha ↓</button>
    </div>
    <div class="section-title">
      <span class="section-count">${filtered.length} tareas</span>
      <span style="margin-left:auto;color:var(--text-dim);font-size:12px;">Ordenadas por ${sortMode === 'date_asc' ? 'fecha ascendente' : sortMode === 'date_desc' ? 'fecha descendente' : 'urgencia'}</span>

const PERSONAS = catPersonaIds(); // centralizado en catálogo (CAT)
const EARLY_STAGES = ['Señal','Reply','Contactado','En Conv.'];
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MESES_CORTO = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

function taskToast(msg, ok) {
  let t = document.getElementById('task-toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'task-toast';
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:10001;padding:12px 18px;border-radius:10px;font-size:14px;font-weight:600;color:#fff;box-shadow:0 6px 24px rgba(0,0,0,.4);transition:opacity .3s;';
    document.body.appendChild(t);
  }
  t.style.background = ok ? '#16A34A' : '#DC2626';
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.opacity = '0'; }, 3400);
}

function parseSubject(title) {
  let base = (title || '').replace(/\s*\([^)]*\)\s*$/, '').trim();
  let prefix = base, accion = '';
  const idx = base.indexOf(' — ');
  if (idx >= 0) { prefix = base.slice(0, idx).trim(); accion = base.slice(idx + 3).trim(); }
  return { prefix, accion };
}

function buildSubject(ctx, prod, accion, responsable) {
  let empresaPart;
  if (ctx.prefix && ctx.prefix.indexOf('_') >= 0) empresaPart = ctx.prefix.slice(ctx.prefix.indexOf('_') + 1);
  else if (ctx.prefix) empresaPart = ctx.prefix;
  else empresaPart = (ctx.client || '').replace(/\s+/g, '');
  const newPrefix = prod ? (prod + '_' + empresaPart) : empresaPart;
  let s = newPrefix;
  if (accion) s += ' — ' + accion;
  if (responsable) s += ' (' + responsable + ')';
  return s;
}

function computeOwner(ctx) {
  if (ctx.internal) return '77808624';
  const stages = (ctx.stages || []).filter(Boolean);
  if (stages.some(s => EARLY_STAGES.includes(s))) return '82004391';
  return ctx.oid || '77808624';
}

function selOptions(list, current) {
  return list.map(v => '<option value="' + v + '"' + (v === current ? ' selected' : '') + '>' + v + '</option>').join('');
}

// ---------- Calendario propio ----------
let _calState = { y: 2026, m: 0 };
function fmtDisplay(iso) {
  if (!iso) return '';
  const p = iso.split('-').map(Number);
  return p[2] + ' ' + MESES_CORTO[p[1] - 1] + ' ' + p[0];
}
function renderCalendar() {
  const cal = document.getElementById('tm-cal');
  if (!cal) return;
  const y = _calState.y, m = _calState.m;
  const startDow = (new Date(y, m, 1).getDay() + 6) % 7; // lunes=0
  const days = new Date(y, m + 1, 0).getDate();
  const sel = document.getElementById('tm-date').value;
  const navBtn = 'background:none;border:1px solid var(--border,#2a2d35);border-radius:6px;color:var(--text,#e5e7eb);cursor:pointer;width:26px;height:26px;';
  let html = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">' +
    '<button type="button" data-cal="prev" style="' + navBtn + '">‹</button>' +
    '<span style="font-weight:600;font-size:13px;color:var(--text,#e5e7eb);">' + MESES[m] + ' ' + y + '</span>' +
    '<button type="button" data-cal="next" style="' + navBtn + '">›</button></div>' +
    '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;">';
  ['L','M','M','J','V','S','D'].forEach(d => html += '<div style="text-align:center;color:var(--text-dim,#9ca3af);font-size:10px;padding:2px;">' + d + '</div>');
  for (let i = 0; i < startDow; i++) html += '<div></div>';
  for (let d = 1; d <= days; d++) {
    const iso = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const isSel = iso === sel;
    html += '<button type="button" data-day="' + iso + '" style="padding:6px 0;border:0;border-radius:6px;cursor:pointer;font-size:12px;' +
      (isSel ? 'background:linear-gradient(135deg,var(--purple,#7c3aed),var(--pink,#db2777));color:#fff;font-weight:700;' : 'background:none;color:var(--text,#e5e7eb);') + '">' + d + '</button>';
  }
  html += '</div>';
  cal.innerHTML = html;
  cal.querySelector('[data-cal="prev"]').addEventListener('click', () => { _calState.m--; if (_calState.m < 0) { _calState.m = 11; _calState.y--; } renderCalendar(); });
  cal.querySelector('[data-cal="next"]').addEventListener('click', () => { _calState.m++; if (_calState.m > 11) { _calState.m = 0; _calState.y++; } renderCalendar(); });
  cal.querySelectorAll('[data-day]').forEach(b => b.addEventListener('click', () => {
    document.getElementById('tm-date').value = b.dataset.day;
    document.getElementById('tm-date-display').value = fmtDisplay(b.dataset.day);
    cal.style.display = 'none';
  }));
}
function openCalendar() {
  const iso = document.getElementById('tm-date').value;
  const d = iso ? new Date(iso + 'T00:00:00') : new Date();
  _calState = { y: d.getFullYear(), m: d.getMonth() };

  document.getElementById('tm-cal').style.display = 'block';
}
function setDateQuick(plusDays) {

// Abre el editor desde una alerta, directo en modo "nueva acción" (en blanco) sobre esa oportunidad
function openAlertAction(ds) {
  openTaskEditor({ tid: '', did: ds.did, oid: ds.oid || '', client: ds.client || '', title: ds.client || '', prod: ds.prod || '', stages: ds.stages || '', persona: ds.persona || '', date: '' });
  if (_taskCtx.did) {
    enterNewTaskMode();
    const h = document.getElementById('tm-heading');
    if (h) h.textContent = 'Generar siguiente acción';
  } else {
    taskToast('Esta alerta no tiene oportunidad asociada en HubSpot', false);
  }
}

async function doTaskAction(kind) {
  const prod = document.getElementById('tm-prod').value;
  const accion = document.getElementById('tm-accion').value.trim();
  const responsable = getResponsable();
  const date = document.getElementById('tm-date').value;
  let url, payload;

  if (kind === 'close') {
    url = TASK_CLOSE_URL;
    payload = { taskId: _taskCtx.tid };
  } else if (kind === 'reopen') {
    url = TASK_UPDATE_URL;
    payload = { taskId: _taskCtx.tid, reopen: true, status: 'NOT_STARTED' };
  } else {
    if (!responsable) { taskToast('Falta el responsable', false); return; }
    if (!accion) { taskToast('Falta describir qué hay que hacer', false); return; }
    const subject = buildSubject(_taskCtx, prod, accion, responsable);
    const ownerId = computeOwner(_taskCtx);
    if (kind === 'update') {
      url = TASK_UPDATE_URL;
      payload = { taskId: _taskCtx.tid, descripcion: subject, fechaCierre: date, ownerId };
    } else { // create (nueva tarea)
      if (!_taskCtx.did) { taskToast('Sin oportunidad asociada: no se puede crear', false); return; }
      url = TASK_NEXT_URL;
      payload = { dealId: _taskCtx.did, descripcion: subject, fechaCierre: date, ownerId };
    }
  }
  try {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    document.getElementById('task-modal').style.display = 'none';
    taskToast(kind === 'update' ? 'Tarea actualizada' : kind === 'close' ? 'Tarea cerrada' : 'Tarea nueva creada', true);
    setTimeout(loadData, 700);
  } catch (e) {
    taskToast('Error: ' + e.message, false);
  }
}

// Mapeo ownerId → persona (igual que en backend)
function ownerIdToPersona(ownerId) {
  if (ownerId === '82004391') return 'Martha';
  if (ownerId === '77808624') return 'Migue';
  return 'Otro';
}

function applyAlertasFilters(alertas) {
  let filtered = alertas.filter(a => pasaFiltro('alertas', a, 'alerta'));

  // Sort
  const sortMode = FILT.alertas.sort || 'monto_desc';
  filtered.sort((a, b) => {
    if (sortMode === 'monto_desc') return (b.amount || 0) - (a.amount || 0);
    if (sortMode === 'dias_desc') return (b.days || 0) - (a.days || 0);
    if (sortMode === 'urgencia') {
      // Cerrar > ReActivar > Higienizar
      const order = { Cerrar: 0, ReActivar: 1, Higienizar: 2 };
      const c = (order[a.categoria] || 9) - (order[b.categoria] || 9);
      if (c !== 0) return c;
      return (b.amount || 0) - (a.amount || 0);
    }
    return 0;
  });

  return filtered;
}

function buildChatContext() {
  if (!DATA) return {};
  
  const deals = DATA.deals || [];
  const tareas = (DATA.tareas && DATA.tareas.tareas) || [];
  const alertas16 = DATA.alertas16 || [];
  const stats = DATA.statsAlertas16 || {};
  
  const grDeals = deals.filter(d => !d.name.startsWith('PT_'));
  
  return {
    dealsActivos: grDeals.filter(d => !['closedwon', '1092009814'].includes(d.stage)).length,
    dealsTotal: grDeals.length,
    tareasVencidas: tareas.filter(t => {
      if (!t.dueDate) return false;
      return new Date(t.dueDate) < new Date() && t.status !== 'COMPLETED';
    }).length,
    alertasTotales: alertas16.length,
    alertasCerrar: (stats.porCategoria && stats.porCategoria.Cerrar) || 0,
    alertasReactivar: (stats.porCategoria && stats.porCategoria.ReActivar) || 0,
    alertasHigienizar: (stats.porCategoria && stats.porCategoria.Higienizar) || 0,
    revenueEnJuego: stats.revenueEnRiesgo ? `$${stats.revenueEnRiesgo.toLocaleString('en-US')}` : '—'
  };
}

function openClaudeChat(promptId) {
  const prompt = CHAT_PROMPTS.find(p => p.id === promptId);
  if (!prompt) return;
  
  const ctx = buildChatContext();
  const promptText = prompt.promptBuilder(ctx);
  
  const url = promptText 
    ? `https://claude.ai/new?q=${encodeURIComponent(promptText)}`
    : `https://claude.ai/new`;

function fmtPct(v) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  // If rate > 100%, it means opens are from leads enrolled before the period — show — instead of misleading 200%+
  if (Number(v) > 1.0) return '—';
  return (Number(v) * 100).toFixed(1) + '%';
}
function fmtNum(v) {
  if (v === null || v === undefined) return '—';

}
function freshness(iso) {
  if (!iso) return 'sin datos';
  const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  const hours = Math.floor((Date.now() - new Date(iso).getTime()) / 3600000);
  if (hours < 1) return 'hace minutos';
  if (hours < 24) return `hace ${hours}h`;
  if (days === 1) return 'hace 1 día';
  if (days < 7) return `hace ${days} días`;
  return `hace ${Math.floor(days / 7)} sem`;
}
function fmtDate(iso) {
  if (!iso) return '—';

}

/* ---- Dia natural America/Mexico_City ----------------------------------
   FIX 16jul2026 — CAUSA RAIZ: la columna y el filtro "HOY" no median el dia
   natural, median una ventana rodante de 24h:
       age = Math.floor((now - fecha)/86400000);  if (age <= 0) -> hoy
   Con eso, a cualquier hora del render "HOY" arrastraba parte del dia
   anterior (replies del 15-jul contados el 16-jul en el reporte diario).
   Ahora se compara la fecha calendario en America/Mexico_City: independiente
   de la hora del render y del huso horario del navegador.
   d7/d30/d90 se dejan rodantes A PROPOSITO: ahi "ultimos N dias" es la
   semantica correcta y no hay defecto medido. HOY sigue contenido en d7. */
var GR_TZ_FMT = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Mexico_City', year: 'numeric', month: '2-digit', day: '2-digit' });
function grDayKey(d) {
  var p = GR_TZ_FMT.formatToParts(d), o = {};
  for (var i = 0; i < p.length; i++) { o[p[i].type] = p[i].value; }
  return o.year + '-' + o.month + '-' + o.day;
}

   ('asked_to_circle_back_later') y el detalle por la NORMALIZADA ('circle_back'),
   asi que tocar el numero abria una lista vacia. Se unifica con el mismo mapeo. */
function normClasP(c){ return c==='asked_to_circle_back_later' ? 'circle_back' : (c||''); }

function renderProspeccion() {

  if(PEV){ PEV.forEach(function(e){ var u=String(e.producto||'').toUpperCase().replace(/\s+/g,''); if(u==='360'||u==='3V') e.producto='360'; else if(u==='GENIA') e.producto='GenIA'; else if(u==='AEO+SEO'||u==='AEO') e.producto='AEO'; }); }
  var cont = document.getElementById('p-prospeccion');
  if (!cont) return;
  if (!PEV || !PEV.length) {
    cont.innerHTML = '<div class="section"><div style="font-size:12px;color:var(--text-dim);">Aún no hay eventos.</div></div>';
    return;
  }
  var fmtLbl = function(s) { return String(s||'').split('_').map(function(w){return w.charAt(0).toUpperCase()+w.slice(1);}).join(' '); };
  var nowP = new Date();
  var HOY_KEY = grDayKey(nowP);
  var winOf = function(arr) {
    var w={hoy:0,d7:0,d30:0,d90:0,total:0};
    arr.forEach(function(e){ w.total++; var f=new Date(e.fecha); if(isNaN(f)) return; var age=Math.floor((nowP-f)/86400000); if(grDayKey(f)===HOY_KEY)w.hoy++; if(age<=7)w.d7++; if(age<=30)w.d30++; if(age<=90)w.d90++; });
    return w;
  };
  var matchFilt = prospPasa;
  var normClas = function(c) { return (c==='asked_to_circle_back_later') ? 'circle_back' : (c||''); };
  var PEV_n = PEV.map(function(e){ return Object.assign({},e,{clasificacion:normClas(e.clasificacion||'')}); }).filter(function(e){ return !isEventoPrueba(e); });
  var repliesArr = PEV_n.filter(function(e){ return e.tipo!=='open3' && matchFilt(e); });
  var senalesArr = PEV_n.filter(function(e){ return e.tipo==='open3' && matchFilt(e); });
  // DUO: campana con formato "Empresa, Persona – señal"
  var isDUO = function(e){ return e.campana && e.campana.indexOf(' – ')!==-1; };
  var duoArr = senalesArr.filter(function(e){ return isDUO(e); });
  var open3puro = senalesArr.filter(function(e){ return !isDUO(e); });
  var duoReplies = repliesArr.filter(function(e){ return isDUO(e); });
  var GR_PRODS=['TW','AM','AEO','360','GenIA','ITS','LT','BD','WB','HS'];
  var activeProd=GR_PRODS.filter(function(p){ return PEV.some(function(e){return (e.producto||'')===p;}); });
  var _cf=function(field,val,lbl,cur){ return '<button class="chip'+(cur===val?' active':'')+'" data-pf="'+field+'" data-pv="'+encodeURIComponent(val)+'" style="font-size:11px;padding:5px 11px;border-radius:18px;">'+lbl+'</button>'; };
  var _row=function(label,inner){ return '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px;"><span style="font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-right:2px;min-width:62px;">'+label+'</span>'+inner+'</div>'; };

  var prodShown = prospGrupo==='ALL'?activeProd:activeProd.filter(function(p){return grupoDeProd(p)===prospGrupo;});
  var canalesPres=Array.from(new Set(PEV_n.map(function(e){return e.canal;}).filter(Boolean)));
  var chips='';
  chips+=_row('Grupo', _cf('grupo','ALL','Todos',prospGrupo)+GRUPOS_PRES.map(function(g){return _cf('grupo',g,g,prospGrupo);}).join(''));
  chips+=_row('Producto', _cf('prod','ALL','Todos',prospProducto)+prodShown.map(function(p){return _cf('prod',p,p,prospProducto);}).join(''));
  if(canalesPres.length){ chips+=_row('Canal', _cf('canal','ALL','Todos',prospCanal)+canalesPres.map(function(c){return _cf('canal',c,c,prospCanal);}).join('')); }
  chips+=_row('Semáforo', _cf('sem','ALL','Todos',prospSem)+_cf('sem','rojo','🔴 Vencidas',prospSem)+_cf('sem','amarillo','🟡 Próximas',prospSem)+_cf('sem','verde','🟢 Al día',prospSem));
  var dot=function(c){ return '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+c+';margin-right:7px;vertical-align:middle;"></span>'; };
  var H1='<thead><tr><th style="width:38%;">CLASIFICACIÓN</th><th style="text-align:center;">HOY</th><th style="text-align:center;">7D</th><th style="text-align:center;">30D</th><th style="text-align:center;">90D</th><th style="text-align:center;">TOTAL</th></tr></thead>';
  var wc=function(n,win,clas,bold){ var s=bold?'font-weight:700;':''; return n>0?'<td class="pcell" data-ptype="clas" data-pval="'+encodeURIComponent(clas)+'" data-pwin="'+win+'" style="text-align:center;'+s+'cursor:pointer;">'+n+'</td>':'<td style="text-align:center;color:var(--text-mute);'+s+'">0</td>'; };
  var rowC=function(clas,col){ var sub=repliesArr.filter(function(e){return normClasP(e.clasificacion||'')===clas;}); if(!sub.length)return ''; var w=winOf(sub); return '<tr><td>'+dot(col)+fmtLbl(clas)+'</td>'+wc(w.hoy,'hoy',clas,0)+wc(w.d7,'d7',clas,0)+wc(w.d30,'d30',clas,0)+wc(w.d90,'d90',clas,0)+wc(w.total,'total',clas,1)+'</tr>'; };
  var secH=function(lbl,col,bg){ return '<tr style="background:'+bg+';"><td colspan="6" style="font-size:11px;font-weight:800;text-transform:uppercase;color:'+col+';padding:8px 12px;">'+dot(col)+lbl+'</td></tr>'; };
  var t1='<div style="overflow-x:auto;"><table class="tbl" style="table-layout:fixed;width:100%;">'+H1+'<tbody>';
  // Sección DUO en replies (contactos DUO que respondieron)
  if(duoReplies.length){ t1+=secH('DUO — SEÑAL CONDUCTUAL + REPLY','#7C3AED','rgba(124,58,237,.08)'); var wDR=winOf(duoReplies); t1+='<tr><td><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#7C3AED;margin-right:7px;vertical-align:middle;"></span>DUO Reply</td>'+wc(wDR.hoy,'hoy','__DUO_REPLY__',0)+wc(wDR.d7,'d7','__DUO_REPLY__',0)+wc(wDR.d30,'d30','__DUO_REPLY__',0)+wc(wDR.d90,'d90','__DUO_REPLY__',0)+wc(wDR.total,'total','__DUO_REPLY__',1)+'</tr>'; }
  t1+=secH('ALTA PRIORIDAD — ATENDER YA','#10B981','rgba(16,185,129,.08)');
  t1+=rowC('interested','#10B981')+rowC('meeting_booked','#10B981')+rowC('forwarded_to_the_right_person','#10B981')+rowC('introduction','#10B981');
  t1+=secH('MEDIA — PENDIENTE / RETOMAR','#F59E0B','rgba(245,158,11,.08)');
  t1+=rowC('circle_back','#F59E0B')+rowC('ooo','#F59E0B');
  t1+=secH('DESCARTADO — YA NO INTERESA','#EF4444','rgba(239,68,68,.07)');
  t1+=rowC('not_the_right_person','#EF4444')+rowC('not_interested','#EF4444')+rowC('hard_no','#EF4444');
  var known=new Set(['interested','meeting_booked','forwarded_to_the_right_person','introduction','circle_back','ooo','not_the_right_person','not_interested','hard_no']);
  var seen={}; repliesArr.forEach(function(e){ var c=e.clasificacion||''; if(c&&!known.has(c)&&!seen[c]){seen[c]=true;t1+=rowC(c,'#6B7280');} });
  if(!repliesArr.length) t1+='<tr><td colspan="6" style="font-size:12px;color:var(--text-mute);padding:12px;">Sin replies para este filtro.</td></tr>';
  var wT=winOf(repliesArr);
  t1+='<tr style="border-top:2px solid var(--border,#2A3142);"><td style="font-weight:700;">TOTAL replies</td>'+wc(wT.hoy,'hoy','__ALL_REPLIES__',1)+wc(wT.d7,'d7','__ALL_REPLIES__',1)+wc(wT.d30,'d30','__ALL_REPLIES__',1)+wc(wT.d90,'d90','__ALL_REPLIES__',1)+wc(wT.total,'total','__ALL_REPLIES__',1)+'</tr></tbody></table></div>';
  var H2='<thead><tr><th style="width:38%;">PRODUCTO</th><th style="text-align:center;">HOY</th><th style="text-align:center;">7D</th><th style="text-align:center;">30D</th><th style="text-align:center;">90D</th><th style="text-align:center;">TOTAL</th></tr></thead>';
  var wcp=function(n,win,prod,bold){ var s=bold?'font-weight:700;':''; return n>0?'<td class="pcell" data-ptype="prod" data-pval="'+encodeURIComponent(prod)+'" data-pwin="'+win+'" style="text-align:center;'+s+'cursor:pointer;">'+n+'</td>':'<td style="text-align:center;color:var(--text-mute);'+s+'">0</td>'; };
  var t2='<div style="overflow-x:auto;"><table class="tbl" style="table-layout:fixed;width:100%;">'+H2+'<tbody>';
  // Separar DUO (campana con formato "Empresa, Persona – señal") de Open+3 puro
  var ps={}; open3puro.forEach(function(e){ var p=e.producto||'(sin producto)'; ps[p]=(ps[p]||0)+1; });
  var wS=winOf(senalesArr);
  // DUO siempre PRIMERO (igual que STIL)
  if(duoArr.length){ var wD=winOf(duoArr); t2+='<tr style="border-top:1px solid #2A3142;"><td style="font-weight:600;color:#7C3AED;">DUO (señales conductuales)</td>'+wcp(wD.hoy,'hoy','__DUO__',0)+wcp(wD.d7,'d7','__DUO__',0)+wcp(wD.d30,'d30','__DUO__',0)+wcp(wD.d90,'d90','__DUO__',0)+wcp(wD.total,'total','__DUO__',1)+'</tr>'; }
  Object.keys(ps).sort().forEach(function(p){ var sub=senalesArr.filter(function(e){return (e.producto||'(sin producto)')===p;}); var w=winOf(sub); t2+='<tr><td style="font-weight:600;">'+p+'</td>'+wcp(w.hoy,'hoy',p,0)+wcp(w.d7,'d7',p,0)+wcp(w.d30,'d30',p,0)+wcp(w.d90,'d90',p,0)+wcp(w.total,'total',p,1)+'</tr>'; });
  if(!senalesArr.length) t2+='<tr><td colspan="6" style="font-size:12px;color:var(--text-mute);padding:12px;">Sin señales para este filtro.</td></tr>';
  t2+='<tr style="border-top:2px solid var(--border,#2A3142);"><td style="font-weight:700;">TOTAL señales</td>'+wcp(wS.hoy,'hoy','__ALL_SENALES__',1)+wcp(wS.d7,'d7','__ALL_SENALES__',1)+wcp(wS.d30,'d30','__ALL_SENALES__',1)+wcp(wS.d90,'d90','__ALL_SENALES__',1)+wcp(wS.total,'total','__ALL_SENALES__',1)+'</tr></tbody></table></div>';
  // ETAPAS y sc eliminados (tabla dh quitada)
  // Tabla Oportunidades eliminada
  cont.innerHTML='<div class="section"><div class="section-title">Inventario de prospección</div><div style="font-size:12px;color:var(--text-dim);margin-bottom:14px;">Fuente: tabla de eventos (los 3 tenants), no HubSpot. Los 30d incluyen 7d y hoy.</div>'+chips+'<div style="font-size:12px;font-weight:700;color:var(--cyan,#06B6D4);margin:16px 0 6px;">Replies por prioridad</div><div style="font-size:11px;color:var(--text-dim);margin-bottom:10px;">Verde = atender ya · Amarillo = pendiente/retomar · Rojo = descartado. Toca un número para ver el detalle.</div>'+t1+'<div style="font-size:12px;font-weight:700;color:var(--yellow,#F59E0B);margin:18px 0 6px;">Open+3 (señales) por producto</div>'+t2+'<div id="pipeline-metrics-gr" style="margin:16px 0 4px;"></div><div style="border:none;border-top:1px solid #252d50;margin:14px 0"></div><div id="prosp-detalle" style="margin-top:16px;"></div></div>';
  cont.querySelectorAll('[data-pf]').forEach(function(btn){ btn.addEventListener('click',function(){ var f=btn.dataset.pf, v=decodeURIComponent(btn.dataset.pv); if(f==='grupo'){prospGrupo=v; prospProducto='ALL';} else if(f==='prod')prospProducto=v; else if(f==='canal')prospCanal=v; else if(f==='sem')prospSem=v; renderProspeccion(); }); });

function renderAmplemarketDrilldown() {
  const container = document.getElementById('am-drilldown');
  if (!container) return;
  
  if (!amDrilldown) {
    container.innerHTML = '';
    container.style.display = 'none';
    return;
  }
  
  container.style.display = 'block';
  
  if (amDrilldown === 'meetings') container.innerHTML = renderMeetingsDrilldown();
  else if (amDrilldown === 'replies') container.innerHTML = renderRepliesDrilldown();
  else if (amDrilldown === 'openplus3') container.innerHTML = renderOpenPlus3Drilldown();
  else if (amDrilldown === 'duogenerated') container.innerHTML = renderDuoGeneratedDrilldown();
  
  // Update KPI active states
  document.querySelectorAll('[data-am-kpi]').forEach(el => {
    const isActive = el.dataset.amKpi === amDrilldown;
    el.style.boxShadow = isActive ? '0 0 0 2px var(--purple)' : '';
  });
}

function drilldownHeader(title, color) {
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)">
      <div style="font-size:16px;font-weight:700;color:${color || 'var(--text)'}">${title}</div>
      <button onclick="toggleAmDrilldown(null)" style="background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:4px 10px;border-radius:6px;font-size:12px;cursor:pointer" onmouseover="this.style.color='var(--text)';this.style.background='var(--bg-3)'" onmouseout="this.style.color='var(--text-dim)';this.style.background='transparent'">Cerrar ✕</button>
    </div>
  `;
}

function renderMeetingsDrilldown() {
  const am = AM_DATA;
  const meetings = am.meetingsDetail || [];
  if (meetings.length === 0) {
    return `<div class="section">${drilldownHeader('🎯 Reuniones agendadas', 'var(--mint)')}<div style="padding:20px;color:var(--text-dim);text-align:center">No hay detalle disponible.</div></div>`;
  }
  
  const byProducto = {};
  meetings.forEach(m => {
    const key = m.producto;
    if (!byProducto[key]) byProducto[key] = { SEQ: 0, DUO: 0 };
    byProducto[key][m.canal]++;
  });
  
  let summary = '<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">';
  Object.keys(byProducto).sort().forEach(prod => {
    const v = byProducto[prod];
    summary += `<span style="background:var(--bg-3);border:1px solid var(--border);padding:6px 12px;border-radius:6px;font-size:12px;color:var(--text)"><strong>${prod}</strong>: ${v.SEQ + v.DUO} <span style="color:var(--text-dim)">(${v.SEQ} SEQ · ${v.DUO} DUO)</span></span>`;
  });
  summary += '</div>';
  
  let html = `<div class="section" style="border-left:3px solid var(--mint)">${drilldownHeader(`🎯 Reuniones agendadas — ${meetings.length} en últimos 30 días`, 'var(--mint)')}` + summary;
  html += `<div style="overflow-x:auto"><table class="tbl">
    <thead>
      <tr><th>Fecha</th><th>Empresa</th><th>Contacto</th><th>Cargo</th><th>Producto</th><th>Canal</th><th>Secuencia</th></tr>
    </thead>
    <tbody>`;
  meetings.forEach(m => {
    const canalColor = m.canal === 'SEQ' ? 'var(--mint)' : 'var(--purple)';
    html += `<tr>
      <td style="color:var(--text-dim);font-size:12px;white-space:nowrap">${fmtDate(m.date)}</td>
      <td style="font-weight:600;color:var(--text)">${m.company}</td>
      <td style="color:var(--text)">${m.name}</td>
      <td style="color:var(--text-dim);font-size:12px">${m.title}</td>
      <td style="color:var(--text);font-weight:700">${m.producto}</td>
      <td style="color:${canalColor};font-weight:600">${m.canal === 'SEQ' ? '📋 SEQ' : '🔮 DUO'}</td>
      <td style="color:var(--text-dim);font-size:11px">${(m.sequence || '').trim()}</td>
    </tr>`;
  });
  html += '</tbody></table></div></div>';
  return html;
}

function renderRepliesDrilldown() {
  const am = AM_DATA;
  const replies = am.repliesDetail || [];
  if (replies.length === 0) {
    return `<div class="section">${drilldownHeader('💬 Respuestas', 'var(--cyan)')}<div style="padding:20px;color:var(--text-dim);text-align:center">No hay detalle disponible.</div></div>`;
  }
  
  const byTag = {};
  replies.forEach(r => {
    const tag = r.tag || 'unknown';
    byTag[tag] = (byTag[tag] || 0) + 1;
  });
  
  let summary = '<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">';
  Object.entries(byTag).sort((a,b) => b[1]-a[1]).forEach(([tag, cnt]) => {
    const st = REPLY_TAG_STYLES[tag] || REPLY_TAG_STYLES.unknown;
    summary += `<span style="background:var(--bg-3);border:1px solid var(--border);padding:6px 12px;border-radius:6px;font-size:12px;color:${st.color}"><strong>${cnt}</strong> ${st.label}</span>`;
  });
  summary += '</div>';
  
  const completeness = replies.length >= am.kpis.replies 
    ? `<div style="background:var(--bg-3);border:1px solid var(--border);border-left:3px solid var(--mint);padding:8px 12px;margin-bottom:12px;border-radius:6px;font-size:12px;color:var(--text-dim)">✅ Mostrando los <strong style="color:var(--text)">${replies.length}</strong> replies completos del último mes.</div>`
    : `<div style="background:var(--bg-3);border:1px solid var(--border);border-left:3px solid var(--yellow);padding:8px 12px;margin-bottom:12px;border-radius:6px;font-size:12px;color:var(--text-dim)">⚠️ Mostrando <strong style="color:var(--text)">${replies.length}</strong> de <strong style="color:var(--text)">${am.kpis.replies}</strong> replies. Pide actualizar Amplemarket para traer todos.</div>`;
  
  let html = `<div class="section" style="border-left:3px solid var(--cyan)">${drilldownHeader(`💬 Replies — ${replies.length} de ${am.kpis.replies}`, 'var(--cyan)')}` + summary + completeness;
  html += `<div style="overflow-x:auto"><table class="tbl">
    <thead>
      <tr><th>Fecha</th><th>Empresa</th><th>Contacto</th><th>Cargo</th><th>Producto</th><th>Canal</th><th>Clasificación</th></tr>
    </thead>
    <tbody>`;
  replies.forEach(r => {
    const st = REPLY_TAG_STYLES[r.tag] || REPLY_TAG_STYLES.unknown;
    const canalColor = r.canal === 'SEQ' ? 'var(--mint)' : 'var(--purple)';
    html += `<tr>
      <td style="color:var(--text-dim);font-size:12px;white-space:nowrap">${fmtDate(r.date)}</td>
      <td style="font-weight:600;color:var(--text)">${r.company || '—'}</td>
      <td style="color:var(--text)">${r.name || '—'}</td>
      <td style="color:var(--text-dim);font-size:12px">${r.title || '—'}</td>
      <td style="color:var(--text);font-weight:700">${r.producto}</td>
      <td style="color:${canalColor};font-weight:600;font-size:12px">${r.canal === 'SEQ' ? '📋' : '🔮'} ${r.canal}</td>
      <td style="color:${st.color};font-weight:600;font-size:12px">${st.label}</td>
    </tr>`;
  });
  html += '</tbody></table></div></div>';
  return html;
}

function pPct(x) { return ((x || 0) * 100).toFixed(1) + '%'; }
function pNum(n) { return (n || 0).toLocaleString('es-MX'); }
function pMoney(n) { return '$' + Math.round(n || 0).toLocaleString('es-MX'); }

function funnelRow(steps) {
  let h = '<div style="display:flex;gap:8px;align-items:stretch;overflow-x:auto;">';
  steps.forEach((s, i) => {
    if (i > 0) h += '<div style="display:flex;align-items:center;color:var(--text-mute);font-size:16px;padding:0 2px;">→</div>';
    h += '<div style="flex:1;min-width:110px;background:var(--bg-3,#1a1d24);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;">' +

function renderAmplemarketDrilldown() {
  const container = document.getElementById('am-drilldown');
  if (!container) return;
  
  if (!amDrilldown) {
    container.innerHTML = '';
    container.style.display = 'none';
    return;
  }
  
  container.style.display = 'block';
  
  if (amDrilldown === 'meetings') container.innerHTML = renderMeetingsDrilldown();
  else if (amDrilldown === 'replies') container.innerHTML = renderRepliesDrilldown();
  else if (amDrilldown === 'openplus3') container.innerHTML = renderOpenPlus3Drilldown();
  else if (amDrilldown === 'duogenerated') container.innerHTML = renderDuoGeneratedDrilldown();
  
  // Update KPI active states
  document.querySelectorAll('[data-am-kpi]').forEach(el => {
    const isActive = el.dataset.amKpi === amDrilldown;
    el.style.boxShadow = isActive ? '0 0 0 2px var(--purple)' : '';
  });
}

  return `

function renderMeetingsDrilldown() {
  const am = AM_DATA;
  const meetings = am.meetingsDetail || [];
  if (meetings.length === 0) {
    return `<div class="section">${drilldownHeader('🎯 Reuniones agendadas', 'var(--mint)')}<div style="padding:20px;color:var(--text-dim);text-align:center">No hay detalle disponible.</div></div>`;
  }
  
  const byProducto = {};
  meetings.forEach(m => {
    const key = m.producto;
    if (!byProducto[key]) byProducto[key] = { SEQ: 0, DUO: 0 };
    byProducto[key][m.canal]++;
  });
  
  let summary = '<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">';
  Object.keys(byProducto).sort().forEach(prod => {
    const v = byProducto[prod];
    summary += `<span style="background:var(--bg-3);border:1px solid var(--border);padding:6px 12px;border-radius:6px;font-size:12px;color:var(--text)"><strong>${prod}</strong>: ${v.SEQ + v.DUO} <span style="color:var(--text-dim)">(${v.SEQ} SEQ · ${v.DUO} DUO)</span></span>`;
  });
  summary += '</div>';
  
  let html = `<div class="section" style="border-left:3px solid var(--mint)">${drilldownHeader(`🎯 Reuniones agendadas — ${meetings.length} en últimos 30 días`, 'var(--mint)')}` + summary;

    <thead>
      <tr><th>Fecha</th><th>Empresa</th><th>Contacto</th><th>Cargo</th><th>Producto</th><th>Canal</th><th>Secuencia</th></tr>
    </thead>
    <tbody>`;
  meetings.forEach(m => {
    const canalColor = m.canal === 'SEQ' ? 'var(--mint)' : 'var(--purple)';
    html += `<tr>
      <td style="color:var(--text-dim);font-size:12px;white-space:nowrap">${fmtDate(m.date)}</td>
      <td style="font-weight:600;color:var(--text)">${m.company}</td>
      <td style="color:var(--text)">${m.name}</td>
      <td style="color:var(--text-dim);font-size:12px">${m.title}</td>

  html += '</tbody></table></div></div>';
  return html;

var GR_ETAPAS_ORDER_PM=['Senal Detectada','Reply Recibido','Contactado','En Conversacion','Atraccion','Educacion','Propuesta Enviada','Aprobacion Verbal','Contract Sent','Ganada','Perdida','Renovacion'];
var GR_ETAPA_COLORES={'Senal Detectada':'#DB0540','Reply Recibido':'#DB0540','Contactado':'#DB0540','En Conversacion':'#FFCD00','Atraccion':'#62D175','Educacion':'#62D175','Propuesta Enviada':'#62D175','Aprobacion Verbal':'#62D175','Contract Sent':'#02ADBA','Ganada':'#02ADBA','Perdida':'#6B7280','Renovacion':'#7D2AE4','Otra etapa':'#6B7280'};
var GR_ETAPA_LABEL={'Senal Detectada':'Señal Detectada','Reply Recibido':'Reply Recibido','Contactado':'Contactado','En Conversacion':'En Conversación','Atraccion':'Atracción','Educacion':'Educación','Propuesta Enviada':'Propuesta Env.','Aprobacion Verbal':'Aprob. Verbal','Contract Sent':'Contract Sent','Ganada':'Ganada','Perdida':'Perdida','Renovacion':'Renovación','Otra etapa':'Otra etapa'};

function renderPipelineMetricsGR(pool){
  var box=document.getElementById('pipeline-metrics-gr'); if(!box) return;
  var dbs={}; var sinEtapa=0;
  if(pool){
    pool.forEach(function(e){
      var et=e.etapa||''; if(!et){sinEtapa++;return;}
      if(!dbs[et]) dbs[et]=[];
      dbs[et].push({deal_id:e.deal_id,dealname:e.empresa});
    });
  } else {
    var PEV=(PROSPECCION_DATA&&Array.isArray(PROSPECCION_DATA.eventos))?PROSPECCION_DATA.eventos:[];
    var matchFiltM=prospPasa;
    PEV.filter(matchFiltM).forEach(function(e){
      var et=e.etapa||''; if(!et){sinEtapa++;return;}
      if(!dbs[et]) dbs[et]=[];
      dbs[et].push({deal_id:e.deal_id,dealname:e.empresa});
    });
    if(!Object.keys(dbs).length && !sinEtapa){
      dbs=(PROSPECCION_DATA&&PROSPECCION_DATA.dealsByStage)||{};
    }
  }
  var allKeys=Object.keys(dbs);
  var ordered=[].concat(GR_ETAPAS_ORDER_PM.filter(function(k){return allKeys.indexOf(k)!==-1;}),allKeys.filter(function(k){return GR_ETAPAS_ORDER_PM.indexOf(k)===-1;}));
  var mainEtapas=ordered.filter(function(k){return !/Perdida/i.test(k);});
  var perdidaEtapas=ordered.filter(function(k){return /Perdida/i.test(k);});
  var totalActivos=mainEtapas.reduce(function(s,k){return s+(dbs[k]||[]).length;},0);
  var totalPerdida=perdidaEtapas.reduce(function(s,k){return s+(dbs[k]||[]).length;},0);
  var totalGeneral=totalActivos+totalPerdida+sinEtapa;
  if(!totalGeneral){box.innerHTML='';return;}
  var rotulo = pool
    ? 'En esta vista &middot; <span style="color:#F3F4F6">'+totalGeneral+'</span> contactos &middot; <span style="color:#62D175">'+totalActivos+'</span> activos'
    : 'Pipeline GR &middot; <span style="color:#F3F4F6">'+totalGeneral+'</span> deals &middot; <span style="color:#62D175">'+totalActivos+'</span> activos';
  var h='<div style="margin-bottom:10px;font-size:11px;font-weight:700;color:#6B7280;text-transform:uppercase;letter-spacing:.06em">'+rotulo+'</div>';
  h+='<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;">';
  mainEtapas.forEach(function(k){
    var deals=dbs[k]||[]; if(!deals.length) return;
    var col=GR_ETAPA_COLORES[k]||'#6B7280';
    var lbl=GR_ETAPA_LABEL[k]||k;
    var pct=totalActivos>0?Math.round(deals.length/totalActivos*100):0;
    h+='<div style="display:flex;flex-direction:column;align-items:center;gap:2px;background:'+col+'18;border:1px solid '+col+'44;border-radius:14px;padding:10px 16px;min-width:80px;">'+
      '<div style="font-size:22px;font-weight:800;color:'+col+';line-height:1;">'+deals.length+'</div>'+
      '<div style="font-size:10px;font-weight:700;color:#F3F4F6;text-align:center;line-height:1.3;">'+lbl+'</div>'+
      '<div style="font-size:13px;font-weight:700;color:'+col+'cc;margin-top:2px;">'+pct+'%</div>'+
      '</div>';
  });
  if(totalPerdida>0||sinEtapa>0){
    h+='<div style="align-self:stretch;width:1px;background:#2A3142;margin:0 4px;"></div>';
    perdidaEtapas.forEach(function(k){
      var deals=dbs[k]||[]; if(!deals.length) return;
      h+='<div style="display:flex;flex-direction:column;align-items:center;gap:2px;background:#6B728018;border:1px solid #6B728044;border-radius:14px;padding:10px 16px;min-width:80px;">'+
        '<div style="font-size:22px;font-weight:800;color:#6B7280;line-height:1;">'+deals.length+'</div>'+
        '<div style="font-size:10px;font-weight:700;color:#9CA3AF;text-align:center;line-height:1.3;">Perdida</div>'+
        '</div>';
    });
    if(sinEtapa>0){
      h+='<div style="display:flex;flex-direction:column;align-items:center;gap:2px;background:#6B728012;border:1px dashed #6B728055;border-radius:14px;padding:10px 16px;min-width:80px;">'+
        '<div style="font-size:22px;font-weight:800;color:#9CA3AF;line-height:1;">'+sinEtapa+'</div>'+
        '<div style="font-size:10px;font-weight:700;color:#9CA3AF;text-align:center;line-height:1.3;">Sin etapa</div>'+
        '</div>';
    }
  }
  h+='</div>';
  box.innerHTML=h;
}
