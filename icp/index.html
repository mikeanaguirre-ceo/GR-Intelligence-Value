<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ICP por producto</title>
<style>
:root { --purple:#7C3AED; --pink:#EC4899; --mint:#10B981; --yellow:#F59E0B; --red:#EF4444; --bg:#0B0F19; --bg-2:#141827; --bg-3:#1E2433; --border:#2A3142; --text:#F3F4F6; --dim:#9CA3AF; --mute:#6B7280; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); font-size:14px; line-height:1.5; }
#app { max-width:1200px; margin:0 auto; padding:16px; }
.hdr { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding:14px 18px; background:linear-gradient(135deg,var(--purple),var(--pink)); border-radius:12px; margin-bottom:14px; }
.hdr h1 { font-size:18px; font-weight:800; } .hdr p { font-size:12px; opacity:.9; }
.btn { background:rgba(0,0,0,.28); border:none; color:#fff; padding:8px 14px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:700; }
.btn:disabled { opacity:.5; cursor:wait; }
.fila { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:6px 0; }
.fila > span { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); min-width:78px; }
.chip { background:var(--bg-2); border:1px solid var(--border); color:var(--dim); padding:6px 12px; border-radius:18px; cursor:pointer; font-size:13px; font-weight:600; }
.chip.on { background:var(--bg-3); color:var(--text); border-color:var(--purple); }
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin:14px 0; }
.kpi { background:var(--bg-2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
.kpi b { display:block; font-size:24px; line-height:1.15; } .kpi span { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; font-weight:700; } .kpi em { display:block; font-style:normal; font-size:12px; color:var(--mute); }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr)); gap:12px; }
.docs { margin-top:14px; }
.docl { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:8px; margin-top:8px; }
.docl div { display:flex; flex-direction:column; gap:2px; font-size:13px; }
.docl span { font-size:11px; text-transform:uppercase; letter-spacing:.04em; opacity:.7; }
.docl a { color:var(--mint); text-decoration:none; word-break:break-word; }
.docl em { opacity:.6; font-style:normal; }
.prio { font-size:11px; font-weight:800; padding:2px 7px; border-radius:9px; white-space:nowrap; }
.prio.alta { background:rgba(16,185,129,.18); color:#34D399; } .prio.media { background:rgba(245,158,11,.16); color:#FBBF24; } .prio.baja { background:rgba(239,68,68,.16); color:#F87171; } .prio.poca { background:var(--bg-3); color:var(--mute); }
details.todas { margin-top:10px; } details.todas summary { cursor:pointer; font-size:12.5px; color:var(--mint); font-weight:700; }
details.todas table td:first-child { max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.resumen-prio div { margin:4px 0; font-size:13px; } .resumen-prio b { color:var(--dim); font-weight:700; }
.card { background:var(--bg-2); border:1px solid var(--border); border-radius:12px; padding:14px; }
.card h3 { font-size:14px; margin-bottom:4px; } .card p.n { font-size:12px; color:var(--mute); margin-bottom:10px; }
.bar { display:grid; grid-template-columns:minmax(90px,38%) 1fr auto; gap:8px; align-items:center; margin:5px 0; font-size:12.5px; }
.bar .et { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); }
.bar .et.sd { color:var(--mute); font-style:italic; }
.bar .tr { height:14px; background:var(--bg-3); border-radius:7px; overflow:hidden; display:flex; }
.bar .g { background:var(--mint); } .bar .p { background:#4B5563; } .bar .neg { background:var(--red); } .bar .pos { background:var(--mint); } .bar .neu { background:#4B5563; }
.bar .vl { color:var(--dim); white-space:nowrap; font-variant-numeric:tabular-nums; min-width:92px; text-align:right; }
.poco { color:var(--yellow); font-size:11px; }
.ley { display:flex; gap:12px; font-size:11.5px; color:var(--dim); margin:4px 0 8px; flex-wrap:wrap; } .ley i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
table { width:100%; border-collapse:collapse; font-size:13px; } th, td { padding:7px 6px; border-bottom:1px solid var(--border); text-align:right; } th:first-child, td:first-child { text-align:left; } th { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
.aviso { background:var(--bg-2); border:1px dashed var(--border); border-radius:10px; padding:12px; color:var(--dim); margin:10px 0; font-size:13px; }
.msg { font-size:12.5px; color:#fff; opacity:.9; }
@media (max-width:520px) { .bar { grid-template-columns:42% 1fr; } .bar .vl { grid-column:1 / -1; text-align:left; min-width:0; } }
.ay { display:inline-block; width:15px; height:15px; line-height:15px; text-align:center; border-radius:50%; background:var(--bg-3); color:var(--dim); font-size:10px; font-weight:800; cursor:help; margin-left:5px; vertical-align:1px; position:relative; }
.ay:hover::after, .ay:focus::after { content:attr(data-t); position:absolute; left:50%; top:20px; transform:translateX(-50%); width:260px; background:#000; color:#fff; font-size:12px; font-weight:400; line-height:1.4; text-transform:none; letter-spacing:0; text-align:left; padding:8px 10px; border-radius:8px; z-index:20; white-space:normal; box-shadow:0 4px 14px rgba(0,0,0,.5); }
.dona { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
.dona svg { flex:0 0 150px; }
.dona .lg { flex:1 1 180px; font-size:12.5px; }
.dona .lg div { display:grid; grid-template-columns:12px 1fr auto; gap:6px; align-items:center; margin:3px 0; }
.dona .lg i { width:10px; height:10px; border-radius:2px; display:inline-block; }
.dona .lg em { color:var(--dim); font-style:normal; white-space:nowrap; font-variant-numeric:tabular-nums; }
.kpi em .up { color:var(--mint); font-weight:700; } .kpi em .dn { color:var(--red); font-weight:700; }
.rdh { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:4px; }
.seg { display:inline-flex; flex-wrap:wrap; gap:2px; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:3px; }
.seg button { border:0; background:transparent; color:var(--dim); padding:6px 11px; border-radius:8px; cursor:pointer; font:inherit; font-size:12.5px; font-weight:600; }
.seg button[aria-pressed="true"] { background:var(--bg-3); color:var(--text); box-shadow:inset 0 0 0 1px var(--purple); }
.rdchart { width:100%; height:auto; display:block; margin-top:6px; } .rdchart text { fill:#9CA3AF; font-size:12px; } .rdchart text.val { fill:var(--text); font-weight:700; }
.rank { display:grid; gap:4px; margin-top:6px; }
.rrow { display:grid; grid-template-columns:minmax(0,190px) minmax(0,1fr) auto; gap:10px; align-items:center; padding:7px 6px; border-radius:8px; cursor:pointer; border:0; background:transparent; color:inherit; font:inherit; text-align:left; width:100%; }
.rrow:hover { background:var(--bg-3); } .rrow .nm { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rrow .tr { height:12px; background:var(--bg-3); border-radius:6px; overflow:hidden; } .rrow .tr b { display:block; height:100%; background:linear-gradient(90deg,var(--purple),var(--pink)); border-radius:6px; }
.rrow .meta { display:flex; gap:8px; align-items:center; justify-content:flex-end; } .rrow .num { font-weight:700; min-width:44px; text-align:right; font-variant-numeric:tabular-nums; }
@media (max-width:560px) { .rrow { grid-template-columns:minmax(0,1fr) auto; } .rrow .tr { grid-column:1 / -1; order:3; } }
.pill { font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap; }
.p-esc { background:rgba(16,185,129,.16); color:#34D399; } .p-man { background:rgba(139,92,246,.18); color:#C4B5FD; } .p-rev { background:rgba(239,68,68,.15); color:#F87171; } .p-vig { background:rgba(245,158,11,.16); color:#FBBF24; } .p-poc { background:var(--bg-3); color:var(--mute); }
.rec { display:grid; gap:8px; list-style:none; margin-top:8px; } .rec li { display:grid; gap:2px; padding:10px 12px; background:var(--bg-3); border-radius:10px; font-size:13px; }
.rec b { font-size:11.5px; color:var(--pink); text-transform:uppercase; letter-spacing:.04em; }
.cols2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr)); gap:12px; }
.tblx { overflow-x:auto; } table.tb td:first-child { max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } table.tb td, table.tb th { white-space:nowrap; }
details.msj { border-top:1px solid var(--border); padding:8px 0; } details.msj summary { cursor:pointer; display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; font-size:13px; }
details.msj summary em { font-style:normal; color:var(--dim); font-size:12px; } details.msj .txt { white-space:pre-wrap; font-size:13px; color:var(--text); background:var(--bg-3); border-radius:8px; padding:10px 12px; margin-top:8px; max-height:340px; overflow:auto; }
.mdx { font-size:13px; margin-top:8px; } .mdx p { margin:6px 0; } .mdx ul { margin:4px 0 8px 18px; } .mdx li { margin:3px 0; }
</style>
</head>
<body>
<div id="app">
  <header class="hdr">
    <div><h1>ICP por producto</h1><p id="foto">Cargando la foto del ICP…</p></div>
    <div><button class="btn" id="act">↻ Actualizar ICP</button> <span class="msg" id="msg"></span></div>
  </header>
  <div class="fila" id="f-prod"><span>Producto</span></div>
  <div class="fila" id="f-vista"><span>Vista</span></div>
  <div class="fila" id="f-per"><span>Periodicidad</span></div>
  <div class="fila" id="f-anio"><span>Año</span></div>
  <div class="fila" id="f-medida"><span>Medida</span></div>
  <div class="fila" id="f-pesos"><span>Pesos</span></div>
  <section id="docs" class="docs"></section>
  <section id="kpis" class="kpis"></section>
  <section id="graf" class="grid"></section>
  <section id="cal" style="margin-top:14px"></section>
</div>
<script>
// Pagina ICP de Great Revenue (vB, 16-nov-2026). Lee la foto guardada (GR — ICP Tablero API, GET gr-icp). Nada se refresca solo:
// solo el boton "Actualizar ICP" recalcula (POST gr-icp-actualizar, candado de 3 minutos en el servidor).
// Productos: solo los oficiales (grupo GR de catalogos.json) y "Otros" (Mike, 16-nov). Vista principal: prospectos.
(function () {
  var BASE = 'https://mikea.app.n8n.cloud/webhook/';
  var D = null, CAT = [], st = { prod: 'TODOS', anio: 'todos', vista: 'se', medida: 'clientes', medidaS: 'personas', pesos: 'cal', per: 'q', desde: '', hasta: '', met: 'm' };
  var NOMBRES = { TODOS: 'Todos', Otros: 'Otros', DUO: 'Señales Dúo' };
  var VISTAS = [['se', 'Prospectos (reacciones)'], ['re', 'Llegaron a reunión'], ['op', 'Oportunidades cerradas'], ['rd', 'Rendimiento y pruebas']];
  var DIM_OP = { sector: 'Industria', tamano: 'Tamaño de la empresa', nivel: 'Nivel del contacto', area: 'Área', pais: 'País', motivo: 'Motivo de pérdida' };
  var DIM_RE = { sector: 'Industria', tamano: 'Tamaño de la empresa', nivel: 'Nivel del contacto', area: 'Área', pais: 'País' };
  var DIM_SE = { industria: 'Industria', tamano: 'Tamaño de la empresa', nivel: 'Nivel del contacto', area: 'Área', pais: 'País', secuencia: 'Secuencia o señal' };
  var DONA = { tamano: 1, nivel: 1, area: 1, pais: 1 };
  var COLORES = ['#7C3AED', '#EC4899', '#10B981', '#F59E0B', '#3B82F6', '#4B5563', '#2A3142'];
  var AYUDA = {
    vista_se: 'Cada persona que reaccionó a una secuencia o a una señal de Duo, contada una vez por producto y año con su reacción más alta. Es la vista con más casos: sirve para decidir a quién apuntar.',
    vista_re: 'Oportunidades (abiertas y cerradas) que llegaron a la reunión: pasaron por Educación o más adelante, o se ganaron. Es el paso intermedio entre la reacción y la venta, con más casos que las ganadas.',
    vista_rd: 'Cómo va cada producto en el tiempo, qué escalar o revisar, qué secuencias y señales generan y qué mensajes funcionaron. Contactados, respuestas, interesados y reuniones salen de la analítica de Amplemarket (se actualiza cada lunes); oportunidades, reuniones y ganadas salen del CRM.',
    k_reu_am: 'Reuniones agendadas registradas en Amplemarket.',
    escalar: 'Reuniones por cada 1,000 contactados del producto entre el mismo dato de toda la cuenta. Escalar: 1.2 veces o más el promedio. Mantener: de 0.8 a 1.2. Revisar: menos de 0.8. Pocos datos: menos de 400 contactados, no se toma como conclusión. Señales Dúo son las secuencias que creó Dúo sin prefijo de producto; Otros es el resto de la cuenta.',
    reglab: 'Genera: dio al menos una reunión u oportunidad en el periodo. Si no dio nada: Apagar con 800 contactados o más, Vigilar de 400 a 799, Pocos datos con menos de 400. Es una sugerencia para decidir, no se apaga nada solo.',
    exitos: 'Cada secuencia o señal que dio interés, recomendación, cita, reunión u oportunidad en los últimos 12 meses, con el mensaje que se envió. Se guarda en las fichas de éxito del motor y alimenta la base de conocimiento; aquí solo se muestran el mensaje de GR y los totales, sin datos de las personas.',
    per: 'Periodicidad: mes, trimestre, semestre (ene–jun y jul–dic), año o rango. Por trimestre (la inicial) se lee estable; por mes hay pocos casos y un mes malo parece una caída. Un periodo es completo si tiene todos sus meses dentro de los últimos 12 y ya terminó; los incompletos van en otro color y no entran al promedio.',
    semaforo: 'Compara el % de oportunidades que llegan a reunión del último periodo completo (dato del CRM) contra el promedio de sus 4 periodos anteriores (su línea base) y contra la mediana del portafolio. Verde: igual o mejor. Amarillo: hasta 20% peor, o abajo de la mediana. Rojo: más de 20% peor. Gris: menos de 10 oportunidades en el periodo. Los números de Amplemarket se muestran solo en los meses que llegaron completos.',
    k_cont: 'Personas contactadas por primera vez en el periodo.', k_resp: 'Respondieron entre contactados.', k_int: 'Interesados entre contactados: el indicador del semáforo.', k_cpr: 'Contactados por cada reunión agendada en Amplemarket. Menos es mejor.',
    prioridad: 'Todas las opciones del tema, no solo las primeras. Tasa = éxitos entre casos de esa opción (positivas en prospectos, reunión en oportunidades, ganadas en cerradas). Contra el promedio = la tasa de la opción entre la tasa de todo el tema. Alta: 1.2 veces o más. Media: 0.8 a 1.2. Baja: menos de 0.8. Pocos casos: menos de 10, no se toma como conclusión. «Sin dato» no entra.',
    pruebas: 'Pruebas de hipótesis del producto (ciclo de cambio vE, 5.1): dos versiones al mismo tiempo, 400 contactos por versión con señal o 1,500 en campaña, 4 a 6 semanas; gana la que tenga más respuestas positivas por contacto.',
    vista_op: 'Oportunidades ya cerradas, ganadas o perdidas. Con menos de 10 ganadas por producto sirve para confirmar, no para decidir.',
    anio: 'Año de la reacción, de la creación de la oportunidad (reunión) o del cierre (cerradas).',
    medida: 'Clientes cuenta oportunidades ganadas; Monto suma su valor (solo en Todos: un ticket grande deforma un producto). En prospectos, Personas cuenta gente y Puntos suma el peso de cada reacción.',
    pesos: 'Pesos oficiales (calibrados el 15-nov) = cuánto vale cada tipo de reacción según cuántas llegaron a reunión. Los anteriores quedan para comparar.',
    prod: 'Los productos oficiales de Great Revenue (Configuración → Productos). Lo que no es de un producto oficial (Pintaando, IMMMU, Excepciones o sin producto) se junta en Otros.',
    dona: 'El pastel reparte lo que sí funcionó (positivas, reuniones o ganadas) entre los valores; la lista dice cuántos de cada valor hubo en total y qué porcentaje funcionó.',
    barras: 'Cada barra muestra solo lo que funcionó (positivas, reuniones o ganadas) de esa opción: cuántas, qué % de todas son y la tasa (entre todas las personas u oportunidades de esa opción). Al pasar el cursor se ven las neutras, negativas o perdidas. «Pocos casos» = menos de 10.',
    docs: 'Los documentos de ventas vigentes del producto, como están ligados en Configuración → Productos. Aquí solo se consultan.',
    k_personas: 'Personas distintas que reaccionaron.', k_pos: 'Reacciones a favor: interés, reunión, presentación o reenvío.', k_neg: 'Reacciones en contra: no interesado, baja o rechazo.',
    k_pts: 'Suma del peso de todas las reacciones con los pesos elegidos.', k_op: 'Oportunidades creadas en el periodo, abiertas o cerradas.', k_reu: 'De esas, las que llegaron a la reunión.',
    k_tasa_reu: 'Reuniones entre oportunidades.', k_cer: 'Oportunidades cerradas.', k_gan: 'Ganadas.', k_tasa: 'Ganadas entre cerradas.', k_monto: 'Valor de las ganadas.', k_ticket: 'Monto entre ganadas.', k_abi: 'Oportunidades abiertas hoy.'
  };
  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (n) { return Math.round(n || 0).toLocaleString('es-MX'); };
  var pct = function (a, b) { return b ? Math.round(a * 100 / b) + '%' : '—'; };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var ay = function (k) { return AYUDA[k] ? '<span class="ay" tabindex="0" data-t="' + esc(AYUDA[k]) + '">?</span>' : ''; };
  var corto = function (n) { return String(n || '').replace(/\s*\(.*\)\s*$/, ''); };
  function chips(cont, opts, key, ayk) {
    var el = $(cont); el.innerHTML = '<span>' + el.getAttribute('data-l') + ay(ayk) + '</span>';
    opts.forEach(function (o) { var b = document.createElement('button'); b.className = 'chip' + (String(st[key]) === String(o[0]) ? ' on' : ''); b.textContent = o[1]; if (o[2]) b.title = o[2];
      b.onclick = function () { st[key] = o[0]; pintar(); }; el.appendChild(b); });
  }
  // Valor que "funciono" y total por cada valor de una dimension, segun la vista
  function par(v) {
    if (st.vista === 'se') return [v[1], v[0], v[2]];          // positivas, personas, negativas
    if (st.vista === 're') return [v[0], v[0] + v[1], 0];      // reunion, oportunidades
    return [st.medida === 'monto' ? v[2] : v[0], v[0] + v[1], 0]; // ganadas (o monto), cerradas
  }
  function ordenar(e) {
    return e.sort(function (a, b) { if (a[0] === 'Sin dato') return 1; if (b[0] === 'Sin dato') return -1;
      if (st.vista === 'se' && st.medidaS === 'puntos') return b[1][3] - a[1][3];
      var pa = par(a[1]), pb = par(b[1]); return (pb[0] - pa[0]) || (pb[1] - pa[1]); });
  }
  function dona(dimObj) {
    var todos = Object.entries(dimObj || {}); if (!todos.length) return '<p class="n">Sin datos.</p>';
    var sd = todos.filter(function (x) { return x[0] === 'Sin dato'; })[0];
    var e = ordenar(todos.filter(function (x) { return x[0] !== 'Sin dato'; }));
    var top = e.slice(0, 5), resto = e.slice(5);
    if (resto.length) { var r = [0, 0, 0, 0]; resto.forEach(function (x) { for (var i = 0; i < 4; i++) r[i] += x[1][i] || 0; }); top.push(['Otros valores', r]); }
    if (sd) top.push(sd);
    var tot = 0; top.forEach(function (x) { tot += Math.max(par(x[1])[0], 0); });
    var R = 54, C = 2 * Math.PI * R, acc = 0, arcos = '';
    if (tot > 0) top.forEach(function (x, i) { var v = Math.max(par(x[1])[0], 0); if (!v) return; var l = v / tot * C;
      arcos += '<circle r="' + R + '" cx="75" cy="75" fill="none" stroke="' + COLORES[i % COLORES.length] + '" stroke-width="24" stroke-dasharray="' + l + ' ' + (C - l) + '" stroke-dashoffset="' + (-acc) + '" transform="rotate(-90 75 75)"><title>' + esc(x[0]) + ': ' + fmt(v) + '</title></circle>'; acc += l; });
    else arcos = '<circle r="' + R + '" cx="75" cy="75" fill="none" stroke="#2A3142" stroke-width="24"></circle>';
    var centro = st.vista === 'se' ? 'positivas' : st.vista === 're' ? 'reuniones' : (st.medida === 'monto' ? 'monto' : 'ganadas');
    var svg = '<svg viewBox="0 0 150 150" width="150" height="150" role="img">' + arcos + '<text x="75" y="72" text-anchor="middle" fill="#F3F4F6" font-size="20" font-weight="800">' + (st.medida === 'monto' && st.vista === 'op' ? '$' + fmt(tot / 1000) + 'k' : fmt(tot)) + '</text><text x="75" y="90" text-anchor="middle" fill="#9CA3AF" font-size="11">' + centro + '</text></svg>';
    var lg = top.map(function (x, i) { var p = par(x[1]); var txt = st.vista === 'op' && st.medida === 'monto' ? '$' + fmt(p[0]) : fmt(p[0]) + ' · ' + (tot ? Math.round(Math.max(p[0], 0) * 100 / tot) : 0) + '% · tasa ' + pct(p[0], p[1]);
      return '<div title="' + esc(detalle(x[0], x[1], tot)) + '"><i style="background:' + COLORES[i % COLORES.length] + '"></i><span>' + esc(x[0]) + '</span><em>' + txt + (p[1] < 10 ? ' <span class="poco">pocos</span>' : '') + '</em></div>'; }).join('');
    return '<div class="dona">' + svg + '<div class="lg">' + lg + '</div></div>';

    var h = L.slice(0, 12).map(function (x) { var r = Object.keys(RES_TXT).filter(function (k) { return x.res && x.res[k]; }).map(function (k) { return fmt(x.res[k]) + ' ' + RES_TXT[k][x.res[k] === 1 ? 0 : 1]; }).join(' · ');
      return '<details class="msj"><summary><b>' + esc(x.n || 'Sin nombre') + '</b> <span class="pill ' + (x.origen === 'senal' ? 'p-man' : 'p-esc') + '">' + (x.origen === 'senal' ? 'Señal' : 'Secuencia') + '</span><em>' + r + '</em></summary>' + (x.texto ? '<div class="txt">' + esc(x.texto) + '</div>' : '<p class="n">El texto de esta secuencia todavía no se recupera de Amplemarket.</p>') + '</details>'; }).join('');
    return '<div class="card" style="grid-column:1/-1"><h3>Mensajes que funcionaron' + ay('exitos') + '</h3>' + (L.length ? '<p class="n">Secuencias y señales que dieron interés, recomendación, cita, reunión u oportunidad en los últimos 12 meses. Toca una para leer el mensaje que se envió.</p>' + h : '') +
      (fr ? '<details class="todas"' + (L.length ? '' : ' open') + '><summary>Frases y asuntos que abrieron conversación (lectura del 15-nov)</summary><div class="mdx">' + md(fr) + '</div></details>' : '') + '</div>';

  function rendimiento() {

  }

  // ---------- Prioridades: todas las opciones de cada tema (Mike, 16-nov) ----------
  // Por valor: casos, % del total del tema, exitos (positivas / reunion / ganadas), tasa y la tasa contra el promedio del tema.
  // Prioridad: Alta >= 1.2 veces el promedio · Media 0.8 a 1.2 · Baja < 0.8 · Pocos casos con menos de 10.
  function prioridades(dimObj) {
    var e = Object.entries(dimObj || {}).filter(function (x) { return x[0] !== 'Sin dato'; });
    var puntos = st.vista === 'se' && st.medidaS === 'puntos';
    var totN = 0, totE = 0, totP = 0;

    return { L: L, prom: prom, puntos: puntos, totN: totN, totE: totE };
  }
  var ETQ_PRIO = { alta: 'Alta', media: 'Media', baja: 'Baja', poca: 'Pocos casos' };
  function nombreExito() { return st.vista === 'se' ? 'Positivas' : st.vista === 're' ? 'Llegaron a reunión' : 'Ganadas'; }

      '<tr><td><b>Todo el tema</b></td><td>' + fmt(P.totE) + '</td><td>100%</td><td>' + fmt(P.totN) + '</td><td>' + (P.puntos ? P.prom.toFixed(2) + ' pts' : Math.round(P.prom * 100) + '%') + '</td><td>1.0×</td><td></td></tr></table></div></details>';
  }

      return '<div><b>' + DIMS[n] + ':</b> ' + (A.length ? A.map(function (o) { return esc(o.v) + ' <span style="color:var(--mute)">(' + (P.puntos ? o.tasa.toFixed(1) + ' pts' : Math.round(o.tasa * 100) + '%') + ' · ' + fmt(o.n) + ')</span>'; }).join(' · ') : '<span style="color:var(--mute)">ninguna opción con 10 casos o más arriba del promedio</span>') + '</div>'; }).join('');
    return '<div class="card resumen-prio" style="grid-column:1/-1"><h3>Prioridades por tema' + ay('prioridad') + '</h3><p class="n">Las opciones con prioridad Alta de cada tema: su tasa de ' + nombreExito().toLowerCase() + ' está 20% o más arriba del promedio del tema, con 10 casos o más. Entre paréntesis: tasa y casos.</p>' + filas + '</div>';

      if ((k.ganadas || 0) < 10) html += '<div class="aviso" style="grid-column:1/-1">Menos de 10 ganadas en este corte: úsalo para confirmar lo que dicen las vistas de Prospectos y de Reunión, no para decidir.</div>';
    }

    $('cal').innerHTML = st.prod === 'TODOS' && st.vista === 'se' ? calibracion() : '';

  function cargarCatalogo() {

  }
  ['f-prod', 'f-vista', 'f-per', 'f-anio', 'f-medida', 'f-pesos'].forEach(function (id) { var el = $(id); el.setAttribute('data-l', el.querySelector('span').textContent); });
  $('act').onclick = function () {
    var b = $('act'); b.disabled = true; $('msg').textContent = 'Recalculando, tarda un minuto…';

})();
