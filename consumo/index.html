<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Consumo de IA y n8n · Great Revenue</title>
<style>
:root {
  --purple: #7C3AED; --pink: #EC4899; --cyan: #06B6D4; --mint: #10B981; --yellow: #F59E0B; --red: #EF4444;
  --bg: #0B0F19; --bg-2: #141827; --bg-3: #1E2433; --border: #2A3142; --text: #F3F4F6; --text-dim: #9CA3AF; --text-mute: #6B7280;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; min-height: 100vh; }
#app { max-width: 1400px; margin: 0 auto; padding: 20px 16px; }
.hdr { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 16px 20px; background: linear-gradient(135deg, var(--purple), var(--pink)); border-radius: 12px; margin-bottom: 16px; }
.hdr-left { display: flex; align-items: center; gap: 14px; }
.logo { width: 42px; height: 42px; background: rgba(255,255,255,0.2); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; }
.hdr-main { font-size: 18px; font-weight: 800; letter-spacing: 0.5px; }
.hdr-sub { font-size: 11px; opacity: 0.85; letter-spacing: 1px; text-transform: uppercase; }
.hdr-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.live-badge { background: rgba(0,0,0,0.25); padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; background: var(--mint); border-radius: 50%; }
.dot.tarde { background: var(--yellow); } .dot.mal { background: var(--red); }
.btn-refresh { background: rgba(0,0,0,0.25); border: none; color: white; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-refresh:hover { background: rgba(0,0,0,0.4); }
.tabs { display: flex; gap: 4px; overflow-x: auto; background: var(--bg-2); border: 1px solid var(--border); border-radius: 10px; padding: 4px; margin-bottom: 16px; }
.tab { background: transparent; border: none; color: var(--text-dim); padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; white-space: nowrap; }
.tab:hover { background: var(--bg-3); color: var(--text); }
.tab.active { background: linear-gradient(135deg, var(--purple), var(--pink)); color: white; }
.badge { background: var(--red); color: white; padding: 1px 7px; border-radius: 10px; font-size: 11px; margin-left: 6px; }
.panel { display: none; } .panel.active { display: block; }
.filtros { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.chip { background: var(--bg-2); border: 1px solid var(--border); color: var(--text-dim); padding: 7px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600; }
.chip.active { background: var(--bg-3); color: var(--text); border-color: var(--purple); }
input[type=date], input[type=search], select { background: var(--bg-2); border: 1px solid var(--border); color: var(--text); padding: 7px 10px; border-radius: 8px; font: inherit; font-size: 13px; color-scheme: dark; }
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--bg-2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
.kpi-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 8px; }
.kpi-value { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.kpi-sub { font-size: 12px; color: var(--text-mute); margin-top: 4px; }
.sube { color: var(--red); } .baja { color: var(--mint); }
.card { background: var(--bg-2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.card h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 12px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.clientes { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.cli { background: var(--bg-3); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
.cli.sel { border-color: var(--pink); box-shadow: 0 0 0 1px var(--pink); }
.cli .nom { font-weight: 700; display: flex; align-items: center; gap: 8px; }
.cli .monto { font-size: 22px; font-weight: 800; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
.cli .det { color: var(--text-mute); font-size: 12px; }
.cli.cero .monto { color: var(--text-mute); }
.sem { width: 11px; height: 11px; border-radius: 50%; flex: 0 0 11px; }
.verde { background: var(--mint); } .amarillo { background: var(--yellow); } .rojo { background: var(--red); } .gris { background: var(--text-mute); }
.medidor { height: 5px; background: var(--border); border-radius: 3px; margin-top: 8px; overflow: hidden; } .medidor div { height: 100%; }
.barras { display: flex; align-items: flex-end; gap: 2px; height: 160px; }
.barras .b { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; min-width: 0; height: 100%; }
.barras .col { width: 100%; background: linear-gradient(180deg, var(--pink), var(--purple)); border-radius: 3px 3px 0 0; min-height: 1px; }
.barras .col.lim { background: var(--red); } .barras .col.vacio { background: var(--border); }
.barras .et { font-size: 10px; color: var(--text-mute); margin-top: 4px; height: 14px; }
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; white-space: nowrap; cursor: pointer; }
.tbl td { padding: 9px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
.tbl tr:hover td { background: var(--bg-3); }
.tbl tr.total td { font-weight: 800; background: var(--bg-3); }
.num { text-align: right !important; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; background: var(--bg-3); color: var(--text-dim); border: 1px solid var(--border); white-space: nowrap; }
.tag.on { color: var(--mint); border-color: rgba(16,185,129,.4); } .tag.ia { color: var(--cyan); border-color: rgba(6,182,212,.4); }
.tag.manual { color: var(--yellow); border-color: rgba(245,158,11,.4); } .tag.noid { color: var(--red); border-color: rgba(239,68,68,.4); }
.dim { color: var(--text-mute); font-size: 12px; }
.nota { color: var(--text-dim); font-size: 12px; margin-top: 10px; }
.aviso { background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.35); color: #FCD34D; border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; font-size: 13px; }
.error { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.35); color: #FCA5A5; }
.clave { max-width: 420px; margin: 80px auto; text-align: center; }
.clave input { width: 100%; margin: 14px 0; padding: 10px; }
.clave button, .btn { background: linear-gradient(135deg, var(--purple), var(--pink)); color: white; border: none; padding: 9px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; font: inherit; }
.ok { color: var(--mint); } .ahorro { color: var(--mint); font-weight: 700; }
a { color: var(--cyan); }
@media (max-width: 640px) { .kpi-value { font-size: 22px; } .hdr { padding: 14px; } }
</style>
</head>
<body>
<div id="app">
  <header class="hdr">
    <div class="hdr-left">
      <div class="logo">G</div>
      <div><div class="hdr-main">GREAT REVENUE</div><div class="hdr-sub">Consumo de IA y n8n por cliente</div></div>
    </div>
    <div class="hdr-right">
      <span class="live-badge" id="carga"><span class="dot"></span> Cargando…</span>
      <button class="btn-refresh" id="btnRefrescar">↻ Actualizar</button>
    </div>
  </header>
  <div id="contenido"></div>
</div>
<script>
// ===== Consumo de IA y n8n · Great Revenue (16 oct 2026) =====
// Pagina estatica de intelligence.greatrevenue.com/consumo/. No trae datos: los pide con la clave a n8n
// (webhook gr-consumo-api). La clave llega una vez en la liga (#k=...), se guarda en este navegador y se
// quita de la barra de direcciones.
var API = 'https://mikea.app.n8n.cloud/webhook/gr-consumo-api';
var PRECIOS = [ // USD por millon de tokens: entrada, salida, cache leido. Escritura de cache = 1.25x la entrada.
  [/fable-5|mythos-5/, 10, 50, 1], [/opus-5-5/, 4, 20, 0.20], [/opus-5|opus-4-[5-8]/, 5, 25, 0.5], [/opus-4|opus-3/, 15, 75, 1.5],
  [/sonnet-5/, 2, 10, 0.20], [/sonnet/, 3, 15, 0.30], [/haiku-5/, 0.10, 0.50, 0.01], [/haiku-4/, 1, 5, 0.10], [/haiku/, 0.25, 1.25, 0.03]];
var D = null, clave = '';
var est = { tab: 'resumen', periodo: 'mes', desde: '', hasta: '', cliente: '', flujo: '', buscar: '', soloIA: false, soloNoId: false, orden: 'u' };
try { var e0 = JSON.parse(localStorage.getItem('gr_consumo_estado') || '{}'); ['tab', 'periodo', 'desde', 'hasta'].forEach(function (k) { if (e0[k]) est[k] = e0[k]; }); } catch (e) {}
function guardarEstado() { try { localStorage.setItem('gr_consumo_estado', JSON.stringify({ tab: est.tab, periodo: est.periodo, desde: est.desde, hasta: est.hasta })); } catch (e) {} }

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function usd(x) { x = x || 0; return '$' + (x >= 100 ? x.toFixed(0) : x.toFixed(2)); }
function usd4(x) { return '$' + (x || 0).toFixed(4); }
function num(x) { return Math.round(x || 0).toLocaleString('es-MX'); }
function tok(x) { x = x || 0; return x >= 1e6 ? (x / 1e6).toFixed(2) + ' M' : x >= 1e3 ? (x / 1e3).toFixed(1) + ' mil' : String(Math.round(x)); }
function dia(d, n) { var t = new Date(d + 'T12:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); }
function diasEntre(a, b) { return Math.round((Date.parse(b + 'T12:00:00Z') - Date.parse(a + 'T12:00:00Z')) / 86400000) + 1; }
function fechaCorta(d) { var m = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic']; return Number(d.slice(8)) + ' ' + m[Number(d.slice(5, 7)) - 1]; }
function nombreMes(ym) { var m = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre']; return m[Number(ym.slice(5, 7)) - 1] + ' ' + ym.slice(0, 4); }
function precio(m) { for (var i = 0; i < PRECIOS.length; i++) if (PRECIOS[i][0].test(m)) return PRECIOS[i]; return null; }
function costo(m, f) { var p = precio(m); if (!p) return 0; return (f.i * p[1] + f.o * p[2] + f.cr * p[3] + f.cw * p[1] * 1.25) / 1e6; }

// ---------- Clave y carga ----------
(function () {
  var h = location.hash.match(/k=([A-Za-z0-9]+)/);
  if (h) { clave = h[1]; try { localStorage.setItem('gr_consumo_k', clave); } catch (e) {} history.replaceState(null, '', location.pathname); }
  if (!clave) try { clave = localStorage.getItem('gr_consumo_k') || ''; } catch (e) {}
})();
function pedirClave(msg) {
  $('carga').innerHTML = '<span class="dot mal"></span> Sin acceso';
  $('contenido').innerHTML = '<div class="card clave"><h3 style="justify-content:center">Acceso</h3><p class="dim">' + esc(msg || 'Escribe la clave del portal.') + '</p>' +
    '<input type="password" id="inClave" placeholder="Clave"><button id="btnClave">Entrar</button></div>';
  $('btnClave').onclick = function () { clave = $('inClave').value.trim(); try { localStorage.setItem('gr_consumo_k', clave); } catch (e) {} cargar(); };
}
function api(cuerpo) {
  cuerpo.k = clave;
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) }).then(function (r) { return r.json(); });
}
function cargar() {
  if (!clave) return pedirClave();
  $('carga').innerHTML = '<span class="dot"></span> Cargando…';
  api({ accion: 'datos' }).then(function (r) {
    if (!r || !r.ok) { try { localStorage.removeItem('gr_consumo_k'); } catch (e) {} return pedirClave(r && r.error === 'clave' ? 'La clave no es válida.' : 'No se pudo leer: ' + (r && r.error || 'sin respuesta')); }
    D = r; preparar(); pintar();
  }).catch(function (e) { $('carga').innerHTML = '<span class="dot mal"></span> Sin conexión'; $('contenido').innerHTML = '<div class="aviso error">No se pudo conectar con el servidor. ' + esc(e.message) + '</div>'; });
}
$('btnRefrescar').onclick = cargar;

// ---------- Datos ----------
var WF = {};
function preparar() {
  WF = {}; D.wf.forEach(function (w) { WF[w.id] = w; });
  D.uso.forEach(function (f) { var w = WF[f.w]; f.c = w ? w.c : (f.c || 'No identificado'); f.n = w ? w.n : (f.n || f.w); });
  D.ej.forEach(function (f) { var w = WF[f.w]; f.c = w ? w.c : 'No identificado'; });
  var vistos = {}; D.clientes.forEach(function (c) { vistos[c] = 1; });
  D.wf.forEach(function (w) { if (!vistos[w.c]) { vistos[w.c] = 1; D.clientes.push(w.c); } });
  D.primerDia = D.uso.reduce(function (a, f) { return !a || f.d < a ? f.d : a; }, '') || D.hoy;
  D.primerDiaEj = D.ej.reduce(function (a, f) { return !a || f.d < a ? f.d : a; }, '') || D.hoy;
}
function rango() {
  var h = D.hoy, p = est.periodo;
  if (p === 'hoy') return [h, h];
  if (p === 'ayer') return [dia(h, -1), dia(h, -1)];
  if (p === '7') return [dia(h, -6), h];
  if (p === '30') return [dia(h, -29), h];
  if (p === 'mes') return [h.slice(0, 8) + '01', h];
  if (p === 'mesant') { var f = dia(h.slice(0, 8) + '01', -1); return [f.slice(0, 8) + '01', f]; }
  if (p === 'todo') return [D.primerDia < D.primerDiaEj ? D.primerDia : D.primerDiaEj, h];
  var a = est.desde || dia(h, -6), b = est.hasta || h; return a <= b ? [a, b] : [b, a];
}
function diasMedidos(r) { var a = r[0] > D.primerDia ? r[0] : D.primerDia; return a > r[1] ? 1 : diasEntre(a, r[1]); }
function anterior(r) { var n = diasEntre(r[0], r[1]); return [dia(r[0], -n), dia(r[0], -1)]; }
function sumar(filas, clave) {
  var g = {};
  filas.forEach(function (f) { var k = clave(f); var a = g[k] = g[k] || { u: 0, e: 0, l: 0, i: 0, o: 0, cr: 0, cw: 0, m: {}, w: {} };
    a.u += f.u; a.e += f.e; a.l += f.l; a.i += f.i; a.o += f.o; a.cr += f.cr; a.cw += f.cw; a.m[f.m] = (a.m[f.m] || 0) + f.u; a.w[f.w] = 1; });
  return g;
}
function usoEn(r, fc) { return D.uso.filter(function (f) { return f.d >= r[0] && f.d <= r[1] && (!fc || fc(f)); }); }
function ejEn(r, fc) { return D.ej.filter(function (f) { return f.d >= r[0] && f.d <= r[1] && (!fc || fc(f)); }); }
function limite(c) { return c ? (D.limites[c] != null ? D.limites[c] : D.limiteDefault) : D.limiteTotal; }
function nivel(g, l) { return !g ? 'gris' : g >= l ? 'rojo' : g >= 0.7 * l ? 'amarillo' : 'verde'; }
function total(filas) { return filas.reduce(function (a, f) { return a + f.u; }, 0); }

// ---------- Pintar ----------
function pintar() {
  guardarEstado();
  var ult = D.ultimo ? new Date(D.ultimo) : null, min = ult ? Math.round((Date.now() - ult) / 60000) : 9999;
  var hora = ult ? ult.toLocaleString('es-MX', { timeZone: 'America/Mexico_City', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : 'sin dato';
  $('carga').innerHTML = '<span class="dot' + (min > 130 ? ' mal' : min > 75 ? ' tarde' : '') + '"></span> Última carga: ' + hora + (ult ? ' · hace ' + (min < 60 ? min + ' min' : Math.round(min / 60) + ' h') : '');
  var noId = D.wf.filter(function (w) { return w.c === 'No identificado' && !w.ar; }).length;
  var TABS = [['resumen', 'Resumen'], ['flujos', 'Flujos'], ['auditoria', 'Auditoría de workflows' + (noId ? '<span class="badge">' + noId + '</span>' : '')], ['modelos', 'Modelos recomendados'], ['limites', 'Límites y alarmas']];
  var h = '<nav class="tabs">' + TABS.map(function (t) { return '<button class="tab' + (est.tab === t[0] ? ' active' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>'; }).join('') + '</nav>';
  h += filtrosPeriodo();
  h += '<div id="panel"></div>';
  $('contenido').innerHTML = h;
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) { b.onclick = function () { est.tab = b.getAttribute('data-tab'); pintar(); }; });
  enlazarPeriodo();
  ({ resumen: pResumen, flujos: pFlujos, auditoria: pAuditoria, modelos: pModelos, limites: pLimites })[est.tab]();
}
function filtrosPeriodo() {
  var P = [['hoy', 'Hoy'], ['ayer', 'Ayer'], ['7', '7 días'], ['30', '30 días'], ['mes', 'Este mes'], ['mesant', 'Mes pasado'], ['todo', 'Todo'], ['rango', 'Rango']];
  var r = rango();
  return '<div class="filtros">' + P.map(function (p) { return '<button class="chip' + (est.periodo === p[0] ? ' active' : '') + '" data-p="' + p[0] + '">' + p[1] + '</button>'; }).join('') +
    '<span class="dim">del</span><input type="date" id="fDesde" value="' + r[0] + '" max="' + D.hoy + '"><span class="dim">al</span><input type="date" id="fHasta" value="' + r[1] + '" max="' + D.hoy + '">' +
    (est.cliente ? '<button class="chip active" id="quitarCliente">' + esc(est.cliente) + ' ✕</button>' : '') + '</div>';
}
function enlazarPeriodo() {
  Array.prototype.forEach.call(document.querySelectorAll('[data-p]'), function (b) { b.onclick = function () { est.periodo = b.getAttribute('data-p'); est.flujo = ''; if (est.periodo === 'rango' && !est.desde) { var r = rango(); est.desde = r[0]; est.hasta = r[1]; } pintar(); }; });
  $('fDesde').onchange = $('fHasta').onchange = function () { est.periodo = 'rango'; est.desde = $('fDesde').value; est.hasta = $('fHasta').value; pintar(); };
  if ($('quitarCliente')) $('quitarCliente').onclick = function () { est.cliente = ''; est.flujo = ''; pintar(); };
}
function avisoCobertura(r) {
  if (r[0] >= D.primerDia) return '';
  return '<div class="aviso">El gasto de Claude se mide desde el <b>' + fechaCorta(D.primerDia) + '</b> (lo más viejo que n8n todavía guarda). Lo anterior a esa fecha no aparece; la cifra completa solo está en la consola de Anthropic.</div>';
}

function pResumen() {
  var r = rango(), ra = anterior(r), dias = diasEntre(r[0], r[1]);
  var fc = est.cliente ? function (f) { return f.c === est.cliente; } : null;
  var filas = usoEn(r, fc), prev = usoEn(ra, fc), g = total(filas), gp = total(prev);
  var ej = ejEn(r, fc).reduce(function (a, f) { return a + f.e; }, 0);
  var mesIni = D.hoy.slice(0, 8) + '01', diasMes = new Date(Date.UTC(+D.hoy.slice(0, 4), +D.hoy.slice(5, 7), 0)).getUTCDate();
  var gMes = total(usoEn([mesIni, D.hoy], fc)), transcurridos = diasEntre(mesIni > D.primerDia ? mesIni : D.primerDia, D.hoy);
  var proy = transcurridos ? gMes / transcurridos * diasMes : 0;
  var hoyG = total(usoEn([D.hoy, D.hoy], fc)), ayerG = total(usoEn([dia(D.hoy, -1), dia(D.hoy, -1)], fc));
  var cambio = gp ? (g - gp) / gp * 100 : null;
  var tokE = filas.reduce(function (a, f) { return a + f.i + f.cr + f.cw; }, 0), tokS = filas.reduce(function (a, f) { return a + f.o; }, 0);
  var h = avisoCobertura(r) + '<div class="kpi-grid">' +
    kpi('Gasto Claude del periodo', usd(g), fechaCorta(r[0]) + (dias > 1 ? ' – ' + fechaCorta(r[1]) : '') + (cambio == null ? '' : ' · <span class="' + (cambio > 0 ? 'sube' : 'baja') + '">' + (cambio > 0 ? '▲ ' : '▼ ') + Math.abs(cambio).toFixed(0) + '% vs periodo anterior</span>')) +
    kpi('Hoy', usd(hoyG), 'ayer ' + usd(ayerG) + ' · límite ' + usd(limite(est.cliente)) + '/día') +
    kpi('Proyección del mes', usd(proy), 'llevamos ' + usd(gMes) + ' en ' + nombreMes(D.hoy).toLowerCase()) +
    kpi('Promedio diario', usd(g / diasMedidos(r)), diasMedidos(r) + ' día' + (diasMedidos(r) > 1 ? 's' : '') + ' con medición') +

    'Cada hora se leen por la API de n8n las ejecuciones nuevas de los workflows que usan Claude y se suma el <i>usage</i> que Anthropic devuelve en cada respuesta (tokens de entrada, salida y caché), con el precio de cada modelo. Las ejecuciones de n8n se cuentan de todos los workflows. ' +
    'Última carga: ' + num(c.workflows_leidos) + ' workflows leídos, ' + num(c.workflows_con_claude) + ' con Claude, ' + num(c.ejecuciones_leidas) + ' ejecuciones revisadas. ' +
    'No se ven aquí: el uso de Claude Code y de claude.ai (van por la suscripción, no por la llave de la API) ni las ejecuciones que n8n no guarda.</div></div>';
  $('panel').innerHTML = h;
}
