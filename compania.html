<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Portal de la compañía | Great Revenue Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;900&display=swap">
<link rel="stylesheet" href="/portal_comun.css?v=20261014b">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="/correo_estilos.js?v=20261014b"></script>
<script src="/portal_comun.js?v=20261014b"></script>
</head>
<body>
<div class="top"><span class="marca" id="logo"><b>Portal de tu compañía</b></span><span class="quien" id="quien">Entra con tu cuenta de Google</span></div>
<div class="banda oscura" id="banda"><div class="in"><h1 id="titulo">Tu portal</h1><p id="bajada">Entra con tu cuenta de Google para ver la configuración de tu compañía.</p></div></div>
<main>
  <section id="v-entrar">
    <div class="entrar"><b>Entra con tu cuenta de Google</b><div id="gbtn"></div><p class="msg bad" id="m-entrar"></p></div>
  </section>
  <section id="v-portal" hidden>
    <div id="selector"></div>
    <div class="panel" id="panel"></div>
  </section>
</main>
<footer>Operado por Great Revenue Intelligence · <a href="/privacidad.html">Aviso de privacidad</a></footer>

<script>
(function () {
  var P = window.GRP, $ = P.$, h = P.h;
  var LLAVE = 'gr_sesion_cia';
  var estado = { companias: [], sel: null, rol: '', muestras: {} };
  var EDITABLE = false;
  // La compania viene en la ruta (/itera/portal); la forma vieja ?c=ITERA sigue sirviendo.
  var pedida = (/^\/([a-z0-9]+)\/portal/.exec(location.pathname) || [])[1] || (/[?&]c=([A-Za-z0-9]+)/.exec(location.search) || [])[1];
  var ses = function () { return P.sesion(LLAVE); };
  function salir(motivo) { P.sesion(LLAVE, null); $('v-portal').hidden = true; $('v-entrar').hidden = false; $('m-entrar').textContent = motivo || ''; }

  P.google('gbtn', function (resp) {
    $('m-entrar').textContent = 'Revisando tu acceso...';
    P.api({ accion: 'entrar', id_token: resp.credential }).then(function (d) {
      if (!d.sesion) { $('m-entrar').textContent = d.error || 'No se pudo entrar.'; return; }
      P.sesion(LLAVE, d.sesion); $('m-entrar').textContent = ''; cargar();
    });
  });
  function cargar() {
    P.api({ accion: 'companias', sesion: ses() }).then(function (d) {
      if (d._codigo === 401 || d._codigo === 403) { salir(d.error); return; }
      if (!d.companias || !d.companias.length) { salir(d.error || 'Tu cuenta no tiene una compañía asignada.'); return; }
      estado.companias = d.companias; estado.rol = (d.usuario || {}).rol; estado.usuario = d.usuario || {};
      $('quien').textContent = d.usuario.nombre + ' · ' + d.usuario.email;
      $('v-entrar').hidden = true; $('v-portal').hidden = false;
      var t = estado.sel || (pedida && d.companias.some(function (c) { return c.tenant === pedida.toUpperCase(); }) ? pedida.toUpperCase() : d.companias[0].tenant);
      pintarSelector(); elegir(t);
    });
  }
  function pintarSelector() {
    var gr = estado.rol === 'gr';
    var vista = '<div class="aviso vista" style="margin-bottom:16px"><b>Estás viendo el portal como lo ve quien administra la compañía.</b> Para editar la configuración, regresa al <a href="/alta.html" style="color:#fff">portal de alta</a>.</div>';
    if (estado.companias.length < 2) { $('selector').innerHTML = gr ? vista : ''; return; }
    $('selector').innerHTML = (gr ? vista : '') + '<div class="nota" style="margin-bottom:16px"><label style="display:flex;gap:8px;align-items:center">' + (gr ? 'Compañía que estás viendo' : 'Compañía') + '<select id="sel-cia">' + estado.companias.map(function (c) { return '<option value="' + h(c.tenant) + '">' + h(c.datos.marca_nombre || c.tenant) + '</option>'; }).join('') + '</select></label></div>';
    $('sel-cia').onchange = function () { elegir(this.value); };
  }
  function dl(pares) { return '<dl class="dato">' + pares.map(function (p) { return '<dt>' + h(p[0]) + (p[3] ? P.ayuda(p[3]) : '') + '</dt><dd>' + (p[2] ? p[1] : h(p[1] || '—')) + '</dd>'; }).join('') + '</dl>'; }
  function abrir(u) { return /^https:\/\//.test(u || '') ? '<a href="' + h(u.split(/\s+/)[0]) + '" target="_blank" rel="noopener">Abrir</a>' : '—'; }
  function tarjeta(n, titulo, cuerpo, extra) { return '<div class="card"><div class="card-h"><h2><span class="num">' + n + '</span>' + h(titulo) + '</h2>' + (extra || '') + '</div>' + cuerpo + '</div>'; }
  function seccion(n, id, titulo, cuerpo, c, ejemplo) { return tarjeta(n, titulo, cuerpo + P.pedir(id, titulo, ejemplo) + P.solicitudes(c.solicitudes, titulo)); }
  var PESTANAS = [['equipo', 'Equipo'], ['conexiones', 'Conexiones'], ['marca', 'Tu marca y tus correos'], ['proceso', 'Objetivos y proceso']];
  var pestana = (/^#(equipo|conexiones|marca|proceso)$/.exec(location.hash) || [])[1] || 'equipo';
  function elegir(t) {
    var c = estado.companias.filter(function (x) { return x.tenant === t; })[0]; if (!c) return;
    estado.sel = t; if ($('sel-cia')) $('sel-cia').value = t;
    var d = c.datos;
    P.aplicarMarca(d, 'Portal de ' + (d.portal_nombre || d.marca_nombre || t), 'Tu equipo, tus conexiones y cómo salen tus correos.');
    document.title = 'Portal de ' + (d.marca_nombre || t);
    var html = '<nav class="tabs" role="tablist">' + PESTANAS.map(function (p) { return '<button role="tab" class="tab' + (p[0] === pestana ? ' on' : '') + '" data-tab="' + p[0] + '" aria-selected="' + (p[0] === pestana) + '">' + p[1] + '</button>'; }).join('') + '</nav>';
    html += '<div id="contenido">' + ({ equipo: equipo, conexiones: conexiones, marca: marca, proceso: proceso }[pestana])(c) + '</div>';
    $('panel').innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'), function (b) { b.onclick = function () { pestana = b.getAttribute('data-tab'); try { history.replaceState(null, '', '#' + pestana); } catch (e) {} elegir(t); }; });
    P.activarPedir(ses, t, cargar);
    if (pestana === 'equipo') activarEquipo(c);
    if (pestana === 'conexiones') activarConexiones(c);
    if (pestana === 'marca') {
      if ($('doc-completo')) $('doc-completo').onclick = function () { P.api({ accion: 'vitrina', sesion: ses(), tenant: t }).then(function (x) { if (x.html) P.abrirHtml(x.html); }); };
      cargarMuestras(c);
    }
  }
  // Equipo: quien administra agrega, quita e invita dentro de sus licencias; el resto lo consulta.
  function equipo(c) {
    var d = c.datos, inf = c.info || {}, adm = !!inf.administra, inv = Object.assign({}, inf.invitaciones || {});
    // La invitacion de alta (antes del registro por persona) tambien cuenta.
    P.correos(inf.alta_invitacion_para).forEach(function (e) { e = e.toLowerCase(); if (!inv[e]) inv[e] = inf.alta_invitacion_fecha || ''; });
    var admins = P.correos(d.portal_admins).map(function (x) { return x.toLowerCase(); });
    var todos = admins.concat(P.correos(d.portal_usuarios).map(function (x) { return x.toLowerCase(); }).filter(function (x) { return admins.indexOf(x) < 0; }));
    var max = Number(d.usuarios_max || 5), lleno = todos.length >= max;
    var cx = c.conexiones || {}, yo = String((estado.usuario || {}).email || '').toLowerCase();
    var google = {}; (cx.google || []).forEach(function (g) { google[String(g.quien).toLowerCase()] = g.servicios || {}; });
    // Su Google por servicio: correo, calendario y Drive, cada uno con su estado real en el motor.
    var SERV = [['correo', 'Correo'], ['calendario', 'Calendario'], ['drive', 'Drive']];
    function chips(sv) { return SERV.map(function (x) { return '<span class="chip ' + (sv[x[0]] ? 'aplicado' : 'pendiente') + '">' + x[1] + (sv[x[0]] ? '' : ': falta') + '</span>'; }).join(''); }
    var sol = {}; try { sol = JSON.parse((c.info || {}).licencias_solicitud || '{}') || {}; } catch (x) { sol = {}; }
    var filas = todos.map(function (e) {
      var esAdm = admins.indexOf(e) >= 0;
      var sv = google[e], completo = !!(sv && sv.correo && sv.calendario && sv.drive);
      var alta = e === yo && cx.disponible && cx.disponible.google ? ' <a class="s mini" href="' + h(conectar(c, 'google')) + '">' + (sv ? 'Completar mi Google' : 'Dar de alta mi Google') + '</a>' : '';
      var g = sv ? chips(sv) + (completo ? '' : alta) + ((adm || e === yo) ? ' <button class="s mini" data-quitar-google="' + h(e) + '">Quitar su Google</button>' : '') : (alta || '<span class="vacio">Sin conectar</span>');
      return '<tr><td>' + h(e) + '</td><td>' + (esAdm ? 'Administra' : 'Equipo') + '</td><td>' + g + '</td><td>' + (inv[e] ? 'Enviada el ' + h(inv[e]) : '<span class="vacio">Sin enviar</span>') + '</td>'
        + (adm ? '<td class="acc"><button class="s" data-invitar="' + h(e) + '">' + (inv[e] ? 'Reenviar invitación' : 'Enviar invitación') + '</button>' + (esAdm ? '' : ' <button class="s" data-quitar="' + h(e) + '">Quitar del equipo</button>') + '</td>' : '') + '</tr>';
    }).join('');
    var cuerpo = '<p style="margin:0">Aquí está quién usa el motor de ' + h(d.marca_nombre) + '. Cada persona entra con su cuenta de Google y conecta su correo, su calendario y su Drive: así el motor envía las minutas y los seguimientos desde su propio correo y lee sus reuniones y notas.</p>'
      + '<p class="nota" style="margin:0">Licencias en uso: <span class="uso' + (todos.length > max ? ' lleno' : '') + '">' + todos.length + ' de ' + max + '</span>, contando a quien administra.' + P.ayuda('usuarios_max') + ' ' + (adm ? 'Para sumar a alguien: agrégalo y envíale la invitación para dar de alta su Google. También te la puedes enviar a ti.' : 'Quien administra el portal agrega o quita personas.') + '</p>'
      + '<div style="overflow-x:auto"><table class="equipo"><tr><th>Correo</th><th>Rol</th><th>Su Google' + P.ayuda('google') + '</th><th>Invitación para dar de alta' + P.ayuda('invitacion') + '</th>' + (adm ? '<th></th>' : '') + '</tr>' + filas + '</table></div>'
      + (adm ? '<div class="acciones"><label style="flex:1;min-width:220px">Agregar a una persona (correo de Google)<input id="nuevo-usuario" type="email" placeholder="nombre@compania.com"' + (lleno ? ' disabled' : '') + '></label><button class="p" id="agregar"' + (lleno ? ' disabled' : '') + '>Agregar</button></div>'
        + (lleno ? '<p class="vacio">Ya usan todas las licencias. Quita a alguien o pide más licencias.</p>' : '')
        + '<div class="acciones"><label style="min-width:160px">Licencias adicionales<input id="lic-cuantas" type="number" min="1" max="50" value="1"></label><button class="s" id="lic-pedir">Pedir más licencias</button></div>'
        + (sol.fecha ? '<p class="vacio">Pediste ' + h(sol.cuantas) + ' licencia(s) más el ' + h(sol.fecha) + '. Great Revenue ya recibió el aviso.</p>' : '') : '')
      + '<span class="msg" id="m-equipo"></span>';
    return tarjeta(1, 'Equipo', cuerpo + P.pedir('equipo', 'Equipo', 'Ej.: explicar a mi equipo cómo dar de alta su Google') + P.solicitudes(c.solicitudes, 'Equipo'));
  }
  function activarEquipo(c) {
    var t = c.tenant;
    var llamar = function (cuerpo, ok, b) {
      if (b) b.disabled = true; P.msg('m-equipo', '', 'Procesando...');
      P.api(Object.assign({ sesion: ses(), tenant: t }, cuerpo)).then(function (d) {
        if (b) b.disabled = false;
        if (d._codigo === 401) { salir(d.error); return; }
        if (!d.ok) { P.msg('m-equipo', 'bad', d.error || 'No se pudo.'); return; }
        cargar(); setTimeout(function () { P.msg('m-equipo', 'ok', ok); }, 900);
      });
    };
    if ($('agregar')) $('agregar').onclick = function () {
      var e = $('nuevo-usuario').value.trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) { P.msg('m-equipo', 'bad', 'Escribe un correo válido.'); return; }
      llamar({ accion: 'equipo_agregar', email: e }, e + ' quedó en el equipo. Ahora envíale su invitación.', $('agregar'));
    };
    if ($('lic-pedir')) $('lic-pedir').onclick = function () {
      var b = $('lic-pedir'), n = Math.round(Number($('lic-cuantas').value || 0));
      if (!(n >= 1 && n <= 50)) { P.msg('m-equipo', 'bad', 'Indica cuántas licencias más necesitas (1 a 50).'); return; }
      if (!b.getAttribute('data-confirmar')) { b.setAttribute('data-confirmar', '1'); b.className = 'p'; b.textContent = 'Confirmar solicitud'; P.msg('m-equipo', '', 'Se avisa a Great Revenue que necesitan ' + n + ' licencia(s) más.'); return; }
      llamar({ accion: 'licencias_pedir', cuantas: n }, 'Listo: Great Revenue recibió tu solicitud de ' + n + ' licencia(s) más.', b);
    };
    Array.prototype.forEach.call(document.querySelectorAll('[data-invitar]'), function (b) {
      b.onclick = function () {
        var e = b.getAttribute('data-invitar');
        if (!b.getAttribute('data-confirmar')) { b.setAttribute('data-confirmar', '1'); b.className = 'p'; b.textContent = 'Confirmar envío'; P.msg('m-equipo', '', 'Sale ahora a ' + e + ' la invitación para dar de alta su Google (correo, calendario y Drive).'); return; }
        llamar({ accion: 'equipo_invitar', email: e }, 'Listo: ' + e + ' recibió la invitación para dar de alta su Google.', b);
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-quitar-google]'), function (b) {
      b.onclick = function () {
        var e = b.getAttribute('data-quitar-google');
        if (!b.getAttribute('data-confirmar')) { b.setAttribute('data-confirmar', '1'); b.className = 'p mini'; b.textContent = 'Confirmar'; P.msg('m-equipo', '', 'Se borran del motor el correo, el calendario y el Drive de ' + e + '. Sigue en el equipo y puede volver a darlos de alta.'); return; }
        llamar({ accion: 'equipo_quitar_google', email: e }, 'Listo: se quitó el Google de ' + e + ' (correo, calendario y Drive).', b);
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-quitar]'), function (b) {
      b.onclick = function () {
        var e = b.getAttribute('data-quitar');
        if (!b.getAttribute('data-confirmar')) { b.setAttribute('data-confirmar', '1'); b.className = 'p'; b.textContent = 'Confirmar quitar'; P.msg('m-equipo', '', e + ' ya no podrá entrar al portal y se borran del motor su correo, calendario y Drive.'); return; }
        llamar({ accion: 'equipo_quitar', email: e }, e + ' salió del equipo: se borraron sus conexiones de Google y se liberó una licencia.', b);
      };
    });
  }
  // Liga para conectar un servicio: va a la pagina oficial del servicio y regresa a esta pestana.
  // Liga para dar de alta un servicio: pagina del sitio con la ruta de la compania (nunca la direccion del motor).
  function conectar(c, servicio, otra) { var cx = c.conexiones || {}; return cx.pagina + '?s=' + servicio + (otra ? '&otra=1' : '') + '&p=' + encodeURIComponent(ses() || ''); }
  function activarConexiones(c) {
    Array.prototype.forEach.call(document.querySelectorAll('[data-quitar-servicio]'), function (b) {
      b.onclick = function () {
        var sv = b.getAttribute('data-quitar-servicio'), nom = sv === 'zoho' ? 'Zoho CRM' : 'Amplemarket';
        if (!b.getAttribute('data-confirmar')) { b.setAttribute('data-confirmar', '1'); b.className = 'p'; b.textContent = 'Confirmar'; P.msg('m-conexiones', '', 'El motor deja de usar ' + nom + ' hasta que lo vuelvas a conectar.'); return; }
        b.disabled = true; P.msg('m-conexiones', '', 'Quitando...');
        P.api({ accion: 'conexion_quitar', sesion: ses(), tenant: c.tenant, servicio: sv }).then(function (d) {
          b.disabled = false;
          if (d._codigo === 401) { salir(d.error); return; }
          if (!d.ok) { P.msg('m-conexiones', 'bad', d.error || 'No se pudo.'); return; }
          cargar(); setTimeout(function () { P.msg('m-conexiones', 'ok', 'Listo: se quitó ' + nom + '.'); }, 900);
        });
      };
    });
  }
  function conexiones(c) {
    var cx = c.conexiones || {}, adm = !!(c.info || {}).administra;
    var tarjetaServicio = function (s, titulo, texto, lista) {
      var hay = (lista || []).length, disp = cx.disponible && cx.disponible[s];
      return '<div class="servicio"><div class="servicio-h"><b>' + titulo + '</b>' + (hay ? '<span class="chip aplicado">Conectado</span>' : '<span class="chip pendiente">Sin conectar</span>') + '</div><p class="vacio" style="margin:0">' + texto + '</p>'
        + (lista || []).map(function (x) { return '<div class="liga">' + h(x.quien) + ' <span class="vacio">desde ' + h(x.fecha) + '</span></div>'; }).join('')
        + (adm && hay ? '<div class="acciones"><button class="s" data-quitar-servicio="' + s + '">Quitar la conexión</button></div>' : '')
        + (adm ? (disp ? '<div class="acciones"><a class="' + (hay ? 's' : 'p') + '" href="' + h(conectar(c, s)) + '">' + (hay ? 'Volver a conectar la misma cuenta' : 'Conectar') + '</a><a class="s" href="' + h(conectar(c, s, true)) + '">' + (hay ? 'Cambiar a otra cuenta' : 'Conectar con otra cuenta') + '</a></div>' + (hay ? '<p class="vacio">Si cambias a otra cuenta, la nueva reemplaza a la actual y la actual se borra del motor.</p>' : '') : '<p class="vacio">Aún no disponible: Great Revenue lo habilita.</p>') : '<p class="vacio">Lo conecta quien administra el portal.</p>') + '</div>';
    };
    var g = (cx.google || []).length;
    var cuerpo = '<p style="margin:0">Las cuentas con las que trabaja el motor. Cada conexión se hace en la página oficial del servicio: Great Revenue nunca ve contraseñas y el permiso se puede retirar cuando quieras.</p>'
      + tarjetaServicio('zoho', 'Zoho CRM', 'Donde viven las oportunidades y contactos. Lo conecta una vez quien administra Zoho en la compañía; el motor crea y actualiza oportunidades, tareas y notas.', cx.zoho)
      + tarjetaServicio('amplemarket', 'Amplemarket', 'Donde corren las secuencias de prospección. Lo conecta una vez quien administra Amplemarket; el motor lee respuestas y aperturas para avisar al vendedor.', cx.amplemarket)
      + '<span class="msg" id="m-conexiones"></span><div class="servicio"><div class="servicio-h"><b>Google de cada persona</b><span class="chip ' + (g ? 'aplicado' : 'pendiente') + '">' + g + ' de ' + h(cx.max_google || '') + ' conectados</span></div><p class="vacio" style="margin:0">Correo, calendario y Drive de cada persona. Se conecta en la pestaña Equipo, cada quien el suyo.</p></div>';
    return tarjeta(2, 'Conexiones', cuerpo + P.pedir('conexiones', 'Conexiones', 'Ej.: no puedo conectar mi calendario') + P.solicitudes(c.solicitudes, 'Conexiones'));
  }
  function marca(c) {
    var d = c.datos, inf = c.info || {}, html = '';
    html += tarjeta(3, 'Vista previa de tus correos', '<p class="nota" style="margin:0">Todos los tipos de correo que salen con tu marca, por objetivo. La opción marcada es la que se usa hoy; si prefieres otra, pídelo en el recuadro del grupo.</p><div id="grupos"><p class="vacio">Cargando tipos de correo...</p></div>',
      inf.tiene_vitrina ? '<button class="s" id="doc-completo">Documento completo de marca</button>' : '');
    html += seccion(4, 'origen', 'Origen de tu marca', dl([['Sitio web', abrir(d.sitio_web), true, 'sitio_web'], ['Manual de identidad', abrir(d.marca_manual_url), true, 'marca_manual_url'], ['Carpeta de logos', abrir(d.marca_logos_carpeta), true, 'marca_logos_carpeta']]), c);
    html += seccion(5, 'marca', 'Tu marca', dl([['Nombre', d.marca_nombre, false, 'marca_nombre'], ['Colores', '<span class="sw"><i style="background:' + h(P.color(d.marca_color_primario, '#ccc')) + '"></i>' + h(d.marca_color_primario) + '</span><span class="sw"><i style="background:' + h(P.color(d.marca_color_oscuro, '#111')) + '"></i>' + h(d.marca_color_oscuro) + '</span>', true, 'marca_color_primario'], ['Colores secundarios', (d.marca_colores_secundarios || '').split(',').filter(Boolean).map(function (x) { return '<span class="sw"><i style="background:' + h(P.color(x, '#ccc')) + '"></i></span>'; }).join(''), true, 'marca_colores_secundarios'], ['Tipografía de los avisos', d.marca_fuente_interna, false, 'marca_fuente_interna'], ['Remitente', d.marca_remitente_interno, false, 'marca_remitente_interno'], ['Prefijo del asunto', d.marca_prefijo_asunto, false, 'marca_prefijo_asunto'], ['Pie', d.marca_pie, false, 'marca_pie']]) + '<div>' + P.aviso(d) + '</div>', c, 'Ej.: usa el logo a color en los avisos');
    if (c.ligas.tablero && d.motor !== 'propio') html += tarjeta(6, 'Tablero', '<div class="liga"><b>Tablero del pipeline:</b> <a href="' + h(c.ligas.tablero) + '" target="_blank" rel="noopener">Abrir</a></div>');
    return html;
  }
  function proceso(c) {
    return tarjeta(7, 'Objetivos y proceso comercial', '<p class="vacio">Próximamente: aquí verás y ajustarás los objetivos que opera el motor y las etapas de tu proceso comercial.</p>' + P.pedir('proceso', 'Objetivos y proceso', 'Ej.: agrega una etapa de propuesta') + P.solicitudes(c.solicitudes, 'Objetivos y proceso'));
  }
  function cargarMuestras(c) {
    var poner = function (actuales) {
      if (estado.sel !== c.tenant || !$('grupos')) return;
      $('grupos').innerHTML = P.vistaPrevia(c, actuales, EDITABLE); P.llenarVistaPrevia(c, actuales); P.activarPedir(ses, c.tenant, cargar);
      Array.prototype.forEach.call(document.querySelectorAll('[data-guardar-diseno]'), function (b) { b.onclick = function () { guardarDiseno(c, b.getAttribute('data-guardar-diseno')); }; });
    };
    var actuales = estado.muestras[c.tenant];
    var pedirActuales = actuales ? Promise.resolve(actuales) : (c.info.tiene_muestras ? P.api({ accion: 'muestras', sesion: ses(), tenant: c.tenant }).then(function (d) { if (d._codigo === 401) { salir(d.error); return {}; } return (d.muestras && d.muestras.actuales) || {}; }) : Promise.resolve({}));
    Promise.all([P.cargarCatalogo(), pedirActuales]).then(function (r) { estado.muestras[c.tenant] = r[1]; poner(r[1]); }, function () { if ($('grupos')) $('grupos').innerHTML = '<p class="vacio">No se pudieron cargar los tipos de correo.</p>'; });
  }

  // Antes de entrar ya se ve con la marca de la compania de la liga.
  if (!ses()) P.marcaPublica('Portal de {nombre}', 'Entra con tu cuenta de Google para ver tu equipo, tus conexiones y tus correos.');
  if (ses()) cargar();
})();
