<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Portal de la compañía | Great Revenue Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;900&display=swap">
<link rel="stylesheet" href="portal_comun.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="correo_estilos.js"></script>
<script src="portal_comun.js"></script>
</head>
<body>
<div class="top"><span class="marca" id="logo"><b>Portal de tu compañía</b></span><span class="quien" id="quien">Entra con tu cuenta de Google</span></div>
<div class="banda oscura" id="banda"><div class="in"><h1 id="titulo">Tu portal</h1><p id="bajada">Entra con tu cuenta de Google para ver la configuración de tu compañía.</p></div></div>
<main>
  <section id="v-entrar">
    <div class="entrar"><b>Entra con tu cuenta de Google</b><div id="gbtn"></div><p class="msg bad" id="m-entrar"></p></div>
  </section>
  <section id="v-portal" hidden>
    <div id="selector"></div>
    <div class="panel" id="panel"></div>
  </section>
</main>
<footer>Operado por Great Revenue Intelligence · <a href="privacidad.html">Aviso de privacidad</a></footer>

<script>
(function () {
  var P = window.GRP, $ = P.$, h = P.h;
  var LLAVE = 'gr_sesion_cia';
  var estado = { companias: [], sel: null, rol: '', muestras: {} };
  var EDITABLE = false;
  var pedida = (/[?&]c=([A-Za-z0-9]+)/.exec(location.search) || [])[1];
  var ses = function () { return P.sesion(LLAVE); };
  function salir(motivo) { P.sesion(LLAVE, null); $('v-portal').hidden = true; $('v-entrar').hidden = false; $('m-entrar').textContent = motivo || ''; }

  P.google('gbtn', function (resp) {
    $('m-entrar').textContent = 'Revisando tu acceso...';
    P.api({ accion: 'entrar', id_token: resp.credential }).then(function (d) {
      if (!d.sesion) { $('m-entrar').textContent = d.error || 'No se pudo entrar.'; return; }
      P.sesion(LLAVE, d.sesion); $('m-entrar').textContent = ''; cargar();
    });
  });
  function cargar() {
    P.api({ accion: 'companias', sesion: ses() }).then(function (d) {
      if (d._codigo === 401 || d._codigo === 403) { salir(d.error); return; }
      if (!d.companias || !d.companias.length) { salir(d.error || 'Tu cuenta no tiene una compañía asignada.'); return; }
      estado.companias = d.companias; estado.rol = (d.usuario || {}).rol;
      $('quien').textContent = d.usuario.nombre + ' · ' + d.usuario.email;
      $('v-entrar').hidden = true; $('v-portal').hidden = false;
      var t = estado.sel || (pedida && d.companias.some(function (c) { return c.tenant === pedida.toUpperCase(); }) ? pedida.toUpperCase() : d.companias[0].tenant);
      pintarSelector(); elegir(t);
    });
  }
  function pintarSelector() {
    var gr = estado.rol === 'gr';
    var vista = '<div class="aviso vista" style="margin-bottom:16px"><b>Estás viendo el portal como lo ve la administradora.</b> Aquí solo se consulta y se piden cambios; para editar, regresa al <a href="alta.html" style="color:#fff">portal de alta</a>.</div>';
    if (estado.companias.length < 2) { $('selector').innerHTML = gr ? vista : ''; return; }
    $('selector').innerHTML = (gr ? vista : '') + '<div class="nota" style="margin-bottom:16px"><label style="display:flex;gap:8px;align-items:center">' + (gr ? 'Compañía que estás viendo' : 'Compañía') + '<select id="sel-cia">' + estado.companias.map(function (c) { return '<option value="' + h(c.tenant) + '">' + h(c.datos.marca_nombre || c.tenant) + '</option>'; }).join('') + '</select></label></div>';
    $('sel-cia').onchange = function () { elegir(this.value); };
  }
  function dl(pares) { return '<dl class="dato">' + pares.map(function (p) { return '<dt>' + h(p[0]) + (p[3] ? P.ayuda(p[3]) : '') + '</dt><dd>' + (p[2] ? p[1] : h(p[1] || '—')) + '</dd>'; }).join('') + '</dl>'; }
  function abrir(u) { return /^https:\/\//.test(u || '') ? '<a href="' + h(u.split(/\s+/)[0]) + '" target="_blank" rel="noopener">Abrir</a>' : '—'; }
  function tarjeta(n, titulo, cuerpo, extra) { return '<div class="card"><div class="card-h"><h2><span class="num">' + n + '</span>' + h(titulo) + '</h2>' + (extra || '') + '</div>' + cuerpo + '</div>'; }
  function seccion(n, id, titulo, cuerpo, c, ejemplo) { return tarjeta(n, titulo, cuerpo + P.pedir(id, titulo, ejemplo) + P.solicitudes(c.solicitudes, titulo)); }
  function elegir(t) {
    var c = estado.companias.filter(function (x) { return x.tenant === t; })[0]; if (!c) return;
    estado.sel = t; if ($('sel-cia')) $('sel-cia').value = t;
    var d = c.datos, inf = c.info || {}, html = '';
    P.aplicarMarca(d, 'Portal de ' + (d.portal_nombre || d.marca_nombre || t), 'Tu marca, cómo operas, quién recibe los avisos y tu equipo. En cada sección puedes pedir cambios.');
    document.title = 'Portal de ' + (d.marca_nombre || t);
    var usados = P.correos(d.portal_usuarios).length;
    html += tarjeta(1, 'Vista previa de tus correos', '<p class="nota" style="margin:0">Todos los tipos de correo que salen con tu marca, por objetivo. La opción marcada es la que se usa hoy; si prefieres otra, pídelo en el recuadro del grupo.</p><div id="grupos"><p class="vacio">Cargando tipos de correo...</p></div>',
      inf.tiene_vitrina ? '<button class="s" id="doc-completo">Documento completo de marca</button>' : '');
    html += seccion(2, 'opera', 'Cómo opera hoy', dl([['CRM', d.crm, false, 'crm'], ['Motor de tus correos', d.motor === 'propio' ? 'Motor propio' : 'Motor común', false, 'motor'], ['Dónde corren los avisos', d.motor_propio, false, 'motor_propio'], ['Marca y decisiones', d.marca_diferencias_manual, false, 'marca_diferencias_manual'], ['Equipo y operación', d.operacion_actual, false, 'operacion_actual']]) + '<div><b style="font-size:13px;color:var(--g)">Mejoras contra el manual</b><div style="margin-top:8px">' + P.listaMejoras(c, false) + '</div></div>', c);
    html += seccion(3, 'origen', 'Origen de tu marca', dl([['Sitio web', abrir(d.sitio_web), true, 'sitio_web'], ['Manual de identidad', abrir(d.marca_manual_url), true, 'marca_manual_url'], ['Carpeta de logos', abrir(d.marca_logos_carpeta), true, 'marca_logos_carpeta']]), c);
    html += seccion(4, 'marca', 'Tu marca', dl([['Nombre', d.marca_nombre, false, 'marca_nombre'], ['Colores', '<span class="sw"><i style="background:' + h(P.color(d.marca_color_primario, '#ccc')) + '"></i>' + h(d.marca_color_primario) + '</span><span class="sw"><i style="background:' + h(P.color(d.marca_color_oscuro, '#111')) + '"></i>' + h(d.marca_color_oscuro) + '</span>', true, 'marca_color_primario'], ['Colores secundarios', (d.marca_colores_secundarios || '').split(',').filter(Boolean).map(function (x) { return '<span class="sw"><i style="background:' + h(P.color(x, '#ccc')) + '"></i></span>'; }).join(''), true, 'marca_colores_secundarios'], ['Tipografía de los avisos', d.marca_fuente_interna, false, 'marca_fuente_interna'], ['Remitente', d.marca_remitente_interno, false, 'marca_remitente_interno'], ['Prefijo del asunto', d.marca_prefijo_asunto, false, 'marca_prefijo_asunto'], ['Pie', d.marca_pie, false, 'marca_pie']]) + '<div>' + P.aviso(d) + '</div>', c, 'Ej.: usa el logo by Itera en los avisos');
    html += seccion(5, 'operacion', 'Quién recibe la operación', dl([['Fallas del motor', d.aviso_fallas_correos, false, 'aviso_fallas_correos'], ['Conexiones nuevas', d.llaves_avisar_a, false, 'llaves_avisar_a']]), c, 'Ej.: las fallas también deben llegarle a Sara');
    html += seccion(6, 'equipo', 'Tu equipo', dl([['Administradora', d.portal_admins, false, 'portal_admins'], ['Usuarios', usados + ' de ' + d.usuarios_max + ' (contándote)', false, 'usuarios_max'], ['Quiénes', P.correos(d.portal_usuarios).join('\n'), false, 'portal_usuarios'], ['Modo', d.modo === 'real' ? 'Real' : 'Prueba', false, 'modo']]) + '<div class="nota">Siguiente paso: desde aquí invitarás a tu equipo y conectarás tus cuentas.</div>', c, 'Ej.: agrega a una persona nueva al equipo');
    if (c.ligas.tablero && d.motor !== 'propio') html += tarjeta(7, 'Ligas', '<div class="liga"><b>Tablero del pipeline:</b> <a href="' + h(c.ligas.tablero) + '" target="_blank" rel="noopener">Abrir</a></div>');
    $('panel').innerHTML = html;
    P.activarPedir(ses, t, cargar);
    if ($('doc-completo')) $('doc-completo').onclick = function () { P.api({ accion: 'vitrina', sesion: ses(), tenant: t }).then(function (x) { if (x.html) P.abrirHtml(x.html); }); };
    cargarMuestras(c);
  }
  function cargarMuestras(c) {
    var poner = function (actuales) {
      if (estado.sel !== c.tenant) return;
      $('grupos').innerHTML = P.vistaPrevia(c, actuales, EDITABLE); P.llenarVistaPrevia(c, actuales); P.activarPedir(ses, c.tenant, cargar);
      Array.prototype.forEach.call(document.querySelectorAll('[data-guardar-diseno]'), function (b) { b.onclick = function () { guardarDiseno(c, b.getAttribute('data-guardar-diseno')); }; });
    };
    var actuales = estado.muestras[c.tenant];
    var pedirActuales = actuales ? Promise.resolve(actuales) : (c.info.tiene_muestras ? P.api({ accion: 'muestras', sesion: ses(), tenant: c.tenant }).then(function (d) { if (d._codigo === 401) { salir(d.error); return {}; } return (d.muestras && d.muestras.actuales) || {}; }) : Promise.resolve({}));
    Promise.all([P.cargarCatalogo(), pedirActuales]).then(function (r) { estado.muestras[c.tenant] = r[1]; poner(r[1]); }, function () { $('grupos').innerHTML = '<p class="vacio">No se pudieron cargar los tipos de correo.</p>'; });
  }

  if (ses()) cargar();
})();
</script>
</body>
</html>
