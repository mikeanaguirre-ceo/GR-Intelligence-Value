<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversaciones Great Revenue</title>
<style>
  :root{
    --marca:#0f3d34; --acento:#1f8a6b; --fondo:#eef0ec; --panel:#fff; --borde:#dfe3de; --texto:#14201c; --tenue:#62706b;
    --b-cliente:#fff; --b-bot:#e3f1ec; --b-persona:#dcecff; --b-nota:#fff4c7; --b-fallo:#fde4df;
    --ok:#1d7a45; --alerta:#a35a00; --mal:#b3261e; --azul:#1f6fd1;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--texto);background:var(--fondo)}
  button{font:inherit}
  .tabs{height:42px;background:#0b2e27;display:flex;align-items:center;gap:4px;padding:0 10px}
  .tabs button{background:transparent;border:0;color:#cfe0da;padding:7px 14px;border-radius:16px;font-weight:650;font-size:13px;cursor:pointer}
  .tabs button.on{background:#fff;color:var(--marca)}
  .tabs .num{background:#d9463b;color:#fff;border-radius:9px;font-size:10.5px;padding:0 6px;margin-left:5px}
  .app{display:grid;grid-template-columns:360px 1fr;height:calc(100% - 42px);overflow:hidden}
  .app[hidden]{display:none}
  .conf{height:calc(100% - 42px);overflow-y:auto;padding:18px 22px 40px}
  .conf h2{font-size:16px;margin:22px 0 8px} .conf h2:first-child{margin-top:0}
  .conf .nota{font-size:12.5px;color:var(--tenue);margin:0 0 10px}
  .conf .tarjeta{background:#fff;border:1px solid var(--borde);border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .resumen{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .resumen button{border:1px solid var(--borde);background:#fff;border-radius:16px;padding:5px 12px;font-size:12.5px;cursor:pointer}
  .resumen button.on{background:var(--marca);color:#fff;border-color:var(--marca)}
  .tabla{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border:1px solid var(--borde);border-radius:10px;overflow:hidden}
  .tabla th{text-align:left;font-size:11.5px;color:var(--tenue);font-weight:650;padding:8px 10px;border-bottom:1px solid var(--borde);background:#f7f8f6}
  .tabla td{padding:8px 10px;border-bottom:1px solid var(--borde);vertical-align:top}
  .tabla tr:last-child td{border-bottom:0}
  .tabla a{color:var(--azul);text-decoration:none} .tabla a:hover{text-decoration:underline}
  .estado-f{font-size:11px;padding:1px 8px;border-radius:10px;font-weight:650;white-space:nowrap}
  .estado-f.al_dia,.estado-f.APPROVED{background:#e4f4ea;color:var(--ok)}
  .estado-f.atrasada,.estado-f.PENDING,.estado-f.sin_pv{background:#ffeccc;color:#9a5300}
  .estado-f.sin_ficha,.estado-f.REJECTED,.estado-f.falta{background:#fde2e1;color:#a3261f}
  .estado-f.PAUSED,.estado-f.DISABLED{background:#eceaea;color:#555}
  .plantilla-texto{white-space:pre-wrap;font-size:12.5px;background:#f5f6f3;border-radius:8px;padding:8px 10px;margin-top:6px}
  .tenue{color:var(--tenue);font-size:12px}
  .filtros select{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:14px;padding:2px 8px;font-size:12px}
  .filtros select option{color:#14201c}
  .etq.producto{background:#e8eefb;color:#2b4a8f} .etq.etapa.prospeccion{background:#fff1d6;color:#8a5200} .etq.etapa.venta{background:#e2f0ff;color:#174f98}
  .estado-wa{font-size:11.5px;font-weight:650;padding:1px 8px;border-radius:10px;white-space:nowrap}
  .estado-wa.conversa{background:#e4f4ea;color:var(--ok)} .estado-wa.enviada{background:#efe9fb;color:#5a3fa0} .estado-wa.listo{background:#e2f0ff;color:#174f98}
  .estado-wa.telefono{background:#fff1d6;color:#8a5200} .estado-wa.falta{background:#fde2e1;color:#a3261f}
  .celcap{display:flex;gap:4px} .celin{width:130px;font:inherit;font-size:12.5px;padding:4px 6px;border:1px solid var(--borde);border-radius:6px}
  .celok{padding:4px 10px;font-size:12px}
  #opor .tabla{display:block;overflow-x:auto} #opor .tabla .etq{white-space:nowrap} #opor td{font-size:12.5px}
  #opor .resumen select,#opor .resumen input{font:inherit;font-size:12.5px;padding:5px 8px;border:1px solid var(--borde);border-radius:8px} .etq.respondio{background:#e4f4ea;color:var(--ok)} .etq.sinresp{background:#fdf3e1;color:#9a5300}
  .lista{background:var(--panel);border-right:1px solid var(--borde);display:flex;flex-direction:column;min-width:0;min-height:0}
  .cab{background:var(--marca);color:#fff;padding:12px 14px;display:flex;flex-direction:column;gap:10px;flex:0 0 auto}
  .cab .fila{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .cab h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
  .cab .estado{font-size:11px;opacity:.8}
  .cab .botones{display:flex;gap:8px}
  .cab .botones button{flex:1;border:0;border-radius:18px;padding:9px 12px;font-weight:650;cursor:pointer}
  .b-act{background:#fff;color:var(--marca)} .b-nuevo{background:var(--acento);color:#fff}
  .buscar{width:100%;border:0;border-radius:8px;padding:8px 10px;font:inherit}
  .filtros{display:flex;gap:6px;flex-wrap:wrap}
  .filtros button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer}
  .filtros button.on{background:#fff;color:var(--marca)}
  .items{overflow-y:auto;flex:1;min-height:0;overscroll-behavior:contain}
  .vacio{padding:24px 16px;color:var(--tenue);font-size:14px}
  .item{padding:10px 14px;border-bottom:1px solid var(--borde);cursor:pointer;display:flex;gap:10px}
  .item:hover{background:#f6f7f5} .item.sel{background:#eaf1ee}
  .ava{width:38px;height:38px;border-radius:50%;background:#dbe5e1;color:#34504a;display:flex;align-items:center;justify-content:center;font-weight:650;flex:0 0 auto}
  .item .cuerpo{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
  .arriba{display:flex;justify-content:space-between;gap:6px}
  .nom{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hora{font-size:11px;color:var(--tenue);flex:0 0 auto}
  .tel{font-size:11px;color:var(--tenue)}
  .prev{font-size:13px;color:var(--tenue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .etqs{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
  .etq{font-size:10px;padding:1px 7px;border-radius:10px;background:#eef1ef;color:#3b4a45}
  .etq.bot{background:#e3f1ec;color:#155a45} .etq.persona{background:#dcecff;color:#174f98}
  .etq.abierta{background:#e4f4ea;color:var(--ok)} .etq.cerrada{background:#f3eee2;color:var(--alerta)}
  .etq.anuncio{background:#efe9fb;color:#5a3fa0}
  .etq.atender{background:#fde2e1;color:#a3261f;font-weight:600} .etq.espera{background:#ffeccc;color:#9a5300;font-weight:600}
  .etq.agendada{background:#e4f4ea;color:var(--ok);font-weight:600} .etq.nocontactar{background:#eceaea;color:#6b2b2b}
  .contador{background:var(--acento);color:#fff;border-radius:10px;font-size:11px;padding:0 7px;font-weight:700}
  .chat{display:flex;flex-direction:column;min-width:0;min-height:0}
  .chatcab{background:#f5f6f3;border-bottom:1px solid var(--borde);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;flex:0 0 auto}
  .quien{display:flex;flex-direction:column;min-width:0}
  .quien .n{font-weight:650;display:flex;gap:6px;align-items:center}
  .quien .m{font-size:12px;color:var(--tenue)}
  .lapiz{border:0;background:transparent;cursor:pointer;color:var(--tenue);font-size:13px;padding:0 2px}
  .acciones{display:flex;gap:8px;flex-wrap:wrap}
  .btn{border:0;border-radius:18px;padding:8px 14px;font-size:13px;font-weight:650;cursor:pointer;background:var(--marca);color:#fff}
  .btn.sec{background:#fff;color:var(--marca);border:1px solid var(--marca)}
  .btn.tomar{background:var(--azul)}
  .btn:disabled{opacity:.5;cursor:default}
  .aviso{padding:8px 16px;font-size:13px;flex:0 0 auto}
  .aviso.persona{background:#e8f1ff;color:#174f98} .aviso.bot{background:#e8f4ef;color:#155a45}
  .aviso.cerrada{background:#fdf3e1;color:#7a4b00}
  .msgs{flex:1;min-height:0;overflow-y:auto;padding:18px 7%;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain}
  .dia{align-self:center;font-size:11px;color:var(--tenue);background:#fff;border-radius:8px;padding:2px 10px;margin:8px 0}
  .m{max-width:72%;padding:7px 10px 5px;border-radius:9px;box-shadow:0 1px 1px rgba(0,0,0,.06);white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
  .m.cliente{align-self:flex-start;background:var(--b-cliente)}
  .m.bot{align-self:flex-end;background:var(--b-bot)}
  .m.persona{align-self:flex-end;background:var(--b-persona)}
  .m.nota{align-self:center;background:var(--b-nota);max-width:86%;font-size:13px}
  .m.fallo{background:var(--b-fallo)}
  .m .pie{display:flex;justify-content:flex-end;gap:6px;font-size:10.5px;color:var(--tenue);margin-top:3px}
  .m .autor{font-size:10.5px;font-weight:650;color:var(--tenue);margin-bottom:2px}
  .m img{max-width:260px;max-height:260px;border-radius:6px;display:block;cursor:zoom-in}
  .m a{color:var(--azul)}
  .check.leido{color:var(--azul)} .check.mal{color:var(--mal)}
  .caja{border-top:1px solid var(--borde);background:#f5f6f3;padding:10px 12px;display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
  .caja .fila{display:flex;gap:8px;align-items:flex-end}
  .caja textarea{flex:1;border:1px solid var(--borde);border-radius:10px;padding:9px 11px;font:inherit;resize:none;min-height:42px;max-height:160px}
  .caja .opciones{display:flex;gap:12px;align-items:center;font-size:12.5px;color:var(--tenue);flex-wrap:wrap}
  .caja .opciones label{display:flex;gap:4px;align-items:center;cursor:pointer}
  .enlace{border:0;background:none;color:var(--azul);cursor:pointer;padding:0;font-size:12.5px}
  .clip{border:1px solid var(--borde);background:#fff;border-radius:50%;width:42px;height:42px;flex:0 0 auto;cursor:pointer;font-size:18px;color:var(--marca)}
  .clip:disabled{opacity:.4;cursor:default}
  .adjunto{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--texto);background:#fff;border:1px solid var(--borde);border-radius:8px;padding:6px 10px}
  .adjunto button{border:0;background:none;color:var(--mal);cursor:pointer;font-size:12.5px}
  .inicio{flex:1;display:flex;align-items:center;justify-content:center;color:var(--tenue);padding:24px;text-align:center}
  .modal{position:fixed;inset:0;background:rgba(10,20,17,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
  .modal .caja-m{background:#fff;border-radius:12px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
  .modal h2{margin:0;font-size:17px}
  .modal label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--tenue)}
  .modal input,.modal select{font:inherit;padding:8px 10px;border:1px solid var(--borde);border-radius:8px;color:var(--texto)}
  .vista{background:#f5f6f3;border-radius:8px;padding:10px;font-size:13.5px;white-space:pre-wrap}
  .pieModal{display:flex;justify-content:flex-end;gap:8px}
  .error{color:var(--mal);font-size:13px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#14201c;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:9}
  .volver{display:none}
  .mudanza{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:8;background:#7a4b00;color:#fff;padding:10px 40px 10px 16px;border-radius:12px;font-size:13.5px;max-width:92vw;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .mudanza a{color:#ffe7b3;font-weight:650} .mudanza button{position:absolute;right:8px;top:6px;border:0;background:none;color:#fff;font-size:18px;cursor:pointer}
  @media (max-width:760px){
    .app{grid-template-columns:1fr}
    .conf{padding:14px 12px 40px}
    .tabla{display:block;overflow-x:auto}
    .app.abierto .lista{display:none}
    .app:not(.abierto) .chat{display:none}
    .volver{display:inline-block}
    .msgs{padding:14px 10px}
    .m{max-width:88%}
  }
</style>
</head>
<body>
<nav class="tabs" id="tabs"><button data-t="conv" class="on">Conversaciones</button><button data-t="opor" id="t-opor">Oportunidades</button><button data-t="conf" id="t-conf">Configuración</button></nav>
<section class="conf" id="conf" hidden></section>
<section class="conf" id="opor" hidden></section>
<div class="app" id="app">
  <aside class="lista">
    <div class="cab">
      <div class="fila"><h1>Conversaciones Great Revenue</h1><span class="estado" id="estado">Cargando…</span></div>
      <div class="botones"><button class="b-act" id="actualizar">↻ Actualizar</button><button class="b-nuevo" id="nuevo">+ Nuevo contacto</button></div>
      <input class="buscar" id="buscar" placeholder="Buscar nombre, número o texto" autocomplete="off">
      <div class="filtros" id="filtros">
        <button data-f="todas" class="on">Todas</button>
        <button data-f="atender" id="f-atender">Por atender</button>
        <button data-f="persona">A cargo de una persona</button>
        <button data-f="bot">Con el bot</button>
        <button data-f="sinleer">Sin leer</button>
        <button data-f="ventana">Ventana abierta</button>
        <button data-f="sinresp">Plantilla sin respuesta</button>
        <button data-f="respondio">Respondió a plantilla</button>
        <select id="f-linea" aria-label="Línea"><option value="">Todas las líneas</option></select>
        <select id="f-etapa" aria-label="Etapa"><option value="">Todas las etapas</option></select>
      </div>
    </div>
    <div class="items" id="items"></div>
  </aside>
  <main class="chat" id="chat"><div class="inicio">Elige una conversación, o escribe a alguien nuevo con “+ Nuevo contacto”.</div></main>
</div>
<div id="capa"></div>

<script>
(function(){
  var K = new URLSearchParams(location.search).get('k') || '';
  // Desde el 19 oct el portal vive en intelligence.greatrevenue.com/gr/whatsapp (sin n8n en la liga); la API sigue en n8n.
  // La misma pagina se sirve tambien en la liga vieja de n8n, donde avisa de la direccion nueva.
  var N8N = 'https://mikea.app.n8n.cloud';
  var NUEVA = 'https://intelligence.greatrevenue.com/gr/whatsapp';
  var enN8n = /\.n8n\.cloud$/.test(location.hostname);
  var BASE = (enN8n ? location.origin : N8N) + '/webhook/';
  var TZ = 'America/Mexico_City';
  var datos = { convs: [], numeros: [], ahora: Math.floor(Date.now()/1000) };
  var abrirPlantillaDesde = '';
  var pendiente = null;
  var sel = null, filtro = 'todas', plantillas = {}, ocupado = false, syncTimer = null;
  var conf = null, confTipo = '', linea = '', etapaF = '';
  var opor = null, oporF = { fase: '', etapa: '', linea: '', cel: '', pend: false, q: '' };
  var $ = function(id){ return document.getElementById(id); };

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function enlazar(s){ return esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }
  function tel(w){ var d = String(w||''); var m = d.match(/^521?(\d{10})$/); return m ? '+52 ' + m[1].replace(/(\d{2})(\d{4})(\d{4})/, '$1 $2 $3') : (d ? '+' + d : ''); }
  function fmt(ts, o){ return new Date(ts*1000).toLocaleString('es-MX', Object.assign({ timeZone: TZ }, o)); }
  function diaClave(ts){ return fmt(ts, { year:'numeric', month:'2-digit', day:'2-digit' }); }
  function hora(ts){ return fmt(ts, { hour:'2-digit', minute:'2-digit' }); }
  function cuando(ts){
    if (!ts) return '';
    var hoy = diaClave(Date.now()/1000), ayer = diaClave(Date.now()/1000 - 86400), d = diaClave(ts);
    if (d === hoy) return hora(ts);
    if (d === ayer) return 'ayer';
    return fmt(ts, { day:'numeric', month:'short' });
  }
  function nombreDia(ts){
    var hoy = diaClave(Date.now()/1000), ayer = diaClave(Date.now()/1000 - 86400), d = diaClave(ts);
    if (d === hoy) return 'Hoy'; if (d === ayer) return 'Ayer';
    return fmt(ts, { weekday:'long', day:'numeric', month:'long' });
  }
  function ventana(c){ var fin = (c.ultimo_entrante_ts||0) + 86400; return { abierta: fin > Date.now()/1000, fin: fin }; }
  function toast(t){ var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 3200); }

  function api(accion, extra){
    var cuerpo = Object.assign({ k: K, accion: accion }, extra || {});
    return fetch(BASE + 'gr-portal-api', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(cuerpo) })
      .then(function(r){ return r.text().then(function(t){
        var j = null; try { j = JSON.parse(t); } catch(e) {}
        if (!r.ok || !j) throw new Error((j && (j.error || j.message)) || (r.status === 500 ? 'La clave no es válida o el servidor falló' : 'Error ' + r.status));
        return j;
      }); });
  }

  // Actualizar: muestra lo que hay y, si algun numero tambien esta en Hootsuite, pide traer lo que se
  // contesto desde alla y vuelve a cargar UNA vez unos segundos despues. Nada corre solo.
  function actualizar(){
    var p = cargar();
    if (!(datos.numeros || []).some(function(n){ return n.hootsuite; })) return p;
    api('sync').catch(function(){});
    $('estado').textContent = 'Trayendo respuestas de Hootsuite…';
    clearTimeout(syncTimer); syncTimer = setTimeout(cargar, 15000);
    return p;
  }

  function cargar(){
    if (ocupado) return Promise.resolve(); ocupado = true;
    $('estado').textContent = 'Actualizando…'; $('actualizar').disabled = true;
    return api('cargar').then(function(j){
      datos = j; $('estado').textContent = 'Actualizado ' + hora(Math.floor(Date.now()/1000));
      pintarLista(); if (sel) pintarChat(false);
    }).catch(function(e){ $('estado').textContent = e.message; })
      .finally(function(){ ocupado = false; $('actualizar').disabled = false; });
  }

  function conv(w){ return datos.convs.find(function(c){ return c.wa_id === w; }); }
  function nombreNumero(pid){ var n = (datos.numeros || []).find(function(x){ return x.phone_id === pid; }); return n ? n.nombre : ''; }
  function variosNumeros(){ return (datos.numeros || []).length > 1; }

  // Etiqueta de lo que hay que hacer (7 oct): sale de por que el bot paso la conversacion a una persona.
  var ATENDER = { duda: 'el bot no supo qué decir', candados: 'el bot no supo qué decir', falla_tecnica: 'falla del bot', pide_persona: 'pidió hablar con alguien',
    precio_insiste: 'insiste en el precio', cliente_actual: 'ya es cliente', queja: 'queja', fuera_de_portafolio: 'fuera del portafolio',
    pais_excluido: 'país excluido', sin_horarios: 'quiere reunión sin horarios', cita_fallo: 'agendar a mano', cita_no_valida: 'agendar a mano' };
  function porAtender(c){ return (c.atender && c.atender !== 'reunion_agendada' && c.atender !== 'no_contactar') || c.esperando; }
  function etqAtencion(c){
    if (c.atender === 'reunion_agendada') return '<span class="etq agendada">Reunión agendada · dar seguimiento</span>';
    if (c.atender === 'no_contactar') return '<span class="etq nocontactar">No contactar</span>';
    var h = c.atender ? '<span class="etq atender">Atender · ' + esc(ATENDER[c.atender] || c.atender) + '</span>' : '';
    if (c.esperando) h += '<span class="etq espera">Esperando tu respuesta</span>';
    return h;
  }

  // Plantillas (19 oct, como en el portal de Pintaando): si se le mando una plantilla y si contesto despues.
  function plantillaInfo(c){
    var p = c.msgs.filter(function(m){ return m.tipo === 'plantilla' && m.dir === 'saliente' && (m.estado || '').indexOf('fallido') !== 0; });
    if (!p.length) return null;
    var ultima = p[p.length - 1].ts;
    return { enviadas: p.length, respondio: c.msgs.some(function(m){ return m.dir === 'entrante' && m.ts > p[0].ts; }), ultima: ultima };
  }
  function productoDe(c){ return conf && conf.conv_producto ? (conf.conv_producto[c.wa_id] || '') : ''; }
  // ===== HubSpot (20 oct): cada conversacion se liga a su oportunidad por los ultimos 10 digitos del telefono. =====
  var idxTel = {};
  function diez(t){ return String(t || '').replace(/\D/g, '').slice(-10); }
  function indexarTel(){
    idxTel = {};

  function leerBase64(f){

      r.onload = function(){ ok(String(r.result).replace(/^data:[^,]*,/, '')); };

    if (sel !== w) pendiente = null;
    sel = w; $('app').classList.add('abierto');
    pintarLista(); pintarChat(true);
    var c = conv(w);
    if (c && c.sin_leer) {
      var ultEnt = c.msgs.filter(function(m){ return m.dir === 'entrante'; }).slice(-1)[0];
      c.sin_leer = 0; pintarLista();
      api('conv', { wa_id: w, cambios: { visto_ts: Math.floor(Date.now()/1000) } }).catch(function(){});
      if (ultEnt && ventana(c).abierta) api('leido', { message_id: ultEnt.id, phone_id: c.phone_id }).catch(function(){});
    }
  }

  function enviar(){
    var c = conv(sel); var t = $('texto'); var txt = t.value.trim(); if (!c) return;
    var nota = $('comoNota').checked;
    var f = (!nota && pendiente) ? pendiente : null;
    if (!txt && !f) return;
    $('enviar').disabled = true;
    var p;
    if (nota) p = api('nota', { wa_id: c.wa_id, texto: txt });
    else if (f) {
      $('enviar').textContent = 'Enviando archivo…';
      p = leerBase64(f).then(function(b64){
        return api('archivo', { wa_id: c.wa_id, phone_id: c.phone_id, archivo: b64, mime: f.type || 'application/octet-stream', nombre_archivo: f.name, texto: txt });
      });
    }
    else p = api('enviar', { wa_id: c.wa_id, phone_id: c.phone_id, texto: txt });
    p.then(function(j){
      if (j.ok === false) { toast('No se envió: ' + (j.error || 'error de WhatsApp')); }
      else { t.value = ''; if (f) { pendiente = null; } if (!nota && c.modo === 'bot') toast('La conversación pasó a tu cargo'); }
      return cargar();
    }).catch(function(e){ toast(e.message); }).finally(function(){ if ($('enviar')) { $('enviar').disabled = false; mostrarAdjunto(); ajustarCaja(); } });
  }

  function cambiarModo(modo){
    var c = conv(sel); if (!c) return;
    api('conv', { wa_id: c.wa_id, cambios: { modo: modo } }).then(function(){
      c.modo = modo; pintarLista(); pintarChat(false);
      toast(modo === 'persona' ? 'Listo: la conversación es tuya y el bot ya no contesta' : 'Listo: el bot vuelve a contestar');
    }).catch(function(e){ toast(e.message); });
  }

  function modal(html){ $('capa').innerHTML = '<div class="modal" id="modal"><div class="caja-m">' + html + '</div></div>'; $('modal').onclick = function(e){ if (e.target.id === 'modal') cerrar(); }; }
  function cerrar(){ $('capa').innerHTML = ''; }

  function renombrar(){
    var c = conv(sel);
    modal('<h2>Nombre del contacto</h2><label>Nombre<input id="nNombre" value="' + esc(c.nombre) + '" maxlength="80"></label><div class="pieModal"><button class="btn sec" id="cancelar">Cancelar</button><button class="btn" id="guardar">Guardar</button></div>');
    $('cancelar').onclick = cerrar; $('nNombre').focus();
    $('guardar').onclick = function(){
      var n = $('nNombre').value.trim();
      api('conv', { wa_id: c.wa_id, cambios: { nombre: n } }).then(function(){ c.nombre = n; cerrar(); pintarLista(); pintarChat(false); }).catch(function(e){ toast(e.message); });
    };
  }

  function traerPlantillas(pid){
    if (plantillas[pid]) return Promise.resolve(plantillas[pid]);
    return api('plantillas', { phone_id: pid }).then(function(j){ if (!j.ok) throw new Error(j.error); plantillas[pid] = j.plantillas; return j.plantillas; });
  }

  // Sirve para dos cosas: escribirle a un contacto nuevo y reabrir una conversación con la ventana cerrada.
  function abrirPlantilla(c){
    var nuevo = !c;
    modal('<h2>' + (nuevo ? 'Escribir a un contacto nuevo' : 'Enviar plantilla a ' + esc(c.nombre || tel(c.wa_id))) + '</h2>' +
      (nuevo && variosNumeros() ? '<label>Enviar desde<select id="pDesde">' + datos.numeros.map(function(n){ return '<option value="' + esc(n.phone_id) + '">' + esc(n.nombre) + '</option>'; }).join('') + '</select></label>' : '') +
      (nuevo ? '<label>Número de WhatsApp (con lada; 10 dígitos si es de México)<input id="pNum" inputmode="tel" placeholder="55 1234 5678"></label><label>Nombre (opcional)<input id="pNom" maxlength="80"></label>' : '') +
      '<label>Plantilla<select id="pSel"><option>Cargando plantillas…</option></select></label><div id="pVars"></div><div class="vista" id="pVista"></div><div class="error" id="pErr"></div>' +
      '<p style="margin:0;font-size:12px;color:var(--tenue)">WhatsApp solo deja iniciar una conversación con plantillas aprobadas por Meta, y la persona debe haber aceptado recibir mensajes del negocio.</p>' +
      '<div class="pieModal"><button class="btn sec" id="cancelar">Cancelar</button><button class="btn" id="pEnviar" disabled>Enviar</button></div>');
    $('cancelar').onclick = cerrar;
    var desde = function(){ return nuevo ? ($('pDesde') ? $('pDesde').value : ((datos.numeros[0] || {}).phone_id || '')) : c.phone_id; };
    if ($('pDesde')) $('pDesde').onchange = function(){ cerrar(); abrirPlantillaDesde = this.value; abrirPlantilla(null); };
    if (nuevo && $('pDesde') && abrirPlantillaDesde) $('pDesde').value = abrirPlantillaDesde;
    traerPlantillas(desde()).then(function(ls){
      var ok = ls.filter(function(p){ return p.soportada; });
      if (!ok.length) { $('pSel').innerHTML = '<option>No hay plantillas aprobadas</option>'; $('pErr').textContent = 'Crea y aprueba una plantilla en el WhatsApp Manager de Meta.'; return; }
      $('pSel').innerHTML = ok.map(function(p, i){ return '<option value="' + i + '">' + esc(p.nombre) + ' · ' + esc(p.idioma) + ' · ' + esc(p.categoria.toLowerCase()) + '</option>'; }).join('');
      var actual = function(){ return ok[Number($('pSel').value)]; };
      var vista = function(){
        var p = actual(); var t = p.texto; var n = 0;
        document.querySelectorAll('.pvar').forEach(function(inp){ n++; t = t.replace(/\{\{\s*[^}]+\s*\}\}/, inp.value || '[' + n + ']'); });
        $('pVista').textContent = t;
      };
      var pintarVars = function(){
        var p = actual(); var h = '';
        for (var i = 1; i <= p.variables; i++) h += '<label>Variable ' + i + '<input class="pvar"></label>';
        $('pVars').innerHTML = h;
        document.querySelectorAll('.pvar').forEach(function(inp){ inp.oninput = vista; });
        vista();
      };
      $('pSel').onchange = pintarVars; pintarVars(); $('pEnviar').disabled = false;
      $('pEnviar').onclick = function(){
        var p = actual(); var vars = []; var falta = false;
        document.querySelectorAll('.pvar').forEach(function(inp){ if (!inp.value.trim()) falta = true; vars.push(inp.value.trim()); });
        if (falta) { $('pErr').textContent = 'Llena todas las variables.'; return; }
        var extra = { plantilla: p.nombre, idioma: p.idioma, variables: vars, vista: $('pVista').textContent, phone_id: desde() };
        if (nuevo) {
          var num = $('pNum').value.replace(/\D/g, '');
          if (num.length < 10) { $('pErr').textContent = 'Escribe el número completo.'; return; }
          extra.numero = num; extra.nombre = $('pNom').value.trim();
        } else extra.wa_id = c.wa_id;
        $('pEnviar').disabled = true; $('pErr').textContent = '';
        api('plantilla', extra).then(function(j){
          if (j.ok === false) { $('pErr').textContent = 'WhatsApp no la aceptó: ' + (j.error || ''); $('pEnviar').disabled = false; return; }
          cerrar(); toast('Plantilla enviada');
          return cargar().then(function(){ if (j.wa_id) abrir(j.wa_id); });
        }).catch(function(e){ $('pErr').textContent = e.message; $('pEnviar').disabled = false; });
      };
    }).catch(function(e){ $('pErr').textContent = e.message; });
  }

  // ===== Configuracion (19 oct): solo lectura. Productos, plantillas y pendientes del bot. =====
  // Los datos salen de /webhook/gr-portal-config: el catalogo del motor (el mismo de /gr/portal#productos),
  // las fichas del bot y las plantillas de Meta con su estado.
  var ESTADO_FICHA = { al_dia: 'Al día', atrasada: 'Atrasada', sin_pv: 'Sin PV', sin_ficha: 'Falta' };
  var ESTADO_META = { APPROVED: 'Aprobada', PENDING: 'En revisión', REJECTED: 'Rechazada', PAUSED: 'Pausada', DISABLED: 'Desactivada' };
  function cargarConf(){
    return fetch(BASE + 'gr-portal-config', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ k: K }) })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!j.ok) throw new Error(j.error || 'No se pudo leer la configuración');
        conf = j;
        $('t-conf').innerHTML = 'Configuración' + (j.pendientes.length ? '<span class="num">' + j.pendientes.length + '</span>' : '');
        pintarSelects();
        pintarLista(); if (!$('conf').hidden) pintarConf();
      }).catch(function(e){ if (!$('conf').hidden) $('conf').innerHTML = '<p class="error">' + esc(e.message) + '</p>'; });
  }
  function liga(o){ return o && o.url ? '<a href="' + esc(o.url) + '" target="_blank" rel="noopener">' + esc(o.nombre) + '</a>' : '<span class="estado-f falta">' + esc(o && o.nombre || 'Por definir') + '</span>'; }
  function pintarConf(){
    if (!conf) { $('conf').innerHTML = '<p class="tenue">Cargando configuración…</p>'; return; }
    var tipos = {}; conf.pendientes.forEach(function(p){ tipos[p.tipo] = (tipos[p.tipo] || 0) + 1; });
    var pend = conf.pendientes.filter(function(p){ return !confTipo || p.tipo === confTipo; });
    var h = '<h2>Pendientes (' + conf.pendientes.length + ')</h2><p class="nota">Lo que está mal o falta para que el bot y las plantillas estén al día. Se recalcula cada vez que abres esta pestaña.</p>' +
      '<div class="resumen" id="resumen"><button data-tipo="" class="' + (confTipo ? '' : 'on') + '">Todos</button>' +
      Object.keys(tipos).map(function(t){ return '<button data-tipo="' + esc(t) + '" class="' + (confTipo === t ? 'on' : '') + '">' + esc(t) + ' (' + tipos[t] + ')</button>'; }).join('') + '</div>' +
      '<table class="tabla"><thead><tr><th>Producto</th><th>Qué</th><th>Detalle</th><th>Lo resuelve</th></tr></thead><tbody>' +
      pend.map(function(p){ return '<tr><td>' + esc(p.producto.replace(/ \(.*\)$/, '')) + '</td><td>' + esc(p.tipo) + '</td><td>' + esc(p.texto) + '</td><td>' + esc(p.quien) + '</td></tr>'; }).join('') + '</tbody></table>';
    h += '<h2>Productos (' + conf.productos.length + ')</h2><p class="nota">La propuesta de valor, el ICP y qué se ofrece son los del catálogo del motor. Hoy se cambian en <a href="https://intelligence.greatrevenue.com/gr/portal#productos" target="_blank" rel="noopener">intelligence.greatrevenue.com/gr/portal#productos</a>.</p>' +
      '<table class="tabla"><thead><tr><th>Producto</th><th>Qué se ofrece</th><th>Propuesta de valor vigente</th><th>ICP vigente</th><th>Ficha del bot</th><th>Plantilla Open+3</th><th>Lidera · aviso del bot</th></tr></thead><tbody>' +
      conf.productos.map(function(p){
        var v = p.plantillas.filter(function(t){ return t.version === '2'; })[0];
        return '<tr><td><b>' + esc(p.nombre.replace(/ \(.*\)$/, '')) + '</b><div class="tenue">' + esc(p.codigo) + '</div></td>' +
          '<td>' + (/^por definir$/i.test(p.ofrece) || !p.ofrece ? '<span class="estado-f falta">Por definir</span>' : esc(p.ofrece)) + '</td>' +
          '<td>' + liga(p.propuesta) + '</td><td>' + liga(p.icp) + '</td>' +
          '<td><span class="estado-f ' + esc(p.ficha.estado) + '">' + esc(ESTADO_FICHA[p.ficha.estado] || p.ficha.estado) + '</span></td>' +
          '<td>' + (v ? esc(v.nombre) + ' <span class="estado-f ' + esc(v.estado) + '">' + esc(ESTADO_META[v.estado] || v.estado) + '</span>' : '<span class="estado-f falta">Falta</span>') + '</td>' +
          '<td>' + esc(p.lidera) + '<div class="tenue">aviso: ' + esc(p.seguimiento_bot.join(', ') || '—') + '</div></td></tr>';
      }).join('') + '</tbody></table>';
    h += '<h2>Plantillas en Meta (' + conf.plantillas.length + ')</h2><p class="nota">Todas las plantillas de la cuenta de WhatsApp, con su estado en Meta. Las v2 son las vigentes de Open+3.</p>' +
      conf.plantillas.map(function(t){
        return '<div class="tarjeta"><b>' + esc(t.nombre) + '</b> <span class="estado-f ' + esc(t.estado) + '">' + esc(ESTADO_META[t.estado] || t.estado) + '</span>' +
          ' <span class="tenue">· ' + esc((t.categoria || '').toLowerCase()) + ' · ' + t.variables + ' variable' + (t.variables === 1 ? '' : 's') + (t.motivo ? ' · motivo: ' + esc(t.motivo) : '') + '</span>' +
          '<details><summary class="tenue" style="cursor:pointer">Ver texto</summary><div class="plantilla-texto">' + esc(t.texto) + '</div></details></div>';
      }).join('');
    $('conf').innerHTML = h;
    $('resumen').onclick = function(e){ var b = e.target.closest('button'); if (!b) return; confTipo = b.getAttribute('data-tipo'); pintarConf(); };
  }
  $('tabs').onclick = function(e){
    var b = e.target.closest('button'); if (!b) return;
    var t = b.getAttribute('data-t');
    document.querySelectorAll('#tabs button').forEach(function(x){ x.classList.toggle('on', x === b); });
    $('conf').hidden = t !== 'conf'; $('opor').hidden = t !== 'opor'; $('app').hidden = t !== 'conv';
    if (t === 'conf') { pintarConf(); cargarConf(); }
    if (t === 'opor') { pintarOpor(); cargarOpor(); }
  };
  $('f-linea').onchange = function(){ linea = this.value; pintarLista(); };
  $('f-etapa').onchange = function(){ etapaF = this.value; pintarLista(); };
  $('f-linea').onclick = $('f-etapa').onclick = function(e){ e.stopPropagation(); };

  $('actualizar').onclick = actualizar;
  $('nuevo').onclick = function(){ abrirPlantilla(null); };
  $('buscar').oninput = pintarLista;
  $('filtros').onclick = function(e){
    var b = e.target.closest('button'); if (!b) return;
    filtro = b.getAttribute('data-f');
    document.querySelectorAll('#filtros button').forEach(function(x){ x.classList.toggle('on', x === b); });
    pintarLista();
  };
  $('items').onclick = function(e){ var it = e.target.closest('.item'); if (it) abrir(it.getAttribute('data-w')); };
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') cerrar(); });

  if (enN8n && K) {
    var aviso = document.createElement('div'); aviso.className = 'mudanza';
    aviso.innerHTML = 'El portal cambió de dirección: <a href="' + NUEVA + '?k=' + encodeURIComponent(K) + '">intelligence.greatrevenue.com/gr/whatsapp</a>. Guarda la liga nueva; esta dejará de usarse. <button type="button" aria-label="Cerrar">×</button>';
    aviso.querySelector('button').onclick = function(){ aviso.remove(); };
    document.body.appendChild(aviso);
  }
  if (!K) { $('estado').textContent = 'Falta la clave en la liga (?k=…)'; $('items').innerHTML = '<div class="vacio">Abre el portal con la liga completa que incluye la clave.</div>'; }
  else { cargar().then(function(){ if ((datos.numeros || []).some(function(n){ return n.hootsuite; })) actualizar(); }); cargarConf(); cargarOpor(); }
})();
</script>
</body>
