<div class="app" id="app">
  <aside class="lista">
    <div class="cab">
      <div class="fila"><h1>Conversaciones</h1><span class="estado" id="estado">Cargando…</span></div>
      <div class="botones"><button class="b-act" id="actualizar">↻ Actualizar</button><button class="b-nuevo" id="nuevo">+ Nuevo contacto</button></div>
      <input class="buscar" id="buscar" placeholder="Buscar nombre, número o texto" autocomplete="off">
      <div class="filtros" id="filtros">
        <button data-f="todas" class="on">Todas</button>
        <button data-f="atender" id="f-atender">Por atender</button>
        <button data-f="persona">A cargo de una persona</button>
        <button data-f="bot">Con el bot</button>
        <button data-f="sinleer">Sin leer</button>
        <button data-f="ventana">Ventana abierta</button>
        <button data-f="sinresp">Plantilla sin respuesta</button>
        <button data-f="respondio">Respondió a plantilla</button>
        <select id="f-linea" aria-label="Línea"><option value="">Todas las líneas</option></select>
        <select id="f-etapa" aria-label="Etapa"><option value="">Todas las etapas</option></select>
      </div>
    </div>
    <div class="items" id="items"></div>
  </aside>
  <main class="chat" id="chat"><div class="inicio">Elige una conversación, o escribe a alguien nuevo con “+ Nuevo contacto”.</div></main>
</div>
<div id="capa"></div>

<script>
(function(){
  var K = new URLSearchParams(location.search).get('k') || '';
  // Desde el 19 oct el portal vive en intelligence.greatrevenue.com/gr/whatsapp (sin n8n en la liga); la API sigue en n8n.
  // La misma pagina se sirve tambien en la liga vieja de n8n, donde avisa de la direccion nueva.
  var N8N = 'https://mikea.app.n8n.cloud';
  var NUEVA = 'https://intelligence.greatrevenue.com/gr/whatsapp';
  var enN8n = /\.n8n\.cloud$/.test(location.hostname);
  var BASE = (enN8n ? location.origin : N8N) + '/webhook/';
  var TZ = 'America/Mexico_City';
  var datos = { convs: [], numeros: [], ahora: Math.floor(Date.now()/1000) };
  var abrirPlantillaDesde = '';
  var pendiente = null;
  var sel = null, filtro = 'todas', plantillas = {}, ocupado = false, syncTimer = null;
  var conf = null, confTipo = '', linea = '', etapaF = '';
  var opor = null, oporF = { fase: '', linea: '', persona: '', wa: '', pend: false, sem: '', origen: '', senal: '', monto: '', cierre: '', nuevas: '', tipo: '', q: '' };
  var $ = function(id){ return document.getElementById(id); };

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function enlazar(s){ return esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }
  function tel(w){ var d = String(w||''); var m = d.match(/^521?(\d{10})$/); return m ? '+52 ' + m[1].replace(/(\d{2})(\d{4})(\d{4})/, '$1 $2 $3') : (d ? '+' + d : ''); }
  function fmt(ts, o){ return new Date(ts*1000).toLocaleString('es-MX', Object.assign({ timeZone: TZ }, o)); }
  function diaClave(ts){ return fmt(ts, { year:'numeric', month:'2-digit', day:'2-digit' }); }
  function hora(ts){ return fmt(ts, { hour:'2-digit', minute:'2-digit' }); }
  function cuando(ts){
    if (!ts) return '';
    var hoy = diaClave(Date.now()/1000), ayer = diaClave(Date.now()/1000 - 86400), d = diaClave(ts);
    if (d === hoy) return hora(ts);
    if (d === ayer) return 'ayer';
    return fmt(ts, { day:'numeric', month:'short' });
  }
  function nombreDia(ts){
    var hoy = diaClave(Date.now()/1000), ayer = diaClave(Date.now()/1000 - 86400), d = diaClave(ts);
    if (d === hoy) return 'Hoy'; if (d === ayer) return 'Ayer';
    return fmt(ts, { weekday:'long', day:'numeric', month:'long' });
  }
  function ventana(c){ var fin = (c.ultimo_entrante_ts||0) + 86400; return { abierta: fin > Date.now()/1000, fin: fin }; }
  function toast(t){ var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 3200); }

  function api(accion, extra){
    var cuerpo = Object.assign({ k: K, accion: accion }, extra || {});
    return fetch(BASE + 'gr-portal-api', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(cuerpo) })
      .then(function(r){ return r.text().then(function(t){
        var j = null; try { j = JSON.parse(t); } catch(e) {}
        if (!r.ok || !j) throw new Error((j && (j.error || j.message)) || (r.status === 500 ? 'La clave no es válida o el servidor falló' : 'Error ' + r.status));
        return j;
      }); });
  }

  // Actualizar: muestra lo que hay y, si algun numero tambien esta en Hootsuite, pide traer lo que se
  // contesto desde alla y vuelve a cargar UNA vez unos segundos despues. Nada corre solo.
  function actualizar(){
    var p = cargar();
    if (!(datos.numeros || []).some(function(n){ return n.hootsuite; })) return p;
    api('sync').catch(function(){});
    $('estado').textContent = 'Trayendo respuestas de Hootsuite…';
    clearTimeout(syncTimer); syncTimer = setTimeout(cargar, 15000);
    return p;
  }

  function cargar(){
    if (ocupado) return Promise.resolve(); ocupado = true;
    $('estado').textContent = 'Actualizando…'; $('actualizar').disabled = true;
    return api('cargar').then(function(j){
      datos = j; $('estado').textContent = 'Actualizado ' + hora(Math.floor(Date.now()/1000));
      pintarLista(); if (sel) pintarChat(false);
    }).catch(function(e){ $('estado').textContent = e.message; })
      .finally(function(){ ocupado = false; $('actualizar').disabled = false; });
  }

  function conv(w){ return datos.convs.find(function(c){ return c.wa_id === w; }); }
  function nombreNumero(pid){ var n = (datos.numeros || []).find(function(x){ return x.phone_id === pid; }); return n ? n.nombre : ''; }
  function variosNumeros(){ return (datos.numeros || []).length > 1; }

  // Etiqueta de lo que hay que hacer (7 oct): sale de por que el bot paso la conversacion a una persona.
  var ATENDER = { duda: 'el bot no supo qué decir', candados: 'el bot no supo qué decir', falla_tecnica: 'falla del bot', pide_persona: 'pidió hablar con alguien',
    precio_insiste: 'insiste en el precio', cliente_actual: 'ya es cliente', queja: 'queja', fuera_de_portafolio: 'fuera del portafolio',
    pais_excluido: 'país excluido', sin_horarios: 'quiere reunión sin horarios', cita_fallo: 'agendar a mano', cita_no_valida: 'agendar a mano' };
  function porAtender(c){ return (c.atender && c.atender !== 'reunion_agendada' && c.atender !== 'no_contactar') || c.esperando; }
  function etqAtencion(c){
    if (c.atender === 'reunion_agendada') return '<span class="etq agendada">Reunión agendada · dar seguimiento</span>';
    if (c.atender === 'no_contactar') return '<span class="etq nocontactar">No contactar</span>';
    var h = c.atender ? '<span class="etq atender">Atender · ' + esc(ATENDER[c.atender] || c.atender) + '</span>' : '';
    if (c.esperando) h += '<span class="etq espera">Esperando tu respuesta</span>';
    return h;
  }

  // Plantillas (19 oct, como en el portal de Pintaando): si se le mando una plantilla y si contesto despues.
  function plantillaInfo(c){
    var p = c.msgs.filter(function(m){ return m.tipo === 'plantilla' && m.dir === 'saliente' && (m.estado || '').indexOf('fallido') !== 0; });
    if (!p.length) return null;
    var ultima = p[p.length - 1].ts;
    return { enviadas: p.length, respondio: c.msgs.some(function(m){ return m.dir === 'entrante' && m.ts > p[0].ts; }), ultima: ultima };
  }
  function productoDe(c){ return conf && conf.conv_producto ? (conf.conv_producto[c.wa_id] || '') : ''; }
  // ===== HubSpot (20 oct): cada conversacion se liga a su oportunidad por los ultimos 10 digitos del telefono. =====
  var idxTel = {};
  function diez(t){ return String(t || '').replace(/\D/g, '').slice(-10); }
  function indexarTel(){
    idxTel = {};
    ((opor && opor.oportunidades) || []).forEach(function(o){ o.contactos.forEach(function(ct){
      [ct.c10 || ct.cel10, ct.tel10].forEach(function(t){ if (t && !idxTel[t]) idxTel[t] = { o: o, c: ct }; });
    }); });
  }
  function oporDe(c){ return idxTel[diez(c.wa_id)] || null; }
  function convDeTel(t){ return t ? datos.convs.find(function(c){ return diez(c.wa_id) === t; }) : null; }
  // Linea de la conversacion: la de su oportunidad; si no tiene, la del producto que entendio el bot.
  function lineaDe(c){
    var op = oporDe(c); if (op) return op.o.linea;
    var slug = productoDe(c); if (!slug || !conf) return { codigo: '', nombre: '' };
    var p = (conf.productos || []).find(function(x){ return x.slug === slug; });
    return p ? { codigo: p.codigo, nombre: p.nombre.replace(/ \(.*\)$/, '') } : { codigo: '', nombre: '' };
  }
  function coincideEtapa(op, f){
    if (f === 'sin') return !op;
    if (!op) return false;
    if (f === 'prospeccion' || f === 'venta') return op.o.etapa.fase === f;
    return op.o.etapa.id === f;
  }
  function opcionesEtapa(todas){
    var et = (opor && opor.etapas) || [];
    var grupo = function(f, t){ return '<optgroup label="' + t + '"><option value="' + f + '">Toda la ' + t.toLowerCase() + '</option>' +
      et.filter(function(e){ return e.fase === f; }).map(function(e){ return '<option value="' + esc(e.id) + '">' + esc(e.nombre) + '</option>'; }).join('') + '</optgroup>'; };
    return '<option value="">' + todas + '</option>' + grupo('prospeccion', 'Prospección') + grupo('venta', 'Venta');
  }
  function lineasConocidas(){
    var m = {};
    ((conf && conf.productos) || []).forEach(function(p){ m[p.codigo] = p.nombre.replace(/ \(.*\)$/, ''); });
    ((opor && opor.lineas) || []).forEach(function(l){ if (l.codigo !== 'SIN') m[l.codigo] = l.nombre; });
    return Object.keys(m).map(function(k){ return { codigo: k, nombre: m[k] }; }).sort(function(a, b){ return a.nombre.localeCompare(b.nombre); });
  }
  function pintarSelects(){
    $('f-linea').innerHTML = '<option value="">Todas las líneas</option>' + lineasConocidas().map(function(l){ return '<option value="' + esc(l.codigo) + '">' + esc(l.nombre) + '</option>'; }).join('');
    $('f-linea').value = linea;
    $('f-etapa').innerHTML = opcionesEtapa('Todas las etapas') + '<option value="sin">Sin oportunidad en HubSpot</option>';
    $('f-etapa').value = etapaF;
  }

  // Estado de cada contacto frente a WhatsApp. El numero es uno solo: el celular (es WhatsApp); si HubSpot solo
  // tiene "telefono", se toma ese, como en el tablero de Great Revenue.
  function estadoContacto(ct){
    var c = convDeTel(ct.c10);
    if (c) {
      if (c.msgs.some(function(m){ return m.dir === 'entrante'; })) return { k: 'conversa', t: 'Ya conversa', c: c };
      if (plantillaInfo(c)) return { k: 'enviada', t: 'Plantilla enviada', c: c };
    }
    if (ct.c10) return { k: 'listo', t: 'Listo para WhatsApp' };
    return { k: 'falta', t: 'Falta celular' };
  }
  // Pendiente de Open+3: la oportunidad esta en Senal Detectada (asi nace el Open+3) y nadie le ha escrito por WhatsApp.
  // Pendiente de Open+3: su senal es Open+3 (gr_tipo_senal, como el tablero), sigue en Senal Detectada y nadie le ha escrito por WhatsApp.
  // Las de DUO o Sequence no llevan la plantilla Open+3.
  function pendienteOpen3(o){ return o.etapa.id === '1332596061' && (o.senal === 'Open+3' || o.origen === 'Open+3') && !o.contactos.some(function(ct){ var e = estadoContacto(ct).k; return e === 'conversa' || e === 'enviada'; }); }
  // Estado de la oportunidad en WhatsApp: el mas avanzado de sus contactos.
  function estadoOp(o){ var orden = ['falta', 'listo', 'enviada', 'conversa'], m = 0; o.contactos.forEach(function(ct){ m = Math.max(m, orden.indexOf(estadoContacto(ct).k)); }); return orden[m]; }
  function personasOp(o){ return [o.responsable, o.apoyo, o.dueno_corto].filter(Boolean); }
  // Plantilla Open+3 vigente de cada linea (codigo del catalogo -> sufijo de gr_open3_*_v2).
  var SUFIJO = { TW: 'tw', HS: 'hs', AM: 'am', AEO: 'aeo', GenIA: 'genia', GENIARH: 'rh', GENIAVTA: 'vta', GENIACOB: 'cob', SYN: 'syn', ITS: 'its', LT: 'lt', BD: 'bd', '360': '360', WB: 'wb' };
  var elegidos = {};   // contact_id -> { o, ct }

  function empresaDe(o, ct){
    if (o && o.empresa && o.empresa.nombre) return o.empresa.nombre;
    if (ct && ct.empresa) return ct.empresa;
    var t = String(o.nombre || '').replace(/^P_/i, '').split('_');
    return (t[1] || '').replace(/([a-z])([A-Z])/g, '$1 $2');
  }
  function chips(k, opciones, actual){
    return opciones.map(function(op){ return '<button class="chip' + (String(actual) === String(op[0]) ? ' on' : '') + '" data-k="' + k + '" data-v="' + esc(op[0]) + '">' + esc(op[1]) + '</button>'; }).join('');
  }

  function cargarOpor(){
    return fetch(BASE + 'gr-portal-oportunidades', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ k: K }) })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!j.ok) throw new Error(j.error || j.message || 'No se pudo leer HubSpot');
        j.oportunidades = j.oportunidades.filter(function(o){ return !/_INTERNO$/i.test(o.nombre); });
        j.oportunidades.forEach(function(o){ o.contactos.forEach(function(ct){ ct.cel = ct.celular || ct.telefono || ''; ct.c10 = diez(ct.cel); }); });
        opor = j; indexarTel(); pintarSelects();
        var n = j.oportunidades.filter(pendienteOpen3).length;
        $('t-opor').innerHTML = 'Oportunidades' + (n ? '<span class="num">' + n + '</span>' : '');
        pintarLista(); if (!$('opor').hidden) pintarOpor();
      }).catch(function(e){ if (!$('opor').hidden) $('opor').innerHTML = '<p class="error">' + esc(e.message) + '</p>'; });
  }

  // Oportunidades con el formato del tablero de Great Revenue: filtros en chips y una columna por etapa.
  function pintarOpor(){
    if (!opor) { $('opor').innerHTML = '<p class="tenue">Leyendo oportunidades de HubSpot…</p>'; return; }
    var f = oporF, q = f.q.trim().toLowerCase();
    var todas = opor.oportunidades;
    // Mismos filtros del tablero de Great Revenue (persona, semaforo, producto, monto, fecha de cierre, nuevas, P_)
    // mas los de WhatsApp (estado del contacto, pendientes de Open+3). Cada chip dice cuantas hay con los demas filtros.
    var hoy = new Date(), ym = function(d){ return d.getFullYear() * 12 + d.getMonth(); }, hoyS = hoy.toISOString().slice(0, 10);
    var PRUEBAS = {
      pend: function(o){ return pendienteOpen3(o); },
      fase: function(o, v){ return o.etapa.fase === v; },
      linea: function(o, v){ return o.linea.codigo === v; },
      persona: function(o, v){ return v === 'Sin' ? !o.responsable : personasOp(o).indexOf(v) >= 0; },
      wa: function(o, v){ return estadoOp(o) === v; },
      sem: function(o, v){ return v === 'sin' ? !o.semaforo : o.semaforo === v; },
      origen: function(o, v){ return v === 'sin' ? !o.origen : o.origen === v; },
      senal: function(o, v){ return v === 'sin' ? !o.senal : o.senal === v; },
      monto: function(o, v){ return (o.monto || 0) >= Number(v); },
      cierre: function(o, v){
        if (v === 'sin') return !o.cierre;
        if (!o.cierre) return false;
        var c = new Date(o.cierre + 'T12:00:00'), d = ym(c) - ym(hoy);
        if (v === 'vencida') return o.cierre < hoyS;
        if (v === 'mes') return d === 0 && o.cierre >= hoyS;
        if (v === 'prox') return d === 1;
        return o.cierre >= hoyS && Math.floor(c.getMonth() / 3) === Math.floor(hoy.getMonth() / 3) && c.getFullYear() === hoy.getFullYear();
      },
      nuevas: function(o, v){ return o.creada && (hoy - new Date(o.creada + 'T12:00:00')) / 864e5 <= Number(v); },
      tipo: function(o, v){ return v === 'p' ? o.prospeccion : !o.prospeccion; }
    };
    var pasa = function(o, sin){
      for (var k in PRUEBAS) { if (k === sin) continue; var v = k === 'pend' ? f.pend : f[k]; if (v && !PRUEBAS[k](o, v)) return false; }
      if (q && (o.nombre + ' ' + o.dueno + ' ' + o.responsable + ' ' + (o.empresa ? o.empresa.nombre : '') + ' ' + o.contactos.map(function(ct){ return ct.nombre + ' ' + ct.empresa; }).join(' ')).toLowerCase().indexOf(q) < 0) return false;
      return true;
    };
    var ls = todas.filter(function(o){ return pasa(o); });
    // Chips con su cuenta: cuantas quedarian al elegir ese valor, respetando los demas filtros (como el tablero).
    var fila = function(k, titulo, opciones, todasTxt){
      var base = todas.filter(function(o){ return pasa(o, k); });
      return '<span class="flabel">' + titulo + '</span><div class="filters">' + '<button class="chip' + (f[k] ? '' : ' on') + '" data-k="' + k + '" data-v="">' + (todasTxt || 'Todas') + ' (' + base.length + ')</button>' +
        opciones.map(function(op){
          var n = base.filter(function(o){ return PRUEBAS[k](o, op[0]); }).length;
          return '<button class="chip' + (String(f[k]) === String(op[0]) ? ' on' : '') + (n ? '' : ' cero') + '" data-k="' + k + '" data-v="' + esc(op[0]) + '">' + op[1] + ' (' + n + ')</button>';
        }).join('') + '</div>';
    };
    var pend = todas.filter(pendienteOpen3);
    var cts = [].concat.apply([], todas.map(function(o){ return o.contactos; }));
    var lineasF = (opor.catalogo || opor.lineas).map(function(l){ return [l.codigo, esc(l.nombre)]; });
    if (todas.some(function(o){ return o.linea.codigo === 'SIN'; })) lineasF.push(['SIN', 'Sin línea']);
    var personasF = (opor.equipo || []).map(function(p){ return [p, esc(p)]; }).concat([['Sin', 'Sin responsable']]);
    var principales = fila('linea', 'Línea:', lineasF) + fila('persona', 'Persona:', personasF, 'Todos') +
      fila('wa', 'WhatsApp:', [['falta', 'Falta celular'], ['listo', 'Con celular, sin escribir'], ['enviada', 'Plantilla enviada'], ['conversa', 'Ya conversa']]) +
      fila('sem', 'Semáforo:', [['rojo', '<span class="sem rojo"></span>Vencidas'], ['amarillo', '<span class="sem amarillo"></span>Próximas'], ['verde', '<span class="sem verde"></span>Al día'], ['aparcada', '<span class="sem aparcada"></span>Aparcadas'], ['sin', 'Sin semáforo']]) +
      fila('fase', 'Fase:', [['prospeccion', 'Prospección'], ['venta', 'Venta']]);
    var mas = fila('origen', 'Llegó por:', [['Sequence', 'Sequence'], ['DUO', 'DUO'], ['Referido', 'Referido'], ['sin', 'Sin dato']], 'Todos') +
      fila('senal', 'Señal:', [['Reply', 'Reply (contestó)'], ['Open+3', 'Open+3 (abrió 3 o más veces)'], ['sin', 'Sin dato']], 'Todas') +
      fila('monto', 'Monto:', [['10000', '≥ $10K'], ['50000', '≥ $50K'], ['100000', '≥ $100K']], 'Todos') +
      fila('cierre', 'Cierre:', [['vencida', 'Vencidas'], ['mes', 'Este mes'], ['prox', 'Próximo mes'], ['trim', 'Este trimestre'], ['sin', 'Sin fecha']], 'Todas') +
      fila('nuevas', 'Nuevas:', [['7', 'Últimos 7 días'], ['30', 'Últimos 30 días']], 'Todas') +
      fila('tipo', 'Tipo:', [['p', 'Prospección (P_)'], ['np', 'Sin P_']], 'Todas');
    var nMas = ['origen', 'senal', 'monto', 'cierre', 'nuevas', 'tipo'].filter(function(k){ return f[k]; }).length;
    var h = '<div class="card"><div class="card-h"><h2><span class="n">1</span>Oportunidades abiertas en HubSpot</h2><span class="tenue">' + todas.length + ' oportunidades · contactos con celular: ' + cts.filter(function(ct){ return ct.c10; }).length + ' de ' + cts.length + '</span></div>' +
      '<p class="nota">Salen de HubSpot cada vez que abres esta pestaña. La línea sale del nombre de la oportunidad; la persona es la responsable, el apoyo o la dueña en HubSpot (los mismos nombres del tablero). El semáforo, el camino de llegada y los días en la etapa son los del tablero. El celular es el WhatsApp de la persona: si falta, escríbelo en la tarjeta y se guarda en HubSpot para todo el equipo. No se revela nada en Amplemarket.</p>' +
      '<div class="filters"><span class="flabel">Open+3:</span><button class="chip pend' + (f.pend ? ' on' : '') + '" data-k="pend" data-v="1">Pendientes de Open+3 · ' + pend.length + ' (' + pend.filter(function(o){ return o.contactos.some(function(ct){ return ct.c10; }); }).length + ' con celular)</button>' +
      '<span class="tenue">Su señal es Open+3 (abrieron el correo 3 o más veces), siguen en Señal Detectada y nadie les ha escrito por WhatsApp</span></div>' +
      '<div class="ffila">' + principales + '</div>' +
      '<details class="masf"' + (nMas ? ' open' : '') + '><summary>Más filtros del tablero' + (nMas ? ' · ' + nMas + ' activo' + (nMas === 1 ? '' : 's') : '') + '</summary><div class="ffila">' + mas + '</div></details>' +
      '<div class="filters"><input id="o-q" type="search" placeholder="Buscar empresa, oportunidad o contacto" value="' + esc(f.q) + '"><span class="tenue">' + ls.length + ' de ' + todas.length + '</span>' +
      ((Object.keys(f).some(function(k){ return k !== 'q' && f[k]; }) || f.q) ? '<button class="enlace" id="o-borrar">Quitar filtros</button>' : '') + '</div></div>';
    var etapas = (opor.etapas || []).filter(function(e){ return !f.fase || e.fase === f.fase; });
    h += '<div class="kanban">';
    etapas.forEach(function(e){
      var col = ls.filter(function(o){ return o.etapa.id === e.id; });
      var monto = col.reduce(function(sm, o){ return sm + (o.monto || 0); }, 0);
      h += '<div class="kcol ' + e.fase + '"><div class="kcol-h"><div class="kcol-t">' + esc(e.nombre) + '</div><div class="kcol-n">' + col.length + ' · $' + Math.round(monto / 1000) + 'K</div></div><div class="kcol-b">' +
        (col.length ? '' : '<div class="kvacio">—</div>');
