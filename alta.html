<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Portal de alta | Great Revenue Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;900&display=swap">
<link rel="stylesheet" href="/portal_comun.css?v=20261014c">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="/correo_estilos.js?v=20261014c"></script>
<script src="/portal_comun.js?v=20261014c"></script>
</head>
<body>
<div class="top"><span class="marca" id="logo"><b>Great Revenue Intelligence</b></span><span class="quien" id="quien">Portal de alta</span></div>
<div class="banda oscura" id="banda"><div class="in"><h1 id="titulo">Portal de alta</h1><p id="bajada">Great Revenue da de alta a cada compañía y deja lista su configuración inicial.</p></div></div>
<main>
  <section id="v-entrar">
    <div class="entrar"><b>Entra con tu cuenta de Google</b><div id="gbtn"></div><p class="msg bad" id="m-entrar"></p></div>
  </section>
  <section id="v-portal" hidden>
    <div class="grid">
      <div class="lista" id="lista"></div>
      <div class="panel" id="panel"></div>
    </div>
  </section>
</main>
<footer>Great Revenue Intelligence · <a href="/privacidad.html">Aviso de privacidad</a></footer>

<script>
(function () {
  var P = window.GRP, $ = P.$, h = P.h;
  var LLAVE = 'gr_sesion';
  var estado = { companias: [], sel: null, muestras: {} };
  var EDITABLE = true;
  var ses = function () { return P.sesion(LLAVE); };
  function salir(motivo) { P.sesion(LLAVE, null); $('v-portal').hidden = true; $('v-entrar').hidden = false; $('quien').textContent = 'Portal de alta'; $('m-entrar').textContent = motivo || ''; }

  P.google('gbtn', function (resp) {
    $('m-entrar').textContent = 'Revisando tu acceso...';
    P.api({ accion: 'entrar', id_token: resp.credential }).then(function (d) {
      if (!d.sesion) { $('m-entrar').textContent = d.error || 'No se pudo entrar.'; return; }
      if (d.usuario.rol !== 'gr') { $('m-entrar').innerHTML = 'Este es el portal de Great Revenue. Entra a tu portal desde la liga de tu invitación.'; return; }
      P.sesion(LLAVE, d.sesion); $('m-entrar').textContent = ''; cargar();
    });
  }, 'filled_black');

  function cargar() {
    P.api({ accion: 'companias', sesion: ses() }).then(function (d) {
      if (d._codigo === 401 || d._codigo === 403) { salir(d.error); return; }
      if (!d.companias || (d.usuario && d.usuario.rol !== 'gr')) { salir(d.error || 'Este es el portal de Great Revenue.'); return; }
      estado.companias = d.companias; $('v-entrar').hidden = true; $('v-portal').hidden = false;
      $('quien').textContent = d.usuario.nombre + ' · ' + d.usuario.email;
      var gr = d.companias.filter(function (c) { return c.tenant === 'GR'; })[0];
      if (gr) P.aplicarMarca(gr.datos, 'Portal de alta', 'Configuración inicial de cada compañía. Cada sección se guarda por separado.');
      pintarLista(); elegir(estado.sel || (d.companias[0] && d.companias[0].tenant));
    });
  }
  function pintarLista() {
    $('lista').innerHTML = estado.companias.map(function (c) {
      return '<button class="cia' + (c.tenant === estado.sel ? ' on' : '') + '" data-t="' + h(c.tenant) + '">' + (c.datos.marca_logo_url ? '<img src="' + h(c.datos.marca_logo_url) + '" alt="">' : '')
        + '<b>' + h(c.datos.marca_nombre || c.tenant) + '</b><small>' + h(c.datos.modo === 'real' ? 'Real' : 'Prueba') + ' · ' + P.correos(c.datos.portal_usuarios).length + ' de ' + h(c.datos.usuarios_max) + ' usuarios</small></button>';
    }).join('') + '<button class="nueva" id="nueva">+ Nueva compañía</button>';
    Array.prototype.forEach.call(document.querySelectorAll('.cia'), function (b) { b.onclick = function () { elegir(b.getAttribute('data-t')); }; });
    $('nueva').onclick = nueva;
  }

  // Alta de compania nueva: nombre y sitio, manual de identidad, carpeta de logos y administradora.
  function nueva() {
    estado.sel = null; pintarLista();
    $('panel').innerHTML = '<div class="card"><div class="card-h"><h2>Nueva compañía</h2></div><p class="nota" style="margin:0">La marca se propone después a partir del manual y los logos, y tú la apruebas.</p><div class="dos">'
      + '<label>Nombre de la compañía<input id="n-nombre" placeholder="IT Institute by Itera"></label><label>Sitio web<input id="n-sitio" placeholder="https://it-institute.org"></label>'
      + '<label>Manual de identidad: PDF<input id="n-pdf" type="file" accept="application/pdf"></label><label>o liga de Drive al manual<input id="n-manual" placeholder="https://drive.google.com/file/d/..."></label>'
      + '<label>Carpeta de Drive con logos y archivos<input id="n-logos" placeholder="https://drive.google.com/drive/folders/..."></label><label>Administradora (correo de Google, opcional)<input id="n-admin" placeholder="nombre@compania.com"></label>'
      + '</div><div class="pie-sec"><button class="p" id="n-alta">Dar de alta</button><button class="s" id="n-cancelar">Cancelar</button><span class="msg" id="m-alta"></span></div></div>';
    $('n-cancelar').onclick = function () { elegir(estado.companias[0] && estado.companias[0].tenant); };
    $('n-alta').onclick = function () {
      var f = $('n-pdf').files[0];
      var cuerpo = { accion: 'alta', sesion: ses(), nombre: $('n-nombre').value.trim(), sitio_web: $('n-sitio').value.trim(), manual_url: $('n-manual').value.trim(), logos_url: $('n-logos').value.trim(), admin: $('n-admin').value.trim() };
      if (f && f.size > 10 * 1024 * 1024) { P.msg('m-alta', 'bad', 'El PDF pesa más de 10 MB. Súbelo a Drive y pega la liga.'); return; }
      P.msg('m-alta', '', f ? 'Subiendo el manual...' : 'Dando de alta...'); $('n-alta').disabled = true;
      leerPdf(f).then(function (pdf) { if (pdf) cuerpo.manual_pdf = pdf; return P.api(cuerpo); }).then(function (d) {
        $('n-alta').disabled = false;
        if (d._codigo === 401) { salir(d.error); return; }
        if (!d.ok) { P.msg('m-alta', 'bad', d.error || 'No se pudo dar de alta.'); return; }
        estado.sel = d.tenant; P.msg('m-alta', 'ok', 'Lista. Abriendo la compañía...'); setTimeout(cargar, 600);
      });
    };
  }
  function leerPdf(f) {
    if (!f) return Promise.resolve(null);
    return new Promise(function (ok, mal) { var r = new FileReader(); r.onload = function () { ok({ nombre: f.name, base64: String(r.result).split(',')[1] || '' }); }; r.onerror = mal; r.readAsDataURL(f); });
  }

  // Secciones con campos. Cada una se guarda y se deshace por separado.
  var SECCIONES = [
    { n: 2, id: 'opera', titulo: 'Cómo opera hoy', campos: [['crm', 'CRM'], ['motor', 'Motor de sus correos', 'motor'], ['motor_propio', 'Dónde corren sus avisos', 'largo'], ['marca_diferencias_manual', 'Diferencias contra el manual y decisiones', 'largo'], ['operacion_actual', 'Equipo y operación actual', 'largo']] },
    { n: 3, id: 'origen', titulo: 'Origen de la marca', campos: [['sitio_web', 'Sitio web', 'liga'], ['marca_manual_url', 'Manual de identidad (liga)', 'liga'], ['marca_logos_carpeta', 'Carpeta de Drive con logos', 'liga'], ['marca_vitrina_url', 'Documento completo de marca (liga)', 'liga']] },
    { n: 4, id: 'marca', titulo: 'Marca', campos: [['marca_nombre', 'Nombre de la marca'], ['marca_logo_url', 'Logo (dirección https de una imagen PNG)'], ['marca_color_primario', 'Color principal', 'color'], ['marca_color_oscuro', 'Color oscuro', 'color'], ['marca_colores_secundarios', 'Colores secundarios (separados por coma)'], ['marca_fuente_interna', 'Tipografía de los avisos'], ['marca_pie', 'Pie de los avisos'], ['marca_remitente_interno', 'Remitente de los avisos'], ['marca_prefijo_asunto', 'Prefijo del asunto']] },
    { n: 5, id: 'operacion', titulo: 'Operación: quién recibe', campos: [['aviso_fallas_correos', 'Fallas del motor'], ['llaves_avisar_a', 'Conexiones nuevas']] },
    { n: 6, id: 'portal', titulo: 'Portal de la compañía', campos: [['portal_nombre', 'Nombre del portal'], ['portal_admins', 'Administradora (correo de Google)'], ['usuarios_max', 'Usuarios máximos (incluye a la administradora)'], ['modo', 'Modo', 'modo'], ['portal_usuarios', 'Usuarios (correos de Google, uno por línea o separados por coma)', 'largo']] },
    { n: 7, id: 'ligas', titulo: 'Ligas', campos: [['tablero_url', 'Tablero del pipeline (liga propia, si la compañía ya tiene uno)', 'liga']] }
  ];
  function campo(k, etiqueta, tipo, v) {
    var et = '<span>' + h(etiqueta) + P.ayuda(k) + '</span>';
    if (tipo === 'color') return '<label>' + et + '<span class="color"><input type="color" data-par="' + k + '" value="' + h(P.color(v, '#cccccc')) + '" aria-label="' + h(etiqueta) + '"><input id="f-' + k + '" data-k="' + k + '" value="' + h(v) + '" placeholder="#ffcc00"></span></label>';
    if (tipo === 'motor') return '<label>' + et + '<select id="f-' + k + '" data-k="' + k + '"><option value="comun"' + (v !== 'propio' ? ' selected' : '') + '>Motor común</option><option value="propio"' + (v === 'propio' ? ' selected' : '') + '>Motor propio</option></select></label>';
    if (tipo === 'modo') return '<label>' + et + '<select id="f-' + k + '" data-k="' + k + '"><option value="prueba"' + (v !== 'real' ? ' selected' : '') + '>Prueba</option><option value="real"' + (v === 'real' ? ' selected' : '') + '>Real</option></select></label>';
    if (tipo === 'largo') return '<label style="grid-column:1/-1">' + et + '<textarea id="f-' + k + '" data-k="' + k + '" rows="3">' + h(k === 'portal_usuarios' ? P.correos(v).join('\n') : v) + '</textarea></label>';
    var abrir = tipo === 'liga' && /^https:\/\//.test(v) ? ' <a href="' + h(v.split(/\s+/)[0]) + '" target="_blank" rel="noopener">Abrir</a>' : '';
    return '<label>' + et + abrir + '<input id="f-' + k + '" data-k="' + k + '" value="' + h(v) + '"></label>';
  }
  function tarjeta(n, titulo, cuerpo, extra, id) { return '<div class="card" id="s-' + (id || n) + '"><div class="card-h"><h2><span class="num">' + n + '</span>' + h(titulo) + '</h2>' + (extra || '') + '</div>' + cuerpo + '</div>'; }
  function pieGuardar(id) { return '<div class="pie-sec"><button class="p" data-guardar="' + id + '">Guardar</button><button class="s" data-deshacer="' + id + '">Deshacer</button><span class="msg" id="mg-' + id + '"></span></div>'; }
  function elegir(t) {
    var c = estado.companias.filter(function (x) { return x.tenant === t; })[0]; if (!c) { $('panel').innerHTML = ''; return; }
    estado.sel = t; pintarLista();
    var inf = c.info || {}, html = '';
    if (inf.alta_estado === 'marca_por_proponer') html += '<div class="aviso">Dada de alta el ' + h(inf.alta_fecha || '') + '. Siguiente paso: llena la marca, guarda y apruébala. <button class="s" id="aprobar" style="margin-left:8px">Aprobar marca</button> <span class="msg" id="m-aprobar"></span></div>';
    else if (c.faltan.length) html += '<div class="aviso">Faltan datos para operar: ' + h(c.faltan.join(', ')) + '.</div>';
    // 1. Vista previa por grupos
    html += tarjeta(1, 'Vista previa', '<p class="nota" style="margin:0">Todos los tipos de correo de ' + h(c.datos.marca_nombre) + ', por objetivo, con 3 diseños con sus colores. Elige uno por tipo y guarda el grupo: lo que guardes es lo que se envía.</p><div id="grupos"><p class="vacio">Cargando tipos de correo...</p></div>',
      inf.tiene_vitrina ? '<button class="s" id="doc-completo">Documento completo de marca</button>' : '');
    SECCIONES.forEach(function (s) {
      var cuerpo = '<div class="dos">' + s.campos.map(function (f) { return campo(f[0], f[1], f[2], c.datos[f[0]] || ''); }).join('') + '</div>';
      if (s.id === 'opera') cuerpo += '<div><b style="font-size:13px;color:var(--g)">Mejoras contra el manual</b>' + P.ayuda('marca_diferencias_manual') + '<div id="mejoras" style="margin-top:8px">' + P.listaMejoras(c, true) + '</div><span class="msg" id="m-mejora"></span></div>';
      if (s.id === 'origen') cuerpo += '<div class="acciones"><label style="display:flex;gap:8px;align-items:center">Subir el manual en PDF<input type="file" id="m-pdf" accept="application/pdf"></label><button class="s" id="subir-manual">Subir manual</button><span class="msg" id="m-manual"></span></div>';
      if (s.id === 'marca') cuerpo += '<div><b style="font-size:13px;color:var(--g)">Así se ve un aviso con esta marca (cambia mientras editas)</b><div id="prev" style="margin-top:8px"></div></div>';
      if (s.id === 'ligas') cuerpo += liga('Tablero del pipeline', c.ligas.tablero, true) + (c.datos.tablero_url ? '' : (c.datos.motor === 'propio' ? '<p class="vacio">Pega arriba la liga del tablero que ya usa ' + h(c.datos.marca_nombre) + '.</p>' : '<p class="vacio">Sin liga propia se usa el tablero del motor común. Lleva una clave privada: compártelo solo con la compañía.</p>'))
        + liga('Entrada al portal de ' + c.datos.marca_nombre + ' (va en la invitación)', c.ligas.portal_compania, true) + liga('Documento completo de marca', c.ligas.vitrina, true);
      if (s.id === 'portal') cuerpo += '<div class="nota">Usuarios en uso: <span class="uso" id="uso"></span>. ' + (inf.alta_invitacion_fecha ? 'Última invitación: ' + h(inf.alta_invitacion_fecha) + ' a ' + h(inf.alta_invitacion_para) + '.' : 'Aún no se envía la invitación.') + '</div>'
        + '<div class="acciones"><button class="s" id="invitar">' + (inf.alta_invitacion_fecha ? 'Volver a enviar invitación' : 'Enviar invitación') + '</button><a class="s" href="/' + h(c.clave) + '/portal" target="_blank" rel="noopener">Ver como quien administra</a><span class="msg" id="m-invitar"></span></div>';
      html += tarjeta(s.n, s.titulo, cuerpo + pieGuardar(s.id), '', s.id);
    });
    $('panel').innerHTML = html;
    // Eventos
    Array.prototype.forEach.call(document.querySelectorAll('[data-par]'), function (p) { p.oninput = function () { $('f-' + p.getAttribute('data-par')).value = p.value; vivo(); }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-k]'), function (i) { i.oninput = function () { var par = document.querySelector('[data-par="' + i.getAttribute('data-k') + '"]'); if (par && /^#[0-9a-fA-F]{6}$/.test(i.value)) par.value = i.value; vivo(); }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-guardar]'), function (b) { b.onclick = function () { guardar(c, b.getAttribute('data-guardar')); }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-deshacer]'), function (b) { b.onclick = function () { deshacer(c, b.getAttribute('data-deshacer')); }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-copiar]'), function (b) { b.onclick = function () { var v = b.getAttribute('data-copiar'); (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(function () { b.textContent = 'Copiada'; }, function () { b.textContent = 'Selecciona y copia'; }); }; });
    if ($('aprobar')) $('aprobar').onclick = function () { accion('aprobar', t, 'm-aprobar', 'Aprobada. Ya tiene tablero y ligas.'); };
    if ($('doc-completo')) $('doc-completo').onclick = function () { P.msg('m-invitar', '', ''); P.api({ accion: 'vitrina', sesion: ses(), tenant: t }).then(function (d) { if (d.html) P.abrirHtml(d.html); }); };
    $('subir-manual').onclick = function () { subirManual(t); };
    $('invitar').onclick = function () { invitar(c); };
    activarMejoras(c);
    vivo();
    cargarMuestras(c);
  }
  function datosVivos() { var d = {}; Array.prototype.forEach.call(document.querySelectorAll('[data-k]'), function (i) { d[i.getAttribute('data-k')] = i.value.trim(); }); return d; }
  function vivo() {
    var d = datosVivos();
    if ($('prev')) $('prev').innerHTML = P.aviso(d);
    if ($('uso')) { var n = P.correos(d.portal_usuarios).length, m = Number(d.usuarios_max || 0); $('uso').textContent = n + ' de ' + m; $('uso').className = 'uso' + (n > m ? ' lleno' : ''); }
    botonInvitar();
  }
  // El boton de invitacion siempre dice a quien va: a la administradora GUARDADA. Si el campo tiene otro correo sin guardar, no deja enviar.
  function botonInvitar() {
    var b = $('invitar'), c = estado.companias.filter(function (x) { return x.tenant === estado.sel; })[0]; if (!b || !c) return;
    var guardado = String(c.datos.portal_admins || '').trim().toLowerCase(), campo = String(($('f-portal_admins') || {}).value || '').trim().toLowerCase();
    b.removeAttribute('data-confirmar'); b.className = 's';
    if (campo !== guardado) { b.textContent = 'Guarda la sección para invitar a ' + (campo || 'la nueva administradora'); b.setAttribute('data-sin-guardar', '1'); return; }
    b.removeAttribute('data-sin-guardar');
    b.textContent = guardado ? ((c.info || {}).alta_invitacion_para === guardado ? 'Volver a enviar invitación a ' : 'Enviar invitación a ') + guardado : 'Enviar invitación';
  }
  function cargarMuestras(c) {
    var poner = function (actuales) {
      if (estado.sel !== c.tenant) return;
      $('grupos').innerHTML = P.vistaPrevia(c, actuales, EDITABLE); P.llenarVistaPrevia(c, actuales); P.activarPedir(ses, c.tenant, cargar);
      Array.prototype.forEach.call(document.querySelectorAll('[data-guardar-diseno]'), function (b) { b.onclick = function () { guardarDiseno(c, b.getAttribute('data-guardar-diseno')); }; });
      Array.prototype.forEach.call(document.querySelectorAll('[data-deshacer-diseno]'), function (b) { b.onclick = function () { var g = b.getAttribute('data-deshacer-diseno'); P.deshacerGrupo(c, g); P.msg('md-' + g, '', 'Sin cambios.'); }; });
    };
    var actuales = estado.muestras[c.tenant];
    var pedirActuales = actuales ? Promise.resolve(actuales) : (c.info.tiene_muestras ? P.api({ accion: 'muestras', sesion: ses(), tenant: c.tenant }).then(function (d) { if (d._codigo === 401) { salir(d.error); return {}; } return (d.muestras && d.muestras.actuales) || {}; }) : Promise.resolve({}));
    Promise.all([P.cargarCatalogo(), pedirActuales]).then(function (r) { estado.muestras[c.tenant] = r[1]; poner(r[1]); }, function () { $('grupos').innerHTML = '<p class="vacio">No se pudieron cargar los tipos de correo.</p>'; });
  }
  function guardarDiseno(c, g) {
    var v = P.disenoDeGrupo(c, g);
    if (v === (c.datos.marca_estilos || '{}')) { P.msg('md-' + g, '', 'Sin cambios.'); return; }
    P.msg('md-' + g, '', 'Guardando...');
    P.api({ accion: 'guardar', sesion: ses(), tenant: c.tenant, cambios: { marca_estilos: v } }).then(function (d) {
      if (d._codigo === 401) { salir(d.error); return; }
      if (!d.ok) { P.msg('md-' + g, 'bad', d.error || 'No se pudo guardar.'); return; }
      c.datos.marca_estilos = v; P.msg('md-' + g, 'ok', c.datos.motor === 'propio' ? 'Guardado. Los que quedan en «Actual» siguen igual; un diseño A, B o C aplica cuando ese correo pase al motor común.' : 'Guardado. Los siguientes correos ya salen así.');
    });
  }
  function camposDe(id) { return Array.prototype.slice.call($('s-' + id).querySelectorAll('[data-k]')); }
  function deshacer(c, id) {
    camposDe(id).forEach(function (i) { var k = i.getAttribute('data-k'), v = c.datos[k] || ''; i.value = k === 'portal_usuarios' ? P.correos(v).join('\n') : v; var par = document.querySelector('[data-par="' + k + '"]'); if (par) par.value = P.color(v, '#cccccc'); });
    P.msg('mg-' + id, '', 'Sin cambios.'); vivo();
  }
  function guardar(c, id) {
    var cambios = {};
    camposDe(id).forEach(function (i) { var k = i.getAttribute('data-k'), v = i.value.trim(), ant = c.datos[k] || ''; if (k === 'portal_usuarios') { v = P.correos(v).join(','); ant = P.correos(ant).join(','); } if (ant !== v) cambios[k] = v; });
    if (!Object.keys(cambios).length) { P.msg('mg-' + id, '', 'No hay cambios en esta sección.'); return; }
    var cambiaAdmin = 'portal_admins' in cambios && cambios.portal_admins;
    P.msg('mg-' + id, '', 'Guardando...');
    P.api({ accion: 'guardar', sesion: ses(), tenant: c.tenant, cambios: cambios }).then(function (d) {
      if (d._codigo === 401) { salir(d.error); return; }
      if (!d.ok) { P.msg('mg-' + id, 'bad', d.error || 'No se pudo guardar.'); return; }
      Object.keys(cambios).forEach(function (k) { c.datos[k] = cambios[k]; });
      P.msg('mg-' + id, 'ok', 'Guardado.' + (cambiaAdmin ? ' Cambió la administradora: envíale la invitación.' : ''));
      if ('portal_admins' in cambios) botonInvitar();
      pintarLista();
    });
  }
  function accion(nombre, t, idMsg, ok) {
    P.msg(idMsg, '', 'Procesando...');
    P.api({ accion: nombre, sesion: ses(), tenant: t }).then(function (d) {
      if (d._codigo === 401) { salir(d.error); return; }
      if (!d.ok) { P.msg(idMsg, 'bad', d.error || 'No se pudo.'); return; }
      P.msg(idMsg, 'ok', ok); setTimeout(cargar, 900);
    });
  }
  function subirManual(t) {
    var f = $('m-pdf').files[0];
    if (!f) { P.msg('m-manual', 'bad', 'Elige el PDF.'); return; }
    if (f.size > 10 * 1024 * 1024) { P.msg('m-manual', 'bad', 'El PDF pesa más de 10 MB. Súbelo a Drive y pega la liga.'); return; }
    P.msg('m-manual', '', 'Subiendo...'); $('subir-manual').disabled = true;
    leerPdf(f).then(function (pdf) { return P.api({ accion: 'subir_manual', sesion: ses(), tenant: t, manual_pdf: pdf }); }).then(function (d) {
      $('subir-manual').disabled = false;
      if (!d.ok) { P.msg('m-manual', 'bad', d.error || 'No se pudo subir.'); return; }
      P.msg('m-manual', 'ok', 'Manual guardado en Drive.'); setTimeout(cargar, 800);
    });
  }
  function invitar(c) {
    var b = $('invitar'), admin = c.datos.portal_admins;
    if (b.getAttribute('data-sin-guardar')) { P.msg('m-invitar', 'bad', 'Primero dale Guardar a esta sección: la invitación va a la administradora guardada.'); return; }
    if (!admin) { P.msg('m-invitar', 'bad', 'Primero guarda el correo de la administradora.'); return; }
    if (!b.getAttribute('data-confirmar')) { b.setAttribute('data-confirmar', '1'); b.textContent = 'Confirmar envío a ' + admin; b.className = 'p'; P.msg('m-invitar', '', 'Sale ahora desde mike.aguirre@greatrevenue.com.'); return; }
    b.disabled = true; P.msg('m-invitar', '', 'Enviando invitación...');
    P.api({ accion: 'invitar', sesion: ses(), tenant: c.tenant }).then(function (d) {
      b.disabled = false;
      if (d._codigo === 401) { salir(d.error); return; }
      if (!d.ok) { P.msg('m-invitar', 'bad', d.error || 'No se pudo enviar.'); return; }
      P.msg('m-invitar', 'ok', 'Invitación enviada a ' + admin + '.'); setTimeout(cargar, 1200);
    });
  }
  // Aplicar o revertir una mejora contra el manual: guarda sus cambios y deja anotado lo que habia antes.
  function activarMejoras(c) {
    Array.prototype.forEach.call(document.querySelectorAll('[data-mejora]'), function (b) {
      b.onclick = function () {
        var ms = P.mejoras(c.datos), i = Number(b.getAttribute('data-mejora')), m = ms[i]; if (!m) return;
        var cambios = {};
        if (!m.aplicada) { m.antes = {}; Object.keys(m.cambios).forEach(function (k) { m.antes[k] = c.datos[k] || ''; cambios[k] = m.cambios[k]; }); m.aplicada = true; }
        else { Object.keys(m.antes || {}).forEach(function (k) { cambios[k] = m.antes[k]; }); m.aplicada = false; }
        cambios.marca_mejoras = JSON.stringify(ms);
        b.disabled = true; P.msg('m-mejora', '', 'Guardando...');
        P.api({ accion: 'guardar', sesion: ses(), tenant: c.tenant, cambios: cambios }).then(function (d) {
          b.disabled = false;
          if (d._codigo === 401) { salir(d.error); return; }
          if (!d.ok) { P.msg('m-mejora', 'bad', d.error || 'No se pudo guardar.'); return; }
          Object.keys(cambios).forEach(function (k) { c.datos[k] = cambios[k]; });
          elegir(c.tenant);
          P.msg('m-mejora', 'ok', (m.aplicada ? 'Aplicada.' : 'Revertida.') + (c.datos.motor === 'propio' ? ' Ya se ve en la vista previa; en sus correos aplica cuando pasen al motor común.' : ' Los siguientes correos ya salen así.'));
        });
      };
    });
  }
  function liga(t, u, abrir) { return '<div class="liga"><b>' + h(t) + ':</b> ' + (u ? '<code>' + h(u) + '</code> <button class="s" data-copiar="' + h(u) + '">Copiar</button>' + (abrir ? ' <a href="' + h(u) + '" target="_blank" rel="noopener">Abrir</a>' : '') : 'pendiente') + '</div>'; }

  if (ses()) cargar();
})();
</script>
